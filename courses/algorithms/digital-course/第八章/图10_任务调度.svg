<text x="1036" y="420" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >第 6 天</text>
<text x="656" y="454" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >时间槽分配（每天一个单位时间）</text>
<rect x="656.0" y="466" width="100.66666666666667" height="50" fill="#cdeede" stroke="#127a56" stroke-width="1.8" rx="8" opacity="1" />
<text x="706.3333333333334" y="488" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a4</text>
<text x="706.3333333333334" y="508" font-size="10" fill="#898781" font-weight="600" text-anchor="middle"   >第1天</text>
<rect x="766.6666666666666" y="466" width="100.66666666666667" height="50" fill="#cdeede" stroke="#127a56" stroke-width="1.8" rx="8" opacity="1" />
<text x="817.0" y="488" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a2</text>
<text x="817.0" y="508" font-size="10" fill="#898781" font-weight="600" text-anchor="middle"   >第2天</text>
<rect x="877.3333333333334" y="466" width="100.66666666666667" height="50" fill="#cdeede" stroke="#127a56" stroke-width="1.8" rx="8" opacity="1" />
<text x="927.6666666666667" y="488" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a3</text>
<text x="927.6666666666667" y="508" font-size="10" fill="#898781" font-weight="600" text-anchor="middle"   >第3天</text>
<rect x="988.0" y="466" width="100.66666666666667" height="50" fill="#cdeede" stroke="#127a56" stroke-width="1.8" rx="8" opacity="1" />
<text x="1038.3333333333333" y="488" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a1</text>
<text x="1038.3333333333333" y="508" font-size="10" fill="#898781" font-weight="600" text-anchor="middle"   >第4天</text>
<rect x="1098.6666666666667" y="466" width="100.66666666666667" height="50" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.2" rx="8" opacity="1" />
<text x="1149.0" y="488" font-size="15" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">—</text>
<text x="1149.0" y="508" font-size="10" fill="#898781" font-weight="600" text-anchor="middle"   >第5天</text>
<rect x="1209.3333333333335" y="466" width="100.66666666666667" height="50" fill="#cdeede" stroke="#127a56" stroke-width="1.8" rx="8" opacity="1" />
