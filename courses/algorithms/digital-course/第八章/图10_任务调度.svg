</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >带期限和惩罚的单位时间任务调度</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >拟阵贪心：优先安排惩罚大的任务，最小化总惩罚（8.7.3）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第8章 贪心法</text>
<rect x="40" y="128" width="560" height="660" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >问题与建模</text>
<rect x="64" y="186" width="512" height="88" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="212" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >n 个单位时间任务，每个有期限 dᵢ 和惩罚 wᵢ：</text>
<text x="80" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >在 dᵢ 前完成则无惩罚（早任务），</text>
<text x="80" y="256" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >否则受罚 wᵢ（迟任务）。目标：总惩罚最小。</text>
<rect x="64" y="286" width="512" height="96" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="312" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   >拟阵建模</text>
<text x="80" y="336" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >S = 全部任务，I = 可行的「早任务集」，</text>
<text x="80" y="356" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >权 w = 惩罚值。最小化迟任务惩罚</text>
<text x="80" y="376" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   >⟺ 最大化早任务奖励（定理 8.2：是拟阵）。</text>
<rect x="64" y="394" width="512" height="68" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="420" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   >最优调度结构</text>
<text x="80" y="444" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >早任务全在迟任务之前，且早任务按期限递增排列。</text>
<rect x="64" y="474" width="512" height="96" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="500" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >贪心策略 1</text>
<text x="80" y="524" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >按惩罚 w 递减排序；对每个任务，安排到其</text>
<text x="80" y="544" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >期限之前「最晚的空时间」；排不下则受罚。</text>
<rect x="64" y="582" width="512" height="96" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="608" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >贪心策略 2</text>
<text x="80" y="632" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >按期限 d 递减；day 从大到小，每天从</text>
<text x="80" y="652" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >「期限 ≥ day」的任务中选惩罚最大者完成。</text>
<rect x="64" y="690" width="512" height="78" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="716" font-size="12.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >应用 · 超市问题（POJ1456）</text>
<text x="80" y="740" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >商品有截止时间与利润，最大化销售利润；</text>
<text x="80" y="758" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >同构问题，可用并查集找最晚空位加速。</text>
<rect x="616" y="128" width="744" height="660" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="642" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >示例（7 个作业）</text>
<text x="852" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >按惩罚 w 递减处理</text>
<rect x="646" y="192" width="684" height="28" fill="#f0efec" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="676" y="211" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">任务</text>
<text x="766" y="211" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">期限 d</text>
<text x="866" y="211" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">惩罚 w</text>
<text x="1036" y="211" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">安排结果</text>
<rect x="646" y="220" width="684" height="30" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="676" y="240" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a1</text>
<text x="766" y="240" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">4</text>
<text x="866" y="240" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">70</text>
<text x="1036" y="240" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >第 4 天</text>
<rect x="646" y="250" width="684" height="30" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="676" y="270" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a2</text>
<text x="766" y="270" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">2</text>
<text x="866" y="270" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">60</text>
<text x="1036" y="270" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >第 2 天</text>
<rect x="646" y="280" width="684" height="30" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="676" y="300" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a3</text>
<text x="766" y="300" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">4</text>
<text x="866" y="300" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">50</text>
<text x="1036" y="300" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >第 3 天</text>
<rect x="646" y="310" width="684" height="30" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="676" y="330" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a4</text>
<text x="766" y="330" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">3</text>
<text x="866" y="330" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">40</text>
<text x="1036" y="330" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >第 1 天</text>
<rect x="646" y="340" width="684" height="30" fill="#fdeceb" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="676" y="360" font-size="12.5" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a5</text>
<text x="766" y="360" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">1</text>
<text x="866" y="360" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">30</text>
<text x="1036" y="360" font-size="12" fill="#b3201f" font-weight="700" text-anchor="middle"   >迟（罚 30）</text>
<rect x="646" y="370" width="684" height="30" fill="#fdeceb" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="676" y="390" font-size="12.5" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a6</text>
<text x="766" y="390" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">4</text>
<text x="866" y="390" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">20</text>
<text x="1036" y="390" font-size="12" fill="#b3201f" font-weight="700" text-anchor="middle"   >迟（罚 20）</text>
<rect x="646" y="400" width="684" height="30" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="676" y="420" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a7</text>
