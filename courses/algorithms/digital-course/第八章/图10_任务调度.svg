<text x="1259.6666666666667" y="508" font-size="10" fill="#898781" font-weight="600" text-anchor="middle"   >第6天</text>
<rect x="640" y="536" width="696" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="656" y="562" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">独立任务集 A = {a1, a2, a3, a4, a7}</text>
<text x="656" y="586" font-size="13" fill="#b3201f" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">迟任务 = {a5, a6} → 最小惩罚 = 30 + 20 = 50</text>
<text x="656" y="610" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >最优调度 {a4,a2,a3,a1,a7, a5,a6}（早任务按期限排，迟任务在后）</text>
</svg>
