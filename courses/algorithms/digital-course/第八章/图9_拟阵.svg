<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >拟阵 Matroid</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >为「贪心法一定得到最优解」提供统一的理论保证（8.7）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第8章 贪心法</text>
<rect x="40" y="128" width="660" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >拟阵的定义</text>
<rect x="64" y="186" width="612" height="158" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >拟阵是有序对 M = (S, I)，满足：</text>
<text x="80" y="240" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >① S 是一个有限集合</text>
<text x="80" y="268" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">② 遗传性：B∈I 且 A⊆B  ⟹  A∈I</text>
<text x="96" y="288" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >（独立集的子集也独立；空集 ∈ I）</text>
<text x="80" y="316" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">③ 交换性：A,B∈I 且 |A|&lt;|B|</text>
<text x="96" y="336" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">⟹ ∃ x∈B−A，使 A∪{x}∈I</text>
<text x="80" y="378" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >图拟阵 M[G] = (E, 森林)：边集 A 独立 ⟺ G[A] 无环</text>
<line x1="160" y1="448" x2="300" y2="448" stroke="#127a56" stroke-width="3.2" stroke-linecap="butt" />
<line x1="300" y1="448" x2="300" y2="578" stroke="#127a56" stroke-width="3.2" stroke-linecap="butt" />
<line x1="300" y1="578" x2="160" y2="578" stroke="#127a56" stroke-width="3.2" stroke-linecap="butt" />
<line x1="160" y1="578" x2="160" y2="448" stroke="#e34948" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="5 4"/>
<line x1="160" y1="448" x2="300" y2="578" stroke="#e34948" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="5 4"/>
<circle cx="160" cy="448" r="20" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="160" y="453" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >A</text>
<circle cx="300" cy="448" r="20" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="300" y="453" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >B</text>
<circle cx="300" cy="578" r="20" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="300" y="583" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >C</text>
<circle cx="160" cy="578" r="20" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="160" y="583" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >D</text>
<text x="340" y="458" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >绿色 {AB,BC,CD}</text>
<text x="340" y="480" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >= 森林（无环）→ 独立集</text>
<text x="340" y="512" font-size="12" fill="#b3201f" font-weight="700" text-anchor="start"   >再加虚线 DA 或 AC</text>
<text x="340" y="534" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >→ 出现环 → 相关（非独立）</text>
<text x="340" y="570" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   >遗传性：删边不产生环 ✓</text>
<text x="340" y="592" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   >交换性：|V|−k 棵树，边少者</text>
<text x="340" y="612" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   >可向边多者借一条边不成环 ✓</text>
<rect x="64" y="644" width="612" height="76" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="670" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >定理 8.3</text>
<text x="80" y="696" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >一个拟阵 M=(S,I) 中所有「最大独立子集」的大小都相同。</text>
<rect x="716" y="128" width="644" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="742" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >加权拟阵的贪心算法</text>
<rect x="740" y="186" width="596" height="66" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="756" y="212" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >加权拟阵</text>
<text x="756" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >S 中每个元素 x 有权值 w(x)；独立集 A 的权 = Σ w(x)。</text>
<rect x="740" y="266" width="596" height="160" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="756" y="292" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >求最大权独立子集的贪心框架 greedy(M, w)</text>
<text x="756" y="318" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">A = ∅;</text>
<text x="756" y="338" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">将 S 按权值 w 递减组成优先队列;</text>
<text x="756" y="358" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">while (S ≠ ∅) {</text>
<text x="756" y="378" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  x = S.removeMax();     // 取权最大者</text>
<text x="756" y="398" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (A∪{x} ∈ I)  A = A∪{x};   // 保持独立</text>
<text x="756" y="418" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="756" y="438" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">return A;</text>
<rect x="740" y="440" width="292.0" height="150" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="756" y="466" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >贪心选择性质</text>
<text x="756" y="466" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   ></text>
<text x="756" y="492" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >（引理 8.4）</text>
<text x="756" y="518" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >设 x 是第一个使 {x}</text>
<text x="756" y="538" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >独立的最大权元素，</text>
<text x="756" y="558" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >则存在含 x 的最优</text>
<text x="756" y="578" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >独立子集。</text>
<rect x="1044.0" y="440" width="292.0" height="150" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="1060.0" y="466" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >最优子结构性质</text>
<text x="1060.0" y="492" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >（引理 8.6）</text>
<text x="1060.0" y="518" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >选入 x 后，问题归约</text>
<text x="1060.0" y="538" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >为在收缩拟阵 M/x</text>
<text x="1060.0" y="558" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >上求最大权独立子集</text>
<text x="1060.0" y="578" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >的子问题。</text>
<rect x="740" y="604" width="596" height="116" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.3" rx="12" opacity="1" />
<text x="756" y="630" font-size="13.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >为什么重要？</text>
<text x="756" y="656" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >一旦把问题建模成「加权拟阵」，上面的贪心算法</text>
<text x="756" y="678" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >就一定能求得最优解——两大性质由拟阵结构保证，</text>
<text x="756" y="700" font-size="12" fill="#4a3aa7" font-weight="700" text-anchor="start"   >无需对每个具体问题单独证明贪心的正确性。</text>
</svg>
