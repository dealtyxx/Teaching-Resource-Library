<circle cx="750.9237567890925" cy="392.42956348249515" r="17" fill="#e9f7f1" stroke="#127a56" stroke-width="2.2" opacity="1"/>
<text x="750.9237567890925" y="397.42956348249515" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
