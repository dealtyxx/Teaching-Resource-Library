  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >旅行商问题 TSP 的近似算法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >组合技术：Prim 建最小生成树 → 先根遍历 → 抄近路成回路；近似比 η ≤ 2（12.2.4）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第12章 概率算法与近似算法</text>
<rect x="40" y="128" width="560" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >问题 · 组合近似算法</text>
<rect x="64" y="186" width="512" height="100" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >问题（NP 完全）</text>
<text x="80" y="238" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >带权连通图 G=(V,E)，边费用非负；求经过每个</text>
<text x="80" y="262" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >顶点恰一次的最小费用回路（TSP 回路）。</text>
<rect x="64" y="298" width="512" height="128" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="324" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >前提：费用满足三角不等式</text>
<text x="80" y="350" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">任意 u,v,w：c(u,w) ≤ c(u,v) + c(v,w)</text>
<line x1="400" y1="408" x2="540" y2="408" stroke="#127a56" stroke-width="2.4" stroke-linecap="butt" />
<line x1="400" y1="408" x2="470" y2="364" stroke="#c3c2b7" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="470" y1="364" x2="540" y2="408" stroke="#c3c2b7" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="4 3"/>
<circle cx="400" cy="408" r="6" fill="#127a56" stroke="#ffffff" stroke-width="1.4" opacity="1"/>
<circle cx="470" cy="364" r="6" fill="#127a56" stroke="#ffffff" stroke-width="1.4" opacity="1"/>
<circle cx="540" cy="408" r="6" fill="#127a56" stroke="#ffffff" stroke-width="1.4" opacity="1"/>
<text x="386" y="413" font-size="11" fill="#52514e" font-weight="700" text-anchor="start"   >u</text>
<text x="470" y="354" font-size="11" fill="#52514e" font-weight="700" text-anchor="middle"   >v</text>
<text x="548" y="413" font-size="11" fill="#52514e" font-weight="700" text-anchor="start"   >w</text>
<text x="470.0" y="426" font-size="10" fill="#127a56" font-weight="700" text-anchor="middle"   >直达更短</text>
<text x="80" y="378" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >→ 抄近路（跳过重复点）不会更贵。</text>
<rect x="64" y="438" width="512" height="158" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="464" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >组合技术近似算法</text>
<text x="80" y="490" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >① 任选顶点 v，用 Prim 构造以 v 为根的</text>
<text x="96" y="512" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >最小生成树 T；</text>
<text x="80" y="536" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >② 先根遍历（preorder）T，得到顶点表 path；</text>
<text x="80" y="560" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >③ 把 v 加到 path 末尾，按 path 次序连成</text>
<text x="96" y="582" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >回路 H 作为近似解。</text>
<rect x="64" y="608" width="512" height="112" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="634" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >近似比 η ≤ 2 与复杂度</text>
<text x="80" y="660" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">len(H) ≤ 完全遍历 = 2·w(T) ≤ 2·最优回路 L*</text>
<text x="80" y="684" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >（w(T) ≤ L*：最优回路去掉一条边即一棵生成树）</text>
<text x="80" y="708" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">Prim 与 DFS 均多项式 → 总复杂度 O(n²)。</text>
<rect x="620" y="128" width="740" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >实例：v = 0</text>
<text x="660" y="192" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >① 最小生成树 T（先根遍历 0 1 3 4 2）</text>
<line x1="805.0" y1="226.0" x2="892.4971994991541" y2="289.57043651750485" stroke="#127a56" stroke-width="2.6" stroke-linecap="butt" />
