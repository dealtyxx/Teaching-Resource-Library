<text x="1020" y="192" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >④ 近似 TSP 回路 H</text>
<path d="M 1175.4 237.2 L 1231.3 277.8" stroke="#1c5cab" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<path d="M 1241.6 307.6 L 1220.3 373.4" stroke="#b0491d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" stroke-dasharray="6 4"/>
