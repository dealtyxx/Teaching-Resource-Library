<circle cx="1105.9237567890925" cy="392.42956348249515" r="17" fill="#f4f7fb" stroke="#1c5cab" stroke-width="2.2" opacity="1"/>
<text x="1105.9237567890925" y="397.42956348249515" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<text x="1160" y="440" font-size="10.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >橙色虚线 = 抄近路的边</text>
<rect x="644" y="458" width="692" height="262" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="484" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >构造过程</text>
<text x="660" y="512" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">① Prim 从 v=0 建 MST T，先根遍历序：0 1 3 4 2</text>
<text x="660" y="540" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">② 完全遍历序列（每条树边走两次）：</text>
<rect x="676" y="552" width="300" height="30" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="8" opacity="1" />
<text x="690" y="572" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">0 1 0 3 4 2 4 3 0</text>
<text x="992" y="572" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">长度 = 2·w(T)</text>
<text x="660" y="602" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">③ 删除重复顶点（抄近路）：</text>
<rect x="676" y="614" width="300" height="30" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="8" opacity="1" />
<text x="690" y="634" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">path = { 0, 1, 3, 4, 2 }</text>
<text x="660" y="668" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">④ 把 v=0 加到末尾，连成回路：</text>
<rect x="676" y="680" width="636" height="32" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="8" opacity="1" />
<text x="690" y="701" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">0→1→3→4→2→0，长度 = 1+3+2+3+5 = 14</text>
</svg>
