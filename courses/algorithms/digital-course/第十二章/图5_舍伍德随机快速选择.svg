<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >舍伍德算法 · 随机化快速选择</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >划分前随机选基准，抹平好坏实例差别；总能得到正确解（例12.4·第 k 大）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第12章 概率算法与近似算法</text>
<rect x="40" y="128" width="560" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >舍伍德思想</text>
<rect x="64" y="186" width="512" height="84" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >特点</text>
<text x="80" y="238" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >总能求得问题的一个解，</text>
<text x="340" y="238" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >且解总是正确的。</text>
<text x="80" y="260" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >（随机性只影响耗时，不影响正确性）</text>
<rect x="64" y="282" width="512" height="128" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="308" font-size="13.5" fill="#b3406e" font-weight="700" text-anchor="start"   >快排/快速选择的隐患</text>
<text x="80" y="334" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >一次划分的性能取决于基准元素：</text>
<text x="80" y="358" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >若基准恰是最小/最大元素 → 两子区间</text>
<text x="80" y="382" font-size="12.5" fill="#b3406e" font-weight="700" text-anchor="start"   >极不均衡 → 退化到最坏 O(n²)。</text>
<rect x="64" y="422" width="512" height="128" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="448" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >舍伍德改造</text>
<text x="80" y="474" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >划分前按随机数在待划分序列中随机选一个</text>
<text x="80" y="498" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >元素作基准 → 期望得到均衡的两个子区间。</text>
<text x="80" y="522" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >算法行为不再受输入实例好坏影响。</text>
<rect x="64" y="562" width="512" height="68" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="588" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >适用条件与效果</text>
<text x="80" y="614" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >当「最坏 ≫ 平均」时引入随机，使最坏趋近平均。</text>
<rect x="64" y="642" width="512" height="78" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="668" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >例12.4：求第 k 大元素（LeetCode215）</text>
<text x="80" y="692" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">nums = {3,2,1,5,6,4}，k=2</text>
<text x="80" y="714" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">递减排序 {6,5,4,3,2,1} → 第 2 大 = 5。</text>
<rect x="620" y="128" width="740" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >随机快速选择 与 一次划分</text>
<rect x="644" y="184" width="692" height="190" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="662" y="210" font-size="11" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">int quickselect(vector&lt;int&gt;&amp;a,int s,int t,int k){</text>
<text x="662" y="224.8" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  if(s&lt;t){</text>
<text x="662" y="239.60000000000002" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">    int j=randa(s,t);        // 随机选基准下标</text>
<text x="662" y="254.40000000000003" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">    swap(a[j],a[s]);         // 基准换到区间首</text>
<text x="662" y="269.20000000000005" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">    int i=partition(a,s,t);  // 递减划分，基准归位</text>
<text x="662" y="284.00000000000006" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">    if(k-1==i)     return a[i];        // 命中第k大</text>
<text x="662" y="298.80000000000007" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">    else if(k-1&lt;i) return quickselect(a,s,i-1,k);</text>
<text x="662" y="313.6000000000001" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">    else           return quickselect(a,i+1,t,k);</text>
<text x="662" y="328.4000000000001" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  }</text>
<text x="662" y="343.2000000000001" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  return a[k-1];</text>
<text x="662" y="358.0000000000001" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="660" y="404" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">① 随机基准 base = 4：</text>
<rect x="664" y="416" width="52" height="42" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="8" opacity="1" />
<text x="690.0" y="443.0" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<rect x="722" y="416" width="52" height="42" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="8" opacity="1" />
<text x="748.0" y="443.0" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<rect x="780" y="416" width="52" height="42" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="8" opacity="1" />
<text x="806.0" y="443.0" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<rect x="838" y="416" width="52" height="42" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="8" opacity="1" />
<text x="864.0" y="443.0" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<rect x="896" y="416" width="52" height="42" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="8" opacity="1" />
<text x="922.0" y="443.0" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<rect x="954" y="416" width="52" height="42" fill="#fdf1ec" stroke="#eb6834" stroke-width="1.5" rx="8" opacity="1" />
<text x="980.0" y="443.0" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<text x="980" y="476" font-size="10.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >基准</text>
<text x="660" y="508" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">② 递减划分后，基准 4 归位到 i=2（=第3大）：</text>
<rect x="664" y="520" width="52" height="42" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.5" rx="8" opacity="1" />
<text x="690.0" y="547.0" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<rect x="722" y="520" width="52" height="42" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.5" rx="8" opacity="1" />
<text x="748.0" y="547.0" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<rect x="780" y="520" width="52" height="42" fill="#fdf1ec" stroke="#eb6834" stroke-width="1.5" rx="8" opacity="1" />
<text x="806.0" y="547.0" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<rect x="838" y="520" width="52" height="42" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5" rx="8" opacity="1" />
<text x="864.0" y="547.0" font-size="16" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<rect x="896" y="520" width="52" height="42" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5" rx="8" opacity="1" />
<text x="922.0" y="547.0" font-size="16" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<rect x="954" y="520" width="52" height="42" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5" rx="8" opacity="1" />
<text x="980.0" y="547.0" font-size="16" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<text x="690" y="580" font-size="10" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<text x="748" y="580" font-size="10" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<text x="806" y="580" font-size="10" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">i=2</text>
<text x="864" y="580" font-size="10" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<text x="922" y="580" font-size="10" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<text x="980" y="580" font-size="10" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<text x="690" y="600" font-size="11" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">↑ 大于基准（第1~2大在此）</text>
<rect x="644" y="618" width="692" height="102" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="644" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >③ 比较排名，只递归一侧</text>
<text x="660" y="670" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">k=2 → k−1=1 &lt; i=2 → 第2大落在左区间 {6,5}；</text>
<text x="660" y="694" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">对 {6,5} 递归 → 命中 → 第 2 大 = 5 ✓</text>
<text x="660" y="714" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >随机基准使期望只需 O(n)，且结果恒正确。</text>
</svg>
