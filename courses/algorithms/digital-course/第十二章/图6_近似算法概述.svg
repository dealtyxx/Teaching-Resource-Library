<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >近似算法概述</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >对付 NP 完全问题：放弃精确最优，用多项式时间求有质量保证的次优解（12.2.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第12章 概率算法与近似算法</text>
<rect x="40" y="128" width="560" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >什么是近似算法</text>
<rect x="64" y="186" width="512" height="96" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >动机</text>
<text x="80" y="238" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >NP 完全问题目前无法用多项式时间精确求解。</text>
<text x="80" y="262" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >近似算法：多项式时间求一个「次优解」。</text>
<rect x="64" y="294" width="512" height="118" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="320" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >近似性能比 η（最小化问题）</text>
<text x="80" y="348" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >最优解 c*，近似解 c（通常 c ≥ c*）：</text>
<text x="80" y="378" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">η = c / c*   ≥ 1</text>
<text x="290" y="378" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   >越接近 1 越好</text>
<text x="80" y="402" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >（例：装箱、多机调度、TSP 的工期/长度）</text>
<rect x="64" y="424" width="512" height="100" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="450" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >近似性能比 η（最大化问题）</text>
<text x="80" y="478" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >最优解 c*，近似解 c（通常 c ≤ c*）：</text>
<text x="80" y="508" font-size="15" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">η = c* / c   ≥ 1</text>
<rect x="64" y="536" width="512" height="184" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="562" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >近似比 C</text>
<text x="80" y="588" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >找一个界 C 使对所有实例 η ≤ C；</text>
<text x="80" y="612" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >若找不到比 C 更小的界，就称 A 的近似比为 C。</text>
<text x="80" y="642" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">η ≤ C</text>
<text x="190" y="642" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >→ A 是「近似比为 C 的相对近似算法」</text>
<text x="80" y="674" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >C 越小 → 近似解质量越有保证；</text>
<text x="80" y="698" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   >理想是 C 为一个与规模无关的常数。</text>
<rect x="620" y="128" width="740" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >性能比的含义 与 问题分类</text>
<rect x="644" y="184" width="692" height="226" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="210" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >直观：近似解 c 与最优解 c* 的差距</text>
<rect x="920" y="244" width="90" height="140" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.5" rx="8" opacity="1" />
<text x="965" y="404" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   >近似 c</text>
<text x="965" y="234" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">135</text>
<rect x="740" y="280" width="90" height="104" fill="#e9f7f1" stroke="#127a56" stroke-width="1.5" rx="8" opacity="1" />
<text x="785" y="404" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >最优 c*</text>
<text x="785" y="270" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">100</text>
<line x1="830" y1="280" x2="920" y2="280" stroke="#898781" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="1015" y1="244" x2="1060" y2="244" stroke="#898781" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="1015" y1="280" x2="1060" y2="280" stroke="#898781" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="1050" y1="244" x2="1050" y2="280" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<text x="1070" y="266.0" font-size="11.5" fill="#898781" font-weight="700" text-anchor="start"   >额外代价</text>
<rect x="1120" y="248" width="200" height="96" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="1220" y="278" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">η = c / c*</text>
<text x="1220" y="308" font-size="13" fill="#52514e" font-weight="600" text-anchor="middle"   font-family="ui-monospace,monospace">= 135 / 100</text>
<text x="1220" y="332" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 1.35 ≤ C</text>
<rect x="644" y="428" width="692" height="90" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<rect x="644" y="428" width="8" height="90" fill="#127a56" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="664" y="460" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >常数近似算法</text>
<text x="664" y="486" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >C 是与规模无关的常数（η ≤ C）</text>
<text x="664" y="508" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >→ 称问题 ∏ 是「可近似的」</text>
<rect x="644" y="528" width="692" height="90" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<rect x="644" y="528" width="8" height="90" fill="#1c5cab" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="664" y="560" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >完全可近似</text>
<text x="664" y="586" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >对任意 ε&gt;0 都存在 (1+ε)-近似算法</text>
<text x="664" y="608" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >→ 精度可任意逼近最优（FPTAS）</text>
<rect x="644" y="628" width="692" height="90" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1.3" rx="12" opacity="1" />
<rect x="644" y="628" width="8" height="90" fill="#b3406e" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="664" y="660" font-size="14.5" fill="#b3406e" font-weight="700" text-anchor="start"   >可不近似</text>
<text x="664" y="686" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >已证不存在 η&lt;C 的近似（除非 P=NP）</text>
<text x="664" y="708" font-size="12" fill="#b3406e" font-weight="700" text-anchor="start"   >→ 近似比也存在「下界壁垒」</text>
</svg>
