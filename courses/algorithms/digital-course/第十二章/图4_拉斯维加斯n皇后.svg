<text x="1010" y="448" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >8 皇后的一个解</text>
<text x="1010" y="474" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">q = [1,5,8,6,3,7,2,4]</text>
<text x="1010" y="502" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >行 i 的皇后落在</text>
<text x="1010" y="522" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >第 q[i] 列。</text>
<text x="1010" y="554" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   >任意两皇后：</text>
<text x="1010" y="576" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   >· 不同列</text>
<text x="1010" y="596" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   >· 不同对角线</text>
<text x="1010" y="624" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >随机试探命中</text>
