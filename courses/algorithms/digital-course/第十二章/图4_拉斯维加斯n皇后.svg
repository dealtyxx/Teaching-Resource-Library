<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >拉斯维加斯算法 · n 皇后</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >逐行随机试探列位；找到解一定正确，找不到就从头重来（例12.3）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第12章 概率算法与近似算法</text>
<rect x="40" y="128" width="560" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >拉斯维加斯思想</text>
<rect x="64" y="186" width="512" height="98" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >特点</text>
<text x="80" y="238" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >一旦找到一个解，这个解一定正确；</text>
<text x="80" y="262" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >但有时可能找不到解（求解失败）。</text>
<rect x="64" y="296" width="512" height="104" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="322" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >通用框架：反复重试直到成功</text>
<text x="80" y="350" font-size="12" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">void solve(x){</text>
<text x="80" y="370" font-size="12" fill="#52514e" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">  bool flag=false;</text>
<text x="80" y="390" font-size="12" fill="#52514e" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">  while(!flag) flag=LV(x); }  // 直到有解</text>
<rect x="64" y="412" width="512" height="176" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="438" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >n 皇后的随机化</text>
<text x="80" y="464" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >逐行放置皇后。放第 i 行时：</text>
<text x="80" y="488" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 随机选列 j = randa(1,n)，最多试探 n 次；</text>
<text x="80" y="512" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 只要 place(i,j) 不冲突就放下，进入下一行；</text>
<text x="80" y="536" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >· 若 n 次都冲突 → 本次求解失败 return false，</text>
<text x="80" y="560" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >  由 solve 从第 1 行整体重来。</text>
<rect x="64" y="600" width="512" height="120" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="626" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >与回溯法对比</text>
<text x="80" y="652" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >回溯法：系统地枚举 + 剪支，保证找到解；</text>
<text x="80" y="676" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >拉斯维加斯：随机试探，实现简单、常常很快，</text>
<text x="80" y="700" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >但可能空手而归，需要重启（正确性从不打折）。</text>
<rect x="620" y="128" width="740" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >核心算法 与 一个成功的解</text>
<rect x="644" y="184" width="692" height="224" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="662" y="208" font-size="11" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">bool place(int i,int j){        // (i,j) 能否放皇后</text>
<text x="662" y="222.6" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  for(int k=1;k&lt;i;k++)</text>
<text x="662" y="237.2" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">    if(q[k]==j || abs(q[k]-j)==abs(i-k))</text>
<text x="662" y="251.79999999999998" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">      return false;             // 同列或同对角线冲突</text>
<text x="662" y="266.4" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  return true;</text>
<text x="662" y="281.0" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="662" y="295.6" font-size="11" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">bool queen(int i,int n){        // 拉斯维加斯放置</text>
<text x="662" y="310.20000000000005" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  if(i&gt;n){ output(); return true; }</text>
<text x="662" y="324.80000000000007" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  int cnt=0, j;</text>
<text x="662" y="339.4000000000001" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  while(cnt&lt;=n){ j=randa(1,n); cnt++;</text>
<text x="662" y="354.0000000000001" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">                 if(place(i,j)) break; }</text>
<text x="662" y="368.60000000000014" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  if(cnt&gt;n) return false;       // n 次都冲突→失败</text>
<text x="662" y="383.20000000000016" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  q[i]=j;  return queen(i+1,n);</text>
<text x="662" y="397.8000000000002" font-size="11" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
