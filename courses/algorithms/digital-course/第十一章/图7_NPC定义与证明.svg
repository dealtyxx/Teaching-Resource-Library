<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >证明 NP 完全 的方法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >两步法：属于 NP + 已知 NPC 问题可归约到它（11.3.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第11章 计算复杂性</text>
<rect x="40" y="128" width="600" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >证明 ∏ 是 NP 完全</text>
<rect x="64" y="186" width="552" height="84" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   >第一步：证明 ∏ ∈ NP</text>
<text x="80" y="238" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >给出证书 y，能在多项式时间内验证 y 是 ∏ 的解。</text>
<text x="80" y="258" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >（建立非确定性算法：猜测 + 验证）</text>
<rect x="64" y="282" width="552" height="108" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="308" font-size="14" fill="#b3406e" font-weight="700" text-anchor="start"   >第二步：找已知 NPC 问题 ∏′，证 ∏′ ≤ₚ ∏</text>
<text x="80" y="334" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >构造多项式时间变换 f，使 I ∈ Y′ ⟺ f(I) ∈ Y。</text>
<text x="80" y="358" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >常用「种子」NPC 问题：SAT、3SAT。</text>
<text x="80" y="380" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >（定理 11.5：NPH ∏′ 且 ∏′≤ₚ∏ → ∏ 也是 NP 难）</text>
<rect x="64" y="404" width="552" height="128" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="430" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >为什么这样就够了？</text>
<text x="80" y="456" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">∏′ 是 NPC → 所有 NP 问题 ∏″ 都满足 ∏″ ≤ₚ ∏′。</text>
<text x="80" y="480" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">又 ∏′ ≤ₚ ∏，由传递性 ∏″ ≤ₚ ∏。</text>
<text x="80" y="504" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >即所有 NP 问题都归约到 ∏ → ∏ 满足 NPC 条件②。</text>
<text x="80" y="558" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >传递归约链：</text>
<rect x="100" y="574" width="98.0" height="40" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.3" rx="9" opacity="1" />
<text x="149.0" y="598" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">任意 ∏″∈NP</text>
<text x="214.0" y="598" font-size="13" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">≤ₚ</text>
<rect x="232.0" y="574" width="115.0" height="40" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.3" rx="9" opacity="1" />
<text x="289.5" y="598" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">∏′ (已知NPC)</text>
<text x="363.0" y="598" font-size="13" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">≤ₚ</text>
<rect x="381.0" y="574" width="81.0" height="40" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.3" rx="9" opacity="1" />
<text x="421.5" y="598" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">∏ (待证)</text>
<rect x="64" y="634" width="552" height="86" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="660" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >定理 11.4 的意义</text>
<text x="80" y="686" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >任一 NPC 问题若可多项式求解 → 全部 NP 可解 → P=NP。</text>
<text x="80" y="708" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   >所以 NPC 是「攻破一个即攻破全部」的最难核心。</text>
<rect x="660" y="128" width="700" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="686" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >从 SAT 出发的归约树</text>
<rect x="875.0" y="198.0" width="70" height="44" fill="#fdeef4" stroke="#b3406e" stroke-width="2" rx="10" opacity="1" />
<text x="910" y="226" font-size="14" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">SAT</text>
<text x="910" y="192" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >第一个 NP 完全问题（Cook–Levin，1970s）</text>
<rect x="869.0" y="274.0" width="82" height="44" fill="#fdeef4" stroke="#b3406e" stroke-width="2" rx="10" opacity="1" />
<text x="910" y="302" font-size="14" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3SAT</text>
<path d="M 910 242 L 910 274" stroke="#b3406e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<text x="930" y="260" font-size="11" fill="#b3406e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">≤ₚ</text>
<rect x="739.75" y="361.0" width="100.5" height="34" fill="#eceaf7" stroke="#4a3aa7" stroke-width="1.4" rx="10" opacity="1" />
<text x="790" y="383" font-size="11.5" fill="#4a3aa7" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">团集 CLIQUE</text>
<path d="M 910 318 L 790 360" stroke="#4a3aa7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="881.0" y="361.0" width="58.0" height="34" fill="#eceaf7" stroke="#4a3aa7" stroke-width="1.4" rx="10" opacity="1" />
<text x="910" y="383" font-size="11.5" fill="#4a3aa7" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">顶点覆盖</text>
<path d="M 910 318 L 910 360" stroke="#4a3aa7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="1015.25" y="361.0" width="49.5" height="34" fill="#eceaf7" stroke="#4a3aa7" stroke-width="1.4" rx="10" opacity="1" />
<text x="1040" y="383" font-size="11.5" fill="#4a3aa7" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">图着色</text>
<path d="M 910 318 L 1040 360" stroke="#4a3aa7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="755.25" y="445.0" width="49.5" height="34" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.4" rx="10" opacity="1" />
<text x="780" y="467" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">子集和</text>
<path d="M 910 396 L 780 444" stroke="#b0491d" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="872.5" y="445.0" width="75.0" height="34" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.4" rx="10" opacity="1" />
<text x="910" y="467" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0/1 背包</text>
<path d="M 910 396 L 910 444" stroke="#b0491d" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="1026.75" y="445.0" width="66.5" height="34" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.4" rx="10" opacity="1" />
<text x="1060" y="467" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">哈密顿回路</text>
<path d="M 910 396 L 1060 444" stroke="#b0491d" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="1175.25" y="445.0" width="49.5" height="34" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.4" rx="10" opacity="1" />
<text x="1200" y="467" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">TSP</text>
<path d="M 910 396 L 1200 444" stroke="#b0491d" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<text x="1320" y="378" font-size="12" fill="#898781" font-weight="700" text-anchor="end"   >≤ₚ</text>
<rect x="684" y="508" width="652" height="96" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="700" y="534" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >已知约 4000 个 NP 完全问题</text>
<text x="700" y="560" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >SAT、3SAT、最大团、图着色、顶点覆盖、</text>
<text x="700" y="582" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >子集和、0/1 背包、TSP、哈密顿回路……</text>
<rect x="684" y="616" width="652" height="104" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="700" y="642" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >整体结构</text>
<text x="700" y="668" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >NP 问题 = P 问题 + NP 完全问题 +（中间问题）；</text>
<text x="700" y="692" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >目前可多项式求解的都属 P；NPC 是 NP 中最难的。</text>
<text x="700" y="714" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >只要一个 NPC 有多项式算法，则所有 NPC 都有。</text>
</svg>
