<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >计算模型 · 图灵机</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >刻画「有效计算」的抽象模型；确定性 DTM 与非确定性 NDTM（11.1.3）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第11章 计算复杂性</text>
<rect x="40" y="128" width="620" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >图灵机的基本结构</text>
<rect x="110" y="258" width="52" height="46" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2" rx="4" opacity="1" />
<text x="136.0" y="288" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">…</text>
<rect x="166" y="258" width="52" height="46" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2" rx="4" opacity="1" />
<text x="192.0" y="288" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<rect x="222" y="258" width="52" height="46" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2" rx="4" opacity="1" />
<text x="248.0" y="288" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<rect x="278" y="258" width="52" height="46" fill="#e9f7f1" stroke="#127a56" stroke-width="2" rx="4" opacity="1" />
<text x="304.0" y="288" font-size="16" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<rect x="334" y="258" width="52" height="46" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2" rx="4" opacity="1" />
<text x="360.0" y="288" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<rect x="390" y="258" width="52" height="46" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2" rx="4" opacity="1" />
<text x="416.0" y="288" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<rect x="446" y="258" width="52" height="46" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2" rx="4" opacity="1" />
<text x="472.0" y="288" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">_</text>
<rect x="502" y="258" width="52" height="46" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.2" rx="4" opacity="1" />
<text x="528.0" y="288" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">…</text>
<text x="110" y="246" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   >工作带（向右无限延伸，可读可写）</text>
<path d="M 304.0 328 L 294.0 350 L 314.0 350 Z" stroke="#b0491d" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<line x1="304.0" y1="304" x2="304.0" y2="328" stroke="#b0491d" stroke-width="2" stroke-linecap="butt" />
<text x="304.0" y="368" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >读写头</text>
<rect x="220" y="386" width="260" height="56" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.4" rx="10" opacity="1" />
<text x="350" y="410" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >有限状态控制器</text>
<text x="350" y="432" font-size="11.5" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">当前状态 q</text>
<line x1="304.0" y1="376" x2="350" y2="386" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 3"/>
<rect x="64" y="468" width="572" height="128" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="494" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >一次动作（由当前状态 + 扫描到的字符决定）</text>
<rect x="80" y="518" width="180" height="60" fill="#eef4fc" stroke="#1c5cab" stroke-width="1.2" rx="10" opacity="1" />
<text x="170" y="544" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >状态转换</text>
<text x="170" y="566" font-size="10.5" fill="#52514e" font-weight="middle" text-anchor="start"   >决定下一状态</text>
<rect x="270" y="518" width="180" height="60" fill="#e9f7f1" stroke="#127a56" stroke-width="1.2" rx="10" opacity="1" />
<text x="360" y="544" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >写字符</text>
<text x="360" y="566" font-size="10.5" fill="#52514e" font-weight="middle" text-anchor="start"   >在当前格写新字符</text>
<rect x="460" y="518" width="180" height="60" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.2" rx="10" opacity="1" />
<text x="550" y="544" font-size="13" fill="#b0491d" font-weight="700" text-anchor="middle"   >移动读写头</text>
<text x="550" y="566" font-size="10.5" fill="#52514e" font-weight="middle" text-anchor="start"   >左移 / 右移 / 停留</text>
<rect x="64" y="610" width="572" height="110" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="636" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >停机与可计算性（对输入串 w 的三种结局）</text>
<text x="80" y="662" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >① 进入终止状态 → 停机，接受 w</text>
<text x="80" y="686" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >② 未进终止状态但 δ 无定义 → 停机，不接受 w</text>
<text x="80" y="710" font-size="12.5" fill="#b3201f" font-weight="700" text-anchor="start"   >③ 一直不停且 δ 有定义 → 死循环，永不停机</text>
<rect x="680" y="128" width="680" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="706" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >确定性 DTM 与 非确定性 NDTM</text>
<rect x="704" y="186" width="632" height="180" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="212" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   >确定性图灵机 DTM</text>
<text x="720" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >动作函数 δ 是单值映射：一个状态 + 一个字符</text>
<text x="720" y="256" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >→ 只产生唯一一个动作。</text>
<circle cx="770" cy="314" r="20" fill="#e9f7f1" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="770" y="319" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">q</text>
<path d="M 792 314 L 920 314" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<text x="856" y="304" font-size="11" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">读 a</text>
<circle cx="942" cy="314" r="20" fill="#e9f7f1" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="942" y="319" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">q′</text>
<text x="1320" y="319" font-size="12" fill="#127a56" font-weight="700" text-anchor="end"   >输出唯一确定</text>
<rect x="704" y="378" width="632" height="210" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="404" font-size="14" fill="#b0491d" font-weight="700" text-anchor="start"   >非确定性图灵机 NDTM</text>
<text x="720" y="428" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >动作函数 δ 是多值映射：一个状态 + 一个字符</text>
<text x="720" y="448" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >→ 可产生多个动作（并行「猜测」所有分支）。</text>
<circle cx="770" cy="516" r="20" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.8" opacity="1"/>
<text x="770" y="521" font-size="13" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">q</text>
<path d="M 792 516 L 928 470" stroke="#b0491d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<circle cx="950" cy="470" r="18" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.6" opacity="1"/>
<text x="950" y="475" font-size="11" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">q1</text>
<path d="M 792 516 L 928 516" stroke="#b0491d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<circle cx="950" cy="516" r="18" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.6" opacity="1"/>
<text x="950" y="521" font-size="11" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">q2</text>
<path d="M 792 516 L 928 562" stroke="#b0491d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<circle cx="950" cy="562" r="18" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.6" opacity="1"/>
<text x="950" y="567" font-size="11" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">q3</text>
<text x="860" y="458" font-size="11" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">读 a → 多个动作</text>
<text x="1320" y="586" font-size="12" fill="#b0491d" font-weight="700" text-anchor="end"   >存在一个分支接受即可</text>
<rect x="704" y="600" width="632" height="120" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="626" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >计算模型与算法</text>
<text x="720" y="652" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >算法 = 一个确定的、对任意输入都停机的图灵机。</text>
<text x="720" y="676" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >可计算问题：在图灵机上有限步内得到正确结果。</text>
<text x="720" y="702" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >其他等价模型：λ 演算、递归函数。</text>
</svg>
