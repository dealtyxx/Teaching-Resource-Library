<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >判定问题 与 优化问题</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >限界目标函数把优化问题转化为判定问题（11.1.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第11章 计算复杂性</text>
<rect x="40" y="128" width="600" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >两类问题</text>
<rect x="64" y="186" width="552" height="96" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="14.5" fill="#b0491d" font-weight="700" text-anchor="start"   >优化问题 ∏′</text>
<text x="80" y="238" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >每个可行解对应一个目标函数值，</text>
<text x="80" y="260" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >求具有最优（最大/最小）目标值的可行解。</text>
<rect x="64" y="294" width="552" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="320" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >判定问题 ∏</text>
<text x="80" y="346" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >只回答是否存在满足要求的解，</text>
<text x="80" y="368" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >解仅为 yes(1) 或 no(0)。</text>
<rect x="64" y="404" width="552" height="130" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="430" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   >转化：限界目标函数值</text>
<rect x="90" y="450" width="200" height="40" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="8" opacity="1" />
<text x="190" y="475" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">优化：求最优 f</text>
<path d="M 300 470 L 360 470" stroke="#52514e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<text x="330" y="458" font-size="10.5" fill="#898781" font-weight="700" text-anchor="middle"   >加界 k</text>
<rect x="370" y="450" width="230" height="40" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="8" opacity="1" />
<text x="485" y="475" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">判定：是否 f ≤ k ?</text>
<text x="80" y="512" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >给目标函数加一个界 k，就得到对应的判定问题。</text>
<rect x="64" y="548" width="552" height="172" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="574" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   >为什么主要研究判定问题？</text>
<text x="80" y="602" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >① 判定问题只有 yes/no 两个解，验证十分容易；</text>
<text x="80" y="628" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >② 优化问题与其对应判定问题「难易程度相同」；</text>
<text x="80" y="654" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >③ 可从判定问题的角度对问题难度分类，</text>
<text x="80" y="680" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >   使复杂性理论的讨论更简洁统一。</text>
<text x="80" y="706" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >（不可计算 / 指数 / 尚未确定 都可用判定问题刻画）</text>
<rect x="660" y="128" width="700" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="686" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >实例 与 难易等价</text>
<rect x="684" y="186" width="652" height="80" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="700" y="212" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   >例11.1 最短路径 → 判定问题 PATH</text>
<text x="700" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >优化：求 u→v 边数最少的路径。</text>
<text x="700" y="256" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">判定：给定 k，u→v 是否存在 ≤ k 条边的路径？</text>
<rect x="684" y="278" width="652" height="80" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="700" y="304" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   >例11.2 图着色 → 判定问题 COLORING</text>
<text x="700" y="328" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >优化：相邻顶点不同色所需的最少颜色数。</text>
<text x="700" y="348" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">判定：给定 k，G 最多能用 k 种颜色着色吗？</text>
<rect x="684" y="370" width="652" height="232" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="700" y="396" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   >难易等价：以 TSP 为例</text>
<text x="700" y="422" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >若判定算法 A 存在，可构造优化算法 B：</text>
<text x="700" y="446" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >求最大边权 w，置 M = n×w（最长路径长度上界），</text>
<text x="700" y="468" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >二分查找仅需 O(log₂M) 次调用 A：</text>
<text x="700" y="494" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">low=0, high=M;</text>
<text x="700" y="509" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">while (low &lt;= high) {</text>
<text x="700" y="524" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  mid = (low+high)/2;</text>
<text x="700" y="539" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (A(u, mid)) low = mid;   // 存在 ≤mid 的路径</text>
<text x="700" y="554" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  else           high = mid;</text>
<text x="700" y="569" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="700" y="584" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">return low+1;</text>
<rect x="684" y="614" width="652" height="106" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="700" y="640" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   >结论</text>
<text x="700" y="666" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">A 是多项式时间 → B 也是多项式时间；</text>
<text x="700" y="690" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">A 是指数时间 → B 也是指数时间。</text>
<text x="700" y="712" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >→ 判定问题与优化问题的难易程度一致。</text>
</svg>
