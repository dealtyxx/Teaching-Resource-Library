<script>

(function(){
  const host=document.querySelector('.fx-bg'); if(!host) return;
  const cv=document.createElement('canvas'); host.appendChild(cv);
  const ctx=cv.getContext('2d'); let parts=[];
  function resize(){
    cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    parts=Array.from({length:24},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
      r:1+Math.random()*2, vx:(Math.random()-.5)*.18, vy:-.1-Math.random()*.22, a:.12+Math.random()*.28}));
  }
  function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; if(p.y<-10){p.y=innerHeight+10;p.x=Math.random()*innerWidth;}
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(15,118,110,${p.a})`; ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  addEventListener('resize',resize); resize(); tick();
})();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function barDraw(ctx,W,H,arr,hi={}){
  ctx.clearRect(0,0,W,H);
  const n=arr.length, pad=28, gap=6, bw=Math.max(8,(W-pad*2)/n-gap);
  const mx=Math.max(...arr,1);
  arr.forEach((v,i)=>{
    const x=pad+i*(bw+gap), h=(H-pad*2)*(v/mx), y=H-pad-h;
    let col=hi.sorted&&hi.sorted.has(i)?'#059669':(hi.pivot===i?'#d97706':(hi.i===i||hi.j===i?'#e11d48':(hi.mid===i?'#7c3aed':(hi.range&&i>=hi.range[0]&&i<=hi.range[1]?'#2563eb':'#64748b'))));
    if(hi.active&&hi.active.has(i)) col='#e11d48';
    if(hi.lo===i||hi.hi===i) col='#0891b2';
    ctx.fillStyle=col; ctx.beginPath();
    const r=6; ctx.moveTo(x+r,y); ctx.arcTo(x+bw,y,x+bw,y+h,r); ctx.arcTo(x+bw,y+h,x,y+h,0); ctx.arcTo(x,y+h,x,y,0); ctx.arcTo(x,y,x+bw,y,r); ctx.fill();
    ctx.fillStyle='#0f172a'; ctx.font='bold 11px ui-monospace'; ctx.textAlign='center';
    ctx.fillText(v, x+bw/2, y-6);
  });
}


const n=7; let p=[...Array(n).keys()], r=Array(n).fill(0);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const pos=[[120,200],[250,80],[380,200],[520,80],[650,200],[780,200],[450,280]];
function find(x){ return p[x]===x?x:(p[x]=find(p[x])); }
function uni(a,b){
  a=find(a); b=find(b); if(a===b) return;
  if(r[a]<r[b]) [a,b]=[b,a]; p[b]=a; if(r[a]===r[b]) r[a]++;
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  // edges parent->child reverse: draw to parent
  for(let i=0;i<n;i++) if(p[i]!==i){
    ctx.strokeStyle='#0f766e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(pos[i][0],pos[i][1]); ctx.lineTo(pos[p[i]][0],pos[p[i]][1]); ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const root=find(i);
    ctx.beginPath(); ctx.arc(pos[i][0],pos[i][1],20,0,Math.PI*2);
    ctx.fillStyle=p[i]===i?'#0f766e':'#99f6e4'; ctx.fill();
    ctx.strokeStyle='#0f172a'; ctx.stroke();
    ctx.fillStyle=p[i]===i?'#fff':'#0f172a'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
    ctx.fillText(i,pos[i][0],pos[i][1]+5);
  }
  par.innerHTML=p.map((v,i)=>`<div class="cell ${v===i?'hit':''}">p[${i}]=${v}</div>`).join('');
}
function op(a,b){ uni(a,b); // path compress all
  for(let i=0;i<n;i++) find(i);
  draw(); log.textContent=`Union(${a},${b}) · 根集合已更新`; }
u12.onclick=()=>op(1,2); u34.onclick=()=>op(3,4); u15.onclick=()=>op(1,5); u26.onclick=()=>op(2,6);
rst.onclick=()=>{ p=[...Array(n).keys()]; r=Array(n).fill(0); draw(); log.textContent='重置'; };
draw();

    '<tr><td>F / F11</td><td>进入或退出全屏（适合投影）</td></tr>'+
    '<tr><td>← / →</td><td>上一节 / 下一节</td></tr>'+
    '<tr><td>Space</td><td>触发主按钮（▶ 播放 / 运行）</td></tr>'+
    '<tr><td>? / H</td><td>打开或关闭本帮助</td></tr>'+
    '<tr><td>Esc</td><td>关闭帮助 / 退出全屏</td></tr>'+
    '<tr><td>1 / 2 / 4</td><td>若有速度条，切换 1× 2× 4×</td></tr>'+
    '</table><button type="button" class="close" id="teachClose">知道了</button></div>';
  document.body.appendChild(help);
  function toggleFs(){
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); }
    else document.exitFullscreen?.();
  }
  function showHelp(on){ help.classList.toggle('on', on!==false ? !help.classList.contains('on') : false); if(on===false) help.classList.remove('on'); if(on===true) help.classList.add('on'); }
  function navDir(dir){
    const links=[...document.querySelectorAll('.page-nav a[href]')];
    if(!links.length) return;
    if(dir<0) links[0].click();
    else links[links.length-1].click();
  }
  function firePrimary(){
    const b=document.querySelector('.btn.primary, button.primary, #run, #play, #anim');
    if(b && !b.disabled) b.click();
  }
  function setSpeed(s){
    const btn=[...document.querySelectorAll('.speed button')].find(x=>x.dataset.s===String(s) || x.textContent.trim().startsWith(String(s)));
    if(btn) btn.click();
  }
  teachFs.onclick=toggleFs;
  teachHelpBtn.onclick=()=>showHelp();
  teachClose.onclick=()=>showHelp(false);
  help.onclick=e=>{ if(e.target===help) showHelp(false); };
  teachFocus.onclick=()=>document.body.classList.toggle('teach-focus');
  addEventListener('keydown', e=>{
    const tag=(e.target&&e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable) return;
    if(e.key==='f'||e.key==='F'||e.key==='F11'){ e.preventDefault(); toggleFs(); }
    else if(e.key==='?'||e.key==='h'||e.key==='H'){ e.preventDefault(); showHelp(); }
    else if(e.key==='Escape'){ showHelp(false); if(document.fullscreenElement) document.exitFullscreen?.(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); navDir(-1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); navDir(1); }
    else if(e.key===' ' || e.code==='Space'){ e.preventDefault(); firePrimary(); }
    else if(e.key==='1'||e.key==='2'||e.key==='4'){ setSpeed(e.key); }
  });
})();

</script>
</body></html>
