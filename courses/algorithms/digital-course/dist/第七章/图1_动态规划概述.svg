<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="812" viewBox="0 0 1400 812" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="812" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >动态规划概述 · 从斐波那契入门</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >重叠子问题 → 记录并复用（例7.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第7章 动态规划</text>
<rect x="40" y="128" width="690" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >递归树 Fib(5)</text>
<text x="298" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >大量重叠子问题 → O(2ⁿ)</text>
<line x1="364.10736300746817" y1="249.72944716652094" x2="265.89263699253183" y2="314.2705528334791" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="406.31094647678674" y1="249.07071383909584" x2="513.6890535232133" y2="314.92928616090416" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="228.42724081700533" y1="346.71746919491164" x2="176.57275918299467" y2="405.28253080508836" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="261.5727591829947" y1="346.71746919491164" x2="313.4272408170053" y2="405.28253080508836" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="518.995390008388" y1="347.2055319899344" x2="471.004609991612" y2="404.7944680100656" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="549.7293039362361" y1="348.20018825540944" x2="590.2706960637639" y2="403.79981174459056" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="147.57220018199865" y1="445.6921596823296" x2="117.42779981800133" y2="498.3078403176704" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="174.01643523907734" y1="444.70119666079114" x2="210.98356476092266" y2="499.29880333920886" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<circle cx="385" cy="236" r="25" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.8" opacity="1"/>
<text x="385" y="242" font-size="16.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >F5</text>
<circle cx="245" cy="328" r="25" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.8" opacity="1"/>
<text x="245" y="334" font-size="16.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >F4</text>
<circle cx="535" cy="328" r="25" fill="#fdf1ec" stroke="#eb6834" stroke-width="1.8" opacity="1"/>
<text x="535" y="334" font-size="16.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >F3</text>
<circle cx="160" cy="424" r="25" fill="#fdf1ec" stroke="#eb6834" stroke-width="1.8" opacity="1"/>
<text x="160" y="430" font-size="16.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >F3</text>
<circle cx="330" cy="424" r="25" fill="#fdf6e6" stroke="#eda100" stroke-width="1.8" opacity="1"/>
<text x="330" y="430" font-size="16.5" fill="#8a5f00" font-weight="700" text-anchor="middle"   >F2</text>
<circle cx="455" cy="424" r="25" fill="#fdf6e6" stroke="#eda100" stroke-width="1.8" opacity="1"/>
<text x="455" y="430" font-size="16.5" fill="#8a5f00" font-weight="700" text-anchor="middle"   >F2</text>
<circle cx="605" cy="424" r="25" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.8" opacity="1"/>
<text x="605" y="430" font-size="16.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >F1</text>
<circle cx="105" cy="520" r="25" fill="#fdf6e6" stroke="#eda100" stroke-width="1.8" opacity="1"/>
<text x="105" y="526" font-size="16.5" fill="#8a5f00" font-weight="700" text-anchor="middle"   >F2</text>
<circle cx="225" cy="520" r="25" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.8" opacity="1"/>
<text x="225" y="526" font-size="16.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >F1</text>
<path d="M 535 298 C 495 278, 220 278, 160 394" stroke="#eb6834" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" stroke-dasharray="5 4"/>
<text x="347.5" y="274" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >F3 算了 2 次</text>
<rect x="66" y="576" width="638" height="74" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="84" y="604" font-size="14.5" fill="#b0491d" font-weight="700" text-anchor="start"   >重叠子问题（overlapping subproblems）</text>
<text x="84" y="628" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >F3 重复 2 次、F2 重复 3 次…… 规模越大重复越多，</text>
<text x="84" y="648" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >朴素递归时间达指数级 O(2ⁿ)，非常低效。</text>
<rect x="66" y="662" width="638" height="78" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="84" y="690" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >核心思想</text>
<text x="84" y="716" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >把每个子问题的解「记录」在表（dp 数组）中，</text>
<text x="84" y="736" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >再次遇到时「直接查表」，避免重复计算。</text>
<rect x="750" y="128" width="610" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="776" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >两条路线 + 空间优化</text>
<rect x="776" y="188" width="558" height="150" fill="#ffffff" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<rect x="776" y="188" width="8" height="150" fill="#b0491d" stroke="none" stroke-width="1" rx="0" opacity="1" />
<rect x="798" y="202" width="63.0" height="24" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="12.0" opacity="1" />
<text x="829.5" y="218.5" font-size="12.5" fill="#b0491d" font-weight="600" text-anchor="middle"   >自顶向下</text>
<text x="1316" y="219" font-size="13.5" fill="#52514e" font-weight="700" text-anchor="end"   >备忘录方法（递归+缓存）</text>
<text x="802" y="240" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">int Fib11(int n){</text>
<text x="802" y="260" font-size="12.5" fill="#b0491d" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  if(dp[n]!=0) return dp[n];     // 查表命中</text>
<text x="802" y="280" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  dp[n]= n&lt;=2 ? 1 : Fib11(n-2)+Fib11(n-1);</text>
<text x="802" y="300" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  return dp[n]; }</text>
<text x="802" y="326" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   >递归实现，是动态规划的变形</text>
<rect x="776" y="350" width="558" height="150" fill="#ffffff" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<rect x="776" y="350" width="8" height="150" fill="#127a56" stroke="none" stroke-width="1" rx="0" opacity="1" />
<rect x="798" y="364" width="63.0" height="24" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12.0" opacity="1" />
<text x="829.5" y="380.5" font-size="12.5" fill="#127a56" font-weight="600" text-anchor="middle"   >自底向上</text>
<text x="1316" y="381" font-size="13.5" fill="#52514e" font-weight="700" text-anchor="end"   >迭代制表（真正的动态规划）</text>
<text x="802" y="402" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">int Fib2(int n){</text>
<text x="802" y="422" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  dp[1]=dp[2]=1;</text>
<text x="802" y="442" font-size="12.5" fill="#127a56" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  for(i=3;i&lt;=n;i++) dp[i]=dp[i-2]+dp[i-1];</text>
<text x="802" y="462" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  return dp[n]; }</text>
<text x="802" y="488" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   >dp 表按「子问题→大问题」顺序填充，O(n)</text>
<rect x="776" y="512" width="558" height="150" fill="#ffffff" stroke="#cbc4ee" stroke-width="1.3" rx="12" opacity="1" />
<rect x="776" y="512" width="8" height="150" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<rect x="798" y="526" width="63.0" height="24" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="12.0" opacity="1" />
<text x="829.5" y="542.5" font-size="12.5" fill="#4a3aa7" font-weight="600" text-anchor="middle"   >空间优化</text>
<text x="1316" y="543" font-size="13.5" fill="#52514e" font-weight="700" text-anchor="end"   >滚动数组（只留 3 个格）</text>
<text x="802" y="564" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">int Fib3(int n){</text>
<text x="802" y="584" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  int dp[3]; dp[0]=dp[1]=1;</text>
<text x="802" y="604" font-size="12.5" fill="#4a3aa7" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  for(i=2;i&lt;n;i++) dp[i%3]=dp[(i-1)%3]+dp[(i-2)%3];</text>
<text x="802" y="624" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  return dp[(n-1)%3]; }</text>
<text x="802" y="650" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   >下标循环刷新，空间从 O(n) 降到 O(1)</text>
<rect x="776" y="676" width="558" height="70" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="1055.0" y="705" font-size="17" fill="#1c5cab" font-weight="700" text-anchor="middle"   >动态规划 = 记录子问题的结果再利用</text>
<text x="1055.0" y="730" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle"   >求大问题解时遇到子问题，直接查表（自底向上产生解）</text>
</svg>
