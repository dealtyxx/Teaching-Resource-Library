<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >最大连续子序列和</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >以 aᵢ 结尾：合并 或 另起，取较大者（7.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第7章 动态规划</text>
<rect x="40" y="128" width="600" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >状态与转移</text>
<rect x="64" y="188" width="552" height="52" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="210" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >状态定义</text>
<text x="80" y="230" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(i) = 以元素 aᵢ 结尾的最大连续子序列和</text>
<text x="80" y="276" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   >考虑 aᵢ 的两种选择：</text>
<rect x="64" y="292" width="270.0" height="150" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="82" y="318" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >① 合并</text>
<text x="82" y="340" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >接到前面「以 aᵢ₋₁</text>
<text x="82" y="358" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >结尾的最大子序列」后</text>
<rect x="104" y="378" width="52" height="34" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.4" rx="6" opacity="1" />
<text x="130" y="400" font-size="12.5" fill="#898781" font-weight="700" text-anchor="middle"   >…</text>
<rect x="166" y="378" width="52" height="34" fill="#d4f0e4" stroke="#127a56" stroke-width="1.4" rx="6" opacity="1" />
<text x="192" y="400" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   >aᵢ₋₁</text>
<rect x="228" y="378" width="52" height="34" fill="#c9efe0" stroke="#127a56" stroke-width="1.4" rx="6" opacity="1" />
<text x="254" y="400" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   >aᵢ</text>
<text x="82" y="432" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(i) = f(i−1) + aᵢ</text>
<rect x="346.0" y="292" width="270.0" height="150" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="364.0" y="318" font-size="14.5" fill="#b0491d" font-weight="700" text-anchor="start"   >② 另起</text>
<text x="364.0" y="340" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >抛弃前面，以 aᵢ 自己</text>
<text x="364.0" y="358" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >作为新子序列的开头</text>
<rect x="386.0" y="378" width="52" height="34" fill="#f8d9c8" stroke="#eb6834" stroke-width="1.4" rx="6" opacity="1" />
<text x="412.0" y="400" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >aᵢ</text>
<text x="454.0" y="397" font-size="12" fill="#898781" font-weight="600" text-anchor="start"   >{ aᵢ }</text>
<text x="364.0" y="432" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(i) = aᵢ</text>
<rect x="64" y="462" width="552" height="90" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="490" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   >状态转移方程</text>
<text x="80" y="518" font-size="14" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">dp[0] = a[0]</text>
<text x="80" y="540" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">dp[i] = max( dp[i−1] + aᵢ ,  aᵢ )    i&gt;0</text>
<rect x="64" y="566" width="552" height="74" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="593" font-size="13.5" fill="#b3406e" font-weight="700" text-anchor="start"   >最终答案</text>
<text x="80" y="618" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >ans = max{ dp[i] }；本题规定和至少为 0，</text>
<text x="80" y="636" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >故结果取 max(ans, 0)。时间/空间均 O(n)。</text>
<rect x="664" y="128" width="696" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="690" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >求解示例</text>
<text x="790" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >a = {−2, 11, −4, 13, −5, −2}</text>
<text x="704" y="270" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a</text>
<text x="704" y="348" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">dp</text>
<text x="704" y="222" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle"   >下标</text>
<text x="776.0" y="222" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle"   >0</text>
<rect x="730" y="246" width="80" height="40" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.2" rx="7" opacity="1" />
<text x="770.0" y="272" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   >-2</text>
<rect x="730" y="324" width="80" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="7" opacity="1" />
<text x="770.0" y="350" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   >-2</text>
<text x="868.0" y="222" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle"   >1</text>
<rect x="822" y="246" width="80" height="40" fill="#fdf1ec" stroke="#eb6834" stroke-width="1.5" rx="7" opacity="1" />
<text x="862.0" y="272" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   >11</text>
<rect x="822" y="324" width="80" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="7" opacity="1" />
<text x="862.0" y="350" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   >11</text>
<text x="960.0" y="222" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle"   >2</text>
<rect x="914" y="246" width="80" height="40" fill="#fdf1ec" stroke="#eb6834" stroke-width="1.5" rx="7" opacity="1" />
<text x="954.0" y="272" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   >-4</text>
<rect x="914" y="324" width="80" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="7" opacity="1" />
<text x="954.0" y="350" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   >7</text>
<text x="1052.0" y="222" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle"   >3</text>
<rect x="1006" y="246" width="80" height="40" fill="#fdf1ec" stroke="#eb6834" stroke-width="1.5" rx="7" opacity="1" />
<text x="1046.0" y="272" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   >13</text>
<rect x="1006" y="324" width="80" height="40" fill="#e9f7f1" stroke="#127a56" stroke-width="2" rx="7" opacity="1" />
<text x="1046.0" y="350" font-size="16" fill="#127a56" font-weight="700" text-anchor="middle"   >20</text>
<text x="1144.0" y="222" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle"   >4</text>
<rect x="1098" y="246" width="80" height="40" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.2" rx="7" opacity="1" />
<text x="1138.0" y="272" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   >-5</text>
<rect x="1098" y="324" width="80" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="7" opacity="1" />
<text x="1138.0" y="350" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   >15</text>
<text x="1236.0" y="222" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle"   >5</text>
<rect x="1190" y="246" width="80" height="40" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.2" rx="7" opacity="1" />
<text x="1230.0" y="272" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   >-2</text>
<rect x="1190" y="324" width="80" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="7" opacity="1" />
<text x="1230.0" y="350" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   >13</text>
<path d="M 812 344 L 820 344" stroke="#eb6834" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<path d="M 904 344 L 912 344" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<path d="M 996 344 L 1004 344" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<path d="M 1088 344 L 1096 344" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<path d="M 1180 344 L 1188 344" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<text x="730" y="398" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">绿→合并（dp[i−1]+aᵢ）    橙→另起（aᵢ）</text>
<rect x="704" y="428" width="616" height="74" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="722" y="456" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >最大 dp 值 = 20（下标 3）</text>
<text x="722" y="482" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >回推得一个最大连续子序列 {11, −4, 13}，和为 20。</text>
<rect x="704" y="516" width="616" height="128" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="722" y="543" font-size="14" fill="#4a3aa7" font-weight="700" text-anchor="start"   >滚动数组优化（dp 只依赖 dp[i−1]）</text>
<text x="722" y="568" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">int dp=a[0], ans=dp;</text>
<text x="722" y="589" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for(int j=1;j&lt;n;j++){</text>
<text x="722" y="610" font-size="12.5" fill="#4a3aa7" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  dp=max(dp+a[j], a[j]);  ans=max(ans,dp);</text>
<text x="722" y="631" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">} return max(ans,0);        // 空间 O(1)</text>
</svg>
