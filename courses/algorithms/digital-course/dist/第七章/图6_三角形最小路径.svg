<text x="923.0" y="516" font-size="12" fill="#898781" font-weight="600" text-anchor="middle"   >底行 dp = 原三角形最后一行</text>
<rect x="728" y="528" width="608" height="96" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="746" y="556" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   >状态转移方程（答案 = dp[0][0]）</text>
<text x="746" y="584" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">dp[n−1][j] = a[n−1][j]                初始（底行）</text>
<text x="746" y="606" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">dp[i][j] = min(dp[i+1][j], dp[i+1][j+1]) + a[i][j]</text>
<rect x="728" y="634" width="608" height="84" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.3" rx="12" opacity="1" />
<text x="746" y="662" font-size="14" fill="#4a3aa7" font-weight="700" text-anchor="start"   >滚动数组优化</text>
<text x="746" y="688" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >阶段 i 仅依赖 i+1 → 降维为一维 dp[j]，</text>
<text x="746" y="708" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >自底向上逐行覆盖，空间 O(n)。</text>
