<path d="M 136 378 L 258.0 400" stroke="#eb6834" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<text x="640" y="338" font-size="12.5" fill="#b3406e" font-weight="700" text-anchor="end"   >对角线</text>
<text x="640" y="356" font-size="12.5" fill="#b3406e" font-weight="700" text-anchor="end"   >边界</text>
<path d="M 584 378 L 466.0 400" stroke="#e87ba4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<circle cx="466.0" cy="400" r="2.5" fill="#e87ba4" stroke="none" stroke-width="1" opacity="1"/>
<rect x="64" y="528" width="592" height="190" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="82" y="556" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   >状态转移方程（起点 dp[0][0]=a[0][0]）</text>
<text x="82" y="584" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">dp[i][0] = dp[i−1][0] + a[i][0]</text>
<text x="82" y="604" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >               第0列边界：只能从正上方来</text>
<text x="82" y="628" font-size="13" fill="#b3406e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">dp[i][i] = dp[i−1][i−1] + a[i][i]</text>
<text x="82" y="648" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >               对角线边界：只能从左上方来</text>
<text x="82" y="672" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">dp[i][j] = min(dp[i−1][j−1], dp[i−1][j]) + a[i][j]</text>
<text x="82" y="692" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >               其他：两条来路取最小 → ans=min(dp[n−1][*])</text>
<rect x="704" y="128" width="656" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="730" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >自底向上</text>
<text x="830" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >dp[i][j]=从底到 (i,j) 的最小和</text>
