<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >最好、最坏与平均情况分析</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >以顺序查找为例：在 a[0..n-1] 中查找 x（1.2.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第1章 绪论</text>
<rect x="40" y="130" width="1320" height="96" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="166" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start"   >同一算法在不同输入下的执行次数不同 —— 需分别刻画三种情况</text>
<text x="66" y="200" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >设输入规模为 n，Dₙ 为所有输入集合，T(I) 为输入 I 下基本操作的执行次数（这里基本操作为元素比较 a[i]==x）。</text>
<rect x="40" y="258" width="430" height="452" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="40" y="258" width="430" height="8" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="68" y="306" font-size="23" fill="#0b0b0b" font-weight="700" text-anchor="start"   >最好情况</text>
<text x="170" y="305" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >Best Case</text>
<rect x="362" y="286" width="67.96000000000001" height="30" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="15.0" opacity="1" />
<text x="395.98" y="306.22" font-size="14.5" fill="#127a56" font-weight="600" text-anchor="middle"   >O(1)</text>
<rect x="108.0" y="350" width="44" height="44" fill="#1baf7a" stroke="#127a56" stroke-width="1.3" rx="7" opacity="1" />
<text x="130.0" y="378.0" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle"   >x</text>
<text x="130.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[0]</text>
<rect x="158.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="180.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="180.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[1]</text>
<rect x="208.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="230.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="230.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[2]</text>
<rect x="258.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="280.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="280.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[3]</text>
<rect x="308.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="330.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="330.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[4]</text>
<rect x="358.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="380.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="380.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[5]</text>
<text x="255.0" y="438" font-size="14" fill="#127a56" font-weight="600" text-anchor="middle"   >比较 1 次</text>
<rect x="68" y="490" width="374" height="60" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="10" opacity="1" />
<text x="255.0" y="528" font-size="18" fill="#127a56" font-weight="700" text-anchor="middle"   >G(n) = min T(I) = 1</text>
<text x="68" y="580" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >x 恰好等于首元素 a[0]，比较 1 </text>
<text x="68" y="606" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >次即命中，是算法的时间下界。</text>
<rect x="485" y="258" width="430" height="452" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="485" y="258" width="430" height="8" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="513" y="306" font-size="23" fill="#0b0b0b" font-weight="700" text-anchor="start"   >最坏情况</text>
<text x="615" y="305" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >Worst Case</text>
<rect x="807" y="286" width="67.96000000000001" height="30" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="15.0" opacity="1" />
<text x="840.98" y="306.22" font-size="14.5" fill="#b0491d" font-weight="600" text-anchor="middle"   >O(n)</text>
<rect x="553.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="575.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="575.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[0]</text>
<rect x="603.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="625.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="625.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[1]</text>
<rect x="653.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="675.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="675.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[2]</text>
<rect x="703.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="725.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="725.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[3]</text>
<rect x="753.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="775.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="775.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[4]</text>
<rect x="803.0" y="350" width="44" height="44" fill="#eb6834" stroke="#b0491d" stroke-width="1.3" rx="7" opacity="1" />
<text x="825.0" y="378.0" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle"   >x</text>
<text x="825.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[5]</text>
<text x="700.0" y="438" font-size="14" fill="#b0491d" font-weight="600" text-anchor="middle"   >比较 6 次（n 次）</text>
<rect x="513" y="490" width="374" height="60" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="10" opacity="1" />
<text x="700.0" y="528" font-size="18" fill="#b0491d" font-weight="700" text-anchor="middle"   >W(n) = max T(I) = n</text>
<text x="513" y="580" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >x 等于末元素 a[n-1]（或查找失败</text>
<text x="513" y="606" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >），需比较 n 次，是算法的时间上界。</text>
<rect x="930" y="258" width="430" height="452" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="930" y="258" width="430" height="8" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="958" y="306" font-size="23" fill="#0b0b0b" font-weight="700" text-anchor="start"   >平均情况</text>
<text x="1060" y="305" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >Average Case</text>
<rect x="1252" y="286" width="67.96000000000001" height="30" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="15.0" opacity="1" />
<text x="1285.98" y="306.22" font-size="14.5" fill="#1c5cab" font-weight="600" text-anchor="middle"   >O(n)</text>
<rect x="998.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="1020.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="1020.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[0]</text>
<rect x="1048.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="1070.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="1070.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[1]</text>
<rect x="1098.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="1120.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="1120.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[2]</text>
<rect x="1148.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="1170.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="1170.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[3]</text>
<rect x="1198.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="1220.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="1220.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[4]</text>
<rect x="1248.0" y="350" width="44" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="1270.0" y="378.0" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >·</text>
<text x="1270.0" y="412" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="middle"   >a[5]</text>
<text x="1145.0" y="438" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle"   >每个位置命中概率均为 1/n</text>
<rect x="958" y="490" width="374" height="60" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="1145.0" y="528" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >A(n) = Σ P(I)·T(I)</text>
<text x="958" y="580" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >等概率下 P(a[i])=1/n，命中 </text>
<text x="958" y="606" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >a[i] 需比较 i+1 次，A(n)=</text>
<text x="958" y="632" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >(n+1)/2。</text>
<rect x="40" y="736" width="1320" height="118" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="14" opacity="1" />
<text x="66" y="774" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="start"   >平均时间复杂度推导（成功查找、等概率）</text>
<text x="66" y="810" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">A(n) = Σᵢ (1/n)·(i+1) = (1/n)·(1+2+…+n) = (1/n)·n(n+1)/2 = (n+1)/2  =  O(n)</text>
<text x="66" y="838" font-size="14.5" fill="#898781" font-weight="normal" text-anchor="start"   >平均时间复杂度反映算法总体性能；一般地 G(n) ≤ A(n) ≤ W(n)。</text>
</svg>
