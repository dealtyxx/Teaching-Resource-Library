</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >排列树问题：任务分配与旅行商</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >优先队列式分支限界法 + 下界剪支（6.8 / 6.9）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第6章 分支限界法</text>
<rect x="40" y="128" width="660" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >任务分配问题</text>
<text x="210" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >lb 越小越优先，剪支 lb ≥ bestc</text>
<text x="246.0" y="216" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >任务0</text>
<text x="298.0" y="216" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >任务1</text>
<text x="350.0" y="216" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >任务2</text>
<text x="402.0" y="216" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >任务3</text>
<text x="154" y="216" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle"   >成本 c</text>
<text x="176" y="255.0" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >人0</text>
<rect x="220" y="224" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="246.0" y="256.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >9</text>
<rect x="272" y="224" width="52" height="52" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="5" opacity="1" />
<text x="298.0" y="256.0" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >2</text>
<rect x="324" y="224" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="350.0" y="256.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >7</text>
<rect x="376" y="224" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="402.0" y="256.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >8</text>
<text x="176" y="307.0" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >人1</text>
<rect x="220" y="276" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="246.0" y="308.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >6</text>
<rect x="272" y="276" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="298.0" y="308.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >4</text>
<rect x="324" y="276" width="52" height="52" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="5" opacity="1" />
<text x="350.0" y="308.0" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<rect x="376" y="276" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="402.0" y="308.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >7</text>
<text x="176" y="359.0" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >人2</text>
<rect x="220" y="328" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="246.0" y="360.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >5</text>
<rect x="272" y="328" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="298.0" y="360.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >8</text>
<rect x="324" y="328" width="52" height="52" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="5" opacity="1" />
<text x="350.0" y="360.0" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >1</text>
<rect x="376" y="328" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="402.0" y="360.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >8</text>
<text x="176" y="411.0" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >人3</text>
<rect x="220" y="380" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="246.0" y="412.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >7</text>
<rect x="272" y="380" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="298.0" y="412.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >6</text>
<rect x="324" y="380" width="52" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="350.0" y="412.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >9</text>
<rect x="376" y="380" width="52" height="52" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="5" opacity="1" />
<text x="402.0" y="412.0" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >4</text>
<text x="448" y="322" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   >各行</text>
<text x="448" y="340" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   >最小</text>
<rect x="68" y="456" width="604" height="84" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="484" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >下界函数 lb</text>
<text x="86" y="512" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">lb = 已分配成本 + Σ(未分配各行·未用任务的最小值)</text>
<text x="86" y="532" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">根结点 lb = 2+3+1+4 = 10</text>
<rect x="68" y="552" width="604" height="96" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="580" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >优先队列式：lb 越小越优先出队（跳跃式）</text>
<text x="86" y="606" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >为人员 i 试探每个未用任务 j → 子结点</text>
<text x="86" y="630" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">剪支：仅扩展 lb &lt; bestc 的结点</text>
<text x="70" y="744" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >解空间 = 排列树；bound() 为 O(n²)，最坏 O(n²·n!)。</text>
<rect x="720" y="128" width="640" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="746" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >旅行商问题 TSP</text>
<text x="956" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >lb=length+dist，状态压缩</text>
<path d="M 834 236 L 936 236" stroke="#4a3aa7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 984 236 L 1086 236" stroke="#4a3aa7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 1134 236 L 1236 236" stroke="#4a3aa7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 1260 260 C 1260 306, 810 306, 810 260" stroke="#eb6834" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" stroke-dasharray="5 4"/>
<text x="1035.0" y="322" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   >回到 s（闭合回路）</text>
<circle cx="810" cy="236" r="23" fill="#3a2e86" stroke="#3a2e86" stroke-width="1.7" opacity="1"/>
<text x="810" y="242" font-size="13" fill="#fff" font-weight="700" text-anchor="middle"   >s</text>
<circle cx="960" cy="236" r="23" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.7" opacity="1"/>
<text x="960" y="242" font-size="13" fill="#3a2e86" font-weight="700" text-anchor="middle"   >x₁</text>
<circle cx="1110" cy="236" r="23" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.7" opacity="1"/>
<text x="1110" y="242" font-size="13" fill="#3a2e86" font-weight="700" text-anchor="middle"   >…</text>
<circle cx="1260" cy="236" r="23" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.7" opacity="1"/>
<text x="1260" y="242" font-size="13" fill="#3a2e86" font-weight="700" text-anchor="middle"   >xₙ₋₁</text>
<rect x="748" y="358" width="584" height="96" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="386" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   >状态压缩（用 int 位表示 used 集合）</text>
<text x="766" y="412" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">inset(used,j) = used &amp; (1&lt;&lt;j)   判断 j 是否在路径</text>
<text x="766" y="434" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">addj(used,j)  = used | (1&lt;&lt;j)   加入顶点 j</text>
<rect x="748" y="466" width="584" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="494" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   >下界函数 lb</text>
<text x="766" y="520" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">lb = 当前路径长度 length + dist[vno]</text>
<text x="766" y="544" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >dist[i] = 顶点 i 到起点 s 的最短路径（6.4 预处理）</text>
<rect x="748" y="574" width="584" height="72" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="602" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >优先队列 lb 越小越优先；剪支：</text>
<text x="766" y="628" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">仅扩展 lb &lt; minpathlen 的结点</text>
<text x="750" y="744" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >解空间 = 排列树；最坏 O((n−1)!)。</text>
</svg>
