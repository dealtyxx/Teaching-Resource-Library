<circle cx="700" cy="378" r="24" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.8" opacity="1"/>
<text x="700" y="384" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   >5</text>
<circle cx="510" cy="568" r="24" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1.8" opacity="1"/>
<text x="510" y="574" font-size="16" fill="#898781" font-weight="700" text-anchor="middle"   >1</text>
<text x="150" y="342" font-size="12" fill="#3a2e86" font-weight="700" text-anchor="middle"   >源点</text>
<text x="550" y="568" font-size="12" fill="#898781" font-weight="600" text-anchor="start"   >不可达</text>
<text x="100" y="628" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle"   >i</text>
<text x="190" y="628" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle"   >0</text>
<text x="280" y="628" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle"   >1</text>
<text x="370" y="628" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle"   >2</text>
<text x="460" y="628" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle"   >3</text>
<text x="550" y="628" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle"   >4</text>
<text x="640" y="628" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle"   >5</text>
<line x1="70" y1="638" x2="730" y2="638" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt" />
<text x="100" y="664" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >dist</text>
<text x="190" y="664" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<text x="280" y="664" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">∞</text>
<text x="370" y="664" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">10</text>
<text x="460" y="664" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">50</text>
<text x="550" y="664" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">30</text>
<text x="640" y="664" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">60</text>
<text x="100" y="692" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >pre</text>
<text x="190" y="692" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">−</text>
<text x="280" y="692" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">*</text>
<text x="370" y="692" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<text x="460" y="692" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<text x="550" y="692" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<text x="640" y="692" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<rect x="780" y="128" width="580" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="806" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >边松弛 relax</text>
<text x="1016" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >队列存放待扩展的顶点</text>
<circle cx="910" cy="258" r="26" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.8" opacity="1"/>
<text x="910" y="264" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   >u</text>
<circle cx="1210" cy="258" r="26" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.8" opacity="1"/>
<text x="1210" y="264" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   >v</text>
<path d="M 936 258 L 1180 258" stroke="#52514e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<rect x="1034.0" y="218" width="52" height="24" fill="#fff" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="1060.0" y="235" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">A[u][v]</text>
<text x="910" y="220" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   >dist[u]</text>
<text x="1210" y="220" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   >dist[v]</text>
<rect x="808" y="314" width="524" height="74" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="1070.0" y="342" font-size="15" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">若 dist[u] + A[u][v] &lt; dist[v]</text>
<text x="1070.0" y="370" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">则 dist[v]←dist[u]+A[u][v]，pre[v]←u，v 进队</text>
<rect x="808" y="408" width="524" height="250" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="826" y="436" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">dist[s]=0; qu.push(s);</text>
<text x="826" y="456" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">while (!qu.empty()) {</text>
<text x="826" y="476" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  u = qu.front(); qu.pop();</text>
<text x="826" y="496" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  for (v : 0..n-1)</text>
<text x="826" y="516" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    if (A[u][v]!=0 &amp;&amp; A[u][v]!=INF)</text>
<text x="826" y="536" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      if (dist[u]+A[u][v] &lt; dist[v]) {</text>
<text x="826" y="556" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">        dist[v]=dist[u]+A[u][v];</text>
<text x="826" y="576" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">        pre[v]=u;</text>
<text x="826" y="596" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">        qu.push(v);   // 松弛成功才进队</text>
<text x="826" y="616" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      }</text>
<text x="826" y="636" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="810" y="740" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >顶点可多次进队；LeetCode743 网络延迟即此模型。</text>
</svg>
