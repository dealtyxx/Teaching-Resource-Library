<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="812" viewBox="0 0 1400 812" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="812" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >两种分支限界法框架</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >队列式（一层层） vs 优先队列式（跳跃式）（6.3 / 6.6）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第6章 分支限界法</text>
<rect x="40" y="128" width="660" height="520" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >队列式框架</text>
<text x="188" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >FIFO 队列</text>
<rect x="68" y="198" width="604" height="232" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="224" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">void bfs() {</text>
<text x="86" y="241.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  定义队列 q;  根结点进队;</text>
<text x="86" y="259.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  while (q 非空) {</text>
<text x="86" y="276.5" font-size="12.5" fill="#1c5cab" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">    出队结点 e;   // FIFO</text>
<text x="86" y="294.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    for (e 扩展出 e1) {</text>
<text x="86" y="311.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      if (e1 满足 constraint())</text>
<text x="86" y="329.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">        if (e1 是叶子)</text>
<text x="86" y="346.5" font-size="12.5" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">          比较得更优解;</text>
<text x="86" y="364.0" font-size="12.5" fill="#b0491d" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">        else if (e1 满足 bound())</text>
<text x="86" y="381.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">          e1 进队;    // 剪支</text>
<text x="86" y="399.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    }</text>
<text x="86" y="416.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  }</text>
<text x="86" y="434.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="70" y="464" font-size="14" fill="#2a78d6" font-weight="700" text-anchor="start"   >扩展次序</text>
<line x1="340" y1="519" x2="240" y2="549" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="340" y1="519" x2="440" y2="549" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="240" y1="579" x2="180" y2="609" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="240" y1="579" x2="300" y2="609" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="440" y1="579" x2="380" y2="609" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="440" y1="579" x2="500" y2="609" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<circle cx="340" cy="504" r="15" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" opacity="1"/>
<text x="340" y="509" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   >1</text>
<circle cx="240" cy="564" r="15" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" opacity="1"/>
<text x="240" y="569" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   >2</text>
<circle cx="440" cy="564" r="15" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" opacity="1"/>
<text x="440" y="569" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   >3</text>
<circle cx="180" cy="624" r="15" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" opacity="1"/>
<text x="180" y="629" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   >4</text>
<circle cx="300" cy="624" r="15" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" opacity="1"/>
<text x="300" y="629" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   >5</text>
<circle cx="380" cy="624" r="15" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" opacity="1"/>
<text x="380" y="629" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   >6</text>
<circle cx="500" cy="624" r="15" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" opacity="1"/>
<text x="500" y="629" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   >7</text>
<text x="340" y="662" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >① 一层一层，先进先出</text>
<rect x="720" y="128" width="640" height="520" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="746" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >优先队列式框架</text>
<text x="912" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >priority_queue</text>
<rect x="748" y="198" width="584" height="232" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="224" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">void bfs() {</text>
<text x="766" y="241.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  定义优先队列 q;  根结点进队;</text>
<text x="766" y="259.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  while (q 非空) {</text>
<text x="766" y="276.5" font-size="12.5" fill="#3a2e86" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">    出队结点 e;   // 取最优</text>
<text x="766" y="294.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    for (e 扩展出 e1) {</text>
<text x="766" y="311.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      if (e1 满足 constraint())</text>
<text x="766" y="329.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">        if (e1 是叶子)</text>
<text x="766" y="346.5" font-size="12.5" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">          更新/直接返回最优解;</text>
<text x="766" y="364.0" font-size="12.5" fill="#b0491d" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">        else if (e1 满足 bound())</text>
<text x="766" y="381.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">          e1 进队;    // 剪支</text>
<text x="766" y="399.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    }</text>
<text x="766" y="416.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  }</text>
<text x="766" y="434.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="750" y="464" font-size="14" fill="#4a3aa7" font-weight="700" text-anchor="start"   >扩展次序</text>
<line x1="1020" y1="519" x2="920" y2="549" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="1020" y1="519" x2="1120" y2="549" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="920" y1="579" x2="860" y2="609" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="920" y1="579" x2="980" y2="609" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="1120" y1="579" x2="1060" y2="609" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="1120" y1="579" x2="1180" y2="609" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<circle cx="1020" cy="504" r="15" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.4" opacity="1"/>
<text x="1020" y="509" font-size="12" fill="#3a2e86" font-weight="700" text-anchor="middle"   >1</text>
<circle cx="1120" cy="564" r="15" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.4" opacity="1"/>
<text x="1120" y="569" font-size="12" fill="#3a2e86" font-weight="700" text-anchor="middle"   >2</text>
<circle cx="1060" cy="624" r="15" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.4" opacity="1"/>
<text x="1060" y="629" font-size="12" fill="#3a2e86" font-weight="700" text-anchor="middle"   >3</text>
<circle cx="920" cy="564" r="15" fill="#f2f0f7" stroke="#c3c2b7" stroke-width="1.4" opacity="1"/>
<text x="920" y="569" font-size="12" fill="#898781" font-weight="700" text-anchor="middle"   >4</text>
<circle cx="1180" cy="624" r="15" fill="#f2f0f7" stroke="#c3c2b7" stroke-width="1.4" opacity="1"/>
<text x="1180" y="629" font-size="12" fill="#898781" font-weight="700" text-anchor="middle"   >-</text>
<circle cx="860" cy="624" r="15" fill="#f2f0f7" stroke="#c3c2b7" stroke-width="1.4" opacity="1"/>
<text x="860" y="629" font-size="12" fill="#898781" font-weight="700" text-anchor="middle"   >-</text>
<circle cx="980" cy="624" r="15" fill="#f2f0f7" stroke="#c3c2b7" stroke-width="1.4" opacity="1"/>
<text x="980" y="629" font-size="12" fill="#898781" font-weight="700" text-anchor="middle"   >-</text>
<path d="M 1020 519 C 1120 564, 1060 584, 1060 609" stroke="#eb6834" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" stroke-dasharray="4 3"/>
<text x="1020" y="662" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   >② 选最优活结点，跳跃式深入</text>
<rect x="40" y="668" width="1320" height="120" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="708" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >判断叶子结点（可行解）的两种方式</text>
<text x="70" y="738" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >方式1 · 出队结点 e 时判断：若 e 是叶子则更新更优解、不再扩展；否则扩展 e。</text>
<text x="70" y="768" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >方式2 · 扩展出子结点 e1 后判断：若 e1 是叶子则更新更优解、不进队；否则进队待扩展。</text>
</svg>
