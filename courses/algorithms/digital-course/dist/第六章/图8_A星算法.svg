<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="812" viewBox="0 0 1400 812" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="812" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >A* 算法 · 启发式搜索</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >f = g + h，用启发式函数引导搜索（6.10）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第6章 分支限界法</text>
<rect x="40" y="128" width="660" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >代价函数 f = g + h</text>
<circle cx="150" cy="258" r="26" fill="#3a2e86" stroke="#3a2e86" stroke-width="1.8" opacity="1"/>
<text x="150" y="264" font-size="14" fill="#fff" font-weight="700" text-anchor="middle"   >s</text>
<circle cx="370" cy="258" r="26" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.8" opacity="1"/>
<text x="370" y="264" font-size="14" fill="#2a78d6" font-weight="700" text-anchor="middle"   >n</text>
<circle cx="600" cy="258" r="26" fill="#e9f7f1" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="600" y="264" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >goal</text>
<path d="M 176 258 L 340 258" stroke="#2a78d6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<text x="260.0" y="242" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >g(n)：已走代价</text>
<path d="M 396 258 L 570 258" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" stroke-dasharray="5 4"/>
<text x="485.0" y="242" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   >h(n)：估计代价</text>
<rect x="68" y="328" width="604" height="54" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="370.0" y="362" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f(n) = g(n) + h(n)  ≈ 经过 n 的最优路径代价</text>
<rect x="68" y="402" width="292.0" height="150" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="430" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >OPEN 表</text>
<text x="86" y="458" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >已生成、</text>
<text x="86" y="480" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >未考察的结点</text>
<text x="86" y="510" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >（用优先队列</text>
<text x="86" y="532" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >按 f 排序）</text>
<rect x="380.0" y="402" width="292.0" height="150" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="398.0" y="430" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >CLOSED 表</text>
<text x="398.0" y="458" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >已访问过的</text>
<text x="398.0" y="480" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >结点</text>
<text x="398.0" y="510" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >（记录双亲</text>
<text x="398.0" y="532" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >以回溯路径）</text>
<rect x="68" y="572" width="604" height="172" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="600" font-size="14.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >搜索步骤</text>
<text x="86" y="628" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >① s 入 OPEN，CLOSED 为空</text>
<text x="86" y="652" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >② 取 OPEN 中 f 最小的 u，移入 CLOSED</text>
<text x="86" y="676" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >③ 若 u=goal，沿双亲指针输出路径，成功</text>
<text x="86" y="700" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >④ 扩展 u 的子结点，算 f，加入 OPEN</text>
<text x="86" y="724" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >⑤ 按 f 递增重排 OPEN，转 ②</text>
<text x="70" y="756" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   >本质上是“带启发式的优先队列式分支限界法”。</text>
<rect x="720" y="128" width="640" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="746" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >启发式函数 h(n)</text>
<rect x="748" y="198" width="584" height="78" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="226" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >可接纳性（admissible）</text>
<text x="766" y="252" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">h(n) ≤ H(n)：估计不超过实际 → 保证找到最短路径</text>
<rect x="748" y="286" width="584" height="78" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="314" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >一致性 / 单调性（consistent）</text>
<text x="766" y="340" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">h(nᵢ) ≤ c(nᵢ,nⱼ) + h(nⱼ)：满足三角不等式</text>
<text x="760" y="402" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start"   >常用距离（网格启发式）</text>
<rect x="748" y="424" width="584" height="96" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<rect x="748" y="424" width="8" height="96" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="770" y="454" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >曼哈顿距离</text>
<text x="770" y="482" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">|xᵢ−xⱼ| + |yᵢ−yⱼ|</text>
<text x="770" y="506" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >只走上下左右</text>
<rect x="748" y="532" width="584" height="96" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<rect x="748" y="532" width="8" height="96" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="770" y="562" font-size="15" fill="#b0491d" font-weight="700" text-anchor="start"   >对角线距离</text>
<text x="770" y="590" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">max(|xᵢ−xⱼ|, |yᵢ−yⱼ|)</text>
<text x="770" y="614" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >可走对角线</text>
<rect x="748" y="640" width="584" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<rect x="748" y="640" width="8" height="96" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="770" y="670" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >欧几里得距离</text>
<text x="770" y="698" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">√((xᵢ−xⱼ)² + (yᵢ−yⱼ)²)</text>
<text x="770" y="722" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >直线距离</text>
</svg>
