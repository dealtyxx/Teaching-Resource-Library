<text x="1154" y="308" font-size="11" fill="#b3201f" font-weight="700" text-anchor="middle"   >此处右拐 →</text>
<rect x="704" y="488" width="632" height="130" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="514" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >判断算法（HDU2108）</text>
<text x="720" y="538" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (i=1; i&lt;=n; i++) {   // 首尾补点使环闭合</text>
<text x="720" y="554" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  d = Direction(p[i−1], p[i], p[i+1]);</text>
<text x="720" y="570" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (d == −1) { flag=true; break; }  // 出现右拐</text>
<text x="720" y="586" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="720" y="602" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">输出 flag ? "concave" : "convex";</text>
<rect x="704" y="628" width="632" height="92" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="720" y="654" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   >凸多边形性质</text>
<text x="720" y="678" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >任意两顶点连线都在多边形内部；</text>
<text x="720" y="700" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >凹多边形至少有一个「凹点」，其连线有部分在外。</text>
