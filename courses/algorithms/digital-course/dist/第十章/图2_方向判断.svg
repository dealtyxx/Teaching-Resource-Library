<text x="202" y="486" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p0</text>
<circle cx="296" cy="460" r="4.5" fill="#1c5cab" stroke="none" stroke-width="1" opacity="1"/>
<text x="304" y="452" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1</text>
