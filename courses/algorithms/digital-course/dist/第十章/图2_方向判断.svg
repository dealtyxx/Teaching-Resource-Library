<rect x="64" y="186" width="552" height="70" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">d = Det(p1−p0, p2−p0)</text>
<text x="80" y="238" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >把 p0 当原点，看 p0p1 到 p0p2 的转向</text>
