<text x="270" y="384" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p2</text>
<text x="275.6" y="439.6" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >左拐</text>
<text x="400" y="328" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">例：d = Det((3,1),(2,3))</text>
<text x="400" y="350" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  = 3×3 − 1×2 = 7 &gt; 0</text>
<text x="400" y="372" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  → 左拐，Direction 返回 1</text>
<rect x="64" y="558" width="552" height="162" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="584" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >符号含义（教材约定）</text>
<text x="84" y="612" font-size="12.5" fill="#898781" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">d = 0</text>
<text x="170" y="612" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >三点共线</text>
<text x="84" y="638" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">d &gt; 0</text>
<text x="170" y="638" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >p0p1 在 p0p2 顺时针方向 · 右手螺旋 · 左拐</text>
<text x="84" y="664" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">d &lt; 0</text>
<text x="170" y="664" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >p0p1 在 p0p2 逆时针方向 · 左手螺旋 · 右拐</text>
<text x="84" y="694" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">Direction 返回 0 / 1 / −1 对应上面三种情形。</text>
<rect x="680" y="128" width="680" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="706" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >凸多边形 与 凹多边形（例10.1）</text>
<rect x="704" y="186" width="632" height="48" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="720" y="215" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >顶点按逆时针给出：全部左拐 → 凸；出现右拐 → 凹。</text>
