<line x1="648" y1="428" x2="648" y2="298" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="674" y1="428" x2="674" y2="298" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="700" y1="428" x2="700" y2="298" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
