<text x="461.0" y="420" font-size="10" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p2</text>
<line x1="480.4" y1="350" x2="457.0" y2="402" stroke="#e34948" stroke-width="2" stroke-linecap="butt" stroke-dasharray="4 3"/>
