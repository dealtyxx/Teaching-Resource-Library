<text x="563" y="441" font-size="10" fill="#898781" font-weight="600" text-anchor="end"   >O</text>
<line x1="596" y1="402" x2="687.0" y2="402" stroke="#0b0b0b" stroke-width="2.6" stroke-linecap="butt" />
<circle cx="596" cy="402" r="4" fill="#0b0b0b" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="687.0" cy="402" r="4" fill="#0b0b0b" stroke="none" stroke-width="1" opacity="1"/>
<text x="592" y="420" font-size="10" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p1</text>
<text x="691.0" y="420" font-size="10" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p2</text>
<line x1="637.6" y1="339.6" x2="637.6" y2="402" stroke="#e34948" stroke-width="2" stroke-linecap="butt" stroke-dasharray="4 3"/>
<circle cx="637.6" cy="402" r="3.5" fill="#e34948" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="637.6" cy="339.6" r="5" fill="#4a3aa7" stroke="none" stroke-width="1" opacity="1"/>
<text x="645.6" y="333.6" font-size="11" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p0</text>
<text x="648" y="282.4" font-size="12" fill="#4a3aa7" font-weight="700" text-anchor="middle"   >(c) q 在段内</text>
<text x="564" y="468" font-size="10.5" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">否则 |Det(v1,v3)|/|v1|</text>
<rect x="64" y="528" width="672" height="192" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="554" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >DistPtoSegment(p0,p1,p2)</text>
<text x="80" y="580" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">v1=p2−p1; v2=p1−p2; v3=p0−p1; v4=p0−p2;</text>
<text x="80" y="600" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">if (p1==p2)         return Length(p0−p1);   // 两点重合</text>
<text x="80" y="620" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">if (Dot(v1,v3)&lt;0)   return Length(v3);       // 图(a)</text>
<text x="80" y="640" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">else if (Dot(v2,v4)&lt;0) return Length(v4);    // 图(b)</text>
<text x="80" y="660" font-size="11.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">else return fabs(Det(v1,v3)) / Length(v1);   // 图(c) 垂距</text>
<text x="80" y="688" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >图(c) 中 |Det(v1,v3)| 是平行四边形面积，除以底 |v1| 即为高（垂距）。</text>
<rect x="800" y="128" width="560" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="826" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >三个判断（点积 / 叉积）</text>
<rect x="824" y="186" width="512" height="176" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="840" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >点在矩形内</text>
<text x="840" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >p1 左上、p2 右下为对角；p0 在矩形内 ⟺</text>
<text x="840" y="258" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">(p1−p0)·(p2−p0) ≤ 0   （夹角为直角或钝角）</text>
<rect x="892" y="293.0" width="66" height="33.0" fill="#cdeede" stroke="#127a56" stroke-width="1.4" rx="3" opacity="1" />
<circle cx="925.0" cy="309.5" r="4" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"/>
<text x="925.0" y="301.5" font-size="10" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p0</text>
<text x="888" y="287.0" font-size="9.5" fill="#52514e" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">p1</text>
<text x="964" y="338" font-size="9.5" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p2</text>
<text x="1040" y="323" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >对角连线张成矩形，</text>
<text x="1040" y="343" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >点积 ≤0 即落在其中。</text>
<rect x="824" y="372" width="512" height="96" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="840" y="398" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >点在线段上</text>
<text x="840" y="422" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">Det(p1−p0, p2−p0)==0     共线（在直线上）</text>
<text x="840" y="444" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">&amp;&amp; Dot(p1−p0, p2−p0)&lt;=0  且在 p1p2 之间</text>
<rect x="824" y="478" width="512" height="96" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="840" y="504" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >两线段平行</text>
<text x="840" y="528" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">Det(p2−p1, p4−p3) == 0</text>
<text x="840" y="550" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >两方向向量叉积为 0 → 方向相同或相反。</text>
<rect x="824" y="584" width="512" height="136" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="840" y="610" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >点积判夹角 Angle(p0,p1,p2)</text>
<text x="840" y="634" font-size="12" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">r = (p1−p0)·(p2−p0)</text>
<text x="840" y="658" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">r&gt;0 锐角   r=0 直角   r&lt;0 钝角</text>
<text x="840" y="686" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >这些判断都只用加减、点积、叉积三种基本运算。</text>
</svg>
