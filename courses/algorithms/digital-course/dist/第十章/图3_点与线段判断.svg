<text x="488.4" y="344" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p0</text>
<text x="418" y="282.4" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >(b) q 在 p2 外</text>
<text x="334" y="468" font-size="10.5" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">Dot(v2,v4)&lt;0 → |v4|</text>
<line x1="570" y1="428" x2="570" y2="298" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="596" y1="428" x2="596" y2="298" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
