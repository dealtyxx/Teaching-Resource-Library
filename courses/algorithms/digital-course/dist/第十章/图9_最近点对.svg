<text x="128" y="681" font-size="10" fill="#898781" font-weight="600" text-anchor="end"   >O</text>
<rect x="248.78400000000002" y="184" width="124.43199999999999" height="484" fill="#fdf6e6" stroke="none" stroke-width="1" rx="0" opacity="0.7" />
<line x1="248.78400000000002" y1="668" x2="248.78400000000002" y2="184" stroke="#8a5f00" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/>
<line x1="373.216" y1="668" x2="373.216" y2="184" stroke="#8a5f00" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/>
