<text x="223" y="377.6" font-size="10.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">d1=2.24</text>
<line x1="355" y1="492" x2="399" y2="536" stroke="#e34948" stroke-width="2.6" stroke-linecap="butt" />
<text x="403.4" y="514.0" font-size="10.5" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">d2=1.41</text>
<circle cx="311" cy="228" r="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6" opacity="1"/>
<text x="311" y="231.5" font-size="9" fill="#2a78d6" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<circle cx="267" cy="360" r="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6" opacity="1"/>
<text x="267" y="363.5" font-size="9" fill="#2a78d6" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<circle cx="531" cy="360" r="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6" opacity="1"/>
<text x="531" y="363.5" font-size="9" fill="#eb6834" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<circle cx="267" cy="492" r="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6" opacity="1"/>
<text x="267" y="495.5" font-size="9" fill="#2a78d6" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<circle cx="355" cy="404" r="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6" opacity="1"/>
<text x="355" y="407.5" font-size="9" fill="#eb6834" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<circle cx="355" cy="492" r="8" fill="#fdeceb" stroke="#e34948" stroke-width="2" opacity="1"/>
<text x="355" y="495.5" font-size="9" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<circle cx="399" cy="536" r="8" fill="#fdeceb" stroke="#e34948" stroke-width="2" opacity="1"/>
<text x="399" y="539.5" font-size="9" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<circle cx="487" cy="624" r="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.6" opacity="1"/>
<text x="487" y="627.5" font-size="9" fill="#eb6834" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">7</text>
<circle cx="267" cy="668" r="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6" opacity="1"/>
<text x="267" y="671.5" font-size="9" fill="#2a78d6" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">8</text>
<circle cx="179" cy="404" r="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6" opacity="1"/>
<text x="179" y="407.5" font-size="9" fill="#2a78d6" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">9</text>
<text x="201.0" y="210.39999999999998" font-size="11" fill="#1c5cab" font-weight="700" text-anchor="middle"   >S1(左)</text>
<text x="509.0" y="210.39999999999998" font-size="11" fill="#b0491d" font-weight="700" text-anchor="middle"   >S2(右)</text>
<text x="70" y="730" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="start"   >黄色带形区：与中轴线水平距离 &lt; d 的点，可能存在更近的跨界点对。</text>
<rect x="700" y="128" width="660" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="726" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >蛮力 与 分治</text>
<rect x="724" y="186" width="612" height="64" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="212" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   >蛮力法：两两求距离取最小</text>
<text x="740" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">双重循环，时间复杂度 O(n²)。</text>
<rect x="724" y="262" width="612" height="170" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="288" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >分治法（先按 x 排序）</text>
<text x="740" y="314" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >① 分解</text>
<text x="820" y="314" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >以中点 a[mid] 画竖直中轴线，分成左右两半</text>
<text x="740" y="342" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >② 求解</text>
<text x="820" y="342" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >递归求左半 d1、右半 d2，d = min(d1, d2)</text>
<text x="740" y="370" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >③ 合并</text>
<text x="820" y="370" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >只考虑与中轴线水平距离 &lt; d 的带形区点</text>
<text x="820" y="398" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >带形区点按 y 递增排序，每点仅查其后 ≤ 7 个</text>
<rect x="724" y="442" width="612" height="96" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="468" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   >为什么只查 7 个点？</text>
<text x="740" y="492" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >带形区宽 2d、高 d 的矩形内，同侧点两两距离 ≥ d，</text>
<text x="740" y="514" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >最多容纳常数个点 → 每点向后比较不超过 7 个即可。</text>
<rect x="724" y="548" width="612" height="78" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="574" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >复杂度</text>
<text x="740" y="598" font-size="12.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">T(n) = 2·T(n/2) + O(n)  →  O(n log n)</text>
<text x="740" y="618" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >合并（复制 + 按 y 排序 + 常数次比较）为 O(n)。</text>
<rect x="724" y="636" width="612" height="84" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="662" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   >本例结果</text>
<text x="740" y="686" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">d1(左)=2.236(a9,a1)  d2(右)=1.414(a5,a6)</text>
<text x="740" y="708" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">最近点对 = (a5, a6)，距离 = √2 ≈ 1.414</text>
</svg>
