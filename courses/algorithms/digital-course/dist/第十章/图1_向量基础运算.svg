<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >向量基础运算</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >点、向量加减、点积与叉积（10.1.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第10章 计算几何</text>
<rect x="40" y="128" width="620" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >向量加减 · 平行四边形法则</text>
<rect x="64" y="186" width="572" height="72" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="212" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >点 / 向量：p = (x, y)，起点为原点的有向线段</text>
<text x="80" y="236" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1 ± p2 = (x1 ± x2,  y1 ± y2)   结果仍是向量</text>
<line x1="160" y1="618" x2="160" y2="408" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="190" y1="618" x2="190" y2="408" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="220" y1="618" x2="220" y2="408" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="250" y1="618" x2="250" y2="408" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="280" y1="618" x2="280" y2="408" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="310" y1="618" x2="310" y2="408" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="340" y1="618" x2="340" y2="408" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="370" y1="618" x2="370" y2="408" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="618" x2="370" y2="618" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="588" x2="370" y2="588" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="558" x2="370" y2="558" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="528" x2="370" y2="528" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="498" x2="370" y2="498" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="468" x2="370" y2="468" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="438" x2="370" y2="438" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="408" x2="370" y2="408" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="558" x2="378" y2="558" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<line x1="190" y1="618" x2="190" y2="400" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<text x="183" y="571" font-size="10" fill="#898781" font-weight="600" text-anchor="end"   >O</text>
<line x1="250" y1="588" x2="340" y2="498" stroke="#2a78d6" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="280" y1="468" x2="340" y2="498" stroke="#eb6834" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="4 3"/>
<path d="M 190 558 L 250 588" stroke="#2a78d6" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<path d="M 190 558 L 280 468" stroke="#eb6834" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<path d="M 190 558 L 340 498" stroke="#127a56" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="250" cy="588" r="4" fill="#1c5cab" stroke="none" stroke-width="1" opacity="1"/>
<text x="258" y="606" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1(2,−1)</text>
<circle cx="280" cy="468" r="4" fill="#b0491d" stroke="none" stroke-width="1" opacity="1"/>
<text x="288" y="458" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p2(3,3)</text>
<circle cx="340" cy="498" r="4" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="348" y="488" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p3=p1+p2 (5,2)</text>
<rect x="64" y="614" width="572" height="106" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="640" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   >几何意义</text>
<text x="80" y="664" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >p1+p2：以 p1、p2 为邻边作平行四边形，对角线即为和。</text>
<text x="80" y="686" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">性质：p1+p2 = p2+p1，  p1−p2 = −(p2−p1)。</text>
<text x="80" y="708" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">减法 = 加上负向量：p1−p2 = p1+(−p2)。</text>
<rect x="680" y="128" width="680" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="706" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >点积 与 叉积</text>
<rect x="704" y="186" width="632" height="158" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="212" font-size="14" fill="#b0491d" font-weight="700" text-anchor="start"   >点积 Dot（内积）→ 标量</text>
<text x="720" y="238" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1·p2 = x1·x2 + y1·y2 = |p1||p2|cosθ</text>
<text x="720" y="264" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">double Dot(p1,p2){ return p1.x*p2.x+p1.y*p2.y; }</text>
<text x="720" y="294" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   >符号 → 夹角：</text>
<rect x="830" y="280" width="148" height="26" fill="#ffffff" stroke="#127a56" stroke-width="1.1" rx="7" opacity="1" />
<text x="842" y="298" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1·p2 &gt;0</text>
<text x="948" y="298" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="end"   >锐角</text>
<rect x="990" y="280" width="148" height="26" fill="#ffffff" stroke="#1c5cab" stroke-width="1.1" rx="7" opacity="1" />
<text x="1002" y="298" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1·p2 =0</text>
<text x="1108" y="298" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="end"   >直角</text>
<rect x="1150" y="280" width="148" height="26" fill="#ffffff" stroke="#b3201f" stroke-width="1.1" rx="7" opacity="1" />
<text x="1162" y="298" font-size="11.5" fill="#b3201f" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1·p2 &lt;0</text>
<text x="1268" y="298" font-size="11.5" fill="#b3201f" font-weight="700" text-anchor="end"   >钝角</text>
<text x="720" y="328" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">求向量长度：|p| = sqrt(Dot(p,p))。</text>
<rect x="704" y="360" width="632" height="158" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="386" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   >叉积 Det（外积）→ 标量</text>
<text x="720" y="412" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1×p2 = x1·y2 − x2·y1 = |p1||p2|sinθ</text>
<text x="720" y="438" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">double Det(p1,p2){ return p1.x*p2.y-p1.y*p2.x; }</text>
<text x="720" y="468" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   >符号 → 转向：</text>
<text x="830" y="484" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1×p2 &gt;0</text>
<text x="970" y="484" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >p1 在 p2 顺时针方向</text>
<text x="830" y="504" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1×p2 &lt;0</text>
<text x="970" y="504" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >逆时针方向</text>
<text x="830" y="524" font-size="11.5" fill="#898781" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1×p2 =0</text>
<text x="970" y="524" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >两向量共线</text>
<text x="720" y="502" font-size="10" fill="#52514e" font-weight="normal" text-anchor="start"   ></text>
<rect x="704" y="534" width="632" height="186" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="560" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >叉积的几何意义：带符号面积</text>
<line x1="770" y1="688" x2="934" y2="688" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<line x1="770" y1="688" x2="770" y2="550" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<text x="763" y="701" font-size="10" fill="#898781" font-weight="600" text-anchor="end"   >O</text>
<path d="M 770 688 L 874 662 L 900 584 L 796 610 Z" fill="#cdeede" opacity="0.6" stroke="#127a56" stroke-width="1.4"/>
<path d="M 770 688 L 874 662" stroke="#2a78d6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<path d="M 770 688 L 796 610" stroke="#eb6834" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<text x="880" y="676" font-size="11" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">p1</text>
<text x="790" y="604" font-size="11" fill="#b0491d" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">p2</text>
<text x="980" y="606" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">|p1×p2| = 平行四边形面积</text>
<text x="980" y="630" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">三角形面积 = |p1×p2| / 2</text>
<text x="980" y="658" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">性质：p1×p2 = −(p2×p1)</text>
<text x="980" y="682" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >点积/叉积是计算几何的两大基石。</text>
</svg>
