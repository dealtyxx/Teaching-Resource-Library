<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >最远点对问题 · 旋转卡壳法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >先求凸包，再卡着外壳转一圈找对踵点（10.4.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第10章 计算几何</text>
<rect x="40" y="128" width="640" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >旋转卡壳示意</text>
<text x="210" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >当前边 a0a1，最远点 a4</text>
<line x1="130" y1="648" x2="130" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="180" y1="648" x2="180" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="230" y1="648" x2="230" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="280" y1="648" x2="280" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="330" y1="648" x2="330" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="380" y1="648" x2="380" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="430" y1="648" x2="430" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="480" y1="648" x2="480" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="530" y1="648" x2="530" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="580" y1="648" x2="580" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="630" y1="648" x2="630" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="648" x2="630" y2="648" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="598" x2="630" y2="598" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="548" x2="630" y2="548" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="498" x2="630" y2="498" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="448" x2="630" y2="448" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="398" x2="630" y2="398" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="348" x2="630" y2="348" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="298" x2="630" y2="298" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="248" x2="630" y2="248" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="198" x2="630" y2="198" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="648" x2="638" y2="648" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<line x1="130" y1="648" x2="130" y2="190" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<text x="123" y="661" font-size="10" fill="#898781" font-weight="600" text-anchor="end"   >O</text>
<path d="M 230.0 598.0 L 430.0 598.0 L 580.0 448.0 L 480.0 298.0 L 280.0 248.0 L 130.0 448.0 Z" fill="#eef4fc" opacity="0.6" stroke="#1c5cab" stroke-width="2.4"/>
<line x1="230" y1="598" x2="430" y2="598" stroke="#e34948" stroke-width="4" stroke-linecap="butt" />
<line x1="100.0" y1="598" x2="630" y2="598" stroke="#e34948" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 4"/>
<line x1="100.0" y1="248" x2="630" y2="248" stroke="#2a78d6" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 4"/>
<text x="590.0" y="614" font-size="10" fill="#b3201f" font-weight="700" text-anchor="middle"   >红线=当前边</text>
<text x="560.0" y="240" font-size="10" fill="#1c5cab" font-weight="700" text-anchor="middle"   >蓝线=最远点</text>
<line x1="230" y1="598" x2="280" y2="248" stroke="#127a56" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="430" y1="598" x2="280" y2="248" stroke="#127a56" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="4 3"/>
<text x="240.0" y="423.0" font-size="10" fill="#127a56" font-weight="700" text-anchor="middle"   >两条虚线</text>
<text x="240.0" y="448.0" font-size="10" fill="#127a56" font-weight="700" text-anchor="middle"   >取最长=maxdist</text>
<circle cx="230" cy="598" r="7" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" opacity="1"/>
<text x="230" y="601.5" font-size="10" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a0</text>
<circle cx="430" cy="598" r="7" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" opacity="1"/>
<text x="430" y="601.5" font-size="10" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a1</text>
<circle cx="580" cy="448" r="7" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" opacity="1"/>
<text x="580" y="451.5" font-size="10" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a2</text>
<circle cx="480" cy="298" r="7" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" opacity="1"/>
<text x="480" y="301.5" font-size="10" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a3</text>
<circle cx="280" cy="248" r="9" fill="#e9f7f1" stroke="#127a56" stroke-width="2.2" opacity="1"/>
<text x="280" y="251.5" font-size="10" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a4</text>
<circle cx="130" cy="448" r="7" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" opacity="1"/>
<text x="130" y="451.5" font-size="10" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a5</text>
<rect x="700" y="128" width="660" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="726" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >找最远点 与 一圈遍历</text>
<rect x="724" y="186" width="612" height="72" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >基本思想</text>
<text x="740" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >先用 Graham 求凸包；对每条边找离它最远的点（对踵点），</text>
<text x="740" y="256" font-size="10" fill="#52514e" font-weight="normal" text-anchor="start"   ></text>
<rect x="724" y="268" width="612" height="150" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="294" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >如何找最远点？比平行四边形面积</text>
<line x1="793.0" y1="385.0" x2="884" y2="385.0" stroke="#e34948" stroke-width="3" stroke-linecap="butt" />
<text x="837.2" y="401.0" font-size="9.5" fill="#b3201f" font-weight="700" text-anchor="middle"   >当前边</text>
<path d="M 793.0 385.0 L 884 385.0 L 832 340.8 Z" fill="#fdf1ec" opacity="0.7" stroke="#b0491d" stroke-width="1.2"/>
<circle cx="832" cy="340.8" r="4" fill="#b0491d" stroke="none" stroke-width="1" opacity="1"/>
<text x="840" y="340.8" font-size="10" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">近 S2</text>
<path d="M 793.0 385.0 L 884 385.0 L 915.2 309.6 Z" fill="#e9f7f1" opacity="0.7" stroke="#127a56" stroke-width="1.2"/>
<circle cx="915.2" cy="309.6" r="4" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="923.2" y="309.6" font-size="10" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">远 S1</text>
<text x="1020" y="334" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">S = |Det| = 底×高</text>
<text x="1020" y="356" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >面积越大 → 离边越远</text>
<text x="1020" y="380" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">while S(j+1) &gt; S(j): j++</text>
<text x="1020" y="402" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >找到面积最大处即最远点</text>
<rect x="724" y="428" width="612" height="64" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="454" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   >为什么只转一圈？</text>
<text x="740" y="478" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >红线（边）转动时，最远点单调前进不回退 → 卡壳一圈 O(m)。</text>
<rect x="724" y="502" width="612" height="148" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="528" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >RotatingCalipers(凸包 a)</text>
<text x="740" y="554" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">j = 1;</text>
<text x="740" y="568.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (i=0; i&lt;n; i++) {</text>
<text x="740" y="583.0" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  while (|Det(a[i]−a[i+1], a[j+1]−a[i+1])|</text>
<text x="740" y="597.5" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">         &gt; |Det(a[i]−a[i+1], a[j]−a[i+1])|)</text>
<text x="740" y="612.0" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">    j = (j+1) % n;      // 最远点前移</text>
<text x="740" y="626.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  maxdist = max(maxdist,</text>
<text x="740" y="641.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      max(dist(a[i],a[j]), dist(a[i+1],a[j])));</text>
<text x="740" y="655.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="724" y="662" width="612" height="58" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="740" y="688" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">复杂度：Graham 求凸包 O(n log n) + 卡壳 O(m)</text>
<text x="740" y="710" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >→ 整体 O(n log n)，远优于蛮力 O(n²)。</text>
</svg>
