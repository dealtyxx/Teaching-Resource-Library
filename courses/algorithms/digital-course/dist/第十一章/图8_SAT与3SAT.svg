<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >第一个 NP 完全问题 · SAT 与 3SAT</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >合取范式的可满足性；Cook–Levin 定理（11.3.2 / 11.3.3）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第11章 计算复杂性</text>
<rect x="40" y="128" width="640" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >布尔可满足性 SAT</text>
<rect x="64" y="186" width="592" height="66" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#b3406e" font-weight="700" text-anchor="start"   >Cook–Levin 定理（20 世纪 70 年代）</text>
<text x="80" y="236" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >SAT 是第一个被证明的 NP 完全问题。</text>
<rect x="64" y="262" width="592" height="128" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="288" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >合取范式 CNF 的三级结构</text>
<text x="80" y="316" font-size="12.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">文字（literal）：布尔变元 xᵢ 或其非 ¬xᵢ</text>
<text x="80" y="340" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">子句（clause）：若干文字的「析取」∨</text>
<text x="80" y="364" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">合取范式：若干子句的「合取」∧</text>
<rect x="64" y="402" width="592" height="130" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="428" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   >示例 CNF 公式 F1</text>
<text x="80" y="462" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">F1 = (x1∨x2) ∧ (¬x1∨x3∨x4∨x5) ∧ (¬x1∨¬x3∨x4)</text>
<line x1="132" y1="472" x2="132" y2="494" stroke="#4a3aa7" stroke-width="1.2" stroke-linecap="butt" />
<text x="132" y="508" font-size="10.5" fill="#4a3aa7" font-weight="700" text-anchor="middle"   >文字</text>
<line x1="160" y1="448" x2="160" y2="454" stroke="#b0491d" stroke-width="1.2" stroke-linecap="butt" />
<text x="160" y="446" font-size="10.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >子句</text>
<text x="80" y="524" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >∧ 连接子句 → 整体是合取范式（clauses 用 ∧ 相连）。</text>
<rect x="64" y="544" width="592" height="176" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="570" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >真值赋值 与 可满足性</text>
<text x="80" y="596" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >真值赋值：给每个布尔变元取一组 0/1 值。</text>
<text x="80" y="620" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >可满足赋值：使整个公式取值为 1 的赋值。</text>
<text x="80" y="644" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >若存在可满足赋值，则称公式「可满足」。</text>
<text x="80" y="672" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >SAT 判定问题：给定布尔公式 F，F 可满足吗？</text>
<text x="80" y="702" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >（合取范式为真 ⟺ 每个子句都为真）</text>
<rect x="700" y="128" width="660" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="726" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >3SAT · 每子句恰 3 个文字</text>
<rect x="724" y="186" width="612" height="66" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="212" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >3CNF：布尔公式中每个子句恰好含 3 个文字。</text>
<text x="740" y="236" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >3SAT：给定一个 3CNF 公式 F，F 可满足吗？</text>
<rect x="724" y="262" width="612" height="156" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="288" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >示例 F2（3CNF）</text>
<text x="740" y="316" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">F2 = (x1∨x2∨x3) ∧ (¬x2∨x3∨x4)</text>
<text x="740" y="338" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">        ∧ (¬x1∨¬x4∨x2)</text>
<text x="740" y="366" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">赋值 x1=0, x2=1, x3=1, x4=0：</text>
<text x="740" y="390" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">各子句 = 1∧1∧1 = 1 → F2 可满足 ✓</text>
<text x="740" y="442" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   >逐子句验证：</text>
<rect x="740" y="458" width="200" height="26" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="752" y="476" font-size="11" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">(x1∨x2∨x3)</text>
<text x="970" y="476" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">0∨1∨1=1</text>
<rect x="740" y="490" width="200" height="26" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="752" y="508" font-size="11" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">(¬x2∨x3∨x4)</text>
<text x="970" y="508" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">0∨1∨0=1</text>
<rect x="740" y="522" width="200" height="26" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="752" y="540" font-size="11" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">(¬x1∨¬x4∨x2)</text>
<text x="970" y="540" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">1∨1∨1=1</text>
<rect x="724" y="556" width="612" height="164" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="582" font-size="13.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >定理：SAT ≤ₚ 3SAT（3SAT 也是 NPC）</text>
<text x="740" y="608" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >第一步：把每个子句拆成 ≤3 个文字（引入辅助变元 y）。</text>
<text x="740" y="632" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >第二步：补足到恰好 3 个文字（引入 p、q）：</text>
<text x="756" y="656" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">· 3 个文字：保持不变</text>
<text x="756" y="678" font-size="11.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">· 2 个文字 l1∨l2 → (l1∨l2∨p)∧(l1∨l2∨¬p)</text>
<text x="756" y="700" font-size="10.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">· 1 个文字 l → (l∨p∨q)∧(l∨p∨¬q)∧(l∨¬p∨q)∧(l∨¬p∨¬q)</text>
</svg>
