<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >P、NP、NPC、NP 难 的关系</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >复杂性类的两种可能世界：P≠NP 与 P=NP（11.3.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第11章 计算复杂性</text>
<rect x="40" y="128" width="660" height="624" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >假设 P ≠ NP（普遍认为）</text>
<ellipse cx="440" cy="378" rx="180" ry="200" fill="none" fill-opacity="1" stroke="#b3406e" stroke-width="2" stroke-dasharray="7 5"/>
<text x="440" y="208" font-size="13" fill="#b3406e" font-weight="700" text-anchor="middle"   >NP 难（NP-hard）</text>
<text x="440" y="228" font-size="10.5" fill="#898781" font-weight="600" text-anchor="middle"   >含 NPC，且可延伸到 NP 之外</text>
<ellipse cx="370" cy="458" rx="250" ry="175" fill="#eef4fc" fill-opacity="0.6" stroke="#1c5cab" stroke-width="2.4" />
<text x="160" y="328" font-size="20" fill="#1c5cab" font-weight="700" text-anchor="middle"   >NP</text>
<ellipse cx="280" cy="508" rx="120" ry="85" fill="#e9f7f1" fill-opacity="0.8" stroke="#127a56" stroke-width="2.2" />
<text x="280" y="513" font-size="20" fill="#127a56" font-weight="700" text-anchor="middle"   >P</text>
<ellipse cx="490" cy="398" rx="95" ry="75" fill="#fdeef4" fill-opacity="0.8" stroke="#b3406e" stroke-width="2.2" />
<text x="490" y="396" font-size="15" fill="#b3406e" font-weight="700" text-anchor="middle"   >NPC</text>
<text x="490" y="416" font-size="10" fill="#b3406e" font-weight="600" text-anchor="middle"   >NP完全</text>
<rect x="64" y="648" width="612" height="88" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="674" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >此假设下的关系</text>
<text x="80" y="698" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >P 与 NPC 是 NP 内互不相交的子集；</text>
<text x="80" y="720" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >NPC 是 NP 中「最难」的问题，NP 难可超出 NP。</text>
<rect x="720" y="128" width="640" height="624" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="746" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >若 P = NP · 定义与定理</text>
<ellipse cx="900" cy="278" rx="150" ry="130" fill="none" fill-opacity="1" stroke="#b3406e" stroke-width="2" stroke-dasharray="7 5"/>
<text x="900" y="168" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   >NP 难</text>
<ellipse cx="900" cy="293" rx="120" ry="78" fill="#e9f7f1" fill-opacity="0.7" stroke="#127a56" stroke-width="2.4" />
<text x="900" y="290" font-size="16" fill="#127a56" font-weight="700" text-anchor="middle"   >P = NP</text>
<text x="900" y="312" font-size="12" fill="#127a56" font-weight="600" text-anchor="middle"   >= NP完全</text>
<text x="1120" y="258" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >若 P=NP，则 P、NP、</text>
<text x="1120" y="280" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >NPC 三者合并为同一类，</text>
<text x="1120" y="302" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >NP 难仍在其外。</text>
<rect x="744" y="378" width="592" height="96" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1.3" rx="12" opacity="1" />
<text x="760" y="404" font-size="13.5" fill="#b3406e" font-weight="700" text-anchor="start"   >定义 11.8 · NP 完全（NPC）</text>
<text x="760" y="430" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">① ∏ ∈ NP；</text>
<text x="760" y="454" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">② 对所有 ∏′ ∈ NP，都有 ∏′ ≤ₚ ∏。</text>
<rect x="744" y="486" width="592" height="76" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.3" rx="12" opacity="1" />
<text x="760" y="512" font-size="13.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >定义 11.9 · NP 难（NPH）</text>
<text x="760" y="538" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >只需满足条件 ②（不一定属于 NP）。如停机问题。</text>
<rect x="744" y="574" width="592" height="96" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="760" y="600" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >定理 11.4</text>
<text x="760" y="626" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >若任何一个 NPC 问题多项式时间可解，则 P = NP。</text>
<text x="760" y="650" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >等价：若 NP 中有问题无多项式算法，则 NPC 都无。</text>
<rect x="744" y="682" width="592" height="54" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="760" y="710" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >只要攻破一个 NPC 问题，全部 NPC 问题随之可解。</text>
</svg>
