<text x="543.0" y="328" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">n²</text>
<text x="419.0" y="344.0" font-size="13" fill="#b3201f" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">2ⁿ</text>
<text x="337.0" y="344.0" font-size="12" fill="#b3406e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">n!</text>
<text x="335" y="720.0" font-size="11" fill="#898781" font-weight="600" text-anchor="middle"   >问题规模 n →</text>
<text x="103.0" y="488" font-size="11" fill="#898781" font-weight="600" text-anchor="middle"   >时间</text>
<text x="495" y="568" font-size="11" fill="#1c5cab" font-weight="700" text-anchor="middle"   >多项式区（易解）</text>
<text x="239.0" y="388.0" font-size="11" fill="#b3201f" font-weight="700" text-anchor="middle"   >指数区（难解）</text>
<rect x="680" y="128" width="680" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="706" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >难解问题的三种类型</text>
<rect x="704" y="188" width="632" height="92" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.3" rx="12" opacity="1" />
<rect x="704" y="188" width="8" height="92" fill="#b3201f" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="724" y="220" font-size="14.5" fill="#b3201f" font-weight="700" text-anchor="start"   >① 不可计算</text>
<text x="724" y="246" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >根本不存在求解算法</text>
<text x="724" y="268" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >如停机问题</text>
<rect x="704" y="292" width="632" height="92" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<rect x="704" y="292" width="8" height="92" fill="#b0491d" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="724" y="324" font-size="14.5" fill="#b0491d" font-weight="700" text-anchor="start"   >② 指数级</text>
<text x="724" y="350" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >至少需指数级时间 / 空间</text>
<text x="724" y="372" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >如求幂集、全排列</text>
<rect x="704" y="396" width="632" height="92" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.3" rx="12" opacity="1" />
<rect x="704" y="396" width="8" height="92" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="724" y="428" font-size="14.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >③ 尚未确定</text>
<text x="724" y="454" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >有算法但既未找到多项式算法，</text>
<text x="724" y="476" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >也未证明是难解（哈密顿回路、TSP、0/1 背包）</text>
<rect x="704" y="508" width="632" height="130" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="534" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >伪多项式时间（易被误解的例子）</text>
<text x="720" y="560" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >0/1 背包动态规划为 O(nW)，看似 n 的多项式；</text>
<text x="720" y="584" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >但 |I| = n 与 W 的二进制位数之和，W 用 log₂W 位表示。</text>
<text x="720" y="610" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >当 W 很大时，O(nW) 关于 |I| 仍是指数级 → 伪多项式。</text>
<rect x="704" y="652" width="632" height="68" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="678" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >关键：复杂度要按输入规模 |I|（编码长度）来衡量，</text>
<text x="720" y="702" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >而不是数值本身，才能正确区分易解与难解。</text>
</svg>
