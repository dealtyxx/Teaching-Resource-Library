<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >易解问题 与 难解问题</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >以多项式时间复杂性作为易解 / 难解的分界线（11.1.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第11章 计算复杂性</text>
<rect x="40" y="128" width="620" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >多项式 vs 指数增长</text>
<rect x="64" y="186" width="572" height="76" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="212" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >规模 |I|：实例 I 的二进制编码长度</text>
<text x="80" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >多项式时间算法 → 易解问题；无多项式算法 → 难解问题。</text>
