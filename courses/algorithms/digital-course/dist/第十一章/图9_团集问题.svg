<line x1="770" y1="558" x2="1110" y2="528" stroke="#e5e4dc" stroke-width="1" stroke-linecap="butt" />
<line x1="830" y1="598" x2="1210" y2="558" stroke="#e5e4dc" stroke-width="1" stroke-linecap="butt" />
