<line x1="1060" y1="278" x2="770" y2="558" stroke="#e5e4dc" stroke-width="1" stroke-linecap="butt" />
<line x1="1060" y1="278" x2="830" y2="598" stroke="#e5e4dc" stroke-width="1" stroke-linecap="butt" />
