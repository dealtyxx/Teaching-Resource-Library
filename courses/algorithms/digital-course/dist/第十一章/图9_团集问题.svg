<text x="870" y="532" font-size="10.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">x3</text>
<circle cx="1210" cy="558" r="16" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.4" opacity="1"/>
<text x="1210" y="562" font-size="10.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">x1</text>
<circle cx="1150" cy="598" r="16" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.4" opacity="1"/>
<text x="1150" y="602" font-size="10.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">x2</text>
<circle cx="1110" cy="528" r="16" fill="#e9f7f1" stroke="#127a56" stroke-width="2.4" opacity="1"/>
<text x="1110" y="532" font-size="10.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">x3</text>
<rect x="644" y="640" width="692" height="80" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="666" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">满足赋值 x2=0, x3=1（x1 任取）→ 团集 {¬x2, x3, x3}</text>
<text x="660" y="690" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >三顶点分属 C1、C2、C3 且两两有边 → 大小 3 = 子句数 k。</text>
<text x="660" y="712" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >故 F3 可满足 ⟺ G 有 3 团集。</text>
