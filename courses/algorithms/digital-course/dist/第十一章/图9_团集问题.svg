<text x="920" y="282" font-size="10.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">x1</text>
<circle cx="990" cy="268" r="16" fill="#e9f7f1" stroke="#127a56" stroke-width="2.4" opacity="1"/>
<text x="990" y="272" font-size="10.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">¬x2</text>
