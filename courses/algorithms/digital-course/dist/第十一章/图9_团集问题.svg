<text x="770" y="562" font-size="10.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">¬x1</text>
<circle cx="830" cy="598" r="16" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.4" opacity="1"/>
<text x="830" y="602" font-size="10.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">x2</text>
