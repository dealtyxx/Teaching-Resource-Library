</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >团集问题 CLIQUE · 3SAT ≤ₚ CLIQUE</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >把 3SAT 实例构造成图，可满足 ⟺ 存在 k 团集（例11.9）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第11章 计算复杂性</text>
<rect x="40" y="128" width="560" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >CLIQUE 定义 与 归约构造</text>
<rect x="64" y="186" width="512" height="92" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >团集 CLIQUE</text>
<text x="80" y="238" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >团集 = 图 G 的一个完全子图（其中任意两</text>
<text x="80" y="260" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >顶点都有边）。判定：G 中有大小为 k 的团集吗？</text>
<rect x="64" y="290" width="512" height="76" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="316" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >① CLIQUE ∈ NP</text>
<text x="80" y="342" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >证书 = 一个大小 k 的顶点集 V′，验证 V′ 中</text>
<text x="80" y="362" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >任意两点是否都有边（多项式时间）。</text>
<rect x="64" y="378" width="512" height="174" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="404" font-size="13.5" fill="#b3406e" font-weight="700" text-anchor="start"   >② 3SAT ≤ₚ CLIQUE 的构造</text>
<text x="80" y="430" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >F = C1∧C2∧…∧Ck，每子句 3 个文字。</text>
<text x="80" y="454" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >· 每个子句的 3 个文字 → 图 G 的 3 个顶点；</text>
<text x="80" y="478" font-size="12" fill="#b3406e" font-weight="700" text-anchor="start"   >· 顶点 lᵢ、lⱼ 连边 ⟺ 属于不同子句</text>
<text x="80" y="500" font-size="12" fill="#b3406e" font-weight="700" text-anchor="start"   >   且 lᵢ 不是 lⱼ 的非（不互相矛盾）；</text>
<text x="80" y="524" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >· 可多项式时间构造出图 G。</text>
<rect x="64" y="564" width="512" height="96" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="590" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >关键等价</text>
<text x="80" y="616" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >F 可满足 ⟺ G 有大小为 k 的团集。</text>
<text x="80" y="642" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >（团集中每子句选一个为真的文字，互不矛盾）</text>
<rect x="64" y="672" width="512" height="48" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="700" font-size="12" fill="#4a3aa7" font-weight="700" text-anchor="start"   >CLIQUE ∈ NP + 3SAT≤ₚCLIQUE → CLIQUE 是 NP 完全。</text>
<rect x="620" y="128" width="740" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >示例 F3 的图 G</text>
<text x="878" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >k=3 团集 = 一个满足赋值</text>
<rect x="644" y="184" width="692" height="46" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="10" opacity="1" />
<text x="660" y="212" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">F3 = (x1∨¬x2∨¬x3) ∧ (¬x1∨x2∨x3) ∧ (x1∨x2∨x3)</text>
<ellipse cx="990" cy="276" rx="95" ry="42" fill="#eef4fc" fill-opacity="0.5" stroke="#b7d3f6" stroke-width="1.4"/>
<ellipse cx="825" cy="563" rx="80" ry="55" fill="#eef4fc" fill-opacity="0.5" stroke="#b7d3f6" stroke-width="1.4"/>
<ellipse cx="1155" cy="563" rx="80" ry="55" fill="#eef4fc" fill-opacity="0.5" stroke="#b7d3f6" stroke-width="1.4"/>
<text x="990" y="236" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">C1</text>
<text x="750" y="513" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">C2</text>
<text x="1230" y="513" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">C3</text>
<line x1="920" y1="278" x2="830" y2="598" stroke="#e5e4dc" stroke-width="1" stroke-linecap="butt" />
<line x1="920" y1="278" x2="870" y2="528" stroke="#e5e4dc" stroke-width="1" stroke-linecap="butt" />
