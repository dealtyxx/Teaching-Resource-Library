<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >P 类 与 NP 类问题</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >多项式时间「可解」与多项式时间「可验证」（11.1.4 / 11.1.5）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第11章 计算复杂性</text>
<rect x="40" y="128" width="620" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >P 类 · 多项式时间可解</text>
<rect x="64" y="186" width="572" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >定义 11.3</text>
<text x="80" y="238" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >P 类：yes/no 解可由确定性算法在多项式时间</text>
<text x="80" y="260" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >内得到的判定问题。∏ ∈ P ⟺ ∏ 是易解问题。</text>
<rect x="64" y="294" width="572" height="100" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="320" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >确定性算法（DTM）</text>
<text x="80" y="346" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >每一步只有一种选择 → 相同输入必得相同输出。</text>
<rect x="90" y="360" width="130" height="30" fill="#ffffff" stroke="#b7d3f6" stroke-width="1.2" rx="8" opacity="1" />
<text x="155" y="380" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">输入 I</text>
<path d="M 222 375 L 270 375" stroke="#52514e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<rect x="272" y="360" width="160" height="30" fill="#ffffff" stroke="#b7d3f6" stroke-width="1.2" rx="8" opacity="1" />
<text x="352" y="380" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   >确定性计算</text>
<path d="M 434 375 L 482 375" stroke="#52514e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<rect x="484" y="360" width="120" height="30" fill="#e9f7f1" stroke="#127a56" stroke-width="1.2" rx="8" opacity="1" />
<text x="544" y="380" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">yes / no</text>
<rect x="64" y="412" width="572" height="150" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="438" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >例11.4 最长公共子序列判定问题 ∈ P</text>
<text x="80" y="464" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >原问题：求序列 a、b 的最长公共子序列长度 d。</text>
<text x="80" y="488" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >判定问题：给定 D，存在长度 ≥ D 的公共子序列吗？</text>
<text x="80" y="514" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">算法 B：用 LCSlength() 求 d（O(mn) 多项式），</text>
<text x="80" y="538" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">         若 d ≥ D 回答 yes，否则 no。 → 属于 P</text>
<rect x="64" y="576" width="572" height="144" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="602" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >P 类问题举例</text>
<text x="80" y="628" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >排序、最短路径、最小生成树、最长公共子序列、</text>
<text x="80" y="652" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >矩阵乘法…… 都有多项式时间算法。</text>
<text x="80" y="682" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >P 类 = 我们通常认为「可高效求解」的问题。</text>
<text x="80" y="706" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >图灵机角度：DTM 多项式时间可计算的判定问题。</text>
<rect x="680" y="128" width="680" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="706" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >NP 类 · 多项式时间可验证</text>
<rect x="704" y="186" width="632" height="74" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="212" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >定义 11.5 / 11.6</text>
<text x="720" y="238" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >NP 类：存在多项式时间非确定性算法的判定问题；</text>
<text x="720" y="258" font-size="10" fill="#52514e" font-weight="normal" text-anchor="start"   ></text>
<rect x="704" y="270" width="632" height="128" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="296" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >非确定性算法 = 猜测 + 验证</text>
<rect x="724" y="314" width="96" height="60" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2" rx="8" opacity="1" />
<text x="772" y="340" font-size="12" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">输入 x</text>
<path d="M 822 344 L 860 344" stroke="#52514e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<rect x="862" y="314" width="150" height="60" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.4" rx="8" opacity="1" />
<text x="937" y="336" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >① 猜测阶段</text>
<text x="937" y="358" font-size="11" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">产生任意串 y</text>
<path d="M 1014 344 L 1052 344" stroke="#52514e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<rect x="1054" y="314" width="150" height="60" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="8" opacity="1" />
<text x="1129" y="336" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   >② 验证阶段</text>
<text x="1129" y="358" font-size="11" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">y 是 x 的解吗</text>
<path d="M 1206 344 L 1244 344" stroke="#52514e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<rect x="1246" y="324" width="88" height="40" fill="#ffffff" stroke="#127a56" stroke-width="1.2" rx="8" opacity="1" />
<text x="1290" y="349" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">yes/no</text>
<rect x="704" y="408" width="632" height="66" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="720" y="434" font-size="12.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >接受 I ⟺ 存在一个导致回答 yes 的猜测。</text>
<text x="720" y="458" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >「可验证」：给出证书 y 就能多项式时间验证其正确性。</text>
<rect x="704" y="484" width="632" height="106" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="510" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >例11.6 图着色 COLORING ∈ NP</text>
<text x="720" y="536" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >猜测：给每个顶点任取一种颜色（解 s）；</text>
<text x="720" y="560" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >验证：遍历每条边，检查两端颜色是否不同。</text>
<text x="720" y="582" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >猜测 + 验证均为多项式时间 → COLORING ∈ NP。</text>
<rect x="704" y="602" width="632" height="118" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="628" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   >定理 11.1：P ⊆ NP</text>
<text x="720" y="654" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >P 类问题有确定性算法 A，把它的解当作证书 y，</text>
<text x="720" y="678" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >验证时直接运行 A 即可 → P 类问题也在 NP 中。</text>
<text x="720" y="704" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >P 是否等于 NP，是计算机科学最著名的未解难题。</text>
</svg>
