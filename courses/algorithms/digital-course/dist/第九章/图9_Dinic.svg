<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >Dinic 算法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >BFS 建分层网络 + 一次 DFS 多路增广（9.3.4）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第9章 图算法</text>
<rect x="40" y="128" width="700" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >分层网络 与 多路增广</text>
<rect x="64" y="186" width="652" height="66" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >与 EK 相同：也找边数最少的增广路径。</text>
<text x="80" y="236" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >不同：EK 每条路径都重启 BFS；Dinic 一次 DFS 完成多条路径增广。</text>
<text x="80" y="280" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >① BFS 建立分层网络（level[S]=0，逐层 +1）</text>
<rect x="104" y="316" width="92" height="200" fill="#fbfbfa" stroke="#eeeee8" stroke-width="1" rx="10" opacity="1" />
<text x="150" y="334" font-size="10.5" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">level 0</text>
<rect x="284" y="316" width="92" height="200" fill="#fbfbfa" stroke="#eeeee8" stroke-width="1" rx="10" opacity="1" />
<text x="330" y="334" font-size="10.5" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">level 1</text>
<rect x="464" y="316" width="92" height="200" fill="#fbfbfa" stroke="#eeeee8" stroke-width="1" rx="10" opacity="1" />
<text x="510" y="334" font-size="10.5" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">level 2</text>
<rect x="614" y="316" width="92" height="200" fill="#fbfbfa" stroke="#eeeee8" stroke-width="1" rx="10" opacity="1" />
<text x="660" y="334" font-size="10.5" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">level 3</text>
<path d="M 170.34611850415675 422.8004363822711 L 305.77843035219433 388.18995668777256" stroke="#127a56" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<path d="M 170.34611850415675 433.1995636177289 L 305.77843035219433 467.81004331222744" stroke="#127a56" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<path d="M 351.0 382.0 L 485.0 382.0" stroke="#127a56" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<path d="M 348.6991283261177 391.5573322555713 L 487.739132945098 462.6222235052723" stroke="#127a56" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<path d="M 351.0 474.0 L 485.0 474.0" stroke="#127a56" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<path d="M 530.0771383721104 388.15698910078055 L 636.0986447951066 420.6702510704994" stroke="#127a56" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<path d="M 530.0771383721104 467.84301089921945 L 636.0986447951066 435.3297489295006" stroke="#127a56" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="150" cy="428.0" r="21" fill="#3a2e86" stroke="#3a2e86" stroke-width="2" opacity="1"/>
<text x="150" y="433.0" font-size="13" fill="#fff" font-weight="700" text-anchor="middle"   >0</text>
<circle cx="330" cy="382.0" r="21" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="330" y="387.0" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >1</text>
<circle cx="330" cy="474.0" r="21" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="330" y="479.0" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >2</text>
<circle cx="510" cy="382.0" r="21" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="510" y="387.0" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<circle cx="510" cy="474.0" r="21" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="510" y="479.0" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >4</text>
<circle cx="660" cy="428.0" r="21" fill="#b0491d" stroke="#b0491d" stroke-width="2" opacity="1"/>
<text x="660" y="433.0" font-size="13" fill="#fff" font-weight="700" text-anchor="middle"   >5</text>
<text x="150" y="396.0" font-size="11" fill="#3a2e86" font-weight="700" text-anchor="middle"   >S</text>
<text x="660" y="396.0" font-size="11" fill="#b0491d" font-weight="700" text-anchor="middle"   >T</text>
<text x="80" y="538" font-size="12.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >② 在分层网络中一次 DFS 沿 level+1 方向推进，</text>
<text x="80" y="560" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >   同时增广多条路径（如 0→1→3→5、0→2→4→5、0→1→4→5）。</text>
<rect x="64" y="580" width="652" height="140" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="606" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   >复杂度分析</text>
<text x="80" y="630" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >• 建一次分层网络 O(e)；单次 DFS 多路增广 O(n·e)。</text>
<text x="80" y="652" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >• 可证明每次分层的最短路长度严格递增 → 分层次数 ≤ n−1。</text>
<text x="80" y="676" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >• 总时间复杂度 O(n²·e)。</text>
<text x="80" y="700" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >• 通常 e&gt;n，故 Dinic 优于 Edmonds-Karp 的 O(n·e²)。</text>
<rect x="760" y="128" width="600" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="786" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >算法实现</text>
<rect x="784" y="186" width="552" height="116" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="800" y="212" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >bfs()：构建层次网络</text>
<text x="800" y="236" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">level[S]=0; visited[S]=1; qu.push(S);</text>
<text x="800" y="251" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">while (!qu.empty()) { u=qu.front();...</text>
<text x="800" y="266" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  for (剩余边 &lt;u,v&gt;, flow&gt;0 且 v 未访问)</text>
<text x="800" y="281" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    level[v]=level[u]+1; qu.push(v);</text>
<text x="800" y="296" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="784" y="312" width="552" height="246" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="800" y="338" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >dfs(u, limit)：多路增广</text>
<text x="800" y="362" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">if (u==T || limit==0) return limit;</text>
<text x="800" y="379.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">int flow=0;</text>
<text x="800" y="397.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (每条边 &lt;u,v&gt;, flow&gt;0)</text>
<text x="800" y="414.5" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (level[v]==level[u]+1) {   // 只向下一层</text>
<text x="800" y="432.0" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">    f = dfs(v, min(limit, 边容量));</text>
<text x="800" y="449.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    edge.flow -= f;  rev.flow += f;</text>
<text x="800" y="467.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    flow += f;  limit -= f;</text>
<text x="800" y="484.5" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">    if (limit==0) break;</text>
<text x="800" y="502.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  }</text>
<text x="800" y="519.5" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">if (flow==0) level[u]=-1;  // 阻塞此点</text>
<text x="800" y="537.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">return flow;</text>
<rect x="784" y="568" width="552" height="152" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="800" y="594" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   >主循环 dinic()</text>
<text x="800" y="618" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">while (true) {</text>
<text x="800" y="636" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  bfs();                    // 重建分层网络</text>
<text x="800" y="654" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  if (!visited[T]) break;   // 无增广路径退出</text>
<text x="800" y="672" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  maxflow += dfs(S, INF);   // 一次多路增广</text>
<text x="800" y="690" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="800" y="716" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >level[u]=−1 的「阻塞」使 DFS 不再走死路。</text>
</svg>
