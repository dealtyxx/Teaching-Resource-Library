<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >最小生成树 · Prim 算法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >从一个顶点出发，每步选跨越割集的最小权边生长（9.1.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第9章 图算法</text>
<rect x="40" y="128" width="620" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >带权连通无向图</text>
<text x="232" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >绿色为最小生成树</text>
<line x1="160" y1="258" x2="490" y2="246" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="160" y1="258" x2="320" y2="368" stroke="#127a56" stroke-width="3.4" stroke-linecap="butt" />
<line x1="160" y1="258" x2="190" y2="528" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="490" y1="246" x2="320" y2="368" stroke="#127a56" stroke-width="3.4" stroke-linecap="butt" />
<line x1="490" y1="246" x2="560" y2="428" stroke="#127a56" stroke-width="3.4" stroke-linecap="butt" />
<line x1="320" y1="368" x2="190" y2="528" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="320" y1="368" x2="560" y2="428" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="320" y1="368" x2="440" y2="548" stroke="#127a56" stroke-width="3.4" stroke-linecap="butt" />
<line x1="190" y1="528" x2="440" y2="548" stroke="#127a56" stroke-width="3.4" stroke-linecap="butt" />
<line x1="560" y1="428" x2="440" y2="548" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<rect x="314.0" y="242.0" width="22" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="325.0" y="257.0" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<rect x="229.0" y="303.0" width="22" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="240.0" y="318.0" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<rect x="164.0" y="383.0" width="22" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="175.0" y="398.0" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<rect x="394.0" y="297.0" width="22" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="405.0" y="312.0" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<rect x="514.0" y="327.0" width="22" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="525.0" y="342.0" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<rect x="244.0" y="438.0" width="22" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="255.0" y="453.0" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<rect x="429.0" y="388.0" width="22" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="440.0" y="403.0" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<rect x="369.0" y="448.0" width="22" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="380.0" y="463.0" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<rect x="304.0" y="528.0" width="22" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="315.0" y="543.0" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<rect x="489.0" y="478.0" width="22" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="500.0" y="493.0" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<circle cx="160" cy="258" r="22" fill="#3a2e86" stroke="#3a2e86" stroke-width="2" opacity="1"/>
<text x="160" y="263" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle"   >0</text>
<circle cx="490" cy="246" r="22" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="490" y="251" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >1</text>
<circle cx="320" cy="368" r="22" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="320" y="373" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >2</text>
<circle cx="560" cy="428" r="22" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="560" y="433" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >4</text>
<circle cx="190" cy="528" r="22" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="190" y="533" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<circle cx="440" cy="548" r="22" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="440" y="553" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >5</text>
<text x="160" y="224" font-size="11" fill="#3a2e86" font-weight="700" text-anchor="middle"   >起点 s</text>
<rect x="64" y="598" width="572" height="122" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="624" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >什么是最小生成树（MST）</text>
<text x="80" y="648" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >连通图的生成树：含全部 n 个顶点、恰好 n−1 条边的极小连通子图。</text>
<text x="80" y="670" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >所有生成树中边权之和最小者，即最小生成树。</text>
<text x="80" y="696" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">本例 MST = {(0,2),(2,5),(5,3),(1,2),(1,4)}，权和 = 1+4+2+5+3 = 15</text>
<rect x="680" y="128" width="680" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="706" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >Prim 贪心生长</text>
<rect x="704" y="186" width="632" height="90" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >核心：割集与轻边</text>
<text x="720" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >U 为已在树中的顶点集。每步在割集 (U, V−U)</text>
<text x="720" y="256" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >的所有边中，选权值最小的「轻边」并入树。</text>
<rect x="704" y="286" width="632" height="70" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="720" y="312" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >两个辅助数组（对每个 j∈V−U）</text>
<text x="720" y="336" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">lowcost[j]=U 到 j 的最小边权   closest[j]=该边在 U 中的端点</text>
<text x="720" y="382" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >从 0 出发依次加入的边：</text>
<rect x="720" y="396" width="108" height="46" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" rx="9" opacity="1" />
<text x="774" y="418" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(0,2)</text>
<text x="774" y="435" font-size="11" fill="#52514e" font-weight="600" text-anchor="middle"   >权 1</text>
<path d="M 828 419 L 840 419" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="842" y="396" width="108" height="46" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" rx="9" opacity="1" />
<text x="896" y="418" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(2,5)</text>
<text x="896" y="435" font-size="11" fill="#52514e" font-weight="600" text-anchor="middle"   >权 4</text>
<path d="M 950 419 L 962 419" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="964" y="396" width="108" height="46" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" rx="9" opacity="1" />
<text x="1018" y="418" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(5,3)</text>
<text x="1018" y="435" font-size="11" fill="#52514e" font-weight="600" text-anchor="middle"   >权 2</text>
<path d="M 1072 419 L 1084 419" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="1086" y="396" width="108" height="46" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" rx="9" opacity="1" />
<text x="1140" y="418" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(2,1)</text>
<text x="1140" y="435" font-size="11" fill="#52514e" font-weight="600" text-anchor="middle"   >权 5</text>
<path d="M 1194 419 L 1206 419" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="1208" y="396" width="108" height="46" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" rx="9" opacity="1" />
<text x="1262" y="418" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(1,4)</text>
<text x="1262" y="435" font-size="11" fill="#52514e" font-weight="600" text-anchor="middle"   >权 3</text>
<text x="1320" y="464" font-size="13" fill="#127a56" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">权和 = 15</text>
<rect x="704" y="480" width="632" height="174" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="506" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >核心循环（重复 n−1 次）</text>
<text x="720" y="532" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (i=1;i&lt;n;i++) {</text>
<text x="720" y="548" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  // 在 V−U 中找 lowcost 最小的顶点 k</text>
<text x="720" y="564" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  k = argmin{ lowcost[j] | lowcost[j]≠0 };</text>
<text x="720" y="580" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  输出边 (closest[k], k);  lowcost[k]=0;  // k 加入 U</text>
<text x="720" y="596" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  for (j=0;j&lt;n;j++)         // 用 k 更新候选边</text>
<text x="720" y="612" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">    if (A[k][j] &lt; lowcost[j])</text>
<text x="720" y="628" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">      lowcost[j]=A[k][j], closest[j]=k;</text>
<text x="720" y="644" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="704" y="668" width="632" height="52" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="720" y="694" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >复杂度 O(n²)：两重循环，与边数无关 → 适合稠密图。</text>
<text x="720" y="712" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >Prim 是贪心算法，正确性由「割性质」保证。</text>
</svg>
