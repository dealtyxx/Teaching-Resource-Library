</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >网络流 · 基本概念</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >网络、流、剩余网络、增广路径与反向边（9.3.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第9章 图算法</text>
<rect x="40" y="128" width="640" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >网络</text>
<text x="122" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >源点 S=0，汇点 T=5，边权为容量</text>
<path d="M 127.80796438410684 346.8700222599332 L 248.8000423998728 271.2499735000795" stroke="#2a78d6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
