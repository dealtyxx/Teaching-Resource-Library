<rect x="170.4" y="397.4" width="20" height="18" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="180.4" y="411.4" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<path d="M 291.0 258.0 L 415.0 258.0" stroke="#2a78d6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<rect x="334.8" y="249.0" width="20" height="18" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="344.8" y="263.0" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
