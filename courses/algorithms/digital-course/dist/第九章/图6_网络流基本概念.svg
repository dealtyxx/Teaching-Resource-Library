<rect x="334.8" y="341.4" width="20" height="18" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="344.8" y="355.4" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<path d="M 291.0 468.0 L 415.0 468.0" stroke="#2a78d6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<rect x="334.8" y="459.0" width="20" height="18" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="344.8" y="473.0" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<path d="M 457.80796438410687 269.1299777400668 L 578.8000423998728 344.7500264999205" stroke="#2a78d6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<rect x="500.4" y="293.0" width="20" height="18" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="510.4" y="307.0" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<path d="M 457.3048804081867 456.10289471937165 L 579.3989518950158 372.1632205721766" stroke="#2a78d6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<rect x="500.4" y="410.6" width="20" height="18" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.92" />
<text x="510.4" y="424.6" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<circle cx="110" cy="358" r="21" fill="#3a2e86" stroke="#3a2e86" stroke-width="2" opacity="1"/>
<text x="110" y="363" font-size="13" fill="#fff" font-weight="700" text-anchor="middle"   >0</text>
<circle cx="270" cy="258" r="21" fill="#eef4fc" stroke="#b7d3f6" stroke-width="2" opacity="1"/>
<text x="270" y="263" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >1</text>
<circle cx="270" cy="468" r="21" fill="#eef4fc" stroke="#b7d3f6" stroke-width="2" opacity="1"/>
<text x="270" y="473" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >2</text>
<circle cx="440" cy="258" r="21" fill="#eef4fc" stroke="#b7d3f6" stroke-width="2" opacity="1"/>
<text x="440" y="263" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >3</text>
<circle cx="440" cy="468" r="21" fill="#eef4fc" stroke="#b7d3f6" stroke-width="2" opacity="1"/>
<text x="440" y="473" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >4</text>
<circle cx="600" cy="358" r="21" fill="#b0491d" stroke="#b0491d" stroke-width="2" opacity="1"/>
<text x="600" y="363" font-size="13" fill="#fff" font-weight="700" text-anchor="middle"   >5</text>
<text x="110" y="326" font-size="11" fill="#3a2e86" font-weight="700" text-anchor="middle"   >源点 S</text>
<text x="600" y="326" font-size="11" fill="#b0491d" font-weight="700" text-anchor="middle"   >汇点 T</text>
<rect x="64" y="558" width="592" height="50" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="10" opacity="1" />
<rect x="64" y="558" width="7" height="50" fill="#127a56" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="82" y="580" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >容量限制</text>
<text x="170" y="580" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(u,v) ≤ c(u,v)</text>
<text x="82" y="598" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >每条边的流量不超过其容量</text>
<rect x="64" y="614" width="592" height="50" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<rect x="64" y="614" width="7" height="50" fill="#1c5cab" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="82" y="636" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >斜对称</text>
<text x="170" y="636" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(u,v) = −f(v,u)</text>
<text x="82" y="654" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >u→v 的流量是 v→u 的相反数</text>
<rect x="64" y="670" width="592" height="50" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="10" opacity="1" />
<rect x="64" y="670" width="7" height="50" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="82" y="692" font-size="12.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >流守恒</text>
<text x="170" y="692" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">Σ流入 = Σ流出</text>
<text x="82" y="710" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >非源汇顶点净流量为 0</text>
<rect x="700" y="128" width="660" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="726" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >剩余网络 与 增广路径</text>
<rect x="724" y="186" width="612" height="130" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="212" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >剩余网络 Gf：一条边 u→v（容量 c，流量 f）</text>
<circle cx="820" cy="256" r="18" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.8" opacity="1"/>
<text x="820" y="261" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >u</text>
<circle cx="1020" cy="256" r="18" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.8" opacity="1"/>
<text x="1020" y="261" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >v</text>
<path d="M 838 250 L 998 250" stroke="#127a56" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<text x="920.0" y="242" font-size="11" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">c−f（可增）</text>
<path d="M 998 264 L 838 264" stroke="#eb6834" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<text x="920.0" y="282" font-size="11" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f（可退，反向边）</text>
<text x="740" y="306" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >正向剩余边 c−f + 反向剩余边 f</text>
<rect x="724" y="328" width="612" height="128" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="354" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   >增广路径：S 到 T 的一条简单路径</text>
<text x="740" y="378" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >μ⁺ 前向边：f&lt;c（可增加流量），沿路径方向</text>
<text x="740" y="400" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   >μ⁻ 后向边：f&gt;0（可减少流量），逆路径方向</text>
<text x="740" y="426" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >沿路径取最小剩余容量 delta，前向 −delta、反向 +delta。</text>
<text x="740" y="446" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">例：0→2→4→1→3→5（含一条后向边 4→1）</text>
<rect x="724" y="468" width="612" height="120" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="494" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >为什么需要反向边？</text>
<text x="740" y="518" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >贪心地沿增广路径推流可能「堵死」更优方案。</text>
<text x="740" y="540" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >反向边提供「反悔 / 撤销」之前流量的通道，</text>
<text x="740" y="562" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   >使算法总能调整到真正的最大流（Ford-Fulkerson 核心）。</text>
<rect x="724" y="600" width="612" height="120" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="626" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >最大流的三种等价度量</text>
<text x="740" y="650" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >① 各条增广路径 delta 之和</text>
<text x="740" y="672" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >② 源点 S 的总流出量</text>
<text x="740" y="694" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >③ 汇点 T 的总流入量</text>
</svg>
