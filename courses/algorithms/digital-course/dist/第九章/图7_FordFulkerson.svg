<text x="354.8" y="483.0" font-size="11" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2/2</text>
<path d="M 467.4730561810947 269.6487041207298 L 579.198742641554 344.1324950943693" stroke="#127a56" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="500.0" y="292.0" width="32" height="20" fill="#ffffff" stroke="none" stroke-width="1" rx="5" opacity="0.94" />
<text x="516.0" y="307.0" font-size="11" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2/2</text>
<path d="M 466.39824499830365 464.8814040013571 L 580.4782797639242 373.6173761888606" stroke="#127a56" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
