<circle cx="110" cy="358" r="21" fill="#3a2e86" stroke="#3a2e86" stroke-width="2" opacity="1"/>
<text x="110" y="363" font-size="13" fill="#fff" font-weight="700" text-anchor="middle"   >0</text>
<circle cx="280" cy="258" r="21" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="280" y="263" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >1</text>
<circle cx="280" cy="478" r="21" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="280" y="483" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >2</text>
<circle cx="450" cy="258" r="21" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="450" y="263" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<circle cx="450" cy="478" r="21" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="450" y="483" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >4</text>
<circle cx="600" cy="358" r="21" fill="#b0491d" stroke="#b0491d" stroke-width="2" opacity="1"/>
<text x="600" y="363" font-size="13" fill="#fff" font-weight="700" text-anchor="middle"   >5</text>
<text x="110" y="326" font-size="12" fill="#3a2e86" font-weight="700" text-anchor="middle"   >S</text>
<text x="600" y="326" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   >T</text>
<rect x="64" y="558" width="592" height="62" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="360.0" y="586" font-size="16" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">最大流 = Δ₁+Δ₂+Δ₃ = 2+2+1 = 5</text>
<text x="360.0" y="608" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle"   >= 源点 S 总流出 = 汇点 T 总流入</text>
<rect x="64" y="632" width="592" height="88" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="658" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   >验证</text>
<text x="80" y="682" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >源点割 {0} 的出边容量 = c(0,1)+c(0,2) = 3+2 = 5，</text>
<text x="80" y="704" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >即最大流 ≤ 5；已达到 5 → 就是最大流。</text>
<rect x="700" y="128" width="660" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="726" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >迭代过程 与 算法</text>
<rect x="724" y="190" width="612" height="74" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="740" y="216" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >第 1 次 增广路径</text>
<circle cx="760" cy="242" r="15" fill="#3a2e86" stroke="none" stroke-width="1.6" opacity="1"/>
<text x="760" y="247" font-size="12" fill="#fff" font-weight="700" text-anchor="middle"   >0</text>
<path d="M 776 242 L 800 242" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="822" cy="242" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<text x="822" y="247" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >2</text>
<path d="M 838 242 L 862 242" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="884" cy="242" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<text x="884" y="247" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >4</text>
<path d="M 900 242 L 924 242" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="946" cy="242" r="15" fill="#b0491d" stroke="none" stroke-width="1.6" opacity="1"/>
<text x="946" y="247" font-size="12" fill="#fff" font-weight="700" text-anchor="middle"   >5</text>
<text x="1320" y="220" font-size="12" fill="#52514e" font-weight="end" text-anchor="start"   ></text>
<text x="1160" y="248" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">Δ₁ = min(2,2,3) = 2</text>
<rect x="724" y="272" width="612" height="74" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="740" y="298" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >第 2 次 增广路径</text>
<circle cx="760" cy="324" r="15" fill="#3a2e86" stroke="none" stroke-width="1.6" opacity="1"/>
<text x="760" y="329" font-size="12" fill="#fff" font-weight="700" text-anchor="middle"   >0</text>
<path d="M 776 324 L 800 324" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="822" cy="324" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<text x="822" y="329" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >1</text>
<path d="M 838 324 L 862 324" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="884" cy="324" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<text x="884" y="329" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<path d="M 900 324 L 924 324" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="946" cy="324" r="15" fill="#b0491d" stroke="none" stroke-width="1.6" opacity="1"/>
<text x="946" y="329" font-size="12" fill="#fff" font-weight="700" text-anchor="middle"   >5</text>
<text x="1320" y="302" font-size="12" fill="#52514e" font-weight="end" text-anchor="start"   ></text>
<text x="1160" y="330" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">Δ₂ = min(3,2,2) = 2</text>
<rect x="724" y="354" width="612" height="74" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="740" y="380" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >第 3 次 增广路径</text>
<circle cx="760" cy="406" r="15" fill="#3a2e86" stroke="none" stroke-width="1.6" opacity="1"/>
<text x="760" y="411" font-size="12" fill="#fff" font-weight="700" text-anchor="middle"   >0</text>
<path d="M 776 406 L 800 406" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="822" cy="406" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<text x="822" y="411" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >1</text>
<path d="M 838 406 L 862 406" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="884" cy="406" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<text x="884" y="411" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >4</text>
<path d="M 900 406 L 924 406" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="946" cy="406" r="15" fill="#b0491d" stroke="none" stroke-width="1.6" opacity="1"/>
<text x="946" y="411" font-size="12" fill="#fff" font-weight="700" text-anchor="middle"   >5</text>
<text x="1320" y="384" font-size="12" fill="#52514e" font-weight="end" text-anchor="start"   ></text>
<text x="1160" y="412" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">Δ₃ = min(1,1,1) = 1</text>
<rect x="724" y="436" width="612" height="34" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.2" rx="10" opacity="1" />
<text x="1030.0" y="458" font-size="12.5" fill="#b3201f" font-weight="700" text-anchor="middle"   >第 4 次：找不到增广路径 → 结束</text>
<rect x="724" y="482" width="612" height="118" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="508" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >算法步骤</text>
<text x="740" y="532" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >① 零流开始，建剩余网络 Gf；</text>
<text x="740" y="554" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >② 用 DFS 找一条增广路径，求最小容量 delta；</text>
<text x="740" y="576" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >③ 前向边 −delta、反向边 +delta；重复直到无增广路径。</text>
<rect x="724" y="610" width="612" height="62" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="740" y="636" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   >复杂度 O(e·f*)</text>
<text x="740" y="658" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >f* 为最大流量；找一条增广路 O(e)，迭代最多 f* 次。</text>
</svg>
