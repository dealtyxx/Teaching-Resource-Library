<text x="354.8" y="359.8" font-size="11" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1/1</text>
<path d="M 301.0 478.0 L 425.0 478.0" stroke="#127a56" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
