<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >最小生成树 · Kruskal 算法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >边按权递增选取，用并查集判环（9.1.3）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第9章 图算法</text>
<rect x="40" y="128" width="620" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >按权递增选边</text>
<text x="210" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >同一实例，MST 与 Prim 相同</text>
<rect x="64" y="186" width="572" height="46" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="214" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >策略：边按权从小到大取；不成环则加入，成环则舍弃。</text>
<rect x="70" y="246" width="560" height="30" fill="#f0efec" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="110" y="266" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">边</text>
<text x="210" y="266" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">权 w</text>
<text x="330" y="266" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">操作</text>
<text x="500" y="266" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">连通分量</text>
<rect x="70" y="276" width="560" height="38" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="110" y="301" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(0,2)</text>
<text x="210" y="301" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">1</text>
<text x="330" y="301" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >✓ 加入</text>
<text x="500" y="301" font-size="11.5" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">{0,2}</text>
<rect x="70" y="314" width="560" height="38" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="110" y="339" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(3,5)</text>
<text x="210" y="339" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">2</text>
<text x="330" y="339" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >✓ 加入</text>
<text x="500" y="339" font-size="11.5" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">{3,5}</text>
<rect x="70" y="352" width="560" height="38" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="110" y="377" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(1,4)</text>
<text x="210" y="377" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">3</text>
<text x="330" y="377" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >✓ 加入</text>
<text x="500" y="377" font-size="11.5" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">{1,4}</text>
<rect x="70" y="390" width="560" height="38" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="110" y="415" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(2,5)</text>
<text x="210" y="415" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">4</text>
<text x="330" y="415" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >✓ 加入</text>
<text x="500" y="415" font-size="11.5" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">{0,2,3,5}</text>
<rect x="70" y="428" width="560" height="38" fill="#fdeceb" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="110" y="453" font-size="12.5" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(0,3)</text>
<text x="210" y="453" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">5</text>
<text x="330" y="453" font-size="12" fill="#b3201f" font-weight="700" text-anchor="middle"   >✗ 舍弃(成环)</text>
<text x="500" y="453" font-size="11.5" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">0,3 已连通</text>
<rect x="70" y="466" width="560" height="38" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="0.8" rx="6" opacity="1" />
<text x="110" y="491" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">(1,2)</text>
<text x="210" y="491" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">5</text>
<text x="330" y="491" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >✓ 加入</text>
<text x="500" y="491" font-size="11.5" fill="#52514e" font-weight="middle" text-anchor="start"   font-family="ui-monospace,monospace">{0..5} 完成</text>
<rect x="64" y="496" width="572" height="44" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="80" y="523" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">取满 n−1 = 5 条边即停止；MST 权和 = 1+2+3+4+5 = 15。</text>
<rect x="64" y="552" width="572" height="168" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="578" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >主循环</text>
<text x="80" y="602" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">sort(E, by w);   Init(n);        // 并查集初始化</text>
<text x="80" y="616" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">k=1; j=0;</text>
<text x="80" y="630" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">while (k &lt; n) {</text>
<text x="80" y="644" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  sn1=Find(E[j].u);  sn2=Find(E[j].v);</text>
<text x="80" y="658" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (sn1 != sn2) {              // 不成环</text>
<text x="80" y="672" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">    输出边;  k++;  Union(sn1,sn2);</text>
<text x="80" y="686" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  }</text>
<text x="80" y="700" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  j++;</text>
<text x="80" y="714" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="680" y="128" width="680" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="706" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >并查集 与 算法对比</text>
<rect x="704" y="186" width="632" height="96" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="212" font-size="13.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >判环的关键：并查集（Union-Find）</text>
<text x="720" y="238" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >Find(u)==Find(v) → u、v 已在同一集合 → 加该边成环 → 舍弃；</text>
<text x="720" y="260" font-size="11.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >否则加入并 Union 合并两集合。</text>
<rect x="704" y="292" width="310.0" height="150" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="720" y="318" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >Find + 路径压缩</text>
<text x="720" y="342" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">int Find(int x){</text>
<text x="720" y="358" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  if(x!=parent[x])</text>
<text x="720" y="374" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    parent[x]=</text>
<text x="720" y="390" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      Find(parent[x]);</text>
<text x="720" y="406" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  return parent[x];</text>
<text x="720" y="422" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="1026.0" y="292" width="310.0" height="150" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="1042.0" y="318" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >Union 按秩合并</text>
<text x="1042.0" y="342" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">rx=Find(x); ry=Find(y);</text>
<text x="1042.0" y="358" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">if(rx==ry) return;</text>
<text x="1042.0" y="374" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">if(rnk[rx]&lt;rnk[ry])</text>
<text x="1042.0" y="390" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  parent[rx]=ry;</text>
<text x="1042.0" y="406" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">else { if(==) rnk[rx]++;</text>
<text x="1042.0" y="422" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  parent[ry]=rx; }</text>
<rect x="704" y="458" width="632" height="262" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="720" y="484" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start"   >Prim 与 Kruskal 对比</text>
<line x1="720" y1="498" x2="1320" y2="498" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt" />
<rect x="724" y="510" width="292.0" height="34" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="8" opacity="1" />
<text x="870.0" y="532" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >Prim</text>
<rect x="1028.0" y="510" width="292.0" height="34" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="8" opacity="1" />
<text x="1174.0" y="532" font-size="14" fill="#4a3aa7" font-weight="700" text-anchor="middle"   >Kruskal</text>
<text x="730" y="562" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >•</text>
<text x="744" y="562" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >从顶点生长（割集选轻边）</text>
<text x="1034.0" y="562" font-size="12" fill="#4a3aa7" font-weight="700" text-anchor="start"   >•</text>
<text x="1048.0" y="562" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >从边选取（按权递增）</text>
<text x="730" y="598" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >•</text>
<text x="744" y="598" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >辅助 lowcost / closest</text>
<text x="1034.0" y="598" font-size="12" fill="#4a3aa7" font-weight="700" text-anchor="start"   >•</text>
<text x="1048.0" y="598" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >辅助 并查集判环</text>
<text x="730" y="634" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >•</text>
<text x="744" y="634" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >时间 O(n²)</text>
<text x="1034.0" y="634" font-size="12" fill="#4a3aa7" font-weight="700" text-anchor="start"   >•</text>
<text x="1048.0" y="634" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >时间 O(e log e)</text>
<text x="730" y="670" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >•</text>
<text x="744" y="670" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >与边数无关 → 稠密图</text>
<text x="1034.0" y="670" font-size="12" fill="#4a3aa7" font-weight="700" text-anchor="start"   >•</text>
<text x="1048.0" y="670" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >与顶点数无关 → 稀疏图</text>
<text x="1020.0" y="706" font-size="12" fill="#898781" font-weight="700" text-anchor="middle"   >均为贪心算法，结果同为最小生成树</text>
</svg>
