<text x="190" y="513" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<circle cx="490" cy="268" r="20" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="490" y="273" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >4</text>
<circle cx="495" cy="448" r="20" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="495" y="453" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >5</text>
<circle cx="630" cy="518" r="20" fill="#e9f7f1" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="630" y="523" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >6</text>
<rect x="64" y="554" width="642" height="62" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="578" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >递推（对所有边松弛，共 n−1 轮）</text>
<text x="80" y="602" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">distₖ[y] = min{ distₖ₋₁[y], distₖ₋₁[x] + w }  ⟨x,y⟩∈E</text>
<text x="80" y="640" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   >dist 变化（第 1 轮即收敛）</text>
<text x="84" y="674" font-size="11" fill="#898781" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">k</text>
<text x="196.0" y="674" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<text x="268.0" y="674" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<text x="340.0" y="674" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<text x="412.0" y="674" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<text x="484.0" y="674" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<text x="556.0" y="674" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<text x="628.0" y="674" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<text x="84" y="700" font-size="10.5" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">0</text>
<text x="196.0" y="700" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<text x="268.0" y="700" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">∞</text>
<text x="340.0" y="700" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">∞</text>
<text x="412.0" y="700" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">∞</text>
<text x="484.0" y="700" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">∞</text>
<text x="556.0" y="700" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">∞</text>
<text x="628.0" y="700" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">∞</text>
<text x="84" y="724" font-size="10.5" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">1</text>
<text x="196.0" y="724" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<text x="268.0" y="724" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<text x="340.0" y="724" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<text x="412.0" y="724" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<text x="484.0" y="724" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<text x="556.0" y="724" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<text x="628.0" y="724" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<text x="84" y="748" font-size="10.5" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">2~6</text>
<text x="196.0" y="748" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<text x="268.0" y="748" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<text x="340.0" y="748" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<text x="412.0" y="748" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<text x="484.0" y="748" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<text x="556.0" y="748" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">6</text>
<text x="628.0" y="748" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<rect x="750" y="128" width="610" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="776" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >SPFA · 队列优化</text>
<rect x="774" y="186" width="562" height="90" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="790" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >改进思路</text>
<text x="790" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >只有 dist 被更新的顶点才可能再松弛它的出边。</text>
<text x="790" y="258" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >用队列只保存「待松弛」的顶点，避免无谓遍历。</text>
<rect x="774" y="288" width="562" height="226" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="790" y="314" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >核心循环</text>
<text x="790" y="338" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">qu.push(s); dist[s]=0; visited[s]=1;</text>
<text x="790" y="354" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">while (!qu.empty()) {</text>
<text x="790" y="370" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  x=qu.front(); qu.pop(); visited[x]=0;</text>
<text x="790" y="386" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  for (每条出边 &lt;x,y,w&gt;)</text>
<text x="790" y="402" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">    if (dist[x]+w &lt; dist[y]) {   // 松弛</text>
<text x="790" y="418" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">      dist[y]=dist[x]+w; path[y]=x;</text>
<text x="790" y="434" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">      if (!visited[y]) {          // 不在队列</text>
<text x="790" y="450" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">        qu.push(y); visited[y]=1;</text>
<text x="790" y="466" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      }</text>
<text x="790" y="482" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    }</text>
<text x="790" y="498" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="774" y="526" width="562" height="52" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="790" y="552" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >visited 标记顶点是否已在队列中，</text>
<text x="790" y="572" font-size="12" fill="#4a3aa7" font-weight="700" text-anchor="start"   >避免同一顶点重复入队。</text>
<rect x="774" y="590" width="562" height="130" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="790" y="616" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   >复杂度与适用范围</text>
<text x="794" y="640" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">Bellman-Ford</text>
<text x="970" y="640" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">O(n·e)</text>
<text x="1110" y="640" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >遍历所有边 n−1 轮</text>
<text x="794" y="666" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">SPFA</text>
<text x="970" y="666" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">O(e)（平均）</text>
<text x="1110" y="666" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >队列式，通常更快</text>
<text x="790" y="696" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   >两者都能处理负权边，但都不适用于含负权回路的图。</text>
</svg>
