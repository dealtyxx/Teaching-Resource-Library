<text x="500.0" y="259" font-size="18" fill="#52514e" font-weight="700" text-anchor="middle"   >7</text>
<text x="128.0" y="224" font-size="11" fill="#b3406e" font-weight="700" text-anchor="middle"   >base</text>
<path d="M 374.0 286 L 374.0 310" stroke="#eb6834" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<text x="434.0" y="304" font-size="13" fill="#b0491d" font-weight="700" text-anchor="middle"   >一趟划分 partition</text>
<rect x="100" y="352" width="56" height="48" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="8" opacity="1" />
<text x="128.0" y="383" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >3</text>
<rect x="162" y="352" width="56" height="48" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="8" opacity="1" />
<text x="190.0" y="383" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >1</text>
<rect x="224" y="352" width="56" height="48" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="8" opacity="1" />
<text x="252.0" y="383" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >2</text>
<rect x="286" y="352" width="56" height="48" fill="#fdeef4" stroke="#b3406e" stroke-width="1.4" rx="8" opacity="1" />
<text x="314.0" y="383" font-size="18" fill="#b3406e" font-weight="700" text-anchor="middle"   >5</text>
<rect x="348" y="352" width="56" height="48" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="8" opacity="1" />
<text x="376.0" y="383" font-size="18" fill="#127a56" font-weight="700" text-anchor="middle"   >8</text>
<rect x="410" y="352" width="56" height="48" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="8" opacity="1" />
<text x="438.0" y="383" font-size="18" fill="#127a56" font-weight="700" text-anchor="middle"   >9</text>
<rect x="472" y="352" width="56" height="48" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="8" opacity="1" />
<text x="500.0" y="383" font-size="18" fill="#127a56" font-weight="700" text-anchor="middle"   >7</text>
<path d="M 100 410 L 100 418 L 280 418 L 280 410" stroke="#1c5cab" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="190.0" y="438" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >≤ base（子问题1）</text>
<text x="314.0" y="434" font-size="12.5" fill="#b3406e" font-weight="700" text-anchor="middle"   >基准归位</text>
<path d="M 348 410 L 348 418 L 528 418 L 528 410" stroke="#127a56" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="438.0" y="438" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >≥ base（子问题2）</text>
<rect x="68" y="486" width="612" height="58" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="86" y="512" font-size="14" fill="#52514e" font-weight="600" text-anchor="start"   >分解 = 一趟划分   ·   求解 = 递归左右两段</text>
<text x="86" y="534" font-size="14" fill="#52514e" font-weight="600" text-anchor="start"   >合并 = 就地排序，无需操作</text>
<rect x="728" y="128" width="632" height="436" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="754" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >递归过程</text>
<text x="854" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >每次划分 → 两个子问题</text>
<line x1="1044.0" y1="243" x2="918" y2="295" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="1044.0" y1="243" x2="1170" y2="295" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="918" y1="333" x2="848" y2="381" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="918" y1="333" x2="988" y2="381" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="1170" y1="333" x2="1100" y2="381" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="1170" y1="333" x2="1240" y2="381" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<rect x="944.0" y="205.0" width="200" height="38" fill="#f4f0fb" stroke="#cbc4ee" stroke-width="1.3" rx="9" opacity="1" />
<text x="1044.0" y="229" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">[3 1 2 5 8 9 7]</text>
<rect x="858.0" y="295.0" width="120" height="38" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.3" rx="9" opacity="1" />
<text x="918" y="319" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">[3 1 2]</text>
<rect x="1110.0" y="295.0" width="120" height="38" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.3" rx="9" opacity="1" />
<text x="1170" y="319" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">[8 9 7]</text>
<rect x="813.0" y="381.0" width="70" height="38" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.3" rx="9" opacity="1" />
<text x="848" y="405" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">[1]</text>
<rect x="953.0" y="381.0" width="70" height="38" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.3" rx="9" opacity="1" />
<text x="988" y="405" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">[3]</text>
<rect x="1065.0" y="381.0" width="70" height="38" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.3" rx="9" opacity="1" />
<text x="1100" y="405" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">[7]</text>
<rect x="1205.0" y="381.0" width="70" height="38" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.3" rx="9" opacity="1" />
<text x="1240" y="405" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">[9]</text>
<text x="1320" y="229" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="end"   >每层 O(n)</text>
<text x="1320" y="319" font-size="12" fill="#898781" font-weight="normal" text-anchor="end"   >划分</text>
<rect x="756" y="458" width="576" height="86" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="10" opacity="1" />
<text x="774" y="486" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">平均：T(n)=2T(n/2)+O(n) = O(n log₂n)</text>
<text x="774" y="514" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >最坏（正序/反序，基准取首元素）：</text>
<text x="774" y="536" font-size="14" fill="#b0491d" font-weight="700" text-anchor="start"   >子区间长 0 与 n−1，退化为冒泡 O(n²)</text>
<rect x="40" y="588" width="1320" height="264" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="628" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >应用 · 求第 k 大元素（quickselect）</text>
<text x="650" y="627" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >例4.2</text>
<text x="70" y="662" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >一趟划分后，归位的 a[i] 恰好是第 i+1 大元素（按递减划分）。只需递归其中一侧：</text>
<rect x="80" y="692" width="52" height="44" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="106.0" y="721" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   >9</text>
<text x="106.0" y="752" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="middle"   >i=0</text>
<rect x="138" y="692" width="52" height="44" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="164.0" y="721" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   >6</text>
<text x="164.0" y="752" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="middle"   >i=1</text>
<rect x="196" y="692" width="52" height="44" fill="#fdeef4" stroke="#b3406e" stroke-width="1.3" rx="7" opacity="1" />
<text x="222.0" y="721" font-size="16" fill="#b3406e" font-weight="700" text-anchor="middle"   >5</text>
<text x="222.0" y="752" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="middle"   >i=2</text>
<rect x="254" y="692" width="52" height="44" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="280.0" y="721" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   >4</text>
<text x="280.0" y="752" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="middle"   >i=3</text>
<rect x="312" y="692" width="52" height="44" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="338.0" y="721" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   >2</text>
<text x="338.0" y="752" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="middle"   >i=4</text>
<rect x="370" y="692" width="52" height="44" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="396.0" y="721" font-size="16" fill="#52514e" font-weight="700" text-anchor="middle"   >1</text>
<text x="396.0" y="752" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="middle"   >i=5</text>
<text x="222.0" y="682" font-size="11" fill="#b3406e" font-weight="700" text-anchor="middle"   >归位 a[i]</text>
<rect x="510" y="670" width="820" height="48" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="10" opacity="1" />
<text x="530" y="700" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">k−1 = i</text>
<text x="660" y="700" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >a[i] 即第 k 大，返回</text>
<rect x="510" y="726" width="820" height="48" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="530" y="756" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">k−1 &lt; i</text>
<text x="660" y="756" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >第 k 大在左区间 a[s..i−1]，递归左侧</text>
<rect x="510" y="782" width="820" height="48" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="10" opacity="1" />
<text x="530" y="812" font-size="15" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">k−1 &gt; i</text>
<text x="660" y="812" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >第 k 大在右区间 a[i+1..t]，递归右侧</text>
<text x="70" y="830" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >只递归一侧 → 平均时间 O(n)（快速排序需递归两侧 → O(n log n)）。</text>
</svg>
