</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >快速排序</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >以基准划分，分治两个子序列（4.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第4章 分治法</text>
<rect x="40" y="128" width="668" height="436" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >划分原理</text>
<text x="166" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >以基准 base 重排</text>
<text x="70" y="206" font-size="13.5" fill="#52514e" font-weight="600" text-anchor="start"   >初始序列（base = 首元素 5）</text>
<rect x="100" y="228" width="56" height="48" fill="#fdeef4" stroke="#b3406e" stroke-width="1.4" rx="8" opacity="1" />
<text x="128.0" y="259" font-size="18" fill="#b3406e" font-weight="700" text-anchor="middle"   >5</text>
