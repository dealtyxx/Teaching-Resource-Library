<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="888" viewBox="0 0 1400 888" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="888" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >分治法概述</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >分而治之：分解 → 求解子问题 → 合并（4.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第4章 分治法</text>
<rect x="40" y="122" width="1320" height="82" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="156" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="start"   >分治法（Divide and Conquer）</text>
<text x="66" y="188" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   >将规模为 n 的问题分解为 k 个规模较小、相互独立、与原问题类型相同的子问题，分别求解后合并得到原问题的解。</text>
<rect x="40" y="220" width="720" height="400" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="260" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >求解三步</text>
<text x="166" y="259" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >k=1 时称为减治法</text>
<rect x="68" y="294" width="664" height="56" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<rect x="68" y="294" width="8" height="56" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="90" y="318" font-size="16.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >分解 Divide</text>
<text x="90" y="340" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >分为 k 个规模更小、类型相同、相互独立的子问题</text>
<path d="M 400.0 350 L 400.0 364" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<rect x="68" y="364" width="664" height="56" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="10" opacity="1" />
<rect x="68" y="364" width="8" height="56" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="90" y="388" font-size="16.5" fill="#b0491d" font-weight="700" text-anchor="start"   >求解子问题 Conquer</text>
<text x="90" y="410" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >递归求解各子问题（足够小则直接求解）</text>
<path d="M 400.0 420 L 400.0 434" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<rect x="68" y="434" width="664" height="56" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="10" opacity="1" />
<rect x="68" y="434" width="8" height="56" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="90" y="458" font-size="16.5" fill="#127a56" font-weight="700" text-anchor="start"   >合并 Merge</text>
<text x="90" y="480" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >将子问题的解合并为原问题的解</text>
<rect x="68" y="504" width="664" height="100" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="532" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">T divide-and-conquer(P) {</text>
<text x="86" y="554" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  if |P|≤n0 return adhoc(P);            // 足够小，直接求解</text>
<text x="86" y="576" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  分解 P→P1..Pk;  yi = divide-and-conquer(Pi);</text>
<text x="86" y="598" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  return merge(y1,…,yk);                 // 合并</text>
<rect x="780" y="220" width="580" height="400" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="806" y="260" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >适用问题的四大特性</text>
<rect x="808" y="296" width="524" height="62" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.3" rx="10" opacity="1" />
<rect x="808" y="296" width="8" height="62" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="830" y="323" font-size="16.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >可缩性</text>
<text x="830" y="345" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >规模缩小到一定程度即可直接求解</text>
<rect x="808" y="368" width="524" height="62" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.3" rx="10" opacity="1" />
<rect x="808" y="368" width="8" height="62" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="830" y="395" font-size="16.5" fill="#b0491d" font-weight="700" text-anchor="start"   >可分解性</text>
<text x="830" y="417" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >可分解为若干规模更小的同型子问题</text>
<rect x="808" y="440" width="524" height="62" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.3" rx="10" opacity="1" />
<rect x="808" y="440" width="8" height="62" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="830" y="467" font-size="16.5" fill="#127a56" font-weight="700" text-anchor="start"   >可合并性</text>
<text x="830" y="489" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >原问题的解可由子问题的解合并得到</text>
<rect x="808" y="512" width="524" height="62" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.3" rx="10" opacity="1" />
<rect x="808" y="512" width="8" height="62" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="830" y="539" font-size="16.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >独立性</text>
<text x="830" y="561" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >子问题相互独立，不含公共子子问题</text>
<text x="810" y="600" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >※ 独立性区别于动态规划（子问题重叠）</text>
<rect x="40" y="648" width="1320" height="212" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="688" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >分治算法分析</text>
<text x="210" y="687" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >4.1.3</text>
<rect x="70" y="722" width="560" height="108" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="350" y="776" font-size="26" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">T(n) = a·T(n/b) + f(n)</text>
<text x="350" y="812" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >a 个子问题，每个规模 n/b，合并耗时 f(n)</text>
<text x="680" y="722" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start"   >提升时间性能的三个方向：</text>
<circle cx="696" cy="752" r="5" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="714" y="756" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >减少 a</text>
<text x="820" y="756" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >子问题个数越少越好</text>
<circle cx="696" cy="784" r="5" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="714" y="788" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >增大 b</text>
<text x="820" y="788" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >每次规模缩得越小越好</text>
<circle cx="696" cy="816" r="5" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="714" y="820" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >降低 f(n)</text>
<text x="820" y="820" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >合并代价越低越好</text>
<text x="680" y="840" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >可用第2章 2.6 节（展开法 / 递归树 / 主定理）求解此递推式。</text>
</svg>
