<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="812" viewBox="0 0 1400 812" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="812" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >最大连续子序列和 · 分治法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >最大子序列在左半、右半，或跨越中点（4.5）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第4章 分治法</text>
<rect x="40" y="128" width="1320" height="372" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >分解与三个候选</text>
<text x="232" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >a=(−2,11,−4,13,−5,−2)，mid=2</text>
<rect x="340" y="224" width="92" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.2" rx="8" opacity="1" />
<text x="386.0" y="257" font-size="18" fill="#52514e" font-weight="700" text-anchor="middle"   >-2</text>
<text x="386.0" y="214" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[0]</text>
<rect x="440" y="224" width="92" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.2" rx="8" opacity="1" />
<text x="486.0" y="257" font-size="18" fill="#52514e" font-weight="700" text-anchor="middle"   >11</text>
<text x="486.0" y="214" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[1]</text>
<rect x="540" y="224" width="92" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.2" rx="8" opacity="1" />
<text x="586.0" y="257" font-size="18" fill="#52514e" font-weight="700" text-anchor="middle"   >-4</text>
<text x="586.0" y="214" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[2]</text>
<rect x="640" y="224" width="92" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.2" rx="8" opacity="1" />
<text x="686.0" y="257" font-size="18" fill="#52514e" font-weight="700" text-anchor="middle"   >13</text>
<text x="686.0" y="214" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[3]</text>
<rect x="740" y="224" width="92" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.2" rx="8" opacity="1" />
<text x="786.0" y="257" font-size="18" fill="#52514e" font-weight="700" text-anchor="middle"   >-5</text>
<text x="786.0" y="214" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[4]</text>
<rect x="840" y="224" width="92" height="52" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.2" rx="8" opacity="1" />
<text x="886.0" y="257" font-size="18" fill="#52514e" font-weight="700" text-anchor="middle"   >-2</text>
<text x="886.0" y="214" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[5]</text>
<line x1="636" y1="204" x2="636" y2="374" stroke="#4a3aa7" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="5 4"/>
<text x="490.0" y="192" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >左半 [low..mid]</text>
<text x="790.0" y="192" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >右半 [mid+1..high]</text>
<path d="M 440 286 L 440 296 L 532 296 L 532 286" stroke="#1c5cab" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="486.0" y="318" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="middle"   >候选1 · 左半最大 = 11（递归）</text>
<path d="M 640 340 L 640 350 L 732 350 L 732 340" stroke="#127a56" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="686.0" y="372" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >候选2 · 右半最大 = 13（递归）</text>
<path d="M 440 394 L 440 404 L 732 404 L 732 394" stroke="#b0491d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="586.0" y="426" font-size="14" fill="#b0491d" font-weight="700" text-anchor="middle"   >候选3 · 跨中 a[1..3] = 11−4+13 = 20</text>
<rect x="40" y="520" width="700" height="260" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="560" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >跨中和的计算</text>
<text x="210" y="559" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >从 mid 分别向两侧扩展</text>
<text x="70" y="594" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   >从 mid 向左累加，取最大 maxLeftBorderSum：</text>
<text x="86" y="620" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a[2]=−4 → a[1..2]=7 → a[0..2]=5   ⟹  7</text>
<text x="70" y="658" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   >从 mid+1 向右累加，取最大 maxRightBorderSum：</text>
<text x="86" y="684" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a[3]=13 → a[3..4]=8 → a[3..5]=6   ⟹  13</text>
<rect x="68" y="710" width="644" height="50" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="10" opacity="1" />
<text x="390.0" y="741" font-size="17" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">跨中和 = 7 + 13 = 20</text>
<rect x="760" y="520" width="600" height="260" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="786" y="560" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >合并与复杂度</text>
<rect x="788" y="590" width="544" height="74" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="1060.0" y="620" font-size="15.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">max3( maxLeftSum, maxRightSum, 跨中 )</text>
<text x="1060.0" y="648" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= max3(11, 13, 20) = 20</text>
<rect x="788" y="678" width="544" height="74" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="1060.0" y="708" font-size="16" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">T(n) = 2T(n/2) + n</text>
<text x="1060.0" y="734" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">⟹  O(n log₂n)</text>
</svg>
