<text x="1160.0" y="614" font-size="15" fill="#52514e" font-weight="700" text-anchor="middle"   >3</text>
<text x="1160.0" y="580" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="middle"   >3</text>
<rect x="1192" y="588" width="52" height="40" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="7" opacity="1" />
<text x="1218.0" y="614" font-size="15" fill="#52514e" font-weight="700" text-anchor="middle"   >8</text>
<text x="1218.0" y="580" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="middle"   >4</text>
<text x="1044.0" y="642" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >↑ k=3 插入点=1</text>
<rect x="728" y="660" width="604" height="92" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="746" y="686" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >区间 [low, high]（含 n），求 mid：</text>
<text x="746" y="711" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">k ≤ a[mid]：high = mid    （含 mid，向左逼近）</text>
<text x="746" y="735" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">k &gt; a[mid]：low = mid+1   （向右）；结束返回 low</text>
<text x="730" y="798" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >k=3→1，k=5→4，k=10→5；STL：lower_bound / upper_bound。</text>
