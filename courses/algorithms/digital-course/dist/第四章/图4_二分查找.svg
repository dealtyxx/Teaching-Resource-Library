<text x="986.0" y="614" font-size="15" fill="#52514e" font-weight="700" text-anchor="middle"   >1</text>
<text x="986.0" y="580" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="middle"   >0</text>
<rect x="1018" y="588" width="52" height="40" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="7" opacity="1" />
<text x="1044.0" y="614" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
