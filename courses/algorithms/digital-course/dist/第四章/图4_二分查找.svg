<text x="66" y="560" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >复杂度与变体</text>
<rect x="68" y="590" width="584" height="78" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="620" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >时间复杂度</text>
<text x="86" y="648" font-size="16" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">T(n)=T(n/2)+1  ⟹  O(log₂n)</text>
<rect x="68" y="682" width="584" height="110" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="712" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >变体 · 假币问题（三分法）</text>
<text x="86" y="740" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >n 枚硬币分 A、B、C 三份，天平称 A、B 一次：</text>
<text x="86" y="764" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >轻的一份含假币，否则在 C 中 → 每次缩到 1/3</text>
<text x="86" y="786" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">最少称重次数 C(n) = ⌈log₃n⌉</text>
<rect x="700" y="520" width="660" height="300" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="726" y="560" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >扩展 · 查找插入点</text>
<text x="958" y="559" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >lower_bound：第一个 ≥ k 的位置</text>
<text x="730" y="606" font-size="14.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a = {1, 3, 3, 3, 8}</text>
