<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >汉诺塔：递归分解与时空复杂度</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >把 n 个盘的移动归结为两个 n−1 的子问题（2.1.4）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第2章 递归算法设计技术</text>
<rect x="40" y="124" width="1320" height="72" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="152" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >问题</text>
<text x="120" y="152" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   >将 x 上从小到大的 n 个盘移到 z（借助 y），每次只移一个，且大盘不得压在小盘之上。</text>
<text x="66" y="180" font-size="15" fill="#b0491d" font-weight="700" text-anchor="start"   >递归模型</text>
<text x="150" y="180" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">Hanoi(n,x,y,z)：① Hanoi(n−1,x,z,y)  → ② move(n,x→z)  → ③ Hanoi(n−1,y,x,z)</text>
<rect x="40" y="212" width="760" height="566" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="252" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >递归分解（三步）</text>
<circle cx="84" cy="340" r="15" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.4" opacity="1"/>
<text x="84" y="345" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="middle"   >①</text>
<text x="108" y="326" font-size="14" fill="#52514e" font-weight="600" text-anchor="start"   >Hanoi(n−1, x, z, y)</text>
<text x="108" y="350" font-size="14" fill="#52514e" font-weight="600" text-anchor="start"   >把上面 n−1 个盘 x → y</text>
<rect x="324" y="390" width="442" height="10" fill="#e7e3d8" stroke="#c3c2b7" stroke-width="1" rx="4" opacity="1" />
<rect x="398" y="316" width="8" height="74" fill="#cbb892" stroke="none" stroke-width="1" rx="3" opacity="1" />
<text x="402" y="414" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >x</text>
<rect x="541.0" y="316" width="8" height="74" fill="#cbb892" stroke="none" stroke-width="1" rx="3" opacity="1" />
<text x="545.0" y="414" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >y</text>
<rect x="684" y="316" width="8" height="74" fill="#cbb892" stroke="none" stroke-width="1" rx="3" opacity="1" />
<text x="688" y="414" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >z</text>
<rect x="338.0" y="370" width="128" height="20" fill="#3a2e86" stroke="#2a2170" stroke-width="1" rx="6" opacity="1" />
<text x="402" y="385.0" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"   >n</text>
<rect x="503.0" y="348" width="84" height="42" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.3" rx="8" opacity="1" />
<line x1="511.0" y1="359" x2="579.0" y2="359" stroke="#cbc4ee" stroke-width="1" stroke-linecap="butt" />
<line x1="511.0" y1="370" x2="579.0" y2="370" stroke="#cbc4ee" stroke-width="1" stroke-linecap="butt" />
<line x1="511.0" y1="381" x2="579.0" y2="381" stroke="#cbc4ee" stroke-width="1" stroke-linecap="butt" />
<text x="545.0" y="374.0" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   >n−1</text>
<path d="M 402 308 C 402 284, 545.0 284, 545.0 308" stroke="#eb6834" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<circle cx="84" cy="504" r="15" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.4" opacity="1"/>
<text x="84" y="509" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="middle"   >②</text>
<text x="108" y="490" font-size="14" fill="#52514e" font-weight="600" text-anchor="start"   >move(n, x → z)</text>
<text x="108" y="514" font-size="14" fill="#52514e" font-weight="600" text-anchor="start"   >把最大的第 n 个盘 x → z</text>
<rect x="324" y="554" width="442" height="10" fill="#e7e3d8" stroke="#c3c2b7" stroke-width="1" rx="4" opacity="1" />
<rect x="398" y="480" width="8" height="74" fill="#cbb892" stroke="none" stroke-width="1" rx="3" opacity="1" />
<text x="402" y="578" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >x</text>
<rect x="541.0" y="480" width="8" height="74" fill="#cbb892" stroke="none" stroke-width="1" rx="3" opacity="1" />
<text x="545.0" y="578" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >y</text>
<rect x="684" y="480" width="8" height="74" fill="#cbb892" stroke="none" stroke-width="1" rx="3" opacity="1" />
<text x="688" y="578" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >z</text>
<rect x="503.0" y="512" width="84" height="42" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.3" rx="8" opacity="1" />
<line x1="511.0" y1="523" x2="579.0" y2="523" stroke="#cbc4ee" stroke-width="1" stroke-linecap="butt" />
<line x1="511.0" y1="534" x2="579.0" y2="534" stroke="#cbc4ee" stroke-width="1" stroke-linecap="butt" />
<line x1="511.0" y1="545" x2="579.0" y2="545" stroke="#cbc4ee" stroke-width="1" stroke-linecap="butt" />
<text x="545.0" y="538.0" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   >n−1</text>
<rect x="624.0" y="534" width="128" height="20" fill="#3a2e86" stroke="#2a2170" stroke-width="1" rx="6" opacity="1" />
<text x="688" y="549.0" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"   >n</text>
<path d="M 402 472 C 402 448, 688 448, 688 472" stroke="#eb6834" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<circle cx="84" cy="668" r="15" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.4" opacity="1"/>
<text x="84" y="673" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="middle"   >③</text>
<text x="108" y="654" font-size="14" fill="#52514e" font-weight="600" text-anchor="start"   >Hanoi(n−1, y, x, z)</text>
<text x="108" y="678" font-size="14" fill="#52514e" font-weight="600" text-anchor="start"   >把 n−1 个盘 y → z，完成</text>
<rect x="324" y="718" width="442" height="10" fill="#e7e3d8" stroke="#c3c2b7" stroke-width="1" rx="4" opacity="1" />
<rect x="398" y="644" width="8" height="74" fill="#cbb892" stroke="none" stroke-width="1" rx="3" opacity="1" />
<text x="402" y="742" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >x</text>
<rect x="541.0" y="644" width="8" height="74" fill="#cbb892" stroke="none" stroke-width="1" rx="3" opacity="1" />
<text x="545.0" y="742" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >y</text>
<rect x="684" y="644" width="8" height="74" fill="#cbb892" stroke="none" stroke-width="1" rx="3" opacity="1" />
<text x="688" y="742" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >z</text>
<rect x="624.0" y="698" width="128" height="20" fill="#3a2e86" stroke="#2a2170" stroke-width="1" rx="6" opacity="1" />
<text x="688" y="713.0" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"   >n</text>
<rect x="646.0" y="654" width="84" height="42" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.3" rx="8" opacity="1" />
<line x1="654.0" y1="665" x2="722.0" y2="665" stroke="#cbc4ee" stroke-width="1" stroke-linecap="butt" />
<line x1="654.0" y1="676" x2="722.0" y2="676" stroke="#cbc4ee" stroke-width="1" stroke-linecap="butt" />
<line x1="654.0" y1="687" x2="722.0" y2="687" stroke="#cbc4ee" stroke-width="1" stroke-linecap="butt" />
<text x="688" y="680.0" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   >n−1</text>
<path d="M 545.0 636 C 545.0 612, 688 612, 688 636" stroke="#eb6834" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<rect x="820" y="212" width="540" height="566" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="846" y="252" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >时间与空间复杂度</text>
<rect x="846" y="286" width="488" height="200" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="866" y="316" font-size="16.5" fill="#b0491d" font-weight="700" text-anchor="start"   >① 时间复杂度 T(n)</text>
<text x="866" y="350" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">T(n)=1</text>
<text x="1050" y="350" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="start"   >n=1</text>
<text x="866" y="376" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">T(n)=2T(n−1)+1</text>
<text x="1050" y="376" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="start"   >n&gt;1</text>
<line x1="866" y1="394" x2="1314" y2="394" stroke="#f3c1ac" stroke-width="1" stroke-linecap="butt" />
<text x="866" y="420" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">= 2ⁿ⁻¹T(1)+2ⁿ⁻²+…+2+1</text>
<text x="866" y="448" font-size="16" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">= 2ⁿ − 1</text>
<text x="1120" y="448" font-size="17" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">= O(2ⁿ)</text>
<rect x="846" y="508" width="488" height="196" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="866" y="538" font-size="16.5" fill="#127a56" font-weight="700" text-anchor="start"   >② 空间复杂度 S(n)</text>
<text x="866" y="572" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">S(n)=1</text>
<text x="1050" y="572" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="start"   >n=1</text>
<text x="866" y="598" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">S(n)=S(n−1)+1</text>
<text x="1050" y="598" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="start"   >n&gt;1</text>
<line x1="866" y1="616" x2="1314" y2="616" stroke="#a9e0cb" stroke-width="1" stroke-linecap="butt" />
<text x="866" y="642" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >取最大值关系：前一子问题空间</text>
<text x="866" y="664" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >释放后被后一子问题复用</text>
<text x="1120" y="682" font-size="17" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">S(n) = O(n)</text>
<text x="1090.0" y="756" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="middle"   >时间指数级增长，是递归代价高的典型例子</text>
</svg>
