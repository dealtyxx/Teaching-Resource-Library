<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="772" viewBox="0 0 1400 772" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="772" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >递归的执行过程与系统栈</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >求 fun(5)=5! —— 分解（下降）与求值（回归）（2.1.4）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第2章 递归算法设计技术</text>
<rect x="40" y="128" width="812" height="604" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >分解过程 与 求值过程</text>
<text x="66" y="194" font-size="15" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">f(n)=1 (n=1)；f(n)=n·f(n−1) (n&gt;1)</text>
<text x="190" y="230" font-size="17" fill="#1c5cab" font-weight="700" text-anchor="middle"   >① 分解过程</text>
<text x="190" y="250" font-size="13" fill="#898781" font-weight="normal" text-anchor="middle"   >调用 → 进栈</text>
<text x="600" y="230" font-size="17" fill="#127a56" font-weight="700" text-anchor="middle"   >② 求值过程</text>
<text x="600" y="250" font-size="13" fill="#898781" font-weight="normal" text-anchor="middle"   >返回 → 退栈</text>
<path d="M 84 272 L 84 660" stroke="#2a78d6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<path d="M 812 660 L 812 272" stroke="#127a56" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="95.0" y="272" width="190" height="52" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="10" opacity="1" />
<text x="190" y="305" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">fun(5)</text>
<rect x="485.0" y="272" width="230" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="10" opacity="1" />
<text x="600" y="305" font-size="15.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">fun(5)=fun(4)·5=120</text>
<path d="M 190 324 L 190 352" stroke="#2a78d6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<text x="98" y="350" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >n=5&gt;1，递推</text>
<path d="M 600 356 L 600 328" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="95.0" y="356" width="190" height="52" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="10" opacity="1" />
<text x="190" y="389" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">fun(4)</text>
<rect x="485.0" y="356" width="230" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="10" opacity="1" />
<text x="600" y="389" font-size="15.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">fun(4)=fun(3)·4=24</text>
<path d="M 190 408 L 190 436" stroke="#2a78d6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<text x="98" y="434" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >n=4&gt;1，递推</text>
<path d="M 600 440 L 600 412" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="95.0" y="440" width="190" height="52" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="10" opacity="1" />
<text x="190" y="473" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">fun(3)</text>
<rect x="485.0" y="440" width="230" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="10" opacity="1" />
<text x="600" y="473" font-size="15.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">fun(3)=fun(2)·3=6</text>
<path d="M 190 492 L 190 520" stroke="#2a78d6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<text x="98" y="518" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >n=3&gt;1，递推</text>
<path d="M 600 524 L 600 496" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="95.0" y="524" width="190" height="52" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="10" opacity="1" />
<text x="190" y="557" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">fun(2)</text>
<rect x="485.0" y="524" width="230" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="10" opacity="1" />
<text x="600" y="557" font-size="15.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">fun(2)=fun(1)·2=2</text>
<path d="M 190 576 L 190 604" stroke="#2a78d6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<text x="98" y="602" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >n=2&gt;1，递推</text>
<path d="M 600 608 L 600 580" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="95.0" y="608" width="190" height="52" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="10" opacity="1" />
<text x="190" y="641" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">fun(1)</text>
<rect x="485.0" y="608" width="230" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="10" opacity="1" />
<text x="600" y="641" font-size="15.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">fun(1)=1</text>
<path d="M 285.0 634.0 L 481.0 634.0" stroke="#eb6834" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" stroke-dasharray="5 4"/>
<text x="395.0" y="622.0" font-size="13" fill="#b0491d" font-weight="700" text-anchor="middle"   >n==1，出口</text>
<rect x="872" y="128" width="488" height="604" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="898" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >系统栈</text>
<text x="976" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >递归靠系统栈实现</text>
<rect x="932" y="236" width="300" height="58" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="10" opacity="1" />
<text x="952" y="262" font-size="16" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">fun(1)</text>
<text x="952" y="283" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >参数 / 局部变量 / 返回地址 · n=1  → 出口</text>
<rect x="932" y="300" width="300" height="58" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="10" opacity="1" />
<text x="952" y="326" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">fun(2)</text>
<text x="952" y="347" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >参数 / 局部变量 / 返回地址 · n=2</text>
<rect x="932" y="364" width="300" height="58" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="10" opacity="1" />
<text x="952" y="390" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">fun(3)</text>
<text x="952" y="411" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >参数 / 局部变量 / 返回地址 · n=3</text>
<rect x="932" y="428" width="300" height="58" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="10" opacity="1" />
<text x="952" y="454" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">fun(4)</text>
<text x="952" y="475" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >参数 / 局部变量 / 返回地址 · n=4</text>
<rect x="932" y="492" width="300" height="58" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="10" opacity="1" />
<text x="952" y="518" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">fun(5)</text>
<text x="952" y="539" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >参数 / 局部变量 / 返回地址 · n=5  首次调用</text>
<text x="1248" y="264" font-size="13" fill="#898781" font-weight="600" text-anchor="start"   >栈顶</text>
<path d="M 1272 276 L 1272 540" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="1262" y="396.0" font-size="13" fill="#898781" font-weight="600" text-anchor="middle"   >递</text>
<text x="1262" y="416.0" font-size="13" fill="#898781" font-weight="600" text-anchor="middle"   >归</text>
<text x="1262" y="436.0" font-size="13" fill="#898781" font-weight="600" text-anchor="middle"   >深</text>
<text x="1262" y="456.0" font-size="13" fill="#898781" font-weight="600" text-anchor="middle"   >度</text>
<path d="M 916 266 L 916 234" stroke="#2a78d6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<text x="888" y="256" font-size="12" fill="#1c5cab" font-weight="600" text-anchor="middle"   >进</text>
<text x="888" y="272" font-size="12" fill="#1c5cab" font-weight="600" text-anchor="middle"   >栈</text>
<text x="902" y="578" font-size="14" fill="#52514e" font-weight="600" text-anchor="start"   >深度 = n = 5，随规模 n 增大而加深</text>
<text x="902" y="604" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="start"   >全部执行完毕后，栈应为空。</text>
</svg>
