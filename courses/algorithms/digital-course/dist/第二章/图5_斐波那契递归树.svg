<text x="1096" y="312" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >Fib(1) 被计算 2 次</text>
<text x="1096" y="338" font-size="14" fill="#b0491d" font-weight="600" text-anchor="start"   >→ 存在大量重复计算</text>
<rect x="1080" y="372" width="256" height="104" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="1096" y="400" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="start"   >调用统计</text>
<text x="1096" y="430" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >叶结点数 = Fib(5) = 5</text>
<text x="1096" y="456" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >总调用次数 = 9</text>
<rect x="1080" y="496" width="256" height="158" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="1096" y="524" font-size="16" fill="#127a56" font-weight="700" text-anchor="start"   >时间复杂度</text>
<text x="1096" y="554" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >朴素递归呈指数级：</text>
<text x="1096" y="584" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">T(n)=O(φⁿ)≈O(1.618ⁿ)</text>
<text x="1096" y="614" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >可用记忆化 / 迭代</text>
<text x="1096" y="638" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >优化为 O(n)。</text>
