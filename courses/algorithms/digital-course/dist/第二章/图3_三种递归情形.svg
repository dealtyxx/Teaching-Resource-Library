<text x="976" y="192" font-size="24" fill="#3a2e86" font-weight="700" text-anchor="middle"   >3</text>
<text x="1014" y="180" font-size="20" fill="#0b0b0b" font-weight="700" text-anchor="start"   >求解方法是递归的</text>
<text x="1014" y="204" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >Recursive method</text>
<text x="960" y="256" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >汉诺塔：移 n 个盘可归结为移 n−1 个盘</text>
<rect x="970" y="448" width="350" height="12" fill="#e7e3d8" stroke="#c3c2b7" stroke-width="1" rx="4" opacity="1" />
