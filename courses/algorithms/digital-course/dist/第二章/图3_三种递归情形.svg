<text x="610.0" y="580" font-size="12" fill="#898781" font-weight="normal" text-anchor="middle"   >r→left</text>
<line x1="700.0" y1="462" x2="790.0" y2="492" stroke="#127a56" stroke-width="1.6" stroke-linecap="butt" />
<polygon points="790.0,492 750.0,560 830.0,560" fill="#e9f7f1" stroke="#127a56" stroke-width="1.4"/>
<text x="790.0" y="538" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >子树</text>
<text x="790.0" y="580" font-size="12" fill="#898781" font-weight="normal" text-anchor="middle"   >r→right</text>
<rect x="513" y="620" width="374" height="68" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="10" opacity="1" />
<text x="700.0" y="650" font-size="13.5" fill="#127a56" font-weight="600" text-anchor="middle"   >取子树 r→left / r→right</text>
<text x="700.0" y="672" font-size="13" fill="#898781" font-weight="normal" text-anchor="middle"   >即基本递归运算，特别适合递归求解</text>
