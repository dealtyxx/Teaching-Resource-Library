<path d="M 675 298 L 699 298" stroke="#127a56" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="701" y="278" width="62" height="40" fill="#fff" stroke="#127a56" stroke-width="1.3" rx="6" opacity="1" />
<line x1="741" y1="278" x2="741" y2="318" stroke="#127a56" stroke-width="1" stroke-linecap="butt" />
<text x="721" y="304" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >8</text>
<circle cx="752" cy="298" r="3" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<path d="M 763 298 L 785 298" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<text x="793" y="303" font-size="15" fill="#898781" font-weight="normal" text-anchor="start"   >∅</text>
<path d="M 613 328 L 613 338 L 763 338 L 763 328" stroke="#127a56" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="665.8" y="356" font-size="12.5" fill="#127a56" font-weight="600" text-anchor="middle"   >子链表（仍是单链表）</text>
<text x="515" y="396" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >二叉树：左、右子树仍是二叉树</text>
<circle cx="700.0" cy="440" r="22" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
