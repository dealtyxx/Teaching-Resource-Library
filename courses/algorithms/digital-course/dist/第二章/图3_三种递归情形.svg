<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >何时使用递归：三种情形</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >定义、数据结构或求解方法本身是递归的（2.1.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第2章 递归算法设计技术</text>
<rect x="40" y="128" width="430" height="588" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="40" y="128" width="430" height="8" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="86" cy="184" r="24" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.5" opacity="1"/>
<text x="86" y="192" font-size="24" fill="#1c5cab" font-weight="700" text-anchor="middle"   >1</text>
<text x="124" y="180" font-size="20" fill="#0b0b0b" font-weight="700" text-anchor="start"   >定义是递归的</text>
<text x="124" y="204" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >Recursive definition</text>
<text x="70" y="258" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >许多数学公式 / 数列的定义本身递归</text>
<rect x="68" y="280" width="374" height="92" fill="#fbfbfa" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="86" y="308" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >阶乘 n!</text>
<text x="86" y="336" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">n! = 1</text>
<text x="290" y="336" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="start"   >n = 0,1</text>
<text x="86" y="360" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">n! = n·(n−1)!</text>
<text x="290" y="360" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="start"   >n &gt; 1</text>
<rect x="68" y="384" width="374" height="120" fill="#fbfbfa" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="86" y="412" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >斐波那契 Fib(n)</text>
<text x="86" y="440" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">Fib(n) = 1</text>
<text x="290" y="440" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="start"   >n = 1,2</text>
<text x="86" y="468" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">Fib(n) = Fib(n−1)</text>
<text x="86" y="490" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">              + Fib(n−2)</text>
<text x="290" y="468" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="start"   >n &gt; 2</text>
<rect x="68" y="620" width="374" height="68" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="255.0" y="650" font-size="14" fill="#1c5cab" font-weight="600" text-anchor="middle"   >递归定义可直接转化为</text>
<text x="255.0" y="672" font-size="14" fill="#1c5cab" font-weight="600" text-anchor="middle"   >对应的递归算法</text>
<rect x="485" y="128" width="430" height="588" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="485" y="128" width="430" height="8" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="531" cy="184" r="24" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
