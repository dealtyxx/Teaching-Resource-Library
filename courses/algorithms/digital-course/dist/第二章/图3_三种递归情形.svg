<text x="569" y="180" font-size="20" fill="#0b0b0b" font-weight="700" text-anchor="start"   >数据结构是递归的</text>
<text x="569" y="204" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >Recursive structure</text>
<text x="515" y="256" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >单链表：尾部仍是一个单链表</text>
