<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="862" viewBox="0 0 1400 862" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="862" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >递归的概念与三大条件</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >什么是递归 —— 在定义中直接或间接调用自身（2.1.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第2章 递归算法设计技术</text>
<rect x="40" y="124" width="1320" height="84" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="158" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="start"   >递归（recursion）</text>
<text x="66" y="190" font-size="16" fill="#52514e" font-weight="normal" text-anchor="start"   >一个过程或函数在其定义或说明中直接或间接调用自身的方法；把问题转化为规模更小、解法相同的子问题。</text>
<rect x="40" y="228" width="640" height="300" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="268" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >典型示例 · 求 n!</text>
<text x="320" y="267" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >例2.1</text>
<text x="74" y="320" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">int fun(int n) {</text>
<text x="74" y="350" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    if (n==1)</text>
<text x="74" y="380" font-size="17" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">        return 1;</text>
<text x="74" y="410" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    else</text>
<text x="74" y="440" font-size="17" fill="#b0491d" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">        return fun(n-1) * n;</text>
<text x="74" y="470" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="400" y="346" width="120" height="26" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.1" rx="13" opacity="1" />
<text x="460" y="364" font-size="13.5" fill="#127a56" font-weight="600" text-anchor="middle"   >递归出口</text>
<rect x="400" y="406" width="150" height="26" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.1" rx="13" opacity="1" />
<text x="475" y="424" font-size="13.5" fill="#b0491d" font-weight="600" text-anchor="middle"   >递归体（调用自身）</text>
<path d="M 284 448 C 640 470, 640 340, 144 304" stroke="#eb6834" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" stroke-dasharray="5 4"/>
<text x="660" y="506" font-size="13.5" fill="#898781" font-weight="normal" text-anchor="end"   >规模由 n 缩小到 n−1，最终归结到 n=1</text>
<rect x="700" y="228" width="660" height="300" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="726" y="268" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >自指现象</text>
<text x="826" y="267" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >“从前有座山……”</text>
<rect x="740" y="304" width="480" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.1" rx="8" opacity="1" />
<text x="756" y="329" font-size="13.5" fill="#0b0b0b" font-weight="normal" text-anchor="start"   >从前有座山，山上有座庙……</text>
<rect x="766" y="344" width="428" height="40" fill="#dcebfb" stroke="#b7d3f6" stroke-width="1.1" rx="8" opacity="1" />
<text x="782" y="369" font-size="13.5" fill="#0b0b0b" font-weight="normal" text-anchor="start"   >老和尚给小和尚讲故事：</text>
<rect x="792" y="384" width="376" height="40" fill="#cbe0f8" stroke="#b7d3f6" stroke-width="1.1" rx="8" opacity="1" />
<text x="808" y="409" font-size="13.5" fill="#0b0b0b" font-weight="normal" text-anchor="start"   >从前有座山，山上有座庙……</text>
<rect x="818" y="424" width="324" height="40" fill="#b7d3f6" stroke="#b7d3f6" stroke-width="1.1" rx="8" opacity="1" />
<text x="834" y="449" font-size="13.5" fill="#0b0b0b" font-weight="normal" text-anchor="start"   >老和尚给小和尚讲故事：</text>
<rect x="844" y="464" width="272" height="40" fill="#a6c8f2" stroke="#b7d3f6" stroke-width="1.1" rx="8" opacity="1" />
<text x="860" y="489" font-size="16" fill="#1c5cab" font-weight="600" text-anchor="start"   >……</text>
<text x="1030.0" y="508" font-size="13.5" fill="#b0491d" font-weight="600" text-anchor="middle"   >无限自指若无终止条件将耗尽资源 → 递归必须有出口</text>
<text x="700" y="566" font-size="20" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >可用递归求解的三大条件</text>
<rect x="40.0" y="590" width="424.0" height="236" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="14" opacity="1" />
<rect x="40.0" y="590" width="424.0" height="8" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="92.0" cy="648" r="26" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.5" opacity="1"/>
<text x="92.0" y="657" font-size="26" fill="#1c5cab" font-weight="700" text-anchor="middle"   >1</text>
<text x="136.0" y="656" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start"   >子问题同构</text>
<text x="70.0" y="706" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >原问题能转化为一个或多个子问题，子</text>
<text x="70.0" y="732" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >问题解法与原问题完全相同，只是规模</text>
<text x="70.0" y="758" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >更小。</text>
<rect x="488.0" y="590" width="424.0" height="236" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="14" opacity="1" />
<rect x="488.0" y="590" width="424.0" height="8" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="540.0" cy="648" r="26" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.5" opacity="1"/>
<text x="540.0" y="657" font-size="26" fill="#b0491d" font-weight="700" text-anchor="middle"   >2</text>
<text x="584.0" y="656" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start"   >有限次调用</text>
<text x="518.0" y="706" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >递归调用的次数必须是有限的，随规模</text>
<text x="518.0" y="732" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >减小逐步逼近最简情形。</text>
<rect x="936.0" y="590" width="424.0" height="236" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="14" opacity="1" />
<rect x="936.0" y="590" width="424.0" height="8" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="988.0" cy="648" r="26" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<text x="988.0" y="657" font-size="26" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<text x="1032.0" y="656" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start"   >有递归出口</text>
<text x="966.0" y="706" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >必有明确的结束条件，否则递归将无止</text>
<text x="966.0" y="732" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >境进行，直到耗尽系统资源。</text>
</svg>
