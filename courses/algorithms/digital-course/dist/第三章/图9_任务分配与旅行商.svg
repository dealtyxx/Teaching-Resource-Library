<text x="730" y="576" font-size="15" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">长度 = 2+3+2+4 = 11</text>
<text x="730" y="620" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >枚举 (n−1)! 个排列，取最短 → O(n!)</text>
<rect x="40" y="664" width="1320" height="120" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="704" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >共同原理</text>
<text x="70" y="734" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   >本质相同：解一定是某个排列 → 枚举全部排列，对每个排列算目标值，比较求最优。</text>
<text x="70" y="764" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >任务分配求 min Σc[i][x[i]]（规模 n!）；TSP 求 min 回路长度（固定起点，规模 (n−1)!）。</text>
