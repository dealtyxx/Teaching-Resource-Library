<text x="70" y="546" font-size="15.5" fill="#3a2e86" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">最优方案  x = (1, 0, 2, 3)</text>
<text x="70" y="574" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">总成本 = 2 + 6 + 1 + 4 = 13（最小）</text>
<text x="70" y="620" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >枚举 n! 个排列，比较取最小 → O(n · n!)</text>
