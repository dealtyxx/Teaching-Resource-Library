<text x="726" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >旅行商问题 TSP</text>
<text x="936" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >求最短回路</text>
<text x="730" y="202" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >从 s 出发访问每个城市一次再回到 s；除 s 外的路径</text>
<text x="730" y="224" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >是其余城市的一个排列，求最短回路长度。</text>
