<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >任务分配问题</text>
<text x="210" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >求总成本最小</text>
<text x="70" y="202" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >x=(x₀,…,xₙ₋₁) 为 0~n−1 的排列，xᵢ = 人员 i 分到的任务；</text>
<text x="70" y="224" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >最小化总成本 Σ c[i][x[i]]。</text>
