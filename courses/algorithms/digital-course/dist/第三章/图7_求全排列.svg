<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="760" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >求全排列</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >枚举 1~n 的所有排列（排列列举，共 n! 个）（3.7）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第3章 穷举法</text>
<rect x="40" y="128" width="856" height="600" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >解法1 · 增量插入法</text>
<text x="320" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >n = 3：把新元素插入已有排列的每个位置</text>
<line x1="468" y1="257" x2="260" y2="339" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="468" y1="257" x2="680" y2="339" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="260" y1="381" x2="140" y2="479" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="260" y1="381" x2="260" y2="479" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="260" y1="381" x2="380" y2="479" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="680" y1="381" x2="560" y2="479" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="680" y1="381" x2="680" y2="479" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="680" y1="381" x2="800" y2="479" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<rect x="420.0" y="215.0" width="96" height="42" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" rx="10" opacity="1" />
<text x="468" y="242" font-size="17" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<rect x="212.0" y="339.0" width="96" height="42" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" rx="10" opacity="1" />
<text x="260" y="366" font-size="17" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1 2</text>
<rect x="632.0" y="339.0" width="96" height="42" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" rx="10" opacity="1" />
<text x="680" y="366" font-size="17" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2 1</text>
<rect x="92.0" y="479.0" width="96" height="42" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" rx="10" opacity="1" />
<text x="140" y="506" font-size="17" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3 1 2</text>
<rect x="212.0" y="479.0" width="96" height="42" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" rx="10" opacity="1" />
<text x="260" y="506" font-size="17" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1 3 2</text>
<rect x="332.0" y="479.0" width="96" height="42" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" rx="10" opacity="1" />
<text x="380" y="506" font-size="17" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1 2 3</text>
<rect x="512.0" y="479.0" width="96" height="42" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" rx="10" opacity="1" />
<text x="560" y="506" font-size="17" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3 2 1</text>
<rect x="632.0" y="479.0" width="96" height="42" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" rx="10" opacity="1" />
<text x="680" y="506" font-size="17" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2 3 1</text>
<rect x="752.0" y="479.0" width="96" height="42" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" rx="10" opacity="1" />
<text x="800" y="506" font-size="17" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2 1 3</text>
<text x="70" y="242" font-size="13" fill="#898781" font-weight="600" text-anchor="start"   >初始</text>
<text x="70" y="298.0" font-size="14" fill="#b0491d" font-weight="700" text-anchor="start"   >插入 2</text>
<text x="70" y="430.0" font-size="14" fill="#b0491d" font-weight="700" text-anchor="start"   >插入 3</text>
<text x="468.0" y="552" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="middle"   >共得到 3! = 6 个排列</text>
<text x="468.0" y="582" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >把 3 插到 “1 2” 的 3 个位置：_1_2_  →  312 / 132 / 123</text>
<rect x="916" y="128" width="444" height="600" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="942" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >其他解法与复杂度</text>
<rect x="942" y="198" width="392" height="128" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="962" y="228" font-size="15.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >解法2 · 递归法</text>
<text x="962" y="256" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">perm(1) = {(1)}</text>
<text x="962" y="282" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >perm(n)：对 perm(n−1) 的每</text>
<text x="962" y="306" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >个排列，把 n 插入每个位置。</text>
<rect x="942" y="342" width="392" height="110" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="962" y="372" font-size="15.5" fill="#127a56" font-weight="700" text-anchor="start"   >解法3 · STL</text>
<text x="962" y="400" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">next_permutation(beg,end)</text>
<text x="962" y="426" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >反复生成下一个排列，直到无</text>
<text x="962" y="448" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >下一个排列时返回 false。</text>
<rect x="942" y="468" width="392" height="130" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="962" y="498" font-size="15.5" fill="#b0491d" font-weight="700" text-anchor="start"   >时间复杂度</text>
<text x="962" y="528" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">T(1)=1</text>
<text x="962" y="554" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">T(n)=T(n−1)+n!</text>
<text x="962" y="584" font-size="16" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">⟹ O(n · n!)</text>
<text x="962" y="698" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >排列规模随 n 阶乘级增长。</text>
</svg>
