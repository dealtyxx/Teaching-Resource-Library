<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >0/1 背包 · 限界函数剪支</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >按 v/w 排序，左剪支控重量，右剪支用上界函数（5.8）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第5章 回溯法</text>
<rect x="40" y="128" width="620" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >按 v/w 递减排序</text>
<text x="298" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >W = 6</text>
<text x="110" y="216" font-size="13.5" fill="#52514e" font-weight="700" text-anchor="middle"   >序号 i</text>
<text x="240" y="216" font-size="13.5" fill="#52514e" font-weight="700" text-anchor="middle"   >物品 no</text>
<text x="360" y="216" font-size="13.5" fill="#52514e" font-weight="700" text-anchor="middle"   >w</text>
<text x="450" y="216" font-size="13.5" fill="#52514e" font-weight="700" text-anchor="middle"   >v</text>
<text x="550" y="216" font-size="13.5" fill="#52514e" font-weight="700" text-anchor="middle"   >v/w</text>
<line x1="70" y1="228" x2="630" y2="228" stroke="#c3c2b7" stroke-width="1.2" stroke-linecap="butt" />
<text x="110" y="256" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >0</text>
<text x="240" y="256" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >2</text>
<text x="360" y="256" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >2</text>
<text x="450" y="256" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >3</text>
<text x="550" y="256" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >1.5</text>
<text x="110" y="290" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >1</text>
<text x="240" y="290" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >1</text>
<text x="360" y="290" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >3</text>
<text x="450" y="290" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >4</text>
<text x="550" y="290" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >1.3</text>
<text x="110" y="324" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >2</text>
<text x="240" y="324" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >3</text>
<text x="360" y="324" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >1</text>
<text x="450" y="324" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >1</text>
<text x="550" y="324" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >1.0</text>
<text x="110" y="358" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >3</text>
<text x="240" y="358" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >0</text>
<text x="360" y="358" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >5</text>
<text x="450" y="358" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >4</text>
<text x="550" y="358" font-size="14.5" fill="#52514e" font-weight="600" text-anchor="middle"   >0.8</text>
<text x="70" y="402" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >排序后按序号 i 搜索（v/w 大的先考虑）。</text>
<rect x="68" y="458" width="564" height="96" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="486" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >左剪支（选物品 i）</text>
<text x="86" y="514" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">仅扩展 cw + w[i] ≤ W 的左孩子</text>
<text x="86" y="538" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >（选入后重量不超过背包容量）</text>
<rect x="68" y="566" width="564" height="96" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="594" font-size="15" fill="#b0491d" font-weight="700" text-anchor="start"   >右剪支（不选物品 i）</text>
<text x="86" y="622" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">仅扩展 bound(cw,cv,i+1) &gt; bestv 的右孩子</text>
<text x="86" y="646" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >（上界都不超过当前最优，则剪去）</text>
<text x="70" y="742" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >最坏仍 O(n·2ⁿ)，但剪支后实际结点大幅减少。</text>
<rect x="680" y="128" width="680" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="706" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >限界函数（上界）</text>
<text x="894" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >以结点 i=1、剩余容量 rw=6 为例</text>
<text x="710" y="202" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >按 v/w 顺序贪心装满剩余容量，最后一个物品可“部分装入”，</text>
<text x="710" y="226" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >得到的价值就是该结点的价值上界 b。</text>
<text x="720" y="266" font-size="12.5" fill="#898781" font-weight="600" text-anchor="start"   >容量 W=6</text>
<rect x="720" y="278" width="276" height="60" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="6" opacity="1" />
<text x="858.0" y="304" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="middle"   >物品1</text>
<text x="858.0" y="324" font-size="11" fill="#52514e" font-weight="normal" text-anchor="middle"   >w=3 v=4</text>
<rect x="996" y="278" width="92" height="60" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="6" opacity="1" />
<text x="1042.0" y="304" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >物品2</text>
<text x="1042.0" y="324" font-size="11" fill="#52514e" font-weight="normal" text-anchor="middle"   >w=1 v=1</text>
<rect x="1088" y="278" width="184" height="60" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" rx="6" opacity="1" stroke-dasharray="5 4"/>
<text x="1180.0" y="304" font-size="13" fill="#3a2e86" font-weight="700" text-anchor="middle"   >物品3</text>
<text x="1180.0" y="324" font-size="11" fill="#52514e" font-weight="normal" text-anchor="middle"   >w=2(部分) v=1.6</text>
<text x="996.0" y="362" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >总重量 = 6 = W，装满</text>
<rect x="708" y="428" width="624" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="726" y="456" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">b = v₁ + v₂ + v₃·(2/5)</text>
<text x="726" y="484" font-size="15" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  = 4 + 1 + 4×0.4 = 6.6</text>
<text x="726" y="510" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >→ 该结点价值上界 = 6.6</text>
<rect x="708" y="538" width="624" height="168" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="726" y="566" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">double bound(cw, cv, i) {</text>
<text x="726" y="590" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  rw = W-cw;  b = cv;  j = i;</text>
<text x="726" y="606" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  while (j&lt;n &amp;&amp; g[j].w&lt;=rw) {  // 整件装入</text>
<text x="726" y="622" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    rw -= g[j].w;  b += g[j].v;  j++;</text>
<text x="726" y="638" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  }</text>
<text x="726" y="654" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  if (j&lt;n) b += (double)g[j].v/g[j].w*rw; // 部分</text>
<text x="726" y="670" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  return b;</text>
<text x="726" y="686" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
</svg>
