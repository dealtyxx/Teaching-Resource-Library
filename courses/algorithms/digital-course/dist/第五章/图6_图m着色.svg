<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >图的 m 着色问题</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >为每个顶点在 m 种颜色中择一，相邻顶点不同色（5.5）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第5章 回溯法</text>
<rect x="40" y="128" width="560" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >连通图与一种着色</text>
<text x="254" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >n=4，m=3 → 12 种方案</text>
<line x1="340" y1="278" x2="160" y2="378" stroke="#c3c2b7" stroke-width="2" stroke-linecap="butt" />
<line x1="340" y1="278" x2="240" y2="528" stroke="#c3c2b7" stroke-width="2" stroke-linecap="butt" />
<line x1="340" y1="278" x2="470" y2="488" stroke="#c3c2b7" stroke-width="2" stroke-linecap="butt" />
<line x1="240" y1="528" x2="470" y2="488" stroke="#c3c2b7" stroke-width="2" stroke-linecap="butt" />
<circle cx="340" cy="278" r="26" fill="#e34948" stroke="#b3201f" stroke-width="2" opacity="1"/>
<text x="340" y="284" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"   >0</text>
<circle cx="160" cy="378" r="26" fill="#2a78d6" stroke="#1c5cab" stroke-width="2" opacity="1"/>
<text x="160" y="384" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"   >1</text>
<circle cx="240" cy="528" r="26" fill="#2a78d6" stroke="#1c5cab" stroke-width="2" opacity="1"/>
<text x="240" y="534" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"   >2</text>
<circle cx="470" cy="488" r="26" fill="#1baf7a" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="470" y="494" font-size="17" fill="#fff" font-weight="700" text-anchor="middle"   >3</text>
<circle cx="100" cy="598" r="11" fill="#e34948" stroke="#b3201f" stroke-width="1.5" opacity="1"/>
<text x="120" y="603" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >颜色0</text>
<circle cx="250" cy="598" r="11" fill="#2a78d6" stroke="#1c5cab" stroke-width="1.5" opacity="1"/>
<text x="270" y="603" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >颜色1</text>
<circle cx="400" cy="598" r="11" fill="#1baf7a" stroke="#127a56" stroke-width="1.5" opacity="1"/>
<text x="420" y="603" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >颜色2</text>
<rect x="68" y="636" width="504" height="100" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="664" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >冲突判断 judge(i, j)</text>
<text x="86" y="690" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >若存在相邻顶点 k 已着色 j（A[i][k]=1</text>
<text x="86" y="712" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >且 x[k]=j），则顶点 i 不能着色 j。</text>
<rect x="620" y="128" width="740" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >m 叉解空间树</text>
<text x="812" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >逐顶点试 m 种颜色，高度 n+1</text>
<circle cx="990.0" cy="224" r="20" fill="#3a2e86" stroke="#2a2170" stroke-width="1.6" opacity="1"/>
<text x="990.0" y="229" font-size="12" fill="#fff" font-weight="700" text-anchor="middle"   >根</text>
<line x1="990.0" y1="244" x2="800" y2="308" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<circle cx="800" cy="328" r="20" fill="#e34948" stroke="#b3201f" stroke-width="1.6" opacity="1"/>
<line x1="990.0" y1="244" x2="990" y2="308" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<circle cx="990" cy="328" r="20" fill="#2a78d6" stroke="#1c5cab" stroke-width="1.6" opacity="1"/>
<line x1="990.0" y1="244" x2="1180" y2="308" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<circle cx="1180" cy="328" r="20" fill="#1baf7a" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<text x="990.0" y="288" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="middle"   >顶点0：试 3 种颜色</text>
<line x1="800" y1="348" x2="720" y2="428" stroke="#e34948" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="4 3"/>
<circle cx="720" cy="448" r="18" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.6" opacity="1"/>
<text x="720" y="454" font-size="20" fill="#e34948" text-anchor="middle">✗</text>
<line x1="800" y1="348" x2="820" y2="428" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<circle cx="820" cy="448" r="18" fill="#2a78d6" stroke="#1c5cab" stroke-width="1.6" opacity="1"/>
<line x1="800" y1="348" x2="920" y2="428" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<circle cx="920" cy="448" r="18" fill="#1baf7a" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<text x="820" y="494" font-size="12" fill="#52514e" font-weight="600" text-anchor="middle"   >顶点1 与顶点0 相邻：</text>
<text x="820" y="514" font-size="12" fill="#b3201f" font-weight="700" text-anchor="middle"   >不能再用颜色0（剪支）</text>
<rect x="648" y="548" width="684" height="66" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="666" y="576" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   >解向量 x[i] = 顶点 i 的着色（0~m−1）</text>
<text x="666" y="600" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >i 从 0 到 n−1；i=n 时得到一种着色方案，方案数 +1</text>
<rect x="648" y="628" width="684" height="108" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="666" y="656" font-size="14.5" fill="#b0491d" font-weight="700" text-anchor="start"   >复杂度</text>
<text x="666" y="684" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >m 叉子集树；每结点 judge 耗时 O(n)</text>
<text x="666" y="712" font-size="16" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">T(n) = O(n · mⁿ)</text>
</svg>
