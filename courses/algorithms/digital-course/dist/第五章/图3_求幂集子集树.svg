<text x="936" y="538" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >{2}</text>
<rect x="1044" y="512" width="96" height="40" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="8" opacity="1" />
<text x="1092" y="538" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >{3}</text>
<rect x="1200" y="512" width="96" height="40" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="8" opacity="1" />
<text x="1248" y="538" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >{ }</text>
<text x="532.0" y="265.0" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="end"   >x₀=1 选</text>
<text x="868.0" y="265.0" font-size="12" fill="#898781" font-weight="700" text-anchor="start"   >x₀=0 不选</text>
<text x="294.0" y="362.0" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="end"   >x₁</text>
<text x="184.0" y="461.0" font-size="11" fill="#1c5cab" font-weight="700" text-anchor="end"   >x₂</text>
<text x="700.0" y="574" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >8 个叶子 = 8 个子集（幂集）</text>
<rect x="40" y="640" width="660" height="200" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="680" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >状态与扩展规则</text>
<text x="232" y="679" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >用 (i, x) 表示状态</text>
<text x="70" y="712" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >根 (0, [0,0,0])  →  叶 (n, 一个解)；从 (i, x) 二选一扩展：</text>
<rect x="68" y="728" width="604" height="44" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="86" y="756" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">选 a[i]：(i+1, x[i]=1)      不选 a[i]：(i+1, x[i]=0)</text>
<text x="70" y="798" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">x[i]=1; dfs(a,i+1);   x[i]=0; dfs(a,i+1);</text>
<text x="70" y="824" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >到达叶子（i≥n）即输出一个子集。</text>
<rect x="720" y="640" width="640" height="200" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="746" y="680" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >复杂度与另一解法</text>
<rect x="748" y="710" width="584" height="54" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="1040.0" y="743" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">满二叉树 2ⁿ 个叶子，输出一个解 O(n) → O(n·2ⁿ)</text>
<text x="750" y="788" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >解法2（pset2）：解向量变长存放子集本身，</text>
<text x="750" y="812" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >第 i 层“n−j 选一”，树恰有 2ⁿ 个结点、每个都是解。</text>
</svg>
