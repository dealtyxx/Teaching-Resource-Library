<text x="86" y="724" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >解法1 · used[] 标记</text>
<text x="86" y="746" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >xᵢ 取任意未用元素，used[j] 跳过已用的 a[j]。</text>
<rect x="68" y="762" width="604" height="56" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="10" opacity="1" />
<text x="86" y="788" font-size="14.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >解法2 · 交换法</text>
<text x="86" y="810" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >swap(x[i],x[j])（j≥i）让 xᵢ 取遍后续元素，回溯再换回。</text>
<rect x="720" y="632" width="640" height="200" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="746" y="672" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >复杂度与地位</text>
<rect x="748" y="698" width="584" height="52" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="1040.0" y="730" font-size="17" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">T(n) = O(n · n!)</text>
<text x="750" y="774" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >排列树是 5.11~5.13 的通用框架：</text>
<text x="750" y="798" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >n 皇后、任务分配、旅行商都在排列树上回溯 + 剪支。</text>
