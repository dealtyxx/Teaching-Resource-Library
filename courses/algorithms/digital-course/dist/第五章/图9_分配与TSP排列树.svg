</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >排列树最优化：任务分配与旅行商</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >排列树 + 最优性剪支（限界函数）（5.12 / 5.13）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第5章 回溯法</text>
<rect x="40" y="128" width="660" height="508" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >任务分配问题</text>
<text x="210" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >求最小总成本</text>
<text x="255.0" y="216" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >任务0</text>
<text x="305.0" y="216" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >任务1</text>
<text x="355.0" y="216" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >任务2</text>
<text x="405.0" y="216" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >任务3</text>
<text x="160" y="216" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle"   >成本 c</text>
<text x="184" y="254.0" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >人0</text>
<rect x="230" y="224" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="255.0" y="255.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >9</text>
<rect x="280" y="224" width="50" height="50" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="5" opacity="1" />
<text x="305.0" y="255.0" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >2</text>
<rect x="330" y="224" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="355.0" y="255.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >7</text>
<rect x="380" y="224" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="405.0" y="255.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >8</text>
<text x="184" y="304.0" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >人1</text>
<rect x="230" y="274" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="255.0" y="305.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >6</text>
<rect x="280" y="274" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="305.0" y="305.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >4</text>
<rect x="330" y="274" width="50" height="50" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="5" opacity="1" />
<text x="355.0" y="305.0" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<rect x="380" y="274" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="405.0" y="305.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >7</text>
<text x="184" y="354.0" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >人2</text>
<rect x="230" y="324" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="255.0" y="355.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >5</text>
<rect x="280" y="324" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="305.0" y="355.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >8</text>
<rect x="330" y="324" width="50" height="50" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="5" opacity="1" />
<text x="355.0" y="355.0" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >1</text>
<rect x="380" y="324" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="405.0" y="355.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >8</text>
<text x="184" y="404.0" font-size="11.5" fill="#52514e" font-weight="600" text-anchor="middle"   >人3</text>
<rect x="230" y="374" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="255.0" y="405.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >7</text>
<rect x="280" y="374" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="305.0" y="405.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >6</text>
<rect x="330" y="374" width="50" height="50" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1" rx="5" opacity="1" />
<text x="355.0" y="405.0" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >9</text>
<rect x="380" y="374" width="50" height="50" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="5" opacity="1" />
<text x="405.0" y="405.0" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >4</text>
<text x="454" y="324" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   >各行</text>
<text x="454" y="342" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   >最小</text>
<rect x="68" y="444" width="604" height="48" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="10" opacity="1" />
<text x="86" y="474" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >解 x 是排列，xᵢ=人员 i 分到的任务；目标 min Σ c[i][x[i]]</text>
<rect x="68" y="500" width="604" height="96" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="528" font-size="14.5" fill="#b0491d" font-weight="700" text-anchor="start"   >最优性剪支（下界函数）</text>
<text x="86" y="554" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">bound = 当前成本 + Σ(后续各行未用任务的最小值)</text>
<text x="86" y="578" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >仅扩展 bound(cost, i+1) &lt; bestc 的孩子</text>
<text x="70" y="616" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >解空间树 = 排列树；T(n) = O(n²·n!)</text>
<rect x="720" y="128" width="640" height="508" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="746" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >旅行商问题 TSP</text>
<text x="956" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >求最短回路，起点 s 固定</text>
<path d="M 824 244 L 926 244" stroke="#4a3aa7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 974 244 L 1076 244" stroke="#4a3aa7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 1124 244 L 1236 244" stroke="#4a3aa7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 1260 270 C 1260 324, 800 324, 800 270" stroke="#eb6834" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" stroke-dasharray="5 4"/>
<text x="1030.0" y="340" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >回到起点 s（闭合回路）</text>
<circle cx="800" cy="244" r="24" fill="#3a2e86" stroke="#3a2e86" stroke-width="1.8" opacity="1"/>
<text x="800" y="250" font-size="14" fill="#fff" font-weight="700" text-anchor="middle"   >s</text>
<circle cx="950" cy="244" r="24" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.8" opacity="1"/>
<text x="950" y="250" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >x₁</text>
<circle cx="1100" cy="244" r="24" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.8" opacity="1"/>
<text x="1100" y="250" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >x₂</text>
<circle cx="1260" cy="244" r="24" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.8" opacity="1"/>
<text x="1260" y="250" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="middle"   >xₙ₋₁</text>
<text x="1040.0" y="204" font-size="13" fill="#52514e" font-weight="600" text-anchor="middle"   >x₁~xₙ₋₁ 是非 s 的 n−1 个顶点的排列</text>
<rect x="748" y="378" width="584" height="50" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="10" opacity="1" />
<text x="1040.0" y="409" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">叶子：回路长度 = d + A[x[n−1]][s]</text>
<rect x="748" y="440" width="584" height="96" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="468" font-size="14.5" fill="#b0491d" font-weight="700" text-anchor="start"   >最优性剪支（当前长度）</text>
<text x="766" y="494" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >试探 x[i]→x[j] 时，仅当</text>
<text x="766" y="518" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">d + A[x[i−1]][x[j]] &lt; bestd 才深入</text>
<text x="750" y="616" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >解空间树 = 排列树；T(n) = O(n·(n−1)!) = O(n!)</text>
<rect x="40" y="656" width="1320" height="130" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="696" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >共同原理</text>
<text x="70" y="724" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   >两者的解都是一个排列 → 在排列树上回溯，用最优性剪支（限界函数）裁掉不可能更优的分支。</text>
<text x="70" y="754" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >任务分配用“下界”与 bestc 比较；TSP 用“当前路径长度”与 bestd 比较。剪支越准，搜索越快。</text>
<rect x="1080" y="700" width="130.89" height="34" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="17.0" opacity="1" />
<text x="1145.445" y="722.22" font-size="14.5" fill="#3a2e86" font-weight="600" text-anchor="middle"   >排列树 + 最优性剪支</text>
</svg>
