<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >回溯法概述：解空间树</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >在解空间树中深度优先搜索 + 剪支（5.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第5章 回溯法</text>
<rect x="40" y="122" width="1320" height="82" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="156" font-size="17" fill="#1c5cab" font-weight="700" text-anchor="start"   >解空间</text>
<text x="140" y="156" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >解表示为解向量 x={x₀,x₁,…,xₙ₋₁}，分量 xᵢ∈Sᵢ 对应第 i 步的选择；所有取值组合构成解空间（树）。</text>
<text x="66" y="186" font-size="17" fill="#b0491d" font-weight="700" text-anchor="start"   >回溯法</text>
<text x="140" y="186" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >从根出发按深度优先搜索（DFS）逐步扩展，遇到不可行/非最优分支则剪去，回退到最近的活结点。</text>
<rect x="40" y="224" width="760" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="264" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >解空间树</text>
<text x="166" y="263" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >以选/不选二叉分支为例，高度 n+1</text>
<line x1="420" y1="338" x2="270" y2="396" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="420" y1="338" x2="570" y2="396" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
