<line x1="570" y1="432" x2="490" y2="498" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="570" y1="432" x2="650" y2="498" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="190" y1="534" x2="150" y2="610" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="190" y1="534" x2="230" y2="610" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="350" y1="534" x2="310" y2="610" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="350" y1="534" x2="390" y2="610" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="490" y1="534" x2="470" y2="610" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="490" y1="534" x2="550" y2="610" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
