<line x1="650" y1="534" x2="710" y2="610" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<text x="310" y="367.0" font-size="12" fill="#898781" font-weight="600" text-anchor="middle"   >x₀=1</text>
<text x="530" y="367.0" font-size="12" fill="#898781" font-weight="600" text-anchor="middle"   >x₀=0</text>
<circle cx="420" cy="320" r="18" fill="#3a2e86" stroke="#2a2170" stroke-width="1.6" opacity="1"/>
<circle cx="270" cy="414" r="18" fill="#eb6834" stroke="#b0491d" stroke-width="1.6" opacity="1"/>
<circle cx="570" cy="414" r="18" fill="#eef4fc" stroke="#1c5cab" stroke-width="1.6" opacity="1"/>
<circle cx="190" cy="516" r="18" fill="#eef4fc" stroke="#1c5cab" stroke-width="1.6" opacity="1"/>
