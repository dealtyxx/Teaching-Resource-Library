<circle cx="650" cy="516" r="18" fill="#eef4fc" stroke="#1c5cab" stroke-width="1.6" opacity="1"/>
<circle cx="150" cy="624" r="13" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<circle cx="230" cy="624" r="13" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<circle cx="310" cy="624" r="13" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<circle cx="390" cy="624" r="13" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<circle cx="470" cy="624" r="13" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<circle cx="550" cy="624" r="13" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<circle cx="630" cy="624" r="13" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<circle cx="710" cy="624" r="13" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" opacity="1"/>
<text x="420" y="290" font-size="12" fill="#3a2e86" font-weight="700" text-anchor="middle"   >根结点 i=0</text>
<text x="196" y="418" font-size="12" fill="#b0491d" font-weight="700" text-anchor="end"   >扩展结点</text>
<text x="596" y="418" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >活结点</text>
<text x="350" y="550" font-size="11.5" fill="#898781" font-weight="600" text-anchor="middle"   >死结点→回溯</text>
<text x="420.0" y="664" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="middle"   >叶子结点 = 候选解（共 2ⁿ 个）</text>
<path d="M 390 320 C 270 374, 160 486, 130 594" stroke="#4a3aa7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="100" y="474" font-size="13" fill="#4a3aa7" font-weight="700" text-anchor="start"   >DFS</text>
<rect x="820" y="224" width="540" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="846" y="264" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >核心思想</text>
<rect x="848" y="294" width="484" height="62" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="1090.0" y="332" font-size="22" fill="#b0491d" font-weight="700" text-anchor="middle"   >回溯法 = DFS + 剪支</text>
<rect x="848" y="372" width="484" height="118" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="866" y="400" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >三个结点概念</text>
<text x="866" y="428" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 活结点：已生成、孩子未全部生成</text>
<text x="866" y="452" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 扩展结点：正在生成孩子的结点</text>
<text x="866" y="476" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 死结点：孩子已全部生成 → 回溯</text>
<rect x="848" y="506" width="484" height="92" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="866" y="534" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >两类问题（本质相同）</text>
<text x="866" y="562" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 求所有解：满足约束函数的全部解</text>
<text x="866" y="586" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 求最优解：再加目标函数取最优</text>
<rect x="848" y="614" width="484" height="118" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="866" y="642" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start"   >求解一般步骤</text>
<text x="866" y="670" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >① 确定解空间（一定含问题的解）</text>
<text x="866" y="694" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >② 确定结点的扩展规则</text>
<text x="866" y="718" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >③ DFS 搜索，尽量剪支避免无效搜索</text>
<text x="866" y="816" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >先根遍历=DFS；层次遍历=BFS</text>
</svg>
