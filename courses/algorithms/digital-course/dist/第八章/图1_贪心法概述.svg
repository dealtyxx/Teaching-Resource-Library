<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="812" viewBox="0 0 1400 812" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="812" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >贪心法概述</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >每步都作当前看来最好的选择，逐步构造全局解（8.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第8章 贪心法</text>
<rect x="40" y="128" width="660" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >什么是贪心法</text>
<rect x="64" y="186" width="612" height="88" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start"   >从初始状态出发，依据「贪心准则」逐步构造，</text>
<text x="80" y="236" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start"   >每一步总是作当前看来最好的选择，</text>
<text x="80" y="260" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >决策一旦做出便不可更改（不回溯）。</text>
<text x="80" y="298" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >局部最优选择仅依赖以前的决策，不依赖以后的决策：</text>
<rect x="80" y="328" width="96" height="44" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.6" rx="9" opacity="1" />
<text x="128.0" y="355.0" font-size="13.5" fill="#52514e" font-weight="700" text-anchor="middle"   >初始</text>
<path d="M 176 350.0 L 194 356.0" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="198" y="334" width="96" height="44" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" rx="9" opacity="1" />
<text x="246.0" y="361.0" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >选 x₁</text>
<path d="M 294 356.0 L 312 350.0" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="316" y="328" width="96" height="44" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" rx="9" opacity="1" />
<text x="364.0" y="355.0" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >选 x₂</text>
<path d="M 412 350.0 L 430 356.0" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="434" y="334" width="96" height="44" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" rx="9" opacity="1" />
<text x="482.0" y="361.0" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >选 x₃</text>
<path d="M 530 356.0 L 548 350.0" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="552" y="328" width="96" height="44" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" rx="9" opacity="1" />
<text x="600.0" y="355.0" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="middle"   >目标</text>
<text x="80" y="394" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   >贪心准则（策略）：做出贪心决策的依据。</text>
<text x="80" y="444" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >贪心法求解问题应具有的两大性质：</text>
<rect x="64" y="458" width="300.0" height="148" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="84" y="486" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   >① 最优子结构性质</text>
<text x="84" y="512" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >问题的最优解所包含</text>
<text x="84" y="532" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >的子问题的解也是最</text>
<text x="84" y="552" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >优的。</text>
<rect x="84" y="568" width="260.0" height="26" fill="#d4f0e4" stroke="none" stroke-width="1" rx="6" opacity="1" />
<text x="96" y="585" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   >证明：反证法</text>
<rect x="376.0" y="458" width="300.0" height="148" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="396.0" y="486" font-size="14" fill="#b0491d" font-weight="700" text-anchor="start"   >② 贪心选择性质</text>
<text x="396.0" y="512" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >整体最优解可以通过</text>
<text x="396.0" y="532" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >一系列局部最优选择</text>
<text x="396.0" y="552" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >（贪心选择）得到。</text>
<rect x="396.0" y="568" width="260.0" height="26" fill="#f8ddc9" stroke="none" stroke-width="1" rx="6" opacity="1" />
<text x="408.0" y="585" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   >证明：数学归纳法</text>
<rect x="64" y="622" width="612" height="120" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="650" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   >一般求解过程</text>
<text x="80" y="676" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >① 建立数学模型来描述问题</text>
<text x="80" y="698" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >② 把求解的问题分成若干个子问题</text>
<text x="80" y="720" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >③ 对每一子问题求解，得到子问题的局部最优解</text>
<text x="80" y="742" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >④ 把子问题的局部最优解合成原问题的最优解</text>
<rect x="716" y="128" width="644" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="742" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >算法框架 与 对比</text>
<rect x="740" y="186" width="596" height="190" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="758" y="212" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">SolutionType greedy(SType a[], int n) {</text>
<text x="758" y="232" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  SolutionType x = {};      // 解向量，初始为空</text>
<text x="758" y="252" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  for (int i=0; i&lt;n; i++) {</text>
<text x="758" y="272" font-size="12" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">    xi = Select(a);         // 选当前最好的分量</text>
<text x="758" y="292" font-size="12" fill="#b0491d" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">    if (Feasible(xi))       // 判断 xi 是否可行</text>
<text x="758" y="312" font-size="12" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">      x = Union(x, xi);     // 合并 xi 到 x</text>
<text x="758" y="332" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  }</text>
<text x="758" y="352" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  return x;                 // 返回最优解</text>
<text x="758" y="372" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="740" y="400" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >三个关键操作：</text>
<rect x="866" y="386" width="150" height="30" fill="#e9f7f1" stroke="#127a56" stroke-width="1.1" rx="8" opacity="1" />
<text x="878" y="406" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">Select</text>
<text x="878" y="424" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="start"   >选当前最优分量</text>
<rect x="1026" y="386" width="150" height="30" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.1" rx="8" opacity="1" />
<text x="1038" y="406" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">Feasible</text>
<text x="1038" y="424" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="start"   >判断是否可行</text>
<rect x="1186" y="386" width="150" height="30" fill="#eef4fc" stroke="#1c5cab" stroke-width="1.1" rx="8" opacity="1" />
<text x="1198" y="406" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">Union</text>
<text x="1198" y="424" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="start"   >并入当前解</text>
<rect x="740" y="442" width="596" height="300" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="756" y="470" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start"   >贪心法 与 动态规划</text>
<line x1="756" y1="484" x2="1320" y2="484" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt" />
<rect x="756" y="496" width="276.0" height="34" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="8" opacity="1" />
<text x="897.0" y="518" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >贪心法</text>
<rect x="1048.0" y="496" width="276.0" height="34" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="8" opacity="1" />
<text x="1189.0" y="518" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="middle"   >动态规划</text>
<text x="764" y="546" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >•</text>
<text x="778" y="546" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >每步只作一个局部最优选择</text>
<text x="1056.0" y="546" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >•</text>
<text x="1070.0" y="546" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >考虑所有子问题的解</text>
<text x="764" y="586" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >•</text>
<text x="778" y="586" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >选择依赖已做决策，不依赖未来</text>
<text x="1056.0" y="586" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >•</text>
<text x="1070.0" y="586" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >由子问题最优解推出大问题</text>
<text x="764" y="626" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >•</text>
<text x="778" y="626" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >一路向前，不回溯</text>
<text x="1056.0" y="626" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >•</text>
<text x="1070.0" y="626" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >可回溯 / 记录并复用子问题</text>
<text x="764" y="666" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >•</text>
<text x="778" y="666" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >需证明贪心选择性质</text>
<text x="1056.0" y="666" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >•</text>
<text x="1070.0" y="666" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >需满足最优子结构 + 重叠子问题</text>
<text x="764" y="706" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >•</text>
<text x="778" y="706" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >通常更快 O(n log n)</text>
<text x="1056.0" y="706" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >•</text>
<text x="1070.0" y="706" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   >通常 O(nW)、O(n²) 等</text>
</svg>
