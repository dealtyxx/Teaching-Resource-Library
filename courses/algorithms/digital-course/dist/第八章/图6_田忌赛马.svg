<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >田忌赛马问题</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >双方各 n 匹马排序后，用双指针贪心决定出场（8.4）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第8章 贪心法</text>
<rect x="40" y="128" width="620" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >贪心决策（a、b 均递增排序）</text>
<text x="66" y="190" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >a=田忌, b=齐威王；指针 lefta/righta, leftb/rightb。赢 +200，输 −200，平 0。</text>
<rect x="64" y="210" width="572" height="118" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="12" opacity="1" />
<rect x="64" y="210" width="8" height="118" fill="#127a56" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="84" y="240" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">① a[ra] &gt; b[rb]</text>
<text x="84" y="266" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >田忌最快 &gt; 齐威王最快</text>
<text x="84" y="290" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >→ 两最快对决，田忌赢</text>
<rect x="510" y="226" width="62" height="30" fill="#ffffff" stroke="#127a56" stroke-width="1.3" rx="8" opacity="1" />
<text x="541" y="246" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >+200</text>
<text x="484" y="306" font-size="10.5" fill="#898781" font-weight="600" text-anchor="end"   font-family="ui-monospace,monospace">ra--, rb--</text>
<rect x="64" y="336" width="572" height="118" fill="#fdeceb" stroke="#b3201f" stroke-width="1.3" rx="12" opacity="1" />
<rect x="64" y="336" width="8" height="118" fill="#b3201f" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="84" y="366" font-size="13.5" fill="#b3201f" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">② a[ra] &lt; b[rb]</text>
<text x="84" y="392" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >田忌最快 &lt; 齐威王最快</text>
<text x="84" y="416" font-size="12.5" fill="#b3201f" font-weight="700" text-anchor="start"   >→ 田忌最慢 垫 齐威王最快，输</text>
<rect x="510" y="352" width="62" height="30" fill="#ffffff" stroke="#b3201f" stroke-width="1.3" rx="8" opacity="1" />
<text x="541" y="372" font-size="13" fill="#b3201f" font-weight="700" text-anchor="middle"   >−200</text>
<text x="484" y="432" font-size="10.5" fill="#898781" font-weight="600" text-anchor="end"   font-family="ui-monospace,monospace">la++, rb--</text>
<rect x="64" y="462" width="572" height="118" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="12" opacity="1" />
<rect x="64" y="462" width="8" height="118" fill="#127a56" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="84" y="492" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">③ a[ra] = b[rb] 且 a[la] &gt; b[lb]</text>
<text x="84" y="518" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >最快相同，田忌最慢 &gt; 齐威王最慢</text>
<text x="84" y="542" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >→ 两最慢对决，田忌赢</text>
<rect x="510" y="478" width="62" height="30" fill="#ffffff" stroke="#127a56" stroke-width="1.3" rx="8" opacity="1" />
<text x="541" y="498" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >+200</text>
<text x="484" y="558" font-size="10.5" fill="#898781" font-weight="600" text-anchor="end"   font-family="ui-monospace,monospace">la++, lb++</text>
<rect x="64" y="588" width="572" height="118" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.3" rx="12" opacity="1" />
<rect x="64" y="588" width="8" height="118" fill="#c3c2b7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="84" y="618" font-size="13.5" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">④ a[ra] = b[rb] 且 a[la] ≤ b[lb]</text>
<text x="84" y="644" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >最快相同，田忌最慢不占优</text>
<text x="84" y="668" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start"   >→ 田忌最慢 垫 齐威王最快</text>
<rect x="510" y="604" width="62" height="30" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.3" rx="8" opacity="1" />
<text x="541" y="624" font-size="13" fill="#52514e" font-weight="700" text-anchor="middle"   >输/平</text>
<text x="484" y="684" font-size="10.5" fill="#898781" font-weight="600" text-anchor="end"   font-family="ui-monospace,monospace">la++, rb--</text>
<rect x="676" y="128" width="684" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="702" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >示例</text>
<text x="758" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >n=3, a={92,83,71}, b={95,87,74}</text>
<text x="706" y="194" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">排序后：a = {71, 83, 92}，b = {74, 87, 95}</text>
<text x="716" y="250" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >田忌 a</text>
<rect x="806" y="224" width="96" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" rx="8" opacity="1" />
<text x="854" y="250" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">71</text>
<rect x="964" y="224" width="96" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" rx="8" opacity="1" />
<text x="1012" y="250" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">83</text>
<rect x="1122" y="224" width="96" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" rx="8" opacity="1" />
<text x="1170" y="250" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">92</text>
<text x="716" y="364" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >齐威王 b</text>
<rect x="806" y="338" width="96" height="40" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.6" rx="8" opacity="1" />
<text x="854" y="364" font-size="15" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">74</text>
<rect x="964" y="338" width="96" height="40" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.6" rx="8" opacity="1" />
<text x="1012" y="364" font-size="15" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">87</text>
<rect x="1122" y="338" width="96" height="40" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.6" rx="8" opacity="1" />
<text x="1170" y="364" font-size="15" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">95</text>
<path d="M 854 264 L 1170 338" stroke="#e34948" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  stroke-dasharray="5 4"/>
<rect x="996.0" y="289.0" width="32" height="22" fill="#ffffff" stroke="#e34948" stroke-width="1" rx="6" opacity="0.95" />
<text x="1012.0" y="305.0" font-size="12" fill="#e34948" font-weight="700" text-anchor="middle"   >输</text>
<path d="M 1170 264 L 1012 338" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="1075.0" y="289.0" width="32" height="22" fill="#ffffff" stroke="#127a56" stroke-width="1" rx="6" opacity="0.95" />
<text x="1091.0" y="305.0" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >赢</text>
<path d="M 1012 264 L 854 338" stroke="#127a56" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<rect x="917.0" y="289.0" width="32" height="22" fill="#ffffff" stroke="#127a56" stroke-width="1" rx="6" opacity="0.95" />
<text x="933.0" y="305.0" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >赢</text>
<rect x="700" y="408" width="636" height="168" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="716" y="434" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >双指针过程</text>
<text x="716" y="460" font-size="12.5" fill="#b3201f" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">92 &lt; 95</text>
<text x="826" y="460" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >田忌最快&lt;齐威王最快 → 71 垫 95，输</text>
<text x="1320" y="460" font-size="12.5" fill="#b3201f" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">−200</text>
<text x="716" y="494" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">92 &gt; 87</text>
<text x="826" y="494" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >田忌最快&gt;齐威王最快 → 92 对 87，赢</text>
<text x="1320" y="494" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">+200</text>
<text x="716" y="528" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">83 &gt; 74</text>
<text x="826" y="528" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >田忌最快&gt;齐威王最快 → 83 对 74，赢</text>
<text x="1320" y="528" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">+200</text>
<line x1="716" y1="550" x2="1320" y2="550" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt" />
<text x="716" y="574" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">累计：−200 + 200 + 200 = 200</text>
<rect x="700" y="590" width="636" height="50" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="1018.0" y="620" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >田忌获得的最多银币数 = 200</text>
<text x="716" y="668" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   >复杂度：排序 O(n log n) + 一趟双指针 O(n)。</text>
</svg>
