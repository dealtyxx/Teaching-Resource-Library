<text x="70" y="748" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >规则：首个活动必选；此后只选起始时间 s ≥ 上一所选活动结束时间的活动（不相交）。</text>
<rect x="842" y="128" width="518" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="868" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >策略与实现</text>
<rect x="866" y="186" width="470" height="72" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="882" y="212" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >兼容 = 两区间不相交</text>
<text x="882" y="236" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">sᵢ ≥ eⱼ  或  sⱼ ≥ eᵢ</text>
<rect x="866" y="270" width="470" height="66" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="882" y="296" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >贪心策略</text>
<text x="882" y="320" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >总选最早结束的兼容活动 → 给后续</text>
<text x="1192" y="320" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >留最多时间</text>
<rect x="866" y="348" width="470" height="150" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="882" y="374" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >核心循环（排序后）</text>
<text x="882" y="400" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">preend = A[0].e;  flag[0]=true;  ans=1;</text>
<text x="882" y="420" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (i=1; i&lt;n; i++)</text>
<text x="882" y="440" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (A[i].s &gt;= preend) {   // 兼容</text>
<text x="882" y="460" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    flag[i]=true; ans++;</text>
<text x="882" y="480" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    preend = A[i].e;</text>
<text x="882" y="500" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  }</text>
<rect x="866" y="510" width="470" height="74" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="882" y="536" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >最大兼容活动集合</text>
<rect x="882" y="548" width="96" height="28" fill="#ffffff" stroke="#127a56" stroke-width="1.4" rx="8" opacity="1" />
<text x="930" y="567" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >活动1</text>
<rect x="990" y="548" width="96" height="28" fill="#ffffff" stroke="#127a56" stroke-width="1.4" rx="8" opacity="1" />
<text x="1038" y="567" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >活动4</text>
<rect x="1098" y="548" width="96" height="28" fill="#ffffff" stroke="#127a56" stroke-width="1.4" rx="8" opacity="1" />
<text x="1146" y="567" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >活动8</text>
<rect x="1206" y="548" width="96" height="28" fill="#ffffff" stroke="#127a56" stroke-width="1.4" rx="8" opacity="1" />
<text x="1254" y="567" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >活动11</text>
<text x="1320" y="536" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="end"   >共 4 个</text>
<rect x="866" y="596" width="470" height="44" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="10" opacity="1" />
<text x="882" y="623" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   >复杂度：主要花在排序 → O(n log n)</text>
<rect x="866" y="650" width="470" height="90" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="882" y="676" font-size="13" fill="#4a3aa7" font-weight="700" text-anchor="start"   >应用 · 无重叠区间（LintCode1242）</text>
<text x="882" y="701" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >求最多兼容区间数 ans，则移除的最小数量</text>
<text x="882" y="723" font-size="11.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">= n − ans（例 {[1,2),[2,3),[3,4),[1,3)} → 移 1 个）</text>
</svg>
