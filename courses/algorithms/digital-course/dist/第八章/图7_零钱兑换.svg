<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >零钱兑换问题 · 贪心与反例</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >尽量选面额大的硬币；但贪心并非总能得到最优（8.5）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第8章 贪心法</text>
<rect x="40" y="128" width="620" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >贪心策略</text>
<text x="166" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >面额为 c 的幂次时可行</text>
<rect x="64" y="186" width="572" height="66" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >策略：尽可能选面额大的硬币</text>
<text x="80" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >每步取 A/curm 枚当前最大面额，再换更小面额。</text>
<text x="80" y="284" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">例：c=2, k=3，面额 {1, 2, 4, 8}，A = 23</text>
<rect x="70" y="304" width="560" height="46" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1" rx="8" opacity="1" />
<text x="86" y="332" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">面额 8</text>
<text x="190" y="332" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">23 / 8 = 2 枚</text>
<text x="340" y="332" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">余 23−16 = 7</text>
<circle cx="544" cy="327" r="16" fill="#cdeede" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="544" y="332" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">8</text>
<circle cx="580" cy="327" r="16" fill="#cdeede" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="580" y="332" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">8</text>
<rect x="70" y="358" width="560" height="46" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1" rx="8" opacity="1" />
<text x="86" y="386" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">面额 4</text>
<text x="190" y="386" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">7 / 4 = 1 枚</text>
<text x="340" y="386" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">余 7−4 = 3</text>
<circle cx="544" cy="381" r="16" fill="#cdeede" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="544" y="386" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<rect x="70" y="412" width="560" height="46" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1" rx="8" opacity="1" />
<text x="86" y="440" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">面额 2</text>
<text x="190" y="440" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">3 / 2 = 1 枚</text>
<text x="340" y="440" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">余 3−2 = 1</text>
<circle cx="544" cy="435" r="16" fill="#cdeede" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="544" y="440" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<rect x="70" y="466" width="560" height="46" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1" rx="8" opacity="1" />
<text x="86" y="494" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">面额 1</text>
<text x="190" y="494" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">1 / 1 = 1 枚</text>
<text x="340" y="494" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">余 0</text>
<circle cx="544" cy="489" r="16" fill="#cdeede" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="544" y="494" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<rect x="64" y="536" width="572" height="54" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="568" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">共 2+1+1+1 = 5 枚（此币制下即最优）</text>
<rect x="64" y="604" width="572" height="116" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="630" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >代码要点</text>
<text x="80" y="654" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">curm = pow(c, k);        // 从最大面额起</text>
<text x="80" y="672" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">while (A &gt; 0) {</text>
<text x="80" y="690" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  curs = A / curm;  ans += curs;</text>
<text x="80" y="708" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  A -= curs * curm;  curm /= c;</text>
<text x="80" y="726" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="676" y="128" width="684" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="702" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >反例：贪心失效</text>
<text x="868" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >面额 {1, 4, 5, 10}，A = 18</text>
<rect x="700" y="186" width="636" height="44" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.2" rx="12" opacity="1" />
<text x="1018.0" y="213" font-size="13.5" fill="#b3201f" font-weight="700" text-anchor="middle"   >并非任何币制都能用贪心求最少硬币数！</text>
<text x="716" y="260" font-size="13.5" fill="#b3201f" font-weight="700" text-anchor="start"   >贪心解</text>
<circle cx="806" cy="266" r="20" fill="#fdeceb" stroke="#b3201f" stroke-width="2" opacity="1"/>
<text x="806" y="271" font-size="13" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">10</text>
<circle cx="854" cy="266" r="20" fill="#fdeceb" stroke="#b3201f" stroke-width="2" opacity="1"/>
<text x="854" y="271" font-size="13" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<circle cx="902" cy="266" r="20" fill="#fdeceb" stroke="#b3201f" stroke-width="2" opacity="1"/>
<text x="902" y="271" font-size="13" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<circle cx="950" cy="266" r="20" fill="#fdeceb" stroke="#b3201f" stroke-width="2" opacity="1"/>
<text x="950" y="271" font-size="13" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<circle cx="998" cy="266" r="20" fill="#fdeceb" stroke="#b3201f" stroke-width="2" opacity="1"/>
<text x="998" y="271" font-size="13" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<text x="1320" y="272" font-size="15" fill="#b3201f" font-weight="700" text-anchor="end"   >5 枚</text>
<text x="806" y="304" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">10 + 5 + 1 + 1 + 1 = 18</text>
<line x1="716" y1="328" x2="1320" y2="328" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt" />
<text x="716" y="362" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >最优解</text>
<circle cx="806" cy="368" r="20" fill="#cdeede" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="806" y="373" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">10</text>
<circle cx="854" cy="368" r="20" fill="#cdeede" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="854" y="373" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<circle cx="902" cy="368" r="20" fill="#cdeede" stroke="#127a56" stroke-width="2" opacity="1"/>
<text x="902" y="373" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<text x="1320" y="374" font-size="15" fill="#127a56" font-weight="700" text-anchor="end"   >3 枚</text>
<text x="806" y="406" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">10 + 4 + 4 = 18</text>
<rect x="700" y="434" width="636" height="120" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="716" y="460" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >为什么贪心会错？</text>
<text x="716" y="486" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >贪心先取 10，剩 8 时被迫用 5+1+1+1；</text>
<text x="716" y="508" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >而放弃「贪」用两个 4 反而更省。</text>
<text x="716" y="532" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   >面额不是「拟阵/规范币制」时，局部最优 ≠ 全局最优。</text>
<rect x="700" y="568" width="636" height="154" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="716" y="594" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   >结论</text>
<text x="716" y="620" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >• 贪心法快（O(k)），但只对特定币制正确。</text>
<text x="716" y="644" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >• 使用前需证明「贪心选择性质」成立。</text>
<text x="716" y="668" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >• 一般面额求最少硬币数 → 用动态规划</text>
<text x="716" y="690" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >  （完全背包，见第 7 章），保证最优。</text>
</svg>
