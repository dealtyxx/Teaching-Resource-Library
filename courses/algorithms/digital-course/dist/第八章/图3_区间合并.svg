</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >区间合并</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >按左端点递增排序，相交则合并并取最大右端点（8.2.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第8章 贪心法</text>
<rect x="40" y="128" width="500" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >策略与两种情况</text>
<rect x="64" y="186" width="452" height="62" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >贪心策略</text>
<text x="80" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >按左端点排序；合并时取最大右端点，</text>
<text x="80" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   ></text>
<text x="370" y="236" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >并入更多区间</text>
<rect x="64" y="266" width="452" height="96" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="292" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">(a) 不相交：ans.back().end &lt; curs</text>
<rect x="96" y="310" width="120" height="22" fill="#eef4fc" stroke="#1c5cab" stroke-width="1.6" rx="6" opacity="1" />
<text x="156" y="325" font-size="10.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >ans.back</text>
<rect x="290" y="310" width="120" height="22" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.6" rx="6" opacity="1" />
<text x="350" y="325" font-size="10.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >区间 i</text>
<text x="80" y="354" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >→ 开启新的合并区间（把区间 i 加入 ans）</text>
<rect x="64" y="374" width="452" height="108" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="400" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">(b) 相交：ans.back().end ≥ curs</text>
<rect x="96" y="418" width="150" height="22" fill="#cdeede" stroke="#127a56" stroke-width="1.6" rx="6" opacity="1" />
<text x="171" y="433" font-size="10.5" fill="#127a56" font-weight="700" text-anchor="middle"   >ans.back</text>
<rect x="210" y="444" width="150" height="22" fill="#cdeede" stroke="#127a56" stroke-width="1.6" rx="6" opacity="1" />
<text x="285" y="459" font-size="10.5" fill="#127a56" font-weight="700" text-anchor="middle"   >区间 i</text>
<text x="80" y="474" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">→ 合并：end = max(ans.back().end, cure)</text>
<rect x="64" y="494" width="452" height="224" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="520" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >核心代码（按 start 排序后）</text>
<text x="80" y="546" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">sort(intervals, by start);</text>
<text x="80" y="562" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">ans.push_back(intervals[0]);</text>
<text x="80" y="578" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (i=1; i&lt;n; i++) {</text>
<text x="80" y="594" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  curs=intervals[i].start;</text>
<text x="80" y="610" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  cure=intervals[i].end;</text>
<text x="80" y="626" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (ans.back().end &lt; curs)   // 不相交</text>
<text x="80" y="642" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    ans.push_back({curs,cure});</text>
<text x="80" y="658" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  else                         // 相交合并</text>
<text x="80" y="674" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    ans.back().end =</text>
<text x="80" y="690" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">        max(ans.back().end, cure);</text>
<text x="80" y="706" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="556" y="128" width="804" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="582" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >示例</text>
