  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >最少会议室</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >按开始时间排序 + 小根堆维护各会议室最早空闲时间（8.2.3）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第8章 贪心法</text>
<rect x="40" y="128" width="640" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >问题与时间线</text>
<text x="210" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >intervals = {[0,30),[5,10),[15,20)}</text>
<rect x="64" y="186" width="592" height="70" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >贪心策略</text>
<text x="80" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >优先安排最早开始的会议；尽可能多的兼容会议共用一间。</text>
<line x1="130" y1="296" x2="640" y2="296" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<line x1="130.0" y1="296" x2="130.0" y2="300" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt" />
<text x="130.0" y="288" font-size="10.5" fill="#898781" font-weight="600" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<line x1="215.0" y1="296" x2="215.0" y2="300" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt" />
<text x="215.0" y="288" font-size="10.5" fill="#898781" font-weight="600" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<line x1="300.0" y1="296" x2="300.0" y2="300" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt" />
<text x="300.0" y="288" font-size="10.5" fill="#898781" font-weight="600" text-anchor="middle"   font-family="ui-monospace,monospace">10</text>
<line x1="385.0" y1="296" x2="385.0" y2="300" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt" />
<text x="385.0" y="288" font-size="10.5" fill="#898781" font-weight="600" text-anchor="middle"   font-family="ui-monospace,monospace">15</text>
<line x1="470.0" y1="296" x2="470.0" y2="300" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt" />
<text x="470.0" y="288" font-size="10.5" fill="#898781" font-weight="600" text-anchor="middle"   font-family="ui-monospace,monospace">20</text>
<line x1="555.0" y1="296" x2="555.0" y2="300" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt" />
<text x="555.0" y="288" font-size="10.5" fill="#898781" font-weight="600" text-anchor="middle"   font-family="ui-monospace,monospace">25</text>
<line x1="640.0" y1="296" x2="640.0" y2="300" stroke="#c3c2b7" stroke-width="1" stroke-linecap="butt" />
<text x="640.0" y="288" font-size="10.5" fill="#898781" font-weight="600" text-anchor="middle"   font-family="ui-monospace,monospace">30</text>
<text x="80" y="358" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >会议室 1</text>
<line x1="130" y1="394" x2="640" y2="394" stroke="#eeeee8" stroke-width="1" stroke-linecap="butt" />
<text x="80" y="428" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   >会议室 2</text>
<line x1="130" y1="464" x2="640" y2="464" stroke="#eeeee8" stroke-width="1" stroke-linecap="butt" />
<rect x="130.0" y="336" width="510.0" height="34" fill="#eef4fc" stroke="#1c5cab" stroke-width="1.8" rx="8" opacity="1" />
<text x="385.0" y="358" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">[0,30)</text>
<rect x="215.0" y="406" width="85.0" height="34" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.8" rx="8" opacity="1" />
<text x="257.5" y="428" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">[5,10)</text>
<rect x="385.0" y="406" width="85.0" height="34" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.8" rx="8" opacity="1" />
<text x="427.5" y="428" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">[15,20)</text>
<rect x="64" y="548" width="592" height="78" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="574" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   >为什么是 2 间？</text>
<text x="80" y="598" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >[0,30) 与 [5,10) 在时刻 5~10 重叠 → 至少 2 间；</text>
<text x="80" y="618" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >[15,20) 可复用会议室 2（[5,10) 已于 10 结束）。</text>
<rect x="64" y="636" width="592" height="88" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="662" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   >O(n²) 朴素法</text>
<text x="80" y="686" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >flag 标记；对每个未安排会议 i，把其后所有与之</text>
<text x="80" y="706" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >兼容且未安排的会议 j 依次排入同一会议室。</text>
<rect x="696" y="128" width="664" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="722" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >小根堆过程</text>
<text x="844" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >堆存各会议室的结束时间</text>
<rect x="720" y="194" width="616" height="92" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<circle cx="744" cy="220" r="13" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"/>
<text x="744" y="225" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle"   >1</text>
<text x="768" y="225" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">处理会议 [0,30)</text>
<text x="744" y="250" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >堆空 → 开新会议室，30 进堆</text>
<text x="744" y="274" font-size="12" fill="#898781" font-weight="700" text-anchor="start"   >堆：</text>
<rect x="786" y="260" width="42" height="22" fill="#ffffff" stroke="#b7d3f6" stroke-width="1.3" rx="6" opacity="1" />
<text x="807" y="276" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">30</text>
<rect x="720" y="298" width="616" height="92" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<circle cx="744" cy="324" r="13" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"/>
<text x="744" y="329" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle"   >2</text>
<text x="768" y="329" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">处理会议 [5,10)</text>
<text x="744" y="354" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >5 &lt; 堆顶 30 → 冲突，开新会议室，10 进堆</text>
<text x="744" y="378" font-size="12" fill="#898781" font-weight="700" text-anchor="start"   >堆：</text>
<rect x="786" y="364" width="42" height="22" fill="#ffffff" stroke="#b7d3f6" stroke-width="1.3" rx="6" opacity="1" />
<text x="807" y="380" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">10</text>
<rect x="836" y="364" width="42" height="22" fill="#ffffff" stroke="#b7d3f6" stroke-width="1.3" rx="6" opacity="1" />
<text x="857" y="380" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">30</text>
<rect x="720" y="402" width="616" height="92" fill="#e9f7f1" stroke="#127a56" stroke-width="1.6" rx="12" opacity="1" />
<circle cx="744" cy="428" r="13" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="744" y="433" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle"   >3</text>
<text x="768" y="433" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">处理会议 [15,20)</text>
<text x="744" y="458" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >15 ≥ 堆顶 10 → 兼容，复用：10 出堆、20 进堆</text>
<text x="744" y="482" font-size="12" fill="#898781" font-weight="700" text-anchor="start"   >堆：</text>
<rect x="786" y="468" width="42" height="22" fill="#ffffff" stroke="#127a56" stroke-width="1.3" rx="6" opacity="1" />
<text x="807" y="484" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">20</text>
<rect x="836" y="468" width="42" height="22" fill="#ffffff" stroke="#127a56" stroke-width="1.3" rx="6" opacity="1" />
<text x="857" y="484" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">30</text>
<rect x="720" y="518" width="616" height="34" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="10" opacity="1" />
<text x="1028.0" y="540" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >堆中元素个数 = 会议室数量 = 2</text>
<rect x="720" y="562" width="616" height="162" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="736" y="588" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >优先队列实现（小根堆 minpq）</text>
<text x="736" y="614" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">sort(intervals, by start);</text>
<text x="736" y="630" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">minpq.push(intervals[0].end);</text>
<text x="736" y="646" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (i=1; i&lt;n; i++) {</text>
<text x="736" y="662" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (intervals[i].start &gt;= minpq.top())</text>
<text x="736" y="678" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">    minpq.pop();          // 兼容，复用</text>
<text x="736" y="694" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  minpq.push(intervals[i].end);</text>
<text x="736" y="710" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}  return minpq.size();   // O(n log n)</text>
</svg>
