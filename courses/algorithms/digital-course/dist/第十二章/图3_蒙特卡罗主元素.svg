<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >蒙特卡罗算法 · 主元素</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >随机取一个元素测它是否为主元素；偏真算法，多次调用把错误概率压到 2⁻ᵏ（例12.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第12章 概率算法与近似算法</text>
<rect x="40" y="128" width="560" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >问题与蒙特卡罗思想</text>
<rect x="64" y="186" width="512" height="84" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >主元素（LintCode46）</text>
<text x="80" y="238" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >数组 nums 中出现次数 &gt; n/2 的元素。</text>
<text x="80" y="260" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   >题目保证非空数组中一定存在主元素。</text>
<text x="80" y="302" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >示例 {3, 2, 3}：n=3，阈值 n/2 = 1.5</text>
<rect x="80" y="316" width="52" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.6" rx="10" opacity="1" />
<text x="106" y="348" font-size="20" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<rect x="142" y="316" width="52" height="52" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.6" rx="10" opacity="1" />
<text x="168" y="348" font-size="20" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<rect x="204" y="316" width="52" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.6" rx="10" opacity="1" />
<text x="230" y="348" font-size="20" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<text x="280" y="334" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >元素 3 出现 2 次</text>
<text x="280" y="356" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">2 &gt; 1.5 → 主元素 = 3 ✓</text>
<rect x="64" y="384" width="512" height="148" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="410" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >蒙特卡罗判定 majority(a, maj)</text>
<text x="80" y="436" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >① 随机取一个下标 i，令 maj = a[i]；</text>
<text x="80" y="460" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >② 统计 maj 在数组中出现次数 cnt；</text>
<text x="80" y="484" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >③ 返回 cnt &gt; n/2 是否成立。</text>
<text x="80" y="514" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   >选中的恰是主元素时才返回 true。</text>
<rect x="64" y="546" width="512" height="174" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="572" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >偏真（true-biased）算法</text>
<text x="80" y="598" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >返回 true：maj 一定是主元素（解正确）。</text>
<text x="80" y="622" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >返回 false：maj 不是主元素，但数组中</text>
<text x="80" y="644" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >        不一定没有主元素（解可能漏）。</text>
<text x="80" y="674" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >存在主元素时以概率 &gt; 1/2 返回 true；</text>
<text x="80" y="698" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >只要一次返回 true 即得正确解 → 反复调用。</text>
<rect x="620" y="128" width="740" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >算法 与 错误概率</text>
<rect x="644" y="184" width="692" height="214" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="664" y="210" font-size="11.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">bool majority(vector&lt;int&gt;&amp;a, int &amp;maj){</text>
<text x="664" y="225.6" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  int n=a.size();  int i=randa(0,n-1);</text>
<text x="664" y="241.2" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  maj=a[i];  int cnt=0;</text>
<text x="664" y="256.8" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  for(int j=0;j&lt;n;j++)</text>
<text x="664" y="272.40000000000003" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">    if(a[j]==maj) cnt++;   // 数 maj 的出现次数</text>
<text x="664" y="288.00000000000006" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  return cnt &gt; n/2;          // 偏真判定</text>
<text x="664" y="303.6000000000001" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="664" y="319.2000000000001" font-size="11.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">bool solve(vector&lt;int&gt;&amp;a,int&amp;maj,int k){</text>
<text x="664" y="334.8000000000001" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  for(int i=0;i&lt;k;i++)       // 最多调用 k 次</text>
<text x="664" y="350.40000000000015" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">    if(majority(a,maj)) return true;</text>
<text x="664" y="366.00000000000017" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  return false;</text>
<text x="664" y="381.6000000000002" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="644" y="412" width="692" height="308" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="438" font-size="13.5" fill="#b3406e" font-weight="700" text-anchor="start"   >调用 k 次的错误概率 &lt; 2⁻ᵏ</text>
<text x="660" y="462" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >单次错误 &lt; 1/2；两次 p+(1−p)p &gt; 3/4，错误 &lt; 1/4 …</text>
<line x1="670" y1="648" x2="1320" y2="648" stroke="#c3c2b7" stroke-width="1.4" stroke-linecap="butt" />
<rect x="680" y="522.0" width="66" height="126.0" fill="#fdeef4" stroke="#b3406e" stroke-width="1.3" rx="6" opacity="1" />
<text x="713.0" y="666" font-size="11" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">k=1</text>
<text x="713.0" y="514.0" font-size="10.5" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1/2</text>
<rect x="776" y="585.0" width="66" height="63.0" fill="#fdeef4" stroke="#b3406e" stroke-width="1.3" rx="6" opacity="1" />
<text x="809.0" y="666" font-size="11" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">k=2</text>
<text x="809.0" y="577.0" font-size="10.5" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1/4</text>
<rect x="872" y="616.5" width="66" height="31.5" fill="#fdeef4" stroke="#b3406e" stroke-width="1.3" rx="6" opacity="1" />
<text x="905.0" y="666" font-size="11" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">k=3</text>
<text x="905.0" y="608.5" font-size="10.5" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1/8</text>
<rect x="968" y="632.25" width="66" height="15.75" fill="#fdeef4" stroke="#b3406e" stroke-width="1.3" rx="6" opacity="1" />
<text x="1001.0" y="666" font-size="11" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">k=4</text>
<text x="1001.0" y="624.25" font-size="10.5" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1/16</text>
<rect x="1064" y="640.125" width="66" height="7.875" fill="#fdeef4" stroke="#b3406e" stroke-width="1.3" rx="6" opacity="1" />
<text x="1097.0" y="666" font-size="11" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">k=5</text>
<text x="1097.0" y="632.125" font-size="10.5" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1/32</text>
<rect x="1160" y="644.0625" width="66" height="3.9375" fill="#fdeef4" stroke="#b3406e" stroke-width="1.3" rx="6" opacity="1" />
<text x="1193.0" y="666" font-size="11" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">k=6</text>
<text x="1193.0" y="636.0625" font-size="10.5" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1/64</text>
<text x="1316" y="500" font-size="11.5" fill="#b3406e" font-weight="700" text-anchor="end"   >误差随调用次数指数下降</text>
<rect x="660" y="668" width="660" height="40" fill="#ffffff" stroke="#f3c1d3" stroke-width="1.2" rx="10" opacity="1" />
<text x="676" y="693" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">给定 ε：取 k = ⌈log₂(1/ε)⌉。ε=0.001 → k=10，错误概率 &lt; 0.001。</text>
</svg>
