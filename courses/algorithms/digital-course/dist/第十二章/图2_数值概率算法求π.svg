<text x="987.0" y="602" font-size="13" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3.1272</text>
<rect x="1060" y="580" width="118" height="34" fill="#ffffff" stroke="#f3c1ac" stroke-width="1.2" rx="8" opacity="1" />
<text x="1119.0" y="602" font-size="13" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3.0936</text>
<rect x="1192" y="580" width="118" height="34" fill="#ffffff" stroke="#f3c1ac" stroke-width="1.2" rx="8" opacity="1" />
<text x="1251.0" y="602" font-size="13" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3.1492</text>
<rect x="644" y="646" width="692" height="74" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="672" font-size="13.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >数值概率算法的特征</text>
<text x="660" y="698" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >结果依赖 rand01()，每次不同，均为近似解；</text>
<text x="660" y="716" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >增大 n 或多次平均可提高精度（π 的真值 3.14159…）。</text>
</svg>
