<text x="94" y="633" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >落入圆内（计数 m）</text>
<circle cx="290" cy="628" r="6" fill="#eb6834" stroke="#ffffff" stroke-width="1.4" opacity="1"/>
<text x="304" y="633" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >落在圆外</text>
<rect x="64" y="656" width="512" height="72" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="682" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >示意投点（真实算法投 n=10000 次）</text>
<text x="80" y="708" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >点越多，m/n 越接近 π/4，估计越精确。</text>
<rect x="620" y="128" width="740" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >原理 · 算法 · 结果</text>
<rect x="644" y="184" width="692" height="118" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="210" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >几何原理</text>
<text x="660" y="236" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >边长 2 的正方形内切一个半径 1 的圆：</text>
<text x="660" y="260" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >圆面积 = π，正方形面积 = 4，比 = π/4。</text>
<text x="660" y="286" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">投 n 次落入圆内 m 次 → π/4 ≈ m/n → π ≈ 4m/n。</text>
<rect x="644" y="316" width="692" height="210" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="342" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >算法（以右上象限模拟）</text>
<text x="664" y="366" font-size="11.5" fill="#4a3aa7" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">double rand01() {            // 产生 [0,1] 随机数</text>
<text x="664" y="381.2" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  return randa(0,100)*1.0/100;</text>
<text x="664" y="396.4" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="664" y="411.59999999999997" font-size="11.5" fill="#4a3aa7" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">double solve() {             // 求 π 的概率算法</text>
<text x="664" y="426.79999999999995" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  int n=10000, m=0;  double x,y;</text>
<text x="664" y="441.99999999999994" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  for (int i=1;i&lt;=n;i++) {</text>
<text x="664" y="457.19999999999993" font-size="11.5" fill="#4a3aa7" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">    x=rand01();  y=rand01();</text>
<text x="664" y="472.3999999999999" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">    if (x*x+y*y&lt;=1.0) m++;    // 落入内切圆</text>
<text x="664" y="487.5999999999999" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  }</text>
<text x="664" y="502.7999999999999" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">  return 4.0*m/n;            // π ≈ 4m/n</text>
<text x="664" y="517.9999999999999" font-size="11.5" fill="#52514e" font-weight="500" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="644" y="540" width="692" height="92" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
