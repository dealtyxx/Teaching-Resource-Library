<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >概率算法概述</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >允许在执行中随机选择下一步；随机性有时比最优选择更省时（12.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第12章 概率算法与近似算法</text>
<rect x="40" y="128" width="560" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >什么是概率算法</text>
<rect x="64" y="186" width="512" height="72" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="212" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   >概率算法（随机算法）：执行过程中允许</text>
<text x="80" y="236" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >随机地选择下一个计算步骤，常能降低复杂度。</text>
<rect x="64" y="278" width="512" height="130" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="304" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >两个特点</text>
<text x="80" y="330" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >① 不可再现性：同一输入每次执行结果可能不同</text>
<text x="96" y="352" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >（如 n 皇后，不同运行得到不同的正确解）</text>
<text x="80" y="378" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >② 算法分析困难：需概率论、统计学、数论知识</text>
<rect x="64" y="424" width="512" height="130" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="450" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >随机数发生器（线性同余法）</text>
<text x="80" y="478" font-size="13" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a₀ = d</text>
<text x="80" y="502" font-size="13" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">aₙ = (b·aₙ₋₁ + c) mod m,  n=1,2,…</text>
<text x="80" y="532" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">C++ 中：x[i] = rand() % (b−a+1) + a;  // [a,b] 随机整数</text>
<rect x="64" y="570" width="512" height="150" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="596" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >为什么用随机？</text>
<text x="80" y="622" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >面临选择时，随机选择往往比「求最优选择」省时；</text>
<text x="80" y="646" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >在很多问题上能大幅降低时间复杂度，</text>
<text x="80" y="670" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >或把最坏情况的性能拉近到平均情况。</text>
<text x="80" y="700" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >代价：结果带随机性，需用概率来刻画正确性 / 效率。</text>
<rect x="620" y="128" width="740" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >四类概率算法</text>
<rect x="644" y="188" width="692" height="122" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<rect x="644" y="188" width="8" height="122" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="664" y="220" font-size="15" fill="#2a78d6" font-weight="700" text-anchor="start"   >数值概率算法</text>
<rect x="1140" y="204" width="103.3" height="26" fill="#ffffff" stroke="#b7d3f6" stroke-width="1.2" rx="13.0" opacity="1" />
<text x="1191.65" y="221.14" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle"   >解总能得到，但为近似</text>
<text x="664" y="250" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >近似解，精度随计算时间不断提高</text>
<text x="664" y="280" font-size="12" fill="#2a78d6" font-weight="700" text-anchor="start"   >例：求 π（投镖模拟）</text>
<rect x="644" y="320" width="692" height="122" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<rect x="644" y="320" width="8" height="122" fill="#b0491d" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="664" y="352" font-size="15" fill="#b0491d" font-weight="700" text-anchor="start"   >蒙特卡罗算法</text>
<rect x="1140" y="336" width="81.91" height="26" fill="#ffffff" stroke="#f3c1ac" stroke-width="1.2" rx="13.0" opacity="1" />
<text x="1180.955" y="353.14" font-size="11.5" fill="#b0491d" font-weight="600" text-anchor="middle"   >可能给出错误解</text>
<text x="664" y="382" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >高概率给出正确解，但无法验证是否正确</text>
<text x="664" y="412" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   >例：主元素（偏真，多次调用降错误率）</text>
<rect x="644" y="452" width="692" height="122" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.3" rx="12" opacity="1" />
<rect x="644" y="452" width="8" height="122" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="664" y="484" font-size="15" fill="#4a3aa7" font-weight="700" text-anchor="start"   >拉斯维加斯算法</text>
<rect x="1140" y="468" width="96.17" height="26" fill="#ffffff" stroke="#cbc4ee" stroke-width="1.2" rx="13.0" opacity="1" />
<text x="1188.085" y="485.14" font-size="11.5" fill="#4a3aa7" font-weight="600" text-anchor="middle"   >解总正确，可能失败</text>
<text x="664" y="514" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >一旦找到解一定正确，但有时找不到</text>
<text x="664" y="544" font-size="12" fill="#4a3aa7" font-weight="700" text-anchor="start"   >例：n 皇后（反复重试直到成功）</text>
<rect x="644" y="584" width="692" height="122" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<rect x="644" y="584" width="8" height="122" fill="#127a56" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="664" y="616" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >舍伍德算法</text>
<rect x="1140" y="600" width="96.17" height="26" fill="#ffffff" stroke="#a9e0cb" stroke-width="1.2" rx="13.0" opacity="1" />
<text x="1188.085" y="617.14" font-size="11.5" fill="#127a56" font-weight="600" text-anchor="middle"   >总正确 + 总有解</text>
<text x="664" y="646" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >总能求得解，且解总是正确的</text>
<text x="664" y="676" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >例：随机快速选择（消除好坏实例差异）</text>
</svg>
