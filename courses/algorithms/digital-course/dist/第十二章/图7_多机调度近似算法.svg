</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >多机调度问题的近似算法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >贪心：把作业分配给最先空闲的机器；近似性能比 η ≤ 2（12.2.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第12章 概率算法与近似算法</text>
<rect x="40" y="128" width="560" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >问题 · 策略 · 近似比</text>
<rect x="64" y="186" width="512" height="96" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >问题（NP 完全）</text>
<text x="80" y="238" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >n 个独立作业、m 台相同机器，作业 i 需时 tᵢ；</text>
<text x="80" y="262" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >不可中断、不可拆分。求最短工期（makespan）。</text>
<rect x="64" y="294" width="512" height="106" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="320" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >贪心策略（解法1）</text>
<text x="80" y="346" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >依次把每个作业分配给「当前加工总时间最小」</text>
<text x="80" y="370" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >（最先空闲）的机器 → 用小根堆维护，O(n·log m)。</text>
<text x="80" y="392" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >解法2（LPT）：先按时间递减排序再贪心，通常更优。</text>
<rect x="64" y="412" width="512" height="214" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="438" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >近似性能比 η ≤ 2 的证明要点</text>
<text x="80" y="466" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >两个最优工期下界：</text>
<text x="96" y="490" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">① L* ≥ (Σⱼ tⱼ) / m   （平均分配下界）</text>
<text x="96" y="514" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">② L* ≥ maxⱼ tⱼ        （最大作业下界）</text>
<text x="80" y="542" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >设贪心工期 L 由机器 i 决定，最后放入作业 j：</text>
<text x="96" y="566" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">分配前 i 最小 → Lᵢ−tⱼ ≤ (Σt)/m ≤ L*</text>
<text x="96" y="590" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">又 tⱼ ≤ L*  →  L = Lᵢ ≤ L* + L* = 2L*</text>
<text x="80" y="614" font-size="11.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >故 η = L / L* ≤ 2（此界不能再小，近似比为 2）。</text>
<rect x="64" y="638" width="512" height="82" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="664" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >本例 7 作业 / 3 机器（Σt=80）</text>
<text x="80" y="688" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">下界 ⌈80/3⌉=27，最优 L*=27；贪心 L=35，</text>
<text x="80" y="710" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">η = 35/27 ≈ 1.30 ≤ 2（满足近似比保证）。</text>
