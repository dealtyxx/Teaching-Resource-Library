<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >0/1 背包问题的近似算法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >贪心：按单位重量价值 v/w 递减装包，再与最大单个物品比较；近似比 η ≤ 2（12.2.3）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第12章 概率算法与近似算法</text>
<rect x="40" y="128" width="560" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >问题 · 贪心策略 · 近似比</text>
<rect x="64" y="186" width="512" height="96" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="212" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >问题（NP 完全）</text>
<text x="80" y="238" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >n 个物品，重量 wᵢ、价值 vᵢ，背包容量 W。</text>
<text x="80" y="262" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >每个物品选或不选，求不超重的最大价值。</text>
<rect x="64" y="294" width="512" height="78" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="320" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >贪心策略</text>
<text x="80" y="346" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >优先选取「单位重量价值 v/w 最大」且能装入的物品。</text>
<rect x="64" y="384" width="512" height="150" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="410" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >算法三步</text>
<text x="80" y="436" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >① 全部物品按 v/w 递减排序；</text>
<text x="80" y="460" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >② 按序把能装入的物品放进背包 → 可行解 bestv；</text>
<text x="80" y="484" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >③ 求能装入的单个物品最大价值 maxv，</text>
<text x="96" y="508" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">置 bestv = max(bestv, maxv)  ← 关键修正项</text>
<rect x="64" y="546" width="512" height="96" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="572" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >近似性能比 η ≤ 2</text>
<text x="80" y="598" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >设最优价值 L*、近似解 L。第 ③ 步保证 L ≥ maxv，</text>
<text x="80" y="622" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">可证 L*/L ≤ 2 → 近似比为 2（此界紧）。</text>
<rect x="64" y="654" width="512" height="66" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="680" font-size="12.5" fill="#b3406e" font-weight="700" text-anchor="start"   >为什么要第 ③ 步？</text>
<text x="80" y="704" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >只按 v/w 贪心可能错过「一个大价值物品」，加它兜底。</text>
<rect x="620" y="128" width="740" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >实例：4 物品，W = 6</text>
<rect x="650" y="194" width="78" height="30" fill="#eef2f7" stroke="#b7d3f6" stroke-width="1" rx="6" opacity="1" />
<text x="689.0" y="214" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">序号 i</text>
<rect x="730" y="194" width="96" height="30" fill="#eef2f7" stroke="#b7d3f6" stroke-width="1" rx="6" opacity="1" />
<text x="778.0" y="214" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">物品 no</text>
<rect x="828" y="194" width="78" height="30" fill="#eef2f7" stroke="#b7d3f6" stroke-width="1" rx="6" opacity="1" />
<text x="867.0" y="214" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">w</text>
<rect x="908" y="194" width="78" height="30" fill="#eef2f7" stroke="#b7d3f6" stroke-width="1" rx="6" opacity="1" />
<text x="947.0" y="214" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">v</text>
<rect x="988" y="194" width="96" height="30" fill="#eef2f7" stroke="#b7d3f6" stroke-width="1" rx="6" opacity="1" />
<text x="1036.0" y="214" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">v/w</text>
<rect x="1086" y="194" width="150" height="30" fill="#eef2f7" stroke="#b7d3f6" stroke-width="1" rx="6" opacity="1" />
<text x="1161.0" y="214" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">选择</text>
<rect x="650" y="228" width="78" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="689.0" y="249" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<rect x="730" y="228" width="96" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="778.0" y="249" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0</text>
<rect x="828" y="228" width="78" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="867.0" y="249" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<rect x="908" y="228" width="78" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="947.0" y="249" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">7</text>
<rect x="988" y="228" width="96" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="1036.0" y="249" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2.33</text>
<rect x="1086" y="228" width="150" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="1096" y="249" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">✓ 装入  rw:6→3</text>
<rect x="650" y="262" width="78" height="32" fill="#ffffff" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="689.0" y="283" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<rect x="730" y="262" width="96" height="32" fill="#ffffff" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="778.0" y="283" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1</text>
<rect x="828" y="262" width="78" height="32" fill="#ffffff" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="867.0" y="283" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">4</text>
<rect x="908" y="262" width="78" height="32" fill="#ffffff" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="947.0" y="283" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">9</text>
<rect x="988" y="262" width="96" height="32" fill="#ffffff" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="1036.0" y="283" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2.25</text>
<rect x="1086" y="262" width="150" height="32" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1" rx="6" opacity="1" />
<text x="1096" y="283" font-size="11.5" fill="#b3406e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">✗ 装不下(4&gt;3)</text>
<rect x="650" y="296" width="78" height="32" fill="#ffffff" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="689.0" y="317" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<rect x="730" y="296" width="96" height="32" fill="#ffffff" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="778.0" y="317" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<rect x="828" y="296" width="78" height="32" fill="#ffffff" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="867.0" y="317" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5</text>
<rect x="908" y="296" width="78" height="32" fill="#ffffff" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="947.0" y="317" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">10</text>
<rect x="988" y="296" width="96" height="32" fill="#ffffff" stroke="#e1e0d9" stroke-width="1" rx="6" opacity="1" />
<text x="1036.0" y="317" font-size="11.5" fill="#52514e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2.00</text>
<rect x="1086" y="296" width="150" height="32" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1" rx="6" opacity="1" />
<text x="1096" y="317" font-size="11.5" fill="#b3406e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">✗ 装不下(5&gt;3)</text>
<rect x="650" y="330" width="78" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="689.0" y="351" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">3</text>
<rect x="730" y="330" width="96" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="778.0" y="351" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<rect x="828" y="330" width="78" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="867.0" y="351" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<rect x="908" y="330" width="78" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="947.0" y="351" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2</text>
<rect x="988" y="330" width="96" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="1036.0" y="351" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1.00</text>
<rect x="1086" y="330" width="150" height="32" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="6" opacity="1" />
<text x="1096" y="351" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">✓ 装入  rw:3→1</text>
<rect x="644" y="376" width="692" height="104" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="402" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >② 顺序装包（贪心阶段）</text>
<text x="660" y="428" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">bestv=0 → 取 no0(+7)=7, rw=3 → no1/no3 装不下</text>
<text x="660" y="452" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">→ 取 no2(+2)=9, rw=1  ⟹  bestv = 9</text>
<text x="660" y="474" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="start"   >（no 为原物品编号；序号 3 对应物品 no2）</text>
<rect x="644" y="490" width="692" height="78" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="516" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >③ 单个物品兜底</text>
<text x="660" y="542" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">单个物品都可装(w≤6)，maxv=10（物品 no3）</text>
<text x="1020" y="542" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">→ bestv=max(9,10)=10</text>
<rect x="644" y="578" width="692" height="142" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="660" y="604" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >近似解 与 最优解</text>
<text x="660" y="632" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">近似算法结果 L = bestv = 10。</text>
<text x="660" y="658" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">真正最优 L* = 11（选物品 no1+no2：w=6, v=9+2=11）。</text>
<text x="660" y="684" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">η = L*/L = 11/10 = 1.1 ≤ 2 ✓</text>
<text x="660" y="708" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >多项式时间得到有质量保证的次优解。</text>
</svg>
