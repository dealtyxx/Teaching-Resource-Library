<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >两个有序序列的中位数</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >比较两序列的中位数，对称舍弃等长段（例4.5）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第4章 分治法</text>
<rect x="40" y="128" width="1320" height="344" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >对称弃半原理</text>
<text x="210" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >a=(1,3,4,6,9)  b=(2,3,5,8,10)</text>
<text x="100" y="258" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start"   >a</text>
<rect x="360" y="224" width="82" height="52" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.2" rx="9" opacity="1" />
<text x="401.0" y="257" font-size="19" fill="#b3201f" font-weight="700" text-anchor="middle"   >1</text>
<rect x="450" y="224" width="82" height="52" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.2" rx="9" opacity="1" />
<text x="491.0" y="257" font-size="19" fill="#b3201f" font-weight="700" text-anchor="middle"   >3</text>
<rect x="540" y="224" width="82" height="52" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.5" rx="9" opacity="1" />
<text x="581.0" y="257" font-size="19" fill="#b0491d" font-weight="700" text-anchor="middle"   >4</text>
<text x="581.0" y="216" font-size="11" fill="#b0491d" font-weight="700" text-anchor="middle"   >中位数</text>
<rect x="630" y="224" width="82" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="9" opacity="1" />
<text x="671.0" y="257" font-size="19" fill="#127a56" font-weight="700" text-anchor="middle"   >6</text>
<rect x="720" y="224" width="82" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="9" opacity="1" />
<text x="761.0" y="257" font-size="19" fill="#127a56" font-weight="700" text-anchor="middle"   >9</text>
<text x="100" y="350" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start"   >b</text>
<rect x="360" y="316" width="82" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="9" opacity="1" />
<text x="401.0" y="349" font-size="19" fill="#127a56" font-weight="700" text-anchor="middle"   >2</text>
<rect x="450" y="316" width="82" height="52" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="9" opacity="1" />
<text x="491.0" y="349" font-size="19" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<rect x="540" y="316" width="82" height="52" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.5" rx="9" opacity="1" />
<text x="581.0" y="349" font-size="19" fill="#b0491d" font-weight="700" text-anchor="middle"   >5</text>
<text x="581.0" y="308" font-size="11" fill="#b0491d" font-weight="700" text-anchor="middle"   >中位数</text>
<rect x="630" y="316" width="82" height="52" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.2" rx="9" opacity="1" />
<text x="671.0" y="349" font-size="19" fill="#b3201f" font-weight="700" text-anchor="middle"   >8</text>
<rect x="720" y="316" width="82" height="52" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.2" rx="9" opacity="1" />
<text x="761.0" y="349" font-size="19" fill="#b3201f" font-weight="700" text-anchor="middle"   >10</text>
<rect x="100" y="392" width="700" height="56" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="10" opacity="1" />
<text x="120" y="418" font-size="15" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a[m1]=4 &lt; b[m2]=5</text>
<text x="340" y="418" font-size="14" fill="#52514e" font-weight="600" text-anchor="start"   >→ 舍 a 前半（较小）与 b 后半（较大），等长</text>
<rect x="850" y="396" width="22" height="22" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.2" rx="0" opacity="1" />
<text x="880" y="412" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >各自中位数</text>
<rect x="1050" y="396" width="22" height="22" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.2" rx="0" opacity="1" />
<text x="1080" y="412" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >舍弃（等长）</text>
<rect x="850" y="428" width="22" height="22" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="0" opacity="1" />
<text x="880" y="444" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >保留，继续递归</text>
<text x="1050" y="444" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   >→ 合并中位数不变</text>
<rect x="40" y="490" width="640" height="288" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="530" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >三种情况</text>
<text x="166" y="529" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >a[m1] 与 b[m2] 比较</text>
<rect x="68" y="568" width="584" height="56" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="10" opacity="1" />
<rect x="68" y="568" width="8" height="56" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="88" y="592" font-size="15.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">① a[m1] = b[m2]</text>
<text x="88" y="614" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >该值即为所求中位数，结束</text>
<rect x="68" y="634" width="584" height="56" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<rect x="68" y="634" width="8" height="56" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="88" y="658" font-size="15.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">② a[m1] &lt; b[m2]</text>
<text x="88" y="680" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >舍 a 的前半 + b 的后半，递归</text>
<rect x="68" y="700" width="584" height="56" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="10" opacity="1" />
<rect x="68" y="700" width="8" height="56" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="88" y="724" font-size="15.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">③ a[m1] &gt; b[m2]</text>
<text x="88" y="746" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >舍 a 的后半 + b 的前半，递归</text>
<rect x="700" y="490" width="660" height="288" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="726" y="530" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >递归到单元素 · 复杂度</text>
<text x="730" y="564" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >递归直到两序列各剩 1 个元素，返回较小者。</text>
<rect x="728" y="588" width="604" height="60" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="1030.0" y="624" font-size="17" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">T(n)=T(n/2)+1  ⟹  O(log₂n)</text>
<rect x="728" y="662" width="604" height="88" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="746" y="690" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   >例</text>
<text x="780" y="690" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a=(11,13,15,17,19)  b=(2,4,6,8,20)</text>
<text x="746" y="718" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >合并有序序列的中位数 = 11</text>
<text x="746" y="740" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >（比暴力合并 O(n) 更快）</text>
</svg>
