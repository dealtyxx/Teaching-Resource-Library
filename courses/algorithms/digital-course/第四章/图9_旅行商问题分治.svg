<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="812" viewBox="0 0 1400 812" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="812" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >旅行商问题 · 分治法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >按“下一个要去的顶点”分解为子问题（4.8）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第4章 分治法</text>
<rect x="40" y="128" width="460" height="508" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >子问题定义</text>
<rect x="66" y="198" width="408" height="120" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="84" y="228" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(V, i)</text>
<text x="84" y="258" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >从起点 s 出发，经过顶点集</text>
<text x="84" y="282" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >V 中每个顶点各一次，最后</text>
<text x="84" y="306" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >到达顶点 i 的最短路径长度。</text>
<rect x="66" y="336" width="408" height="72" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="84" y="364" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >递归出口（V = ∅）</text>
<text x="84" y="392" font-size="16" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(∅, i) = A[s][i]</text>
<rect x="66" y="426" width="408" height="108" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="84" y="454" font-size="14.5" fill="#b0491d" font-weight="700" text-anchor="start"   >递归体（V ≠ ∅）</text>
<text x="84" y="486" font-size="15" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(V,i) =</text>
<text x="84" y="514" font-size="14" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  min { f(V−{j}, j) + A[j][i] }</text>
<text x="290" y="486" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">j ∈ V</text>
<text x="70" y="590" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >目标：f(V, s)，其中 V 为除起点 s</text>
<text x="70" y="612" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >外的全部顶点（回到 s）。</text>
<rect x="520" y="128" width="840" height="508" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="546" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >递归树</text>
<text x="624" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >4 个城市，起点 s=0</text>
<line x1="940" y1="242" x2="690" y2="316" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="940" y1="242" x2="940" y2="316" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="940" y1="242" x2="1190" y2="316" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="690" y1="360" x2="610" y2="456" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="690" y1="360" x2="770" y2="456" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="940" y1="360" x2="860" y2="456" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="940" y1="360" x2="1020" y2="456" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="1190" y1="360" x2="1110" y2="456" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<line x1="1190" y1="360" x2="1270" y2="456" stroke="#c3c2b7" stroke-width="1.6" stroke-linecap="butt" />
<rect x="865.0" y="198.0" width="150" height="44" fill="#f4f0fb" stroke="#cbc4ee" stroke-width="1.4" rx="9" opacity="1" />
<text x="940" y="217" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f({1,2,3},0)</text>
<text x="940" y="235" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 23</text>
<rect x="627.0" y="316.0" width="126" height="44" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="9" opacity="1" />
<text x="690" y="335" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f({2,3},1)</text>
<text x="690" y="353" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 17</text>
<rect x="877.0" y="316.0" width="126" height="44" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="9" opacity="1" />
<text x="940" y="335" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f({1,3},2)</text>
<text x="940" y="353" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 21</text>
<rect x="1127.0" y="316.0" width="126" height="44" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="9" opacity="1" />
<text x="1190" y="335" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f({1,2},3)</text>
<text x="1190" y="353" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 19</text>
<rect x="555.0" y="456.0" width="110" height="44" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="9" opacity="1" />
<text x="610" y="475" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f({3},2)</text>
<text x="610" y="493" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 44</text>
<rect x="715.0" y="456.0" width="110" height="44" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="9" opacity="1" />
<text x="770" y="475" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f({2},3)</text>
<text x="770" y="493" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 10</text>
<rect x="805.0" y="456.0" width="110" height="44" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="9" opacity="1" />
<text x="860" y="475" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f({3},1)</text>
<text x="860" y="493" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 43</text>
<rect x="965.0" y="456.0" width="110" height="44" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="9" opacity="1" />
<text x="1020" y="475" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f({1},3)</text>
<text x="1020" y="493" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 13</text>
<rect x="1055.0" y="456.0" width="110" height="44" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="9" opacity="1" />
<text x="1110" y="475" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f({2},1)</text>
<text x="1110" y="493" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 14</text>
<rect x="1215.0" y="456.0" width="110" height="44" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="9" opacity="1" />
<text x="1270" y="475" font-size="12.5" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">f({1},2)</text>
<text x="1270" y="493" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">= 16</text>
<text x="1040" y="222" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="middle"   >取 min</text>
<text x="940.0" y="528" font-size="13" fill="#898781" font-weight="normal" text-anchor="middle"   >每层去掉一个顶点，继续分解至 V=∅（f(∅,·)=A[0][·]）；子问题会重叠。</text>
<text x="940.0" y="556" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="middle"   >顶层结果 f({1,2,3},0) = 23</text>
<rect x="40" y="654" width="1320" height="138" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="694" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >复杂度</text>
<rect x="70" y="716" width="520" height="58" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="330" y="750" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">T(n)=n·T(n−1)+n²  ⟹  O(n!)</text>
<text x="630" y="736" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >大问题分解为 n 个规模 n−1 的子问题，每个转换耗时 O(n)。</text>
<text x="630" y="764" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >图含 n 个顶点 → 对应时间复杂度 O((n−1)!)；子问题重叠时可记忆化（Held–Karp）。</text>
</svg>
