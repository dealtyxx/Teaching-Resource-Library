<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="760" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >前缀和数组</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >O(n) 预处理，O(1) 求任意区间和（3.2.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第3章 穷举法</text>
<rect x="40" y="124" width="1320" height="432" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="164" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >定义与区间和公式</text>
<text x="320" y="242" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >前缀和 psum</text>
<text x="320" y="264" font-size="12" fill="#898781" font-weight="normal" text-anchor="start"   >psum[i]=a[0]+…+a[i−1]</text>
<rect x="446" y="216" width="48" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="7" opacity="1" />
<text x="470" y="242" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >0</text>
<text x="470" y="208" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >0</text>
<rect x="542" y="216" width="48" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="7" opacity="1" />
<text x="566" y="242" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >-3</text>
<text x="566" y="208" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >1</text>
<rect x="638" y="216" width="48" height="40" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="7" opacity="1" />
<text x="662" y="242" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >-2</text>
<text x="662" y="208" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >2</text>
<rect x="734" y="216" width="48" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="7" opacity="1" />
<text x="758" y="242" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >0</text>
<text x="758" y="208" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >3</text>
<rect x="830" y="216" width="48" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="7" opacity="1" />
<text x="854" y="242" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >-3</text>
<text x="854" y="208" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >4</text>
<rect x="926" y="216" width="48" height="40" fill="#e9f7f1" stroke="#127a56" stroke-width="1.3" rx="7" opacity="1" />
<text x="950" y="242" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >1</text>
<text x="950" y="208" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >5</text>
<text x="320" y="344" font-size="14.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >原数组 a</text>
<rect x="476" y="314" width="84" height="48" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="8" opacity="1" />
<text x="518.0" y="345" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >-3</text>
<text x="518.0" y="306" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[0]</text>
<rect x="572" y="314" width="84" height="48" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="8" opacity="1" />
<text x="614.0" y="345" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >1</text>
<text x="614.0" y="306" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[1]</text>
<rect x="668" y="314" width="84" height="48" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.3" rx="8" opacity="1" />
<text x="710.0" y="345" font-size="17" fill="#b0491d" font-weight="700" text-anchor="middle"   >2</text>
<text x="710.0" y="306" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[2]</text>
<rect x="764" y="314" width="84" height="48" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.3" rx="8" opacity="1" />
<text x="806.0" y="345" font-size="17" fill="#b0491d" font-weight="700" text-anchor="middle"   >-3</text>
<text x="806.0" y="306" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[3]</text>
<rect x="860" y="314" width="84" height="48" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.3" rx="8" opacity="1" />
<text x="902.0" y="345" font-size="17" fill="#b0491d" font-weight="700" text-anchor="middle"   >4</text>
<text x="902.0" y="306" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[4]</text>
<path d="M 668 372 L 668 382 L 944 382 L 944 372" stroke="#b0491d" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="806.0" y="406" font-size="15" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a[2..4] = psum[5] − psum[2] = 1 − (−2) = 3</text>
<line x1="662" y1="256" x2="662" y2="314" stroke="#127a56" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="3 3"/>
<line x1="950" y1="256" x2="950" y2="314" stroke="#127a56" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="3 3"/>
<rect x="70" y="454" width="620" height="78" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="90" y="484" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >递推关系（O(n) 求出）</text>
<text x="90" y="512" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">psum[0]=0 ；  psum[i]=psum[i−1]+a[i−1]  (i≥1)</text>
<rect x="710" y="454" width="620" height="78" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="730" y="484" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >区间和公式（O(1) 查询）</text>
<text x="730" y="512" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a[i..j] = psum[j+1] − psum[i]   (0≤i≤j≤n−1)</text>
<rect x="40" y="580" width="1320" height="150" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="620" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >应用：和为 0 的子数组</text>
<text x="342" y="619" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >例3.2</text>
<text x="70" y="654" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >两个相等的前缀和之间，子数组和必为 0：psum[i]=psum[j] ⟺ a[i..j−1]=0。</text>
<text x="70" y="684" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >本例中 psum[0]=psum[3]=0 → a[0..2]=(−3)+1+2=0，答案 {0, 2}。</text>
<text x="70" y="712" font-size="14.5" fill="#898781" font-weight="normal" text-anchor="start"   >用哈希表记录 (psum, 下标)，一次遍历即可 O(n) 求解。</text>
<rect x="1060" y="646" width="270" height="66" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="10" opacity="1" />
<text x="1195" y="676" font-size="15" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">psum[0] = psum[3] = 0</text>
<text x="1195" y="700" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >⟹ a[0..2] 之和为 0</text>
</svg>
