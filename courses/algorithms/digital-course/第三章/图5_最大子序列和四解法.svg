<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="828" viewBox="0 0 1400 828" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="828" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >最大连续子序列和 · 四种解法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >从 O(n³) 逐步优化到 O(n) 的过程（3.4）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第3章 穷举法</text>
<rect x="40" y="128" width="600" height="664" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >优化阶梯</text>
<rect x="68" y="200" width="544" height="138" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="12" opacity="1" />
<rect x="68" y="200" width="10" height="138" fill="#e34948" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="94" y="240" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start"   >解法1</text>
<rect x="492" y="220" width="92" height="34" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.2" rx="17" opacity="1" />
<text x="538.0" y="242" font-size="16" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">O(n³)</text>
<text x="94" y="274" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >三重循环枚举 a[i..j] 并逐个累加</text>
<text x="94" y="298" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >求和</text>
<path d="M 340.0 338 L 340.0 352" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="68" y="364" width="544" height="138" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="12" opacity="1" />
<rect x="68" y="364" width="10" height="138" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="94" y="404" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start"   >解法2</text>
<rect x="492" y="384" width="92" height="34" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="17" opacity="1" />
<text x="538.0" y="406" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">O(n²)</text>
<text x="94" y="438" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >前缀和：cursum = psum[j]</text>
<text x="94" y="462" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   > − psum[i]</text>
<path d="M 340.0 502 L 340.0 516" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="68" y="528" width="544" height="138" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="12" opacity="1" />
<rect x="68" y="528" width="10" height="138" fill="#eda100" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="94" y="568" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start"   >解法3</text>
<rect x="492" y="548" width="92" height="34" fill="#fdf3dd" stroke="#f0d38a" stroke-width="1.2" rx="17" opacity="1" />
<text x="538.0" y="570" font-size="16" fill="#8a5f00" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">O(n²)</text>
<text x="94" y="602" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >增量求和：cursum += a[j]，</text>
<text x="94" y="626" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >省去第三重循环</text>
<path d="M 340.0 666 L 340.0 680" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="68" y="692" width="544" height="138" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="12" opacity="1" />
<rect x="68" y="692" width="10" height="138" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="94" y="732" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start"   >解法4</text>
<rect x="492" y="712" width="92" height="34" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="17" opacity="1" />
<text x="538.0" y="734" font-size="16" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">O(n)</text>
<text x="94" y="766" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >Kadane：cursum&lt;0 即归零，</text>
<text x="94" y="790" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >一次遍历</text>
<rect x="660" y="128" width="700" height="664" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="686" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >解法4 · Kadane 原理</text>
<text x="1028" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >a = {−2, 11, −4, 13, −5, −2}</text>
<text x="690" y="242" font-size="13.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >序列 a</text>
<rect x="780" y="256" width="80" height="48" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="8" opacity="1" />
<text x="820.0" y="287" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >-2</text>
<text x="820.0" y="244" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[0]</text>
<rect x="870" y="256" width="80" height="48" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.3" rx="8" opacity="1" />
<text x="910.0" y="287" font-size="17" fill="#b0491d" font-weight="700" text-anchor="middle"   >11</text>
<text x="910.0" y="244" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[1]</text>
<rect x="960" y="256" width="80" height="48" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.3" rx="8" opacity="1" />
<text x="1000.0" y="287" font-size="17" fill="#b0491d" font-weight="700" text-anchor="middle"   >-4</text>
<text x="1000.0" y="244" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[2]</text>
<rect x="1050" y="256" width="80" height="48" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.3" rx="8" opacity="1" />
<text x="1090.0" y="287" font-size="17" fill="#b0491d" font-weight="700" text-anchor="middle"   >13</text>
<text x="1090.0" y="244" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[3]</text>
<rect x="1140" y="256" width="80" height="48" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="8" opacity="1" />
<text x="1180.0" y="287" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >-5</text>
<text x="1180.0" y="244" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[4]</text>
<rect x="1230" y="256" width="80" height="48" fill="#fbfbfa" stroke="#c3c2b7" stroke-width="1.3" rx="8" opacity="1" />
<text x="1270.0" y="287" font-size="17" fill="#52514e" font-weight="700" text-anchor="middle"   >-2</text>
<text x="1270.0" y="244" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle"   >a[5]</text>
<text x="690" y="338" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >cursum</text>
<text x="690" y="360" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >(以 a[i] 结尾)</text>
<rect x="780" y="352" width="80" height="44" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="8" opacity="1" />
<text x="820.0" y="381" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >-2</text>
<text x="820.0" y="418" font-size="11.5" fill="#b3201f" font-weight="600" text-anchor="middle"   >&lt;0 → 归零</text>
<rect x="870" y="352" width="80" height="44" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="8" opacity="1" />
<text x="910.0" y="381" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >11</text>
<rect x="960" y="352" width="80" height="44" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="8" opacity="1" />
<text x="1000.0" y="381" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >7</text>
<rect x="1050" y="352" width="80" height="44" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="8" opacity="1" />
<text x="1090.0" y="381" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >20</text>
<text x="1090.0" y="418" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   >峰值 20</text>
<rect x="1140" y="352" width="80" height="44" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="8" opacity="1" />
<text x="1180.0" y="381" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >15</text>
<rect x="1230" y="352" width="80" height="44" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="8" opacity="1" />
<text x="1270.0" y="381" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >13</text>
<path d="M 870 226 L 870 218 L 1130 218 L 1130 226" stroke="#b0491d" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="1000.0" y="210" font-size="14" fill="#b0491d" font-weight="700" text-anchor="middle"   >最大子序列 a[1..3] = 11−4+13 = 20</text>
<rect x="690" y="448" width="640" height="120" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="710" y="480" font-size="15.5" fill="#127a56" font-weight="700" text-anchor="start"   >核心思想</text>
<text x="710" y="510" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >cursum 表示“以当前元素结尾的最大子段和”。</text>
<text x="710" y="538" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >一旦 cursum &lt; 0，作为前缀只会拖累后续 → 立即归零重开。</text>
<rect x="690" y="588" width="640" height="158" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="710" y="616" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">maxsum = 0;  cursum = 0;</text>
<text x="710" y="638" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (i=0; i&lt;n; i++) {</text>
<text x="710" y="660" font-size="13.5" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">    cursum += a[i];</text>
<text x="710" y="682" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    if (cursum &gt;= maxsum) maxsum = cursum;</text>
<text x="710" y="704" font-size="13.5" fill="#b3201f" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">    if (cursum &lt; 0) cursum = 0;   // 归零</text>
<text x="710" y="726" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="1300" y="768" font-size="16" fill="#127a56" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">T(n) = O(n)</text>
</svg>
