<text x="662" y="690" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >置 q={0,1,…,n−1}，用 next_permutation 枚举排列（自动不同行、不同列），再检验对角线。T(n)=O(n²·n!)。</text>
