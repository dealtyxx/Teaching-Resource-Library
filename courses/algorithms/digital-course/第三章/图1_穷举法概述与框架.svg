<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="872" viewBox="0 0 1400 872" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="872" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >穷举法概述与算法框架</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >枚举所有情况，逐一按约束检验保留解（3.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第3章 穷举法</text>
<rect x="40" y="122" width="1320" height="84" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="156" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="start"   >穷举法（枚举法 / 列举法）</text>
<text x="66" y="188" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   >先确定穷举对象及其顺序，按顺序逐一列举每个对象的所有情况，再依约束条件检验哪些是解、哪些排除。</text>
<rect x="40" y="226" width="720" height="372" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="266" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >算法框架</text>
<text x="166" y="265" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >嵌套循环 + 约束检验</text>
<rect x="68" y="300" width="664" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="84" y="326" font-size="15.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >① 确定穷举对象与顺序</text>
<rect x="68" y="350" width="664" height="40" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="10" opacity="1" />
<text x="84" y="376" font-size="15.5" fill="#b0491d" font-weight="700" text-anchor="start"   >② 逐一列举所有情况</text>
<rect x="68" y="400" width="664" height="40" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="10" opacity="1" />
<text x="84" y="426" font-size="15.5" fill="#127a56" font-weight="700" text-anchor="start"   >③ 按约束检验、保留解</text>
<rect x="68" y="462" width="664" height="118" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="492" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for x in 值域X:</text>
<text x="340" y="492" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">        // 枚举对象 x</text>
<text x="86" y="518" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  for y in 值域Y:</text>
<text x="340" y="518" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      // 枚举对象 y</text>
<text x="86" y="544" font-size="15" fill="#b0491d" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">    if p(x, y):</text>
<text x="340" y="544" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      // 检验约束</text>
<text x="86" y="570" font-size="15" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">      输出一个解</text>
<rect x="780" y="226" width="580" height="372" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="806" y="266" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >特点与适用</text>
<rect x="806" y="296" width="528" height="68" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="824" y="324" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >主要解决两类问题</text>
<text x="824" y="350" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >“是否存在……”   与   “有多少种可能……”</text>
<circle cx="820" cy="386" r="4" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="836" y="390" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >理论上可解决可计算领域中的各种问题</text>
<circle cx="820" cy="420" r="4" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="836" y="424" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >逻辑清晰、程序简洁明了</text>
<circle cx="820" cy="454" r="4" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="836" y="458" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >一般无需专门证明算法正确性</text>
<circle cx="820" cy="488" r="4" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="836" y="492" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >可作为衡量更高效算法的时间性能底限</text>
<circle cx="820" cy="522" r="4" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="836" y="526" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >实际中用于问题规模不大的场合</text>
<rect x="40" y="620" width="1320" height="220" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="660" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >【例3.1】象棋算式</text>
<text x="298" y="659" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >不同棋子代表不同数字，求 m + n = s</text>
<text x="70" y="694" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >5 个棋子 → 5 个枚举变量（取值 0~9 且互不相等）：</text>
<rect x="80" y="712" width="92" height="56" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="10" opacity="1" />
<text x="126" y="738" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >兵</text>
<text x="126" y="760" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >a ∈ 0~9</text>
<rect x="188" y="712" width="92" height="56" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="10" opacity="1" />
<text x="234" y="738" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >炮</text>
<text x="234" y="760" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >b ∈ 0~9</text>
<rect x="296" y="712" width="92" height="56" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="10" opacity="1" />
<text x="342" y="738" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >马</text>
<text x="342" y="760" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >c ∈ 0~9</text>
<rect x="404" y="712" width="92" height="56" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="10" opacity="1" />
<text x="450" y="738" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >卒</text>
<text x="450" y="760" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >d ∈ 0~9</text>
<rect x="512" y="712" width="92" height="56" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="10" opacity="1" />
<text x="558" y="738" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >车</text>
<text x="558" y="760" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >e ∈ 0~9</text>
<text x="80" y="798" font-size="14.5" fill="#898781" font-weight="normal" text-anchor="start"   >5 重嵌套循环枚举 (a,b,c,d,e)，约束互不相等，检验 m+n=s：</text>
<rect x="740" y="708" width="590" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" rx="14" opacity="1" />
<text x="764" y="740" font-size="16" fill="#127a56" font-weight="700" text-anchor="start"   >答案</text>
<text x="830" y="740" font-size="15" fill="#52514e" font-weight="600" text-anchor="middle"   >兵</text>
<rect x="810" y="756" width="40" height="34" fill="#fff" stroke="#127a56" stroke-width="1.3" rx="8" opacity="1" />
<text x="830" y="780" font-size="17" fill="#127a56" font-weight="700" text-anchor="middle"   >5</text>
<text x="926" y="740" font-size="15" fill="#52514e" font-weight="600" text-anchor="middle"   >炮</text>
<rect x="906" y="756" width="40" height="34" fill="#fff" stroke="#127a56" stroke-width="1.3" rx="8" opacity="1" />
<text x="926" y="780" font-size="17" fill="#127a56" font-weight="700" text-anchor="middle"   >2</text>
<text x="1022" y="740" font-size="15" fill="#52514e" font-weight="600" text-anchor="middle"   >马</text>
<rect x="1002" y="756" width="40" height="34" fill="#fff" stroke="#127a56" stroke-width="1.3" rx="8" opacity="1" />
<text x="1022" y="780" font-size="17" fill="#127a56" font-weight="700" text-anchor="middle"   >4</text>
<text x="1118" y="740" font-size="15" fill="#52514e" font-weight="600" text-anchor="middle"   >卒</text>
<rect x="1098" y="756" width="40" height="34" fill="#fff" stroke="#127a56" stroke-width="1.3" rx="8" opacity="1" />
<text x="1118" y="780" font-size="17" fill="#127a56" font-weight="700" text-anchor="middle"   >0</text>
<text x="1214" y="740" font-size="15" fill="#52514e" font-weight="600" text-anchor="middle"   >车</text>
<rect x="1194" y="756" width="40" height="34" fill="#fff" stroke="#127a56" stroke-width="1.3" rx="8" opacity="1" />
<text x="1214" y="780" font-size="17" fill="#127a56" font-weight="700" text-anchor="middle"   >1</text>
</svg>
