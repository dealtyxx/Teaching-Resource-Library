<text x="830" y="514" font-size="12.5" fill="#b3201f" font-weight="700" text-anchor="middle"   >列1 与 (0,0) 同对角线 → 剪支</text>
<rect x="648" y="544" width="684" height="82" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="666" y="572" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >剪支 valid(i, q[i])</text>
<text x="666" y="598" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >放第 i 个皇后前检查是否与前 i 个冲突，冲突则不再深入。</text>
<rect x="648" y="638" width="684" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="666" y="666" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >复杂度</text>
<text x="666" y="694" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >排列树 O(n!) 个结点，每次 valid 耗时 O(n)</text>
<text x="666" y="720" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">T(n) = O(n · n!)（剪支后实际远小于此）</text>
