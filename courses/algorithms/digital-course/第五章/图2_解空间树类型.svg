<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="812" viewBox="0 0 1400 812" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="812" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >解空间树类型与复杂度</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >子集树 vs 排列树 —— 两种回溯框架（5.2 / 5.10）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第5章 回溯法</text>
<rect x="40" y="128" width="660" height="648" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >子集树</text>
<text x="144" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >从 n 个元素中找子集</text>
<line x1="370.0" y1="239" x2="220.0" y2="285" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="370.0" y1="239" x2="520.0" y2="285" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="220.0" y1="315" x2="150.0" y2="361" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="220.0" y1="315" x2="290.0" y2="361" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="520.0" y1="315" x2="450.0" y2="361" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="520.0" y1="315" x2="590.0" y2="361" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<circle cx="370.0" cy="224" r="15" fill="#3a2e86" stroke="#2a2170" stroke-width="1.5" opacity="1"/>
<circle cx="220.0" cy="300" r="15" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.5" opacity="1"/>
<circle cx="520.0" cy="300" r="15" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.5" opacity="1"/>
<circle cx="150.0" cy="376" r="15" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<circle cx="290.0" cy="376" r="15" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<circle cx="450.0" cy="376" r="15" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<circle cx="590.0" cy="376" r="15" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<text x="287.0" y="262.0" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="end"   >选</text>
<text x="453.0" y="262.0" font-size="12" fill="#898781" font-weight="700" text-anchor="start"   >不选</text>
<text x="370.0" y="414" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle"   >每个元素“选 / 不选” → 满二叉树，高度 n+1</text>
<rect x="68" y="440" width="604" height="190" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="468" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >子集树回溯框架</text>
<text x="86" y="494" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">void dfs(int i) {</text>
<text x="86" y="514" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  if (i&gt;=n) 产生一个解;</text>
<text x="86" y="534" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  else</text>
<text x="86" y="554" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    for (j=下界; j&lt;=上界; j++) {  // m 选一</text>
<text x="86" y="574" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      x[i]=j;</text>
<text x="86" y="594" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      if (constraint(i)&amp;&amp;bound(i)) dfs(i+1);</text>
<text x="86" y="614" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    }</text>
<text x="86" y="634" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<rect x="68" y="660" width="604" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="690" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >复杂度</text>
<text x="86" y="718" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >每层 c 选一（选/不选时 c=2）：</text>
<text x="86" y="744" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">T(n) = O(cⁿ)   （二叉时 O(2ⁿ)）</text>
<rect x="720" y="128" width="640" height="648" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="746" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >排列树</text>
<text x="824" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >确定 n 个元素的排列</text>
<line x1="1040.0" y1="235" x2="850.0" y2="275" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="1040.0" y1="235" x2="1040.0" y2="275" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="1040.0" y1="235" x2="1230.0" y2="275" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="850.0" y1="305" x2="800.0" y2="353" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="850.0" y1="305" x2="900.0" y2="353" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="1040.0" y1="305" x2="990.0" y2="353" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="1040.0" y1="305" x2="1090.0" y2="353" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="1230.0" y1="305" x2="1180.0" y2="353" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="1230.0" y1="305" x2="1280.0" y2="353" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<circle cx="1040.0" cy="220" r="15" fill="#3a2e86" stroke="#2a2170" stroke-width="1.5" opacity="1"/>
<circle cx="850.0" cy="290" r="15" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.5" opacity="1"/>
<circle cx="1040.0" cy="290" r="15" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.5" opacity="1"/>
<circle cx="1230.0" cy="290" r="15" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.5" opacity="1"/>
<circle cx="800.0" cy="368" r="13" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<circle cx="900.0" cy="368" r="13" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<circle cx="990.0" cy="368" r="13" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<circle cx="1090.0" cy="368" r="13" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<circle cx="1180.0" cy="368" r="13" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<circle cx="1280.0" cy="368" r="13" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<text x="842.0" y="255.0" font-size="11.5" fill="#3a2e86" font-weight="700" text-anchor="end"   >1</text>
<text x="1048.0" y="253.0" font-size="11.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >2</text>
<text x="1238.0" y="255.0" font-size="11.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >3</text>
<text x="1040.0" y="406" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle"   >第1层 n 选一，第2层 n−1 选一，…（去重不可复用）</text>
<rect x="748" y="432" width="584" height="190" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="460" font-size="14.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >排列树回溯框架</text>
<text x="766" y="486" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">void dfs(int i) {</text>
<text x="766" y="506" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  if (i&gt;=n) 产生一个解;</text>
<text x="766" y="526" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  else</text>
<text x="766" y="546" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    for (j=i; j&lt;n; j++) {   // 与后面每个交换</text>
<text x="766" y="566" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      swap(x[i],x[j]);</text>
<text x="766" y="586" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      if (constraint(i)&amp;&amp;bound(i)) dfs(i+1);</text>
<text x="766" y="606" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      swap(x[i],x[j]);      // 回溯</text>
<text x="766" y="626" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    }</text>
<rect x="748" y="660" width="584" height="96" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="690" font-size="14.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >复杂度</text>
<text x="766" y="718" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >第 k 层 (n−k) 选一：</text>
<text x="766" y="744" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">T(n) = O(n!)</text>
</svg>
