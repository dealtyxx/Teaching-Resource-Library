<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >剪支策略与子集和问题</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >在搜索中提早终止无效分支（5.1 / 5.6）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第5章 回溯法</text>
<rect x="40" y="128" width="560" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >三类剪支策略</text>
<text x="70" y="198" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >剪支：提早终止无效分支，减少搜索结点，</text>
<text x="70" y="220" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >但不影响最终结果，从而提升性能。</text>
<rect x="68" y="250" width="504" height="96" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<rect x="68" y="250" width="8" height="96" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="106" cy="284" r="18" fill="#fff" stroke="#2a78d6" stroke-width="1.5" opacity="1"/>
<text x="106" y="290" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >1</text>
<text x="140" y="290" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="start"   >可行性剪支</text>
<text x="140" y="316" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >剪去不满足约束条件的分支</text>
<rect x="68" y="362" width="504" height="96" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<rect x="68" y="362" width="8" height="96" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="106" cy="396" r="18" fill="#fff" stroke="#eb6834" stroke-width="1.5" opacity="1"/>
<text x="106" y="402" font-size="18" fill="#b0491d" font-weight="700" text-anchor="middle"   >2</text>
<text x="140" y="402" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="start"   >最优性剪支</text>
<text x="140" y="428" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >用限界函数剪去得不到最优解的分</text>
<text x="140" y="450" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >支</text>
<rect x="68" y="474" width="504" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<rect x="68" y="474" width="8" height="96" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="106" cy="508" r="18" fill="#fff" stroke="#1baf7a" stroke-width="1.5" opacity="1"/>
<text x="106" y="514" font-size="18" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<text x="140" y="514" font-size="18" fill="#0b0b0b" font-weight="700" text-anchor="start"   >交换搜索顺序</text>
<text x="140" y="540" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >改变搜索顺序（如排序）以减少总</text>
<text x="140" y="562" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >结点</text>
<text x="70" y="742" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >回溯法 = DFS + 剪支；剪得越多，越快。</text>
<rect x="620" y="128" width="740" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="646" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >子集和问题的左 / 右剪支</text>
<text x="944" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >a=(3,1,5,2)，t=8</text>
<circle cx="990.0" cy="246" r="30" fill="#eb6834" stroke="#b0491d" stroke-width="1.8" opacity="1"/>
<text x="990.0" y="252" font-size="14" fill="#fff" font-weight="700" text-anchor="middle"   >cs=6</text>
<text x="990.0" y="202" font-size="13" fill="#52514e" font-weight="600" text-anchor="middle"   >扩展结点：i=2, a[2]=5, 余下和 rs=7</text>
<path d="M 966.0 268 L 780 366" stroke="#e34948" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<circle cx="750" cy="396" r="26" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.6" opacity="1"/>
<text x="750" y="401" font-size="13" fill="#b3201f" font-weight="700" text-anchor="middle"   >选5</text>
<text x="800.0" y="321.0" font-size="22" fill="#e34948" text-anchor="middle">✗</text>
<text x="750" y="442" font-size="12.5" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">cs+a[i]=6+5=11 &gt; 8</text>
<text x="750" y="462" font-size="13" fill="#b3201f" font-weight="700" text-anchor="middle"   >左剪支</text>
<path d="M 1014.0 268 L 1200 366" stroke="#127a56" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="1230" cy="396" r="26" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.6" opacity="1"/>
<text x="1230" y="401" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >不选5</text>
<text x="1230" y="442" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">cs+rs'=6+2=8 ≥ 8</text>
<text x="1230" y="462" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   >保留</text>
<rect x="648" y="500" width="684" height="100" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.2" rx="12" opacity="1" />
<text x="666" y="528" font-size="15" fill="#b3201f" font-weight="700" text-anchor="start"   >左剪支（选 a[i]）</text>
<text x="666" y="556" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >仅扩展满足 cs + a[i] ≤ t 的左孩子。</text>
<text x="666" y="580" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >否则总和已超过 t，该路径无效。</text>
<rect x="648" y="612" width="684" height="100" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="666" y="640" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >右剪支（不选 a[i]）</text>
<text x="666" y="668" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >仅扩展满足 cs + rs ≥ t 的右孩子（rs=余下整数和）。</text>
<text x="666" y="692" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >否则即使选完剩余整数也到不了 t。</text>
</svg>
