<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >求解递推式的三种方法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >直接展开法、递归树方法与主定理（2.6）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第2章 递归算法设计技术</text>
<rect x="40" y="128" width="410" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="40" y="128" width="410" height="8" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="86" cy="184" r="22" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.5" opacity="1"/>
<text x="86" y="192" font-size="22" fill="#1c5cab" font-weight="700" text-anchor="middle"   >1</text>
<text x="122" y="180" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start"   >直接展开法</text>
<text x="122" y="204" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >2.6.1 · Substitution</text>
<text x="70" y="250" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >从递推式逐层展开，直到初始条件。</text>
<rect x="68" y="268" width="354" height="250" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="296" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   >例：汉诺塔 T(n)=2T(n−1)+1</text>
<text x="86" y="326" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">T(n) = 2T(n−1) + 1</text>
<text x="86" y="354" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">     = 2²T(n−2) + 2 + 1</text>
<text x="86" y="382" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">     = 2³T(n−3) + 2² + 2 + 1</text>
<text x="86" y="410" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">     = ……</text>
<text x="86" y="438" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">     = 2ⁿ⁻¹T(1) + … + 2 + 1</text>
<text x="86" y="466" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">     = 2ⁿ − 1</text>
<text x="86" y="500" font-size="17" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">= O(2ⁿ)</text>
<rect x="68" y="538" width="354" height="96" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="566" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   >另一例：直接插入排序</text>
<text x="86" y="594" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">T(n)=T(n−1)+O(n)</text>
<text x="86" y="620" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">     ⟹ T(n)=O(n²)</text>
<text x="70" y="738" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >最直观、最基础的方法。</text>
<rect x="495" y="128" width="410" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="495" y="128" width="410" height="8" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="541" cy="184" r="22" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<text x="541" y="192" font-size="22" fill="#127a56" font-weight="700" text-anchor="middle"   >2</text>
<text x="577" y="180" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start"   >递归树方法</text>
<text x="577" y="204" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >2.6.2 · Recursion tree</text>
<text x="525" y="250" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >展开成递归树，逐层求和再相加。</text>
<text x="525" y="278" font-size="14" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">例：T(n)=2T(n/2)+n²</text>
<line x1="645" y1="328" x2="575" y2="374" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="645" y1="328" x2="715" y2="374" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="575" y1="402" x2="540" y2="448" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="575" y1="402" x2="610" y2="448" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="715" y1="402" x2="680" y2="448" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<line x1="715" y1="402" x2="750" y2="448" stroke="#c3c2b7" stroke-width="1.5" stroke-linecap="butt" />
<circle cx="645" cy="314" r="14" fill="#e9f7f1" stroke="#127a56" stroke-width="1.4" opacity="1"/>
<circle cx="575" cy="388" r="14" fill="#e9f7f1" stroke="#127a56" stroke-width="1.4" opacity="1"/>
<circle cx="715" cy="388" r="14" fill="#e9f7f1" stroke="#127a56" stroke-width="1.4" opacity="1"/>
<circle cx="540" cy="462" r="11" fill="#e9f7f1" stroke="#127a56" stroke-width="1.4" opacity="1"/>
<circle cx="610" cy="462" r="11" fill="#e9f7f1" stroke="#127a56" stroke-width="1.4" opacity="1"/>
<circle cx="680" cy="462" r="11" fill="#e9f7f1" stroke="#127a56" stroke-width="1.4" opacity="1"/>
<circle cx="750" cy="462" r="11" fill="#e9f7f1" stroke="#127a56" stroke-width="1.4" opacity="1"/>
<line x1="540" y1="473" x2="540" y2="492" stroke="#c3c2b7" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="3 3"/>
<line x1="610" y1="473" x2="610" y2="492" stroke="#c3c2b7" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="3 3"/>
<line x1="680" y1="473" x2="680" y2="492" stroke="#c3c2b7" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="3 3"/>
<line x1="750" y1="473" x2="750" y2="492" stroke="#c3c2b7" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="3 3"/>
<text x="809" y="319" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">n²</text>
<text x="809" y="393" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">2·(n/2)² = n²/2</text>
<text x="809" y="467" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="middle"   font-family="ui-monospace,monospace">4·(n/4)² = n²/4</text>
<text x="809" y="502" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >……</text>
<text x="525" y="538" font-size="13.5" fill="#52514e" font-weight="600" text-anchor="start"   >树高 = log₂n + 1</text>
<rect x="523" y="580" width="354" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="541" y="608" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >各层求和：</text>
<text x="541" y="634" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">n²(1 + ½ + ¼ + …) </text>
<text x="541" y="660" font-size="16" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">= O(n²)</text>
<text x="525" y="738" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >适合分治型递推式。</text>
<rect x="950" y="128" width="410" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="950" y="128" width="410" height="8" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="996" cy="184" r="22" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.5" opacity="1"/>
<text x="996" y="192" font-size="22" fill="#3a2e86" font-weight="700" text-anchor="middle"   >3</text>
<text x="1032" y="180" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start"   >主定理（主方法）</text>
<text x="1032" y="204" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >2.6.3 · Master theorem</text>
<text x="980" y="250" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >求解分治递推式的通用公式：</text>
<rect x="978" y="266" width="354" height="52" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="10" opacity="1" />
<text x="1155.0" y="298" font-size="18" fill="#3a2e86" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">T(n) = a·T(n/b) + cnᵏ</text>
<text x="980" y="338" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >比较 a 与 bᵏ，分三种情况：</text>
<rect x="978" y="360" width="354" height="56" fill="#fbfbfa" stroke="#cbc4ee" stroke-width="1.2" rx="10" opacity="1" />
<text x="996" y="394" font-size="16" fill="#4a3aa7" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">① a &gt; bᵏ</text>
<text x="1120" y="394" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">T(n) = Θ(n^(log_b a))</text>
<rect x="978" y="426" width="354" height="56" fill="#fbfbfa" stroke="#cbc4ee" stroke-width="1.2" rx="10" opacity="1" />
<text x="996" y="460" font-size="16" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">② a = bᵏ</text>
<text x="1120" y="460" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">T(n) = Θ(nᵏ·log n)</text>
<rect x="978" y="492" width="354" height="56" fill="#fbfbfa" stroke="#cbc4ee" stroke-width="1.2" rx="10" opacity="1" />
<text x="996" y="526" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">③ a &lt; bᵏ</text>
<text x="1120" y="526" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">T(n) = Θ(nᵏ)</text>
<rect x="978" y="576" width="354" height="110" fill="#f4f0fb" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="996" y="604" font-size="14" fill="#3a2e86" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">例：T(n)=4T(n/2)+n</text>
<text x="996" y="632" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a=4, b=2, k=1 → bᵏ=2 &lt; a</text>
<text x="996" y="660" font-size="13.5" fill="#3a2e86" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">属情况①：T(n)=Θ(n^log₂4)=Θ(n²)</text>
<text x="980" y="738" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >a、b、c、k 均为常量。</text>
</svg>
