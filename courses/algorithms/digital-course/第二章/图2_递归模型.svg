<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="880" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >递归模型：递归出口与递归体</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >递归算法的抽象 —— 反映问题的递归结构（2.1.3）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第2章 递归算法设计技术</text>
<rect x="40" y="124" width="1320" height="264" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="164" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >从代码到递归模型</text>
<text x="254" y="163" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >以求 n! 为例</text>
<rect x="80" y="176" width="360" height="176" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="100" y="208" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">int fun(int n) {</text>
<text x="100" y="234" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    if (n==1)</text>
<text x="100" y="260" font-size="15.5" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">        return 1;</text>
<text x="100" y="286" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">    else</text>
<text x="100" y="312" font-size="15.5" fill="#b0491d" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">        return fun(n-1)*n;</text>
<text x="100" y="338" font-size="15.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<path d="M 460 264 L 550 264" stroke="#2a78d6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrB)" />
<text x="505" y="250" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >抽象</text>
<rect x="580" y="168" width="720" height="192" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.5" rx="14" opacity="1" />
<text x="620" y="234" font-size="24" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(n) = 1</text>
<text x="880" y="234" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start"   >当 n = 1</text>
<text x="620" y="298" font-size="24" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(n) = n · f(n−1)</text>
<text x="880" y="298" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start"   >当 n &gt; 1</text>
<rect x="1080" y="212" width="180" height="34" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="17" opacity="1" />
<text x="1170" y="234" font-size="16" fill="#127a56" font-weight="700" text-anchor="middle"   >递归出口</text>
<rect x="1080" y="276" width="180" height="34" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="17" opacity="1" />
<text x="1170" y="298" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   >递归体</text>
<text x="576" y="268" font-size="60" fill="#1c5cab" font-weight="300" text-anchor="middle"   >{</text>
<rect x="40" y="408" width="648" height="400" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="448" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >递归模型的一般形式</text>
<rect x="70" y="478" width="588" height="52" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="364.0" y="511" font-size="21" fill="#1c5cab" font-weight="700" text-anchor="middle"   >递归模型  =  递归出口  +  递归体</text>
<text x="80" y="578" font-size="22" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(s₁) = m₁</text>
<rect x="280" y="556" width="150" height="30" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.1" rx="15" opacity="1" />
<text x="355" y="576" font-size="14" fill="#127a56" font-weight="600" text-anchor="middle"   >递归出口</text>
<text x="80" y="630" font-size="19" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(sₙ) = g( f(sᵢ),…,f(sₙ₋₁), cⱼ,…,cₘ )</text>
<rect x="80" y="648" width="130" height="28" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.1" rx="14" opacity="1" />
<text x="145" y="667" font-size="14" fill="#b0491d" font-weight="600" text-anchor="middle"   >递归体</text>
<line x1="70" y1="696" x2="658" y2="696" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt" />
<text x="76" y="726" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 递归出口：规模最小、可直接求解的情形，给出确定值。</text>
<text x="76" y="756" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 递归体：大问题用一个或多个更小子问题的解组合表示。</text>
<text x="76" y="786" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 缺一不可：无出口 → 无限递归；无递归体 → 无法推进。</text>
<rect x="704" y="408" width="656" height="400" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="730" y="448" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >递归模型实例</text>
<rect x="732" y="486" width="600" height="96" fill="#fbfbfa" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<rect x="732" y="486" width="8" height="96" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="754" y="514" font-size="16.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >求 n!</text>
<circle cx="766" cy="542" r="6" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="780" y="547" font-size="14.5" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">出口  f(1)=1</text>
<circle cx="766" cy="566" r="6" fill="#b0491d" stroke="none" stroke-width="1" opacity="1"/>
<text x="780" y="571" font-size="14.5" fill="#b0491d" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">体      f(n)=n·f(n−1)</text>
<rect x="732" y="594" width="600" height="96" fill="#fbfbfa" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<rect x="732" y="594" width="8" height="96" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="754" y="622" font-size="16.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >单链表求和 Sum(h)</text>
<circle cx="766" cy="650" r="6" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="780" y="655" font-size="14.5" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">出口  Sum(NULL)=0</text>
<circle cx="766" cy="674" r="6" fill="#b0491d" stroke="none" stroke-width="1" opacity="1"/>
<text x="780" y="679" font-size="14.5" fill="#b0491d" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">体      Sum(h)=h→val + Sum(h→next)</text>
<rect x="732" y="702" width="600" height="96" fill="#fbfbfa" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<rect x="732" y="702" width="8" height="96" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="754" y="730" font-size="16.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >二叉树求和 Sumbt(r)</text>
<circle cx="766" cy="758" r="6" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="780" y="763" font-size="14.5" fill="#127a56" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">出口  Sumbt(NULL)=0</text>
<circle cx="766" cy="782" r="6" fill="#b0491d" stroke="none" stroke-width="1" opacity="1"/>
<text x="780" y="787" font-size="14.5" fill="#b0491d" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">体      Sumbt(r)=Sumbt(l)+Sumbt(r)+r→val</text>
</svg>
