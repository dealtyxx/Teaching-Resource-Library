<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="860" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >递归与数学归纳法 · 设计步骤</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >归纳法是递归的理论基础，据此提炼递归模型（2.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第2章 递归算法设计技术</text>
<rect x="40" y="128" width="650" height="330" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >递归 ↔ 数学归纳法</text>
<rect x="70" y="200" width="290" height="34" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1" rx="8" opacity="1" />
<text x="215" y="223" font-size="15" fill="#127a56" font-weight="700" text-anchor="middle"   >数学归纳法（证明方法）</text>
<rect x="390" y="200" width="270" height="34" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1" rx="8" opacity="1" />
<text x="525" y="223" font-size="15" fill="#b0491d" font-weight="700" text-anchor="middle"   >递归（算法技术）</text>
<rect x="70" y="250" width="290" height="60" fill="#fbfbfa" stroke="#a9e0cb" stroke-width="1.1" rx="8" opacity="1" />
<text x="86" y="286" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >归纳基础：P(1) 为真</text>
<rect x="390" y="250" width="270" height="60" fill="#fbfbfa" stroke="#f3c1ac" stroke-width="1.1" rx="8" opacity="1" />
<text x="406" y="286" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >递归出口：最小问题直接求解</text>
<path d="M 366 280 L 386 280" stroke="#898781" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="70" y="324" width="290" height="60" fill="#fbfbfa" stroke="#a9e0cb" stroke-width="1.1" rx="8" opacity="1" />
<text x="86" y="350" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >归纳步骤：P(k−1) ⟹</text>
<text x="86" y="372" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   > P(k)</text>
<rect x="390" y="324" width="270" height="60" fill="#fbfbfa" stroke="#f3c1ac" stroke-width="1.1" rx="8" opacity="1" />
<text x="406" y="350" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >递归体：由子问题解构造大问</text>
<text x="406" y="372" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >题解</text>
<path d="M 366 354 L 386 354" stroke="#898781" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<line x1="70" y1="402" x2="660" y2="402" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt" />
<text x="70" y="428" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >二者本质相同：归纳法自 P(1) 向上递推证明；</text>
<text x="70" y="450" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >递归自出口向上回代求值。常借归纳思路设计递归。</text>
<rect x="710" y="128" width="650" height="330" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="736" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >提取递归模型的一般步骤</text>
<rect x="740" y="206" width="590" height="66" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5" rx="12" opacity="1" />
<rect x="740" y="206" width="10" height="66" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="778" cy="239" r="18" fill="#fff" stroke="#2a78d6" stroke-width="1.6" opacity="1"/>
<text x="778" y="245" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="middle"   >1</text>
<text x="810" y="234" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start"   >分析原问题，找出小问题</text>
<text x="810" y="257" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >对 f(sₙ) 分析，找出合理的更小问题 f(sₙ₋₁)。</text>
<path d="M 1035.0 272 L 1035.0 286" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="740" y="290" width="590" height="66" fill="#ffffff" stroke="#eb6834" stroke-width="1.5" rx="12" opacity="1" />
<rect x="740" y="290" width="10" height="66" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="778" cy="323" r="18" fill="#fff" stroke="#eb6834" stroke-width="1.6" opacity="1"/>
<text x="778" y="329" font-size="18" fill="#b0491d" font-weight="700" text-anchor="middle"   >2</text>
<text x="810" y="318" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start"   >建立大小问题的关系</text>
<text x="810" y="341" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >假设 f(sₙ₋₁) 可解，据此确定 f(sₙ) → 递归体。</text>
<path d="M 1035.0 356 L 1035.0 370" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<rect x="740" y="374" width="590" height="66" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5" rx="12" opacity="1" />
<rect x="740" y="374" width="10" height="66" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="778" cy="407" r="18" fill="#fff" stroke="#1baf7a" stroke-width="1.6" opacity="1"/>
<text x="778" y="413" font-size="18" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<text x="810" y="402" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start"   >确定可直接求解的情况</text>
<text x="810" y="425" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >找到最小可解情形 → 递归出口。</text>
<rect x="40" y="478" width="1320" height="358" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="518" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >基于归纳思想的设计 · 骨牌铺方格</text>
<text x="452" y="517" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >例2.10</text>
<text x="66" y="544" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >用 1×2 骨牌铺满 2×n 方格，求方案数 f(n)。把第 1 列的铺法作为归纳的切入点：</text>
<text x="232" y="578" font-size="14.5" fill="#3a2e86" font-weight="600" text-anchor="middle"   >情况 1：第 1 列竖放 1 块</text>
<rect x="130" y="596" width="34" height="34" fill="#fff" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="130" y="630" width="34" height="34" fill="#fff" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="164" y="596" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="164" y="630" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="198" y="596" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="198" y="630" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="232" y="596" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="232" y="630" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="266" y="596" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="266" y="630" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="300" y="596" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="300" y="630" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="133" y="599" width="28" height="62" fill="#eceaf7" stroke="#3a2e86" stroke-width="1.4" rx="6" opacity="1" />
<path d="M 164 672 L 164 680 L 334 680 L 334 672" stroke="#1c5cab" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="249.0" y="704" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >剩 2×(n−1) → f(n−1)</text>
<text x="842" y="578" font-size="14.5" fill="#b3406e" font-weight="600" text-anchor="middle"   >情况 2：第 1、2 列横放 2 块</text>
<rect x="740" y="596" width="34" height="34" fill="#fff" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="740" y="630" width="34" height="34" fill="#fff" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="774" y="596" width="34" height="34" fill="#fff" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="774" y="630" width="34" height="34" fill="#fff" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="808" y="596" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="808" y="630" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="842" y="596" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="842" y="630" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="876" y="596" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="876" y="630" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="910" y="596" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="910" y="630" width="34" height="34" fill="#f6f5f2" stroke="#c3c2b7" stroke-width="1" rx="3" opacity="1" />
<rect x="743" y="599" width="62" height="28" fill="#fdeef4" stroke="#b3406e" stroke-width="1.4" rx="6" opacity="1" />
<rect x="743" y="633" width="62" height="28" fill="#fdeef4" stroke="#b3406e" stroke-width="1.4" rx="6" opacity="1" />
<path d="M 808 672 L 808 680 L 944 680 L 944 672" stroke="#1c5cab" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="876.0" y="704" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >剩 2×(n−2) → f(n−2)</text>
<text x="700.0" y="636" font-size="30" fill="#898781" font-weight="700" text-anchor="middle"   >＋</text>
<rect x="66" y="758" width="1268" height="58" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="700.0" y="795" font-size="19" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">加法原理：f(1)=1，f(2)=2，f(n)=f(n−1)+f(n−2)  （n&gt;2）</text>
</svg>
