<circle cx="206" cy="622" r="5" fill="#0b0b0b" stroke="none" stroke-width="1" opacity="1"/>
<text x="194" y="614" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p0</text>
<circle cx="602" cy="622" r="5" fill="#0b0b0b" stroke="none" stroke-width="1" opacity="1"/>
<text x="614" y="614" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p1</text>
<circle cx="602" cy="292" r="5" fill="#0b0b0b" stroke="none" stroke-width="1" opacity="1"/>
<text x="614" y="284" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p2</text>
<circle cx="404" cy="490" r="5" fill="#0b0b0b" stroke="none" stroke-width="1" opacity="1"/>
<text x="418" y="494" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p3</text>
<circle cx="206" cy="292" r="5" fill="#0b0b0b" stroke="none" stroke-width="1" opacity="1"/>
<text x="194" y="284" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p4</text>
<text x="470" y="556" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">+15</text>
<text x="509.59999999999997" y="420" font-size="11.5" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">−1.5</text>
<text x="285.20000000000005" y="470.20000000000005" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">+7.5</text>
<text x="404" y="503.4" font-size="10.5" fill="#b3201f" font-weight="700" text-anchor="middle"   >凹点</text>
<rect x="720" y="128" width="640" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="746" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >有向面积 与 求和</text>
<rect x="744" y="186" width="592" height="96" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="760" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >三角形有向面积</text>
<text x="760" y="238" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">S(p0,pi,pi+1) = Det(pi−p0, pi+1−p0) / 2</text>
<text x="760" y="262" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >逆时针为正、顺时针为负；实际面积取绝对值。</text>
<rect x="744" y="292" width="592" height="96" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="760" y="318" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >本例（凹五边形）</text>
<text x="760" y="342" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">S = 15 + (−1.5) + 7.5 = 21</text>
<text x="760" y="366" font-size="12" fill="#b3201f" font-weight="700" text-anchor="start"   >负三角形恰好抵消凹陷处多算的面积。</text>
<rect x="744" y="398" width="592" height="116" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="760" y="424" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >polyArea(p)</text>
<text x="760" y="448" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">double ans = 0;</text>
<text x="760" y="465" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (i=1; i&lt;p.size()−1; i++)</text>
<text x="760" y="482" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  ans += Det(p[i]−p[0], p[i+1]−p[0]);</text>
<text x="760" y="499" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">return fabs(ans) / 2;   // 累计有向面积的一半</text>
<rect x="744" y="526" width="592" height="84" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="760" y="552" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   >三角形面积</text>
<text x="760" y="576" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">triangleArea = fabs(Det(p1−p0, p2−p0)) / 2</text>
<text x="760" y="598" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >叉积绝对值是平行四边形面积，取一半即三角形。</text>
<rect x="744" y="622" width="592" height="98" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="760" y="648" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   >应用 · 特殊多边形面积（例10.3 POJ1654）</text>
<text x="760" y="672" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">从原点按方向串行走，累加 (px·ny − py·nx)</text>
<text x="760" y="694" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >为两倍有向面积；最后取绝对值除 2。</text>
<text x="760" y="714" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >教材 7 顶点凹多边形示例的面积为 56。</text>
</svg>
