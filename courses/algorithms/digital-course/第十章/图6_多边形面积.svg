<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >以 p0 为剖分点，累加各三角形的有向面积（10.1.8）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第10章 计算几何</text>
<rect x="40" y="128" width="660" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
