<text x="261" y="688" font-size="10" fill="#b0491d" font-weight="700" text-anchor="middle"   >基准(极角起点)</text>
<text x="70" y="730" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >灰线示意各点相对 a8 的极角；按极角从小到大扫描。</text>
<rect x="640" y="128" width="720" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="666" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >扫描原理 与 栈的变化</text>
<rect x="664" y="186" width="672" height="88" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="680" y="212" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   >沿逆时针扫描：应当左拐；一旦出现右拐，</text>
<text x="680" y="234" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >说明栈顶点不是凸包点 → 退栈。</text>
<text x="680" y="258" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">Direction(ch[top−1], a[i], ch[top]) &gt; 0  → 右拐 → 退栈</text>
<text x="680" y="300" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >栈的变化过程（栈底 → 栈顶）</text>
<rect x="670" y="314" width="660" height="26" fill="#f0efec" stroke="#e1e0d9" stroke-width="1" rx="5" opacity="1" />
<text x="680" y="332" font-size="11" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">处理</text>
<text x="770" y="332" font-size="11" fill="#0b0b0b" font-weight="700" text-anchor="start"   >操作</text>
<text x="1020" y="332" font-size="11" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">栈内容</text>
<rect x="670" y="340" width="660" height="26" fill="#ffffff" stroke="#e1e0d9" stroke-width="0.7" rx="5" opacity="1" />
<text x="680" y="358" font-size="10.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a8,a7,a6</text>
<text x="770" y="358" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >前 3 点先进栈</text>
<text x="1020" y="358" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a8 a7 a6</text>
<rect x="670" y="366" width="660" height="26" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="0.7" rx="5" opacity="1" />
<text x="680" y="384" font-size="10.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a2</text>
<text x="770" y="384" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >a6 右拐，退栈；a2 进栈</text>
<text x="1020" y="384" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a8 a7 a2</text>
<rect x="670" y="392" width="660" height="26" fill="#ffffff" stroke="#e1e0d9" stroke-width="0.7" rx="5" opacity="1" />
<text x="680" y="410" font-size="10.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a5</text>
<text x="770" y="410" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >无右拐，a5 进栈</text>
<text x="1020" y="410" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a8 a7 a2 a5</text>
<rect x="670" y="418" width="660" height="26" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="0.7" rx="5" opacity="1" />
<text x="680" y="436" font-size="10.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a4</text>
<text x="770" y="436" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >a5 右拐，退栈；a4 进栈</text>
<text x="1020" y="436" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a8 a7 a2 a4</text>
<rect x="670" y="444" width="660" height="26" fill="#ffffff" stroke="#e1e0d9" stroke-width="0.7" rx="5" opacity="1" />
<text x="680" y="462" font-size="10.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a0</text>
<text x="770" y="462" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >a4 右拐，退栈；a0 进栈</text>
<text x="1020" y="462" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a8 a7 a2 a0</text>
<rect x="670" y="470" width="660" height="26" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="0.7" rx="5" opacity="1" />
<text x="680" y="488" font-size="10.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a1</text>
<text x="770" y="488" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >无右拐，a1 进栈</text>
<text x="1020" y="488" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a8 a7 a2 a0 a1</text>
<rect x="670" y="496" width="660" height="26" fill="#ffffff" stroke="#e1e0d9" stroke-width="0.7" rx="5" opacity="1" />
<text x="680" y="514" font-size="10.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a3</text>
<text x="770" y="514" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >无右拐，a3 进栈</text>
<text x="1020" y="514" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">a8 a7 a2 a0 a1 a3</text>
<rect x="670" y="522" width="660" height="26" fill="#e9f7f1" stroke="#e1e0d9" stroke-width="1.4" rx="5" opacity="1" />
<text x="680" y="540" font-size="10.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a9</text>
<text x="770" y="540" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >a3、a1 右拐退栈；a9 进栈</text>
<text x="1020" y="540" font-size="10.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">a8 a7 a2 a0 a9</text>
<rect x="664" y="556" width="672" height="30" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="8" opacity="1" />
<text x="1000.0" y="576" font-size="13" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">凸包（逆时针）= a8, a7, a2, a0, a9</text>
<rect x="664" y="596" width="672" height="118" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="680" y="622" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >核心扫描</text>
<text x="680" y="644" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (i=3; i&lt;n; i++) {</text>
<text x="680" y="662" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  while (top&gt;=0 &amp;&amp; Direction(ch[top−1],a[i],ch[top])&gt;0)</text>
<text x="680" y="680" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">    top−−;        // 右拐退栈</text>
<text x="680" y="698" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  ch[++top]=a[i]; // 当前点进栈</text>
<text x="1320" y="622" font-size="12.5" fill="#4a3aa7" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">O(n log n)</text>
</svg>
