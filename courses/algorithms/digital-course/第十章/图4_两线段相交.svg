  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >两线段是否相交 · 跨立实验</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >各端点在对方线段两侧 → 相交（10.1.5）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第10章 计算几何</text>
<rect x="40" y="128" width="640" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >跨立实验</text>
<text x="166" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >用 Direction 判断两点是否在线段两侧</text>
<line x1="160" y1="558" x2="160" y2="222" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="216" y1="558" x2="216" y2="222" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="272" y1="558" x2="272" y2="222" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="328" y1="558" x2="328" y2="222" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="384" y1="558" x2="384" y2="222" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="440" y1="558" x2="440" y2="222" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="496" y1="558" x2="496" y2="222" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="558" x2="496" y2="558" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="502" x2="496" y2="502" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="446" x2="496" y2="446" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="390" x2="496" y2="390" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="334" x2="496" y2="334" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="278" x2="496" y2="278" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="222" x2="496" y2="222" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="160" y1="558" x2="504" y2="558" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<line x1="160" y1="558" x2="160" y2="214" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<text x="153" y="571" font-size="10" fill="#898781" font-weight="600" text-anchor="end"   >O</text>
<line x1="216" y1="502" x2="440" y2="306.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="butt" />
<line x1="216" y1="306.0" x2="440" y2="502" stroke="#eb6834" stroke-width="3" stroke-linecap="butt" />
<circle cx="328" cy="404.0" r="6" fill="#e34948" stroke="#fff" stroke-width="2" opacity="1"/>
<circle cx="216" cy="502" r="5" fill="#1c5cab" stroke="none" stroke-width="1" opacity="1"/>
<text x="206" y="494" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p1</text>
<circle cx="440" cy="306.0" r="5" fill="#1c5cab" stroke="none" stroke-width="1" opacity="1"/>
<text x="450" y="322.0" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p2</text>
<circle cx="216" cy="306.0" r="5" fill="#b0491d" stroke="none" stroke-width="1" opacity="1"/>
<text x="206" y="298.0" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p3</text>
<circle cx="440" cy="502" r="5" fill="#b0491d" stroke="none" stroke-width="1" opacity="1"/>
<text x="450" y="518" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">p4</text>
<text x="339.20000000000005" y="423.6" font-size="11" fill="#b3201f" font-weight="700" text-anchor="start"   >交点</text>
<rect x="64" y="580" width="592" height="140" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="80" y="606" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >两个条件同时成立即相交：</text>
<text x="80" y="632" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >① p1、p2 在线段 p3p4 两侧：</text>
<text x="340" y="632" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">d1·d2 &lt; 0</text>
<text x="80" y="656" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   >② p3、p4 在线段 p1p2 两侧：</text>
<text x="340" y="656" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">d3·d4 &lt; 0</text>
<text x="80" y="686" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">d1=Dir(p3,p1,p4)  d2=Dir(p3,p2,p4)</text>
<text x="80" y="706" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">d3=Dir(p1,p3,p2)  d4=Dir(p1,p4,p2)</text>
<rect x="700" y="128" width="660" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="726" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >算法 与 特殊情况</text>
<rect x="724" y="186" width="612" height="210" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="212" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >SegIntersect(p1,p2,p3,p4)</text>
<text x="740" y="238" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">d1=Direction(p3,p1,p4);  d2=Direction(p3,p2,p4);</text>
<text x="740" y="255.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">d3=Direction(p1,p3,p2);  d4=Direction(p1,p4,p2);</text>
<text x="740" y="273.0" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">if (d1*d2&lt;0 &amp;&amp; d3*d4&lt;0)  return true;   // 规范相交</text>
<text x="740" y="290.5" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">// 端点共线的特殊情况：</text>
<text x="740" y="308.0" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">if (d1==0 &amp;&amp; OnSegment(p1,p3,p4)) return true;</text>
<text x="740" y="325.5" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">if (d2==0 &amp;&amp; OnSegment(p2,p3,p4)) return true;</text>
<text x="740" y="343.0" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">if (d3==0 &amp;&amp; OnSegment(p3,p1,p2)) return true;</text>
<text x="740" y="360.5" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">if (d4==0 &amp;&amp; OnSegment(p4,p1,p2)) return true;</text>
<text x="740" y="378.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">return false;</text>
<text x="740" y="424" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >三类情形</text>
<line x1="770.0" y1="518.0" x2="850.0" y2="458.0" stroke="#2a78d6" stroke-width="2.4" stroke-linecap="butt" />
<line x1="770.0" y1="458.0" x2="850.0" y2="518.0" stroke="#eb6834" stroke-width="2.4" stroke-linecap="butt" />
<circle cx="810.0" cy="488" r="4" fill="#e34948" stroke="#fff" stroke-width="1.4" opacity="1"/>
<text x="810.0" y="440.0" font-size="11" fill="#127a56" font-weight="700" text-anchor="middle"   >规范相交</text>
<line x1="980.0" y1="508" x2="1060.0" y2="508" stroke="#2a78d6" stroke-width="2.4" stroke-linecap="butt" />
<line x1="1020.0" y1="508" x2="1040.0" y2="458.0" stroke="#eb6834" stroke-width="2.4" stroke-linecap="butt" />
<circle cx="1020.0" cy="508" r="4" fill="#e34948" stroke="#fff" stroke-width="1.4" opacity="1"/>
<text x="1020.0" y="440.0" font-size="11" fill="#b0491d" font-weight="700" text-anchor="middle"   >端点接触</text>
<line x1="1190.0" y1="508" x2="1220" y2="468" stroke="#2a78d6" stroke-width="2.4" stroke-linecap="butt" />
<line x1="1240" y1="508" x2="1270.0" y2="468" stroke="#eb6834" stroke-width="2.4" stroke-linecap="butt" />
<text x="1230.0" y="440.0" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   >不相交</text>
<rect x="724" y="558" width="612" height="162" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="740" y="584" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >应用 · 求交点个数（例10.2 HDU1086）</text>
<text x="740" y="608" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >给定 N 条线段，两两判断是否相交，累计相交对数。</text>
<text x="740" y="632" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">for i&lt;j: if(SegIntersect(...)) ans++;   // O(N²)</text>
<text x="740" y="660" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >判两直线相交则用：</text>
<text x="740" y="684" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">sgn(Dir(p3,p1,p2)) · sgn(Dir(p4,p1,p2)) ≤ 0</text>
<text x="740" y="708" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >（线段相交更严格：还需两组跨立同时成立）</text>
</svg>
