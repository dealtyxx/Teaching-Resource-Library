<text x="194" y="408" font-size="11" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">9</text>
<text x="178" y="398" font-size="10.5" fill="#b0491d" font-weight="700" text-anchor="end"   >起点</text>
<rect x="660" y="128" width="700" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="686" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >礼品包裹（Jarvis）步骤</text>
<rect x="684" y="186" width="652" height="72" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="700" y="212" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >凸包：包含全部点的最小凸多边形</text>
<text x="700" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >任意两点连线都落在其内部。</text>
<rect x="684" y="266" width="652" height="138" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="700" y="292" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >算法步骤</text>
<text x="700" y="316" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >① 取最左下点（x 最小，若并列取 y 最小）→ a9</text>
<text x="700" y="336" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >② 以当前点 aj 为原点，找「其余点都在同一侧」</text>
<text x="700" y="356" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >   的点 ak（与水平射线夹角最小）</text>
<text x="700" y="376" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >③ 把 ak 加入凸包，令 aj=ak，重复 ②</text>
<text x="700" y="396" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >④ 回到起点即结束</text>
<text x="700" y="428" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >包裹顺序：</text>
<circle cx="794" cy="424" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="794" y="429" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a9</text>
<path d="M 810 424 L 866 424" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<circle cx="882" cy="424" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="882" y="429" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a8</text>
<path d="M 898 424 L 954 424" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<circle cx="970" cy="424" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="970" y="429" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a7</text>
<path d="M 986 424 L 1042 424" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<circle cx="1058" cy="424" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="1058" y="429" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a2</text>
<path d="M 1074 424 L 1130 424" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<circle cx="1146" cy="424" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="1146" y="429" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a0</text>
<path d="M 1162 424 L 1218 424" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrM)" />
<circle cx="1234" cy="424" r="15" fill="#e9f7f1" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="1234" y="429" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">a9</text>
<rect x="684" y="454" width="652" height="122" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="700" y="480" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   >比较函数 cmp(aj, ai, ak)</text>
<text x="700" y="504" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">d = Direction(aj, ai, ak);</text>
<text x="700" y="526" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">d&gt;0  → ai 更优（更顺时针）返回 true</text>
<text x="700" y="548" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">d==0 → 共线取更远者；否则保留 ak</text>
<rect x="684" y="588" width="652" height="122" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<text x="700" y="614" font-size="13" fill="#b0491d" font-weight="700" text-anchor="start"   >复杂度</text>
<text x="700" y="638" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >外层枚举凸包点 h 次，内层扫描 n 个点，</text>
<text x="700" y="660" font-size="12" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">时间复杂度 O(n·h)，最坏 O(n²)。</text>
<text x="700" y="684" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >h 为凸包顶点数；点几乎都在凸包上时较慢。</text>
</svg>
