<text x="502" y="628" font-size="11" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">7</text>
<circle cx="282" cy="668" r="9" fill="#e9f7f1" stroke="#127a56" stroke-width="2.2" opacity="1"/>
<text x="282" y="672" font-size="11" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">8</text>
