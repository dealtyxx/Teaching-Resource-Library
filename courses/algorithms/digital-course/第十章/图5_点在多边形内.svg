<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >点在多边形内 · 射线法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >从点向右引射线，交点数为奇则在内、为偶则在外（10.1.6）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第10章 计算几何</text>
<rect x="40" y="128" width="700" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >射线与多边形的交点</text>
<text x="276" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >奇数在内 / 偶数在外</text>
<line x1="130" y1="668" x2="130" y2="234" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="192" y1="668" x2="192" y2="234" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="254" y1="668" x2="254" y2="234" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="316" y1="668" x2="316" y2="234" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="378" y1="668" x2="378" y2="234" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="440" y1="668" x2="440" y2="234" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="502" y1="668" x2="502" y2="234" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="564" y1="668" x2="564" y2="234" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="626" y1="668" x2="626" y2="234" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="668" x2="626" y2="668" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="606" x2="626" y2="606" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="544" x2="626" y2="544" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="482" x2="626" y2="482" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="420" x2="626" y2="420" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="358" x2="626" y2="358" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="296" x2="626" y2="296" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="234" x2="626" y2="234" stroke="#eeede7" stroke-width="1" stroke-linecap="butt" />
<line x1="130" y1="668" x2="634" y2="668" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<line x1="130" y1="668" x2="130" y2="226" stroke="#898781" stroke-width="1.4" stroke-linecap="butt" />
<text x="123" y="681" font-size="10" fill="#898781" font-weight="600" text-anchor="end"   >O</text>
<path d="M 192.0 544.0 L 378.0 606.0 L 564.0 544.0 L 564.0 358.0 L 378.0 420.0 L 192.0 358.0 Z" fill="#eef4fc" stroke="#1c5cab" stroke-width="2.4"/>
<circle cx="192" cy="544" r="4" fill="#1c5cab" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="378" cy="606" r="4" fill="#1c5cab" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="564" cy="544" r="4" fill="#1c5cab" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="564" cy="358" r="4" fill="#1c5cab" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="378" cy="420" r="4" fill="#1c5cab" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="192" cy="358" r="4" fill="#1c5cab" stroke="none" stroke-width="1" opacity="1"/>
<line x1="285.0" y1="482" x2="626" y2="482" stroke="#127a56" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 3"/>
<path d="M 588.8 482 L 626 482" stroke="#127a56" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrG)" />
<circle cx="564" cy="482" r="6" fill="#e34948" stroke="#fff" stroke-width="2" opacity="1"/>
<circle cx="285.0" cy="482" r="6" fill="#127a56" stroke="none" stroke-width="1" opacity="1"/>
<text x="275.0" y="474" font-size="12" fill="#127a56" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">A 内</text>
<text x="452.40000000000003" y="474" font-size="11" fill="#127a56" font-weight="700" text-anchor="middle"   >1 个交点（奇）</text>
<line x1="440" y1="389.0" x2="626" y2="389.0" stroke="#e34948" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 3"/>
<path d="M 588.8 389.0 L 626 389.0" stroke="#e34948" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<circle cx="471.0" cy="389.0" r="6" fill="#e34948" stroke="#fff" stroke-width="2" opacity="1"/>
<circle cx="564" cy="389.0" r="6" fill="#e34948" stroke="#fff" stroke-width="2" opacity="1"/>
<circle cx="440" cy="389.0" r="6" fill="#e34948" stroke="none" stroke-width="1" opacity="1"/>
<text x="430" y="381.0" font-size="12" fill="#b3201f" font-weight="700" text-anchor="end"   font-family="ui-monospace,monospace">B 外</text>
<text x="514.4000000000001" y="407.0" font-size="11" fill="#b3201f" font-weight="700" text-anchor="middle"   >2 个交点（偶）</text>
<text x="70" y="728" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   >红圈为射线与多边形边界的交点；只统计位于点右侧（x &gt; p0.x）的交点。</text>
<rect x="760" y="128" width="600" height="616" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="786" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >判断步骤 PointInPolygon</text>
<rect x="784" y="186" width="552" height="70" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="800" y="212" font-size="13" fill="#127a56" font-weight="700" text-anchor="start"   >核心：数「向右射线」穿过多边形边界的次数</text>
<text x="800" y="236" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >奇数 → 在内部；偶数 → 在外部。</text>
<rect x="784" y="268" width="552" height="268" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="800" y="294" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >对每条边 p1p2：</text>
<text x="800" y="318" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">cnt = 0;</text>
<text x="800" y="334.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">for (每条边 p1=a[i], p2=a[i+1]) {</text>
<text x="800" y="351.0" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (OnSegment(p0,p1,p2)) return true;  // 在边上</text>
<text x="800" y="367.5" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (p1.y==p2.y) continue;      // 水平边跳过</text>
<text x="800" y="384.0" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (p0.y&lt;p1.y &amp;&amp; p0.y&lt;p2.y)</text>
<text x="800" y="400.5" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">      continue;                  // p0 在边下方</text>
<text x="800" y="417.0" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (p0.y&gt;=p1.y &amp;&amp; p0.y&gt;=p2.y)</text>
<text x="800" y="433.5" font-size="11" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">      continue;                  // p0 在边上方</text>
<text x="800" y="450.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  x = (p0.y−p1.y)*(p2.x−p1.x)</text>
<text x="800" y="466.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">        /(p2.y−p1.y) + p1.x;     // 求交点 x</text>
<text x="800" y="483.0" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">  if (x &gt; p0.x) cnt++;           // 只数右侧</text>
<text x="800" y="499.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">}</text>
<text x="800" y="516.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">return (cnt % 2 == 1);</text>
<rect x="784" y="548" width="552" height="172" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="800" y="574" font-size="13" fill="#1c5cab" font-weight="700" text-anchor="start"   >细节处理</text>
<text x="800" y="598" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >• 先判「点在边上」→ 直接返回在内（含边界）。</text>
<text x="800" y="620" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >• 水平边不产生交点，跳过。</text>
<text x="800" y="642" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >• 点在边上下方均无交点（射线为水平线 y=p0.y）。</text>
<text x="800" y="664" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >• 只统计右侧交点，避免同一交点两侧重复计数。</text>
<text x="800" y="694" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="start"   >适用于任意简单多边形（凸或凹），时间 O(n)。</text>
</svg>
