<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="940" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >算法的定义与五大特性</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >什么是算法 —— 求解问题的一系列有限计算步骤（1.1.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第1章 绪论</text>
<rect x="40" y="130" width="1320" height="96" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="168" font-size="19" fill="#1c5cab" font-weight="700" text-anchor="start"   >算法（algorithm）</text>
<text x="66" y="200" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start"   >求解问题的一系列计算步骤，是由若干运算或指令组成的有限序列，用来将输入数据转换成输出结果。</text>
<text x="700" y="268" font-size="16" fill="#898781" font-weight="600" text-anchor="middle"   >算法的基本模型</text>
<rect x="200.0" y="355.0" width="0" height="0" fill="#ffffff" stroke="none" stroke-width="1.3" rx="8" opacity="1" />
<text x="200" y="360.4" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="middle"   ></text>
<rect x="120" y="300" width="180" height="110" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="12" opacity="1" />
<text x="210" y="344" font-size="22" fill="#1c5cab" font-weight="700" text-anchor="middle"   >输入</text>
<text x="210" y="378" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >0 个或多个</text>
<rect x="490" y="274" width="420" height="162" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.8" rx="16" opacity="1" />
<text x="700" y="320" font-size="30" fill="#b0491d" font-weight="700" text-anchor="middle"   >算 法</text>
<text x="700" y="358" font-size="17" fill="#52514e" font-weight="normal" text-anchor="middle"   >有限的计算步骤序列</text>
<text x="700" y="392" font-size="16" fill="#b0491d" font-weight="600" text-anchor="middle"   >有穷性 · 确定性 · 可行性</text>
<rect x="1100" y="300" width="180" height="110" fill="#e9f7f1" stroke="#1baf7a" stroke-width="1.4" rx="12" opacity="1" />
<text x="1190" y="344" font-size="22" fill="#127a56" font-weight="700" text-anchor="middle"   >输出</text>
<text x="1190" y="378" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >1 个或多个</text>
<path d="M 300 355 L 486 355" stroke="#eb6834" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<path d="M 910 355 L 1096 355" stroke="#eb6834" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<text x="393" y="340" font-size="14" fill="#898781" font-weight="normal" text-anchor="middle"   >数据</text>
<text x="1003" y="340" font-size="14" fill="#898781" font-weight="normal" text-anchor="middle"   >结果</text>
<path d="M 120 428 L 120 450 L 1280 450 L 1280 428" stroke="#898781" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"  />
<text x="700" y="476" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >针对一个“问题”，把输入按确定的步骤加工为输出</text>
<text x="700" y="536" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >算法的五大特性</text>
<rect x="40.0" y="560" width="248.0" height="262" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="14" opacity="1" />
<rect x="40.0" y="560" width="248.0" height="8" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<rect x="40.0" y="560" width="8" height="8" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="164.0" cy="622" r="30" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" opacity="1"/>
<text x="164.0" y="632" font-size="30" fill="#1c5cab" font-weight="700" text-anchor="middle"   >1</text>
<text x="164.0" y="688" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >有穷性</text>
<text x="164.0" y="712" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >Finiteness</text>
<text x="164.0" y="746" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >算法必须在执行有限步之</text>
<text x="164.0" y="768" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >后结束，且每一步都在有</text>
<text x="164.0" y="790" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >限时间内完成。</text>
<rect x="308.0" y="560" width="248.0" height="262" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="14" opacity="1" />
<rect x="308.0" y="560" width="248.0" height="8" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<rect x="308.0" y="560" width="8" height="8" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="432.0" cy="622" r="30" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.4" opacity="1"/>
<text x="432.0" y="632" font-size="30" fill="#b0491d" font-weight="700" text-anchor="middle"   >2</text>
<text x="432.0" y="688" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >确定性</text>
<text x="432.0" y="712" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >Definiteness</text>
<text x="432.0" y="746" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >每一条指令都有确切含义</text>
<text x="432.0" y="768" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >，相同输入只有唯一的执</text>
<text x="432.0" y="790" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >行路径，不产生二义性。</text>
<rect x="576.0" y="560" width="248.0" height="262" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="14" opacity="1" />
<rect x="576.0" y="560" width="248.0" height="8" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<rect x="576.0" y="560" width="8" height="8" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="700.0" cy="622" r="30" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.4" opacity="1"/>
<text x="700.0" y="632" font-size="30" fill="#127a56" font-weight="700" text-anchor="middle"   >3</text>
<text x="700.0" y="688" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >可行性</text>
<text x="700.0" y="712" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >Effectiveness</text>
<text x="700.0" y="746" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >每一步都足够基本，原则</text>
<text x="700.0" y="768" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >上用笔和纸做有限次运算</text>
<text x="700.0" y="790" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >即可完成。</text>
<rect x="844.0" y="560" width="248.0" height="262" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="14" opacity="1" />
<rect x="844.0" y="560" width="248.0" height="8" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<rect x="844.0" y="560" width="8" height="8" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="968.0" cy="622" r="30" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.4" opacity="1"/>
<text x="968.0" y="632" font-size="30" fill="#3a2e86" font-weight="700" text-anchor="middle"   >4</text>
<text x="968.0" y="688" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >输　入</text>
<text x="968.0" y="712" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >Input</text>
<text x="968.0" y="746" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >具有零个或多个输入，刻</text>
<text x="968.0" y="768" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >画问题的初始条件。</text>
<rect x="1112.0" y="560" width="248.0" height="262" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="14" opacity="1" />
<rect x="1112.0" y="560" width="248.0" height="8" fill="#e87ba4" stroke="none" stroke-width="1" rx="0" opacity="1" />
<rect x="1112.0" y="560" width="8" height="8" fill="#e87ba4" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="1236.0" cy="622" r="30" fill="#fdeef4" stroke="#f4c4d6" stroke-width="1.4" opacity="1"/>
<text x="1236.0" y="632" font-size="30" fill="#b3406e" font-weight="700" text-anchor="middle"   >5</text>
<text x="1236.0" y="688" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >输　出</text>
<text x="1236.0" y="712" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >Output</text>
<text x="1236.0" y="746" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >具有一个或多个输出，是</text>
<text x="1236.0" y="768" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >与输入相关的求解结果。</text>
<text x="700" y="900" font-size="14" fill="#898781" font-weight="normal" text-anchor="middle"   >例：while(n%2==0) n+=2; 中 n 恒为偶数，循环永不结束 —— 违反“有穷性”，不是算法。</text>
</svg>
