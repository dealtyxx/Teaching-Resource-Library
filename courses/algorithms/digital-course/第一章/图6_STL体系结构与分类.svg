<text x="416" y="733" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >优先队列(堆) · &lt;queue&gt;</text>
<line x1="400" y1="810" x2="680" y2="810" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt" />
<text x="406" y="836" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >基于底层容器封装，接口受限、不</text>
<text x="406" y="858" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >支持遍历。</text>
<rect x="720" y="456" width="320" height="428" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="720" y="456" width="320" height="66" fill="#e9f7f1" stroke="none" stroke-width="1" rx="16" opacity="1" />
