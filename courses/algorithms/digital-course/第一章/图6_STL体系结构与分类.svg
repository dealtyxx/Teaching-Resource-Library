<text x="720.0" y="284" font-size="15" fill="#52514e" font-weight="normal" text-anchor="middle"   >像指针：++  --  *</text>
<text x="720.0" y="310" font-size="13" fill="#898781" font-weight="normal" text-anchor="middle"   >定位并访问容器中的元素</text>
<rect x="1044" y="208" width="300" height="130" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.6" rx="14" opacity="1" />
