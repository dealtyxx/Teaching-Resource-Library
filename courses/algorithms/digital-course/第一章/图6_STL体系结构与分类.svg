<text x="746" y="836" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >红黑树实现，按关键字有序；增删</text>
<text x="746" y="858" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >查 O(log₂n)。</text>
<rect x="1060" y="456" width="320" height="428" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="1060" y="456" width="320" height="66" fill="#fdeef4" stroke="none" stroke-width="1" rx="16" opacity="1" />
<rect x="1060" y="496" width="320" height="26" fill="#fdeef4" stroke="none" stroke-width="1" rx="0" opacity="1" />
<rect x="1060" y="456" width="10" height="66" fill="#e87ba4" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="1086" y="490" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start"   >无序容器</text>
<text x="1086" y="512" font-size="13" fill="#b3406e" font-weight="600" text-anchor="start"   >Unordered</text>
<rect x="1080" y="546" width="280" height="58" fill="#fbfbfa" stroke="#f4c4d6" stroke-width="1.2" rx="10" opacity="1" />
<rect x="1080" y="546" width="6" height="58" fill="#e87ba4" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="1096" y="572" font-size="16.5" fill="#b3406e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">unordered_set</text>
<text x="1096" y="593" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >哈希集合</text>
<rect x="1080" y="616" width="280" height="58" fill="#fbfbfa" stroke="#f4c4d6" stroke-width="1.2" rx="10" opacity="1" />
<rect x="1080" y="616" width="6" height="58" fill="#e87ba4" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="1096" y="642" font-size="16.5" fill="#b3406e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">unordered_map</text>
<text x="1096" y="663" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >哈希映射</text>
<line x1="1080" y1="810" x2="1360" y2="810" stroke="#e1e0d9" stroke-width="1" stroke-linecap="butt" />
<text x="1086" y="836" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >哈希表 + 拉链法，元素无序；</text>
<text x="1086" y="858" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >查找≈O(1)。</text>
