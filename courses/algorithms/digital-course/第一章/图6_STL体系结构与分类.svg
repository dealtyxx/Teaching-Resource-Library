<text x="746" y="490" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start"   >关联容器</text>
<text x="746" y="512" font-size="13" fill="#127a56" font-weight="600" text-anchor="start"   >Associative</text>
<rect x="740" y="546" width="280" height="58" fill="#fbfbfa" stroke="#a9e0cb" stroke-width="1.2" rx="10" opacity="1" />
<rect x="740" y="546" width="6" height="58" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="756" y="572" font-size="16.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">set / multiset</text>
<text x="756" y="593" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >集合 · &lt;set&gt;</text>
<rect x="740" y="616" width="280" height="58" fill="#fbfbfa" stroke="#a9e0cb" stroke-width="1.2" rx="10" opacity="1" />
<rect x="740" y="616" width="6" height="58" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="756" y="642" font-size="16.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">map / multimap</text>
<text x="756" y="663" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >映射 · &lt;map&gt;</text>
