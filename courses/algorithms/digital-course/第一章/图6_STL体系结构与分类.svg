<text x="720.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >STL 体系结构与容器分类</text>
<text x="720.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >标准模板库的三大组件与容器家族（1.3.1）</text>
<text x="1400" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第1章 绪论</text>
