<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="820" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >算法设计的基本步骤</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >从理解问题到评估性能的完整流程（1.1.3）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第1章 绪论</text>
<path d="M 420.0 275.0 L 504.0 275.0" stroke="#52514e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 890.0 275.0 L 974.0 275.0" stroke="#52514e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 1170.0 380 L 1170.0 444" stroke="#52514e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 980.0 555.0 L 896.0 555.0" stroke="#52514e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 510.0 555.0 L 426.0 555.0" stroke="#52514e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<rect x="40.0" y="170" width="380" height="210" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="40.0" y="170" width="10" height="210" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="96.0" cy="226" r="30" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.5" opacity="1"/>
<text x="96.0" y="236" font-size="28" fill="#1c5cab" font-weight="700" text-anchor="middle"   >1</text>
<text x="144.0" y="232" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >分析求解问题</text>
<text x="70.0" y="298" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >理解问题的输入、输出与约束，明确“要</text>
<text x="70.0" y="322" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >解决什么”。</text>
<rect x="510.0" y="170" width="380" height="210" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="510.0" y="170" width="10" height="210" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="566.0" cy="226" r="30" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.5" opacity="1"/>
<text x="566.0" y="236" font-size="28" fill="#127a56" font-weight="700" text-anchor="middle"   >2</text>
<text x="614.0" y="232" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >建立数学模型</text>
<text x="540.0" y="298" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >把实际问题抽象为可计算的数学描述。</text>
<rect x="980.0" y="170" width="380" height="210" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="980.0" y="170" width="10" height="210" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="1036.0" cy="226" r="30" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.5" opacity="1"/>
<text x="1036.0" y="236" font-size="28" fill="#3a2e86" font-weight="700" text-anchor="middle"   >3</text>
<text x="1084.0" y="220" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >选择数据结构与</text>
<text x="1084.0" y="250" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >算法设计策略</text>
<text x="1010.0" y="298" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >确定数据的组织方式，并选取分治、贪心</text>
<text x="1010.0" y="322" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >、动态规划等策略。</text>
<rect x="980.0" y="450" width="380" height="210" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="980.0" y="450" width="10" height="210" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="1036.0" cy="506" r="30" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.5" opacity="1"/>
<text x="1036.0" y="516" font-size="28" fill="#b0491d" font-weight="700" text-anchor="middle"   >4</text>
<text x="1084.0" y="512" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >描述算法</text>
<text x="1010.0" y="578" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >用函数（一个或多个）刻画算法，输入输</text>
<text x="1010.0" y="602" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >出以参数表示。</text>
<rect x="510.0" y="450" width="380" height="210" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="510.0" y="450" width="10" height="210" fill="#e87ba4" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="566.0" cy="506" r="30" fill="#fdeef4" stroke="#f4c4d6" stroke-width="1.5" opacity="1"/>
<text x="566.0" y="516" font-size="28" fill="#b3406e" font-weight="700" text-anchor="middle"   >5</text>
<text x="614.0" y="512" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >证明算法正确性</text>
<text x="540.0" y="578" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >论证算法对所有合法输入都能得到正确结</text>
<text x="540.0" y="602" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >果。</text>
<rect x="40.0" y="450" width="380" height="210" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<rect x="40.0" y="450" width="10" height="210" fill="#c98500" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="96.0" cy="506" r="30" fill="#fdf3dd" stroke="#f0d38a" stroke-width="1.5" opacity="1"/>
<text x="96.0" y="516" font-size="28" fill="#8a5f00" font-weight="700" text-anchor="middle"   >6</text>
<text x="144.0" y="512" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >算法分析</text>
<text x="70.0" y="578" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >分析时间复杂度与空间复杂度，评估算法</text>
<text x="70.0" y="602" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >性能优劣。</text>
<rect x="40" y="720" width="1320" height="62" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="66" y="748" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >核心思想</text>
<text x="66" y="770" font-size="14.5" fill="#52514e" font-weight="normal" text-anchor="start"   >算法设计是“问题 → 模型 → 策略 → 实现 → 正确性 → 效率”的迭代过程；分析结果常反过来推动数据结构与策略的重新选择。</text>
</svg>
