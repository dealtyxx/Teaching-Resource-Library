<polyline points="984.00,434.00 988.63,432.82 993.26,431.63 997.88,430.45 1002.51,429.26 1007.14,428.08 1011.77,426.90 1016.39,425.71 1021.02,424.53 1025.65,423.34 1030.28,422.16 1034.90,420.98 1039.53,419.79 1044.16,418.61 1048.79,417.42 1053.41,416.24 1058.04,415.06 1062.67,413.87 1067.30,412.69 1071.93,411.50 1076.55,410.32 1081.18,409.14 1085.81,407.95 1090.44,406.77 1095.06,405.58 1099.69,404.40 1104.32,403.21 1108.95,402.03 1113.57,400.85 1118.20,399.66 1122.83,398.48 1127.46,397.29 1132.09,396.11 1136.71,394.93 1141.34,393.74 1145.97,392.56 1150.60,391.37 1155.22,390.19 1159.85,389.01 1164.48,387.82 1169.11,386.64 1173.73,385.45 1178.36,384.27 1182.99,383.09 1187.62,381.90 1192.24,380.72 1196.87,379.53 1201.50,378.35 1206.13,377.17 1210.76,375.98 1215.38,374.80 1220.01,373.61 1224.64,372.43 1229.27,371.25 1233.89,370.06 1238.52,368.88 1243.15,367.69 1247.78,366.51 1252.40,365.33 1257.03,364.14 1261.66,362.96 1266.29,361.77 1270.91,360.59 1275.54,359.41 1280.17,358.22 1284.80,357.04 1289.43,355.85 1294.05,354.67 1298.68,353.49 1303.31,352.30 1307.94,351.12 1312.56,349.93 1317.19,348.75" fill="none" stroke="#4a3aa7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="1286.1702127659573" y="350.2212765957447" font-size="14.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >c₁·g(n)</text>
<rect x="956" y="454" width="85.94" height="30" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="15.0" opacity="1" />
<text x="998.97" y="474.22" font-size="14.5" fill="#4a3aa7" font-weight="600" text-anchor="middle"   >定义 1.3</text>
<text x="956" y="500" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >存在 c₁、c₂、n₀&gt;0，使 n≥n₀ 时</text>
<text x="956" y="526" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >c₁·g(n) ≤ f(n) ≤ c₂·g(n)</text>
<text x="956" y="552" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start"   >即 f(n) 与 g(n) 同阶</text>
<rect x="956" y="660" width="378" height="52" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="10" opacity="1" />
<text x="970" y="692" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start"   >例：10n²+4n+2 = Θ(n²)</text>
<rect x="40" y="762" width="1320" height="128" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4" rx="14" opacity="1" />
<text x="66" y="798" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start"   >渐进符号的特性</text>
<text x="66.0" y="832" font-size="15.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >· 传递性</text>
<text x="66.0" y="858" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >f=O(g) 且 g=O(h) ⟹ f=</text>
<text x="66.0" y="878" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >O(h)；Ω、Θ 同理</text>
<text x="391.0" y="832" font-size="15.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >· 自反性</text>
<text x="391.0" y="858" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >f(n)=O(f(n))；Ω、Θ 亦成立</text>
<text x="716.0" y="832" font-size="15.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >· 对称性</text>
<text x="716.0" y="858" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >f=Θ(g) ⟺ g=Θ(f)</text>
<text x="1041.0" y="832" font-size="15.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >· 包含关系</text>
<text x="1041.0" y="858" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >f=Θ(g) ⟹ f=O(g) 且 f=</text>
<text x="1041.0" y="878" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >Ω(g)</text>
</svg>
