<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="792" viewBox="0 0 1400 792" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="792" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >分支限界法概述</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >广度优先搜索 + 剪支，找一个解或最优解（6.1）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第6章 分支限界法</text>
<rect x="40" y="122" width="1320" height="76" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="14" opacity="1" />
<text x="66" y="156" font-size="18" fill="#1c5cab" font-weight="700" text-anchor="start"   >分支限界法 ≡ 广度优先搜索（BFS） + 剪支</text>
<text x="66" y="186" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start"   >不含剪支则退化为广度优先遍历；剪支方式与回溯法类似，也通过约束函数和限界函数实现。</text>
<rect x="40" y="218" width="860" height="420" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="258" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >回溯法 vs 分支限界法</text>
<rect x="370" y="272" width="260" height="40" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1" rx="8" opacity="1" />
<text x="500.0" y="298" font-size="16" fill="#b0491d" font-weight="700" text-anchor="middle"   >回溯法</text>
<rect x="650" y="272" width="260" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1" rx="8" opacity="1" />
<text x="780.0" y="298" font-size="16" fill="#1c5cab" font-weight="700" text-anchor="middle"   >分支限界法</text>
<text x="80" y="350" font-size="14.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >搜索方式</text>
<text x="500.0" y="356" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >深度优先 DFS</text>
<text x="780.0" y="356" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >广度优先 BFS</text>
<line x1="70" y1="386" x2="870" y2="386" stroke="#eee" stroke-width="1" stroke-linecap="butt" />
<text x="80" y="418" font-size="14.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >存储结构</text>
<text x="500.0" y="424" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >栈</text>
<text x="780.0" y="424" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >队列 / 优先队列</text>
<line x1="70" y1="454" x2="870" y2="454" stroke="#eee" stroke-width="1" stroke-linecap="butt" />
<text x="80" y="486" font-size="14.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >结点特性</text>
<text x="500.0" y="486" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >只保存根到当前</text>
<text x="500.0" y="508" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >结点的路径</text>
<text x="780.0" y="486" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >每个结点只有一次</text>
<text x="780.0" y="508" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >成为活结点的机会</text>
<line x1="70" y1="522" x2="870" y2="522" stroke="#eee" stroke-width="1" stroke-linecap="butt" />
<text x="80" y="554" font-size="14.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >常用应用</text>
<text x="500.0" y="554" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >求满足约束的</text>
<text x="500.0" y="576" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >所有解</text>
<text x="780.0" y="554" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >求一个解 / 求目标</text>
<text x="780.0" y="576" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="middle"   >函数的最优解</text>
<line x1="70" y1="590" x2="870" y2="590" stroke="#eee" stroke-width="1" stroke-linecap="butt" />
<text x="70" y="616" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >两者都在同一棵解空间树上搜索，区别在于遍历顺序与活结点组织方式。</text>
<rect x="920" y="218" width="440" height="420" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="946" y="258" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >要点与适用</text>
<rect x="948" y="288" width="384" height="60" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<text x="1140.0" y="324" font-size="22" fill="#1c5cab" font-weight="700" text-anchor="middle"   >BFS + 剪支</text>
<rect x="948" y="364" width="384" height="96" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="966" y="392" font-size="14.5" fill="#b0491d" font-weight="700" text-anchor="start"   >剪支手段（同回溯法）</text>
<text x="966" y="420" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 约束函数 constraint()：可行性</text>
<text x="966" y="444" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 限界函数 bound()：最优性</text>
<rect x="948" y="476" width="384" height="128" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="966" y="504" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >适用判断（以迷宫为例）</text>
<text x="966" y="532" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 求所有解 → 用回溯法</text>
<text x="966" y="558" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >· 求一条最短路径（最优解）</text>
<text x="966" y="582" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >  → 用分支限界法</text>
</svg>
