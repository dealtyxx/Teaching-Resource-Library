<text x="918" y="570" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="middle"   >橙色数字 = S 到该格的最少步数；橙格为最短路径</text>
<rect x="648" y="616" width="684" height="126" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="666" y="644" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >三种 BFS 解法</text>
<text x="666" y="670" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >① 基本 BFS：结点带 steps，首次遇到 E 返回 steps</text>
<text x="666" y="694" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >② 分层次 BFS：每处理完一层 ans+1，遇 E 返回 ans</text>
<text x="666" y="718" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >③ 多起点分层次：所有 E 先进队，反向找 S</text>
