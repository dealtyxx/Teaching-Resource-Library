<text x="86" y="676" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >队列 FIFO；沿 &lt;u,v&gt; 边走到 v 时：</text>
<text x="86" y="702" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">dist[v] = dist[u] + 1，v 进队</text>
<text x="86" y="728" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >每步代价相同 → BFS 求出的即最少边数</text>
