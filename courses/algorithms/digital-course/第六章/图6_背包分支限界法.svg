<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="812" viewBox="0 0 1400 812" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="812" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >0/1 背包 · 两种分支限界法</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >上界函数 ub + 左/右剪支，队列式与优先队列式（6.5 / 6.7）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第6章 分支限界法</text>
<rect x="40" y="128" width="720" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >搜索树（cw, cv, ub）</text>
<text x="408" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >按 v/w 排序，W=6，bestv=8</text>
<path d="M 380.0 251 L 280 305" stroke="#52514e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 420.0 251 L 550 305" stroke="#52514e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 230 351 L 190 405" stroke="#52514e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 270 351 L 340 405" stroke="#52514e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 164 451 L 170 505" stroke="#52514e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<path d="M 186 451 L 340 505" stroke="#52514e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<text x="305.0" y="278.0" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   >选i0</text>
<text x="510.0" y="278.0" font-size="11.5" fill="#898781" font-weight="700" text-anchor="middle"   >不选i0</text>
<rect x="341.0" y="205.0" width="118" height="46" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="9" opacity="1" />
<text x="400.0" y="224" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0, 0</text>
<text x="400.0" y="243" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">ub=8</text>
<rect x="191.0" y="305.0" width="118" height="46" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="9" opacity="1" />
<text x="250" y="324" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2, 3</text>
<text x="250" y="343" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">ub=8</text>
<rect x="521.0" y="305.0" width="118" height="46" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="9" opacity="1" />
<text x="580" y="324" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">0, 0</text>
<text x="580" y="343" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">ub=6.6</text>
<rect x="111.0" y="405.0" width="118" height="46" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="9" opacity="1" />
<text x="170" y="424" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5, 7</text>
<text x="170" y="443" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">ub=8</text>
<rect x="281.0" y="405.0" width="118" height="46" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="9" opacity="1" />
<text x="340" y="424" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">2, 3</text>
<text x="340" y="443" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">ub=6.4</text>
<rect x="111.0" y="505.0" width="118" height="46" fill="#e9f7f1" stroke="#127a56" stroke-width="1.4" rx="9" opacity="1" />
<text x="170" y="524" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">6, 8</text>
<text x="170" y="543" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">ub=8</text>
<rect x="281.0" y="505.0" width="118" height="46" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.4" rx="9" opacity="1" />
<text x="340" y="524" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">5, 7</text>
<text x="340" y="543" font-size="12" fill="#1c5cab" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">ub=7.8</text>
<text x="170" y="568" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >叶子 → bestv=8</text>
<rect x="521.0" y="425.0" width="118" height="46" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.4" rx="9" opacity="1" />
<text x="580" y="444" font-size="13.5" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">1, 1</text>
<text x="580" y="463" font-size="12" fill="#b3201f" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">ub=5</text>
<path d="M 580 351 L 580 425" stroke="#e34948" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" stroke-dasharray="4 3"/>
<text x="534" y="418" font-size="18" fill="#e34948" text-anchor="middle">✗</text>
<text x="580" y="488" font-size="11.5" fill="#b3201f" font-weight="700" text-anchor="middle"   >ub=5 ≤ bestv → 右剪支</text>
<rect x="780" y="128" width="580" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="806" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >上界与剪支 · 两种队列</text>
<rect x="808" y="198" width="524" height="54" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="826" y="224" font-size="14.5" fill="#b0491d" font-weight="700" text-anchor="start"   >上界 ub</text>
<text x="826" y="244" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >按 v/w 贪心装满剩余容量（末件可部分）的价值</text>
<rect x="808" y="264" width="524" height="52" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="826" y="290" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">左剪支：cw+w[i] ≤ W 才进左孩子</text>
<text x="826" y="310" font-size="10" fill="#52514e" font-weight="normal" text-anchor="start"   ></text>
<rect x="808" y="324" width="524" height="40" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="10" opacity="1" />
<text x="826" y="349" font-size="13.5" fill="#1c5cab" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">右剪支：ub &gt; bestv 才进右孩子</text>
<rect x="808" y="380" width="524" height="112" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="826" y="408" font-size="14.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >① 队列式（6.5）</text>
<text x="826" y="434" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >FIFO 队列，一层一层扩展；结点按生成</text>
<text x="826" y="456" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >顺序出队。</text>
<text x="826" y="480" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >适合系统地遍历整棵解空间树。</text>
<rect x="808" y="504" width="524" height="112" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="826" y="532" font-size="14.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >② 优先队列式（6.7）</text>
<text x="826" y="558" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >ub 越大越优先出队，跳跃式扩展，</text>
<text x="826" y="580" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >更快找到好解 → 更早剪支。</text>
<text x="826" y="604" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   >结点带 ub 值参与优先级比较。</text>
<rect x="808" y="628" width="524" height="104" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="826" y="656" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >复杂度</text>
<text x="826" y="684" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >满二叉解空间树，bound() 为 O(n)；</text>
<text x="826" y="708" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >两种方式最坏均为 O(n·2ⁿ)（剪支省下的与实例相关）。</text>
</svg>
