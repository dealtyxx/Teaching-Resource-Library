<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="0" y="0" width="1400" height="800" fill="#f9f9f7"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#52514e"/>
</marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2a78d6"/>
</marker>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#eb6834"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
  <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#127a56"/>
</marker>
<marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M1,1 L8,4.5 L1,8 Z" fill="#898781"/>
</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >限界函数与活结点表</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >上界/下界函数的单调性，队列 / 优先队列组织（6.1.2）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第6章 分支限界法</text>
<rect x="40" y="128" width="660" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >限界函数的单调性</text>
<rect x="68" y="196" width="604" height="156" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="224" font-size="15" fill="#b0491d" font-weight="700" text-anchor="start"   >上界函数 ub（目标求最大值）</text>
<text x="70" y="264" font-size="15" fill="#b0491d" font-weight="700" text-anchor="start"   ></text>
<path d="M 150 284 L 230 284" stroke="#898781" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<circle cx="130" cy="284" r="20" fill="#fff" stroke="#eb6834" stroke-width="1.8" opacity="1"/>
<text x="130" y="289" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   >x₀</text>
<rect x="104" y="232" width="52" height="26" fill="#eb6834" stroke="none" stroke-width="1" rx="6" opacity="0.14" />
<text x="130" y="250" font-size="14" fill="#b0491d" font-weight="700" text-anchor="middle"   >10</text>
<path d="M 270 284 L 350 284" stroke="#898781" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<circle cx="250" cy="284" r="20" fill="#fff" stroke="#eb6834" stroke-width="1.8" opacity="1"/>
<text x="250" y="289" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   >x₁</text>
<rect x="224" y="232" width="52" height="26" fill="#eb6834" stroke="none" stroke-width="1" rx="6" opacity="0.14" />
<text x="250" y="250" font-size="14" fill="#b0491d" font-weight="700" text-anchor="middle"   >9</text>
<path d="M 390 284 L 470 284" stroke="#898781" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<circle cx="370" cy="284" r="20" fill="#fff" stroke="#eb6834" stroke-width="1.8" opacity="1"/>
<text x="370" y="289" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   >…</text>
<rect x="344" y="232" width="52" height="26" fill="#eb6834" stroke="none" stroke-width="1" rx="6" opacity="0.14" />
<text x="370" y="250" font-size="14" fill="#b0491d" font-weight="700" text-anchor="middle"   >…</text>
<circle cx="490" cy="284" r="20" fill="#fff" stroke="#eb6834" stroke-width="1.8" opacity="1"/>
<text x="490" y="289" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   >xₖ</text>
<rect x="464" y="232" width="52" height="26" fill="#eb6834" stroke="none" stroke-width="1" rx="6" opacity="0.14" />
<text x="490" y="250" font-size="14" fill="#b0491d" font-weight="700" text-anchor="middle"   >8</text>
<text x="70" y="326" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >沿路径单调不增：ub(x₀) ≥ ub(x₁) ≥ … ≥ ub(xₖ)</text>
<text x="86" y="342" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   >剪支：仅扩展 ub &gt; bestv 的结点</text>
<rect x="68" y="372" width="604" height="156" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="400" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >下界函数 lb（目标求最小值）</text>
<text x="70" y="440" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   ></text>
<path d="M 150 460 L 230 460" stroke="#898781" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<circle cx="130" cy="460" r="20" fill="#fff" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="130" y="465" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >x₀</text>
<rect x="104" y="408" width="52" height="26" fill="#127a56" stroke="none" stroke-width="1" rx="6" opacity="0.14" />
<text x="130" y="426" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >5</text>
<path d="M 270 460 L 350 460" stroke="#898781" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<circle cx="250" cy="460" r="20" fill="#fff" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="250" y="465" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >x₁</text>
<rect x="224" y="408" width="52" height="26" fill="#127a56" stroke="none" stroke-width="1" rx="6" opacity="0.14" />
<text x="250" y="426" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >6</text>
<path d="M 390 460 L 470 460" stroke="#898781" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arr)" />
<circle cx="370" cy="460" r="20" fill="#fff" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="370" y="465" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >…</text>
<rect x="344" y="408" width="52" height="26" fill="#127a56" stroke="none" stroke-width="1" rx="6" opacity="0.14" />
<text x="370" y="426" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >…</text>
<circle cx="490" cy="460" r="20" fill="#fff" stroke="#127a56" stroke-width="1.8" opacity="1"/>
<text x="490" y="465" font-size="12" fill="#127a56" font-weight="700" text-anchor="middle"   >xₖ</text>
<rect x="464" y="408" width="52" height="26" fill="#127a56" stroke="none" stroke-width="1" rx="6" opacity="0.14" />
<text x="490" y="426" font-size="14" fill="#127a56" font-weight="700" text-anchor="middle"   >8</text>
<text x="70" y="502" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >沿路径单调不减：lb(x₀) ≤ lb(x₁) ≤ … ≤ lb(xₖ)</text>
<text x="86" y="518" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >剪支：仅扩展 lb &lt; bestc 的结点</text>
<rect x="68" y="552" width="604" height="96" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="86" y="580" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   >为什么限界函数比回溯法更关键？</text>
<text x="86" y="608" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >BFS 活结点多，好的限界函数能优先/尽早</text>
<text x="86" y="632" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >剪掉大量无望分支，显著减少搜索规模。</text>
<rect x="720" y="128" width="640" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="746" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >活结点表的两种组织</text>
<rect x="748" y="198" width="584" height="120" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="226" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="start"   >① 队列式（FIFO 队列）</text>
<rect x="780" y="246" width="48" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="7" opacity="1" />
<text x="804" y="272" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >A</text>
<rect x="836" y="246" width="48" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="7" opacity="1" />
<text x="860" y="272" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >B</text>
<rect x="892" y="246" width="48" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="7" opacity="1" />
<text x="916" y="272" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >C</text>
<rect x="948" y="246" width="48" height="40" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="7" opacity="1" />
<text x="972" y="272" font-size="15" fill="#1c5cab" font-weight="700" text-anchor="middle"   >D</text>
<path d="M 766 266 L 778 266" stroke="#eb6834" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrO)" />
<text x="740" y="271" font-size="12" fill="#b0491d" font-weight="700" text-anchor="middle"   >出</text>
<text x="766" y="308" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >先进先出，一层一层扩展（同 BFS）</text>
<rect x="748" y="330" width="584" height="130" fill="#f6f4fb" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="358" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="start"   >② 优先队列式（priority_queue）</text>
<rect x="780" y="378" width="48" height="40" fill="#efeaf9" stroke="#3a2e86" stroke-width="1.6" rx="7" opacity="1" />
<text x="804" y="404" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="middle"   >9</text>
<rect x="836" y="378" width="48" height="40" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="7" opacity="1" />
<text x="860" y="404" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="middle"   >6</text>
<rect x="892" y="378" width="48" height="40" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="7" opacity="1" />
<text x="916" y="404" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="middle"   >8</text>
<rect x="948" y="378" width="48" height="40" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="7" opacity="1" />
<text x="972" y="404" font-size="15" fill="#3a2e86" font-weight="700" text-anchor="middle"   >4</text>
<text x="804" y="434" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   >↑ ub 最大，最先出队</text>
<text x="766" y="454" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start"   >选限界值最优的活结点扩展 → 跳跃式，更快逼近解</text>
<rect x="748" y="472" width="584" height="160" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="12" opacity="1" />
<text x="766" y="500" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   >如何求最优解的解向量</text>
<text x="766" y="528" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >法1 · 每个结点保存根→该结点的路径（解向量）</text>
<text x="766" y="552" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      结点=[1,0,1]，空间较大</text>
<text x="766" y="580" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >法2 · 每个结点保存双亲指针，反推路径</text>
<text x="766" y="604" font-size="12.5" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">      结点=(状态, parent)，节省空间</text>
<text x="750" y="740" font-size="13" fill="#898781" font-weight="normal" text-anchor="start"   >时间分析同回溯法：子集树 O(cⁿ)，排列树 O(n!)。</text>
</svg>
