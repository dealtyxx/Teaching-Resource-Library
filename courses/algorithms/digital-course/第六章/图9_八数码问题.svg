<text x="666" y="536" font-size="14.5" fill="#127a56" font-weight="700" text-anchor="start"   >为什么用 A* 而非纯 BFS？</text>
<text x="666" y="562" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >h 提供“离目标还有多远”的估计，f 小的状态优先扩展，</text>
<text x="666" y="586" font-size="13.5" fill="#52514e" font-weight="normal" text-anchor="start"   >大幅减少无谓状态的搜索，更快逼近目标。</text>
<rect x="648" y="622" width="684" height="118" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="666" y="648" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">int geth(string &amp;str) {   // 错位格数</text>
<text x="666" y="668" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  int h=0;</text>
<text x="666" y="688" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  for (i=0;i&lt;9;i++)</text>
<text x="666" y="708" font-size="12.5" fill="#b3201f" font-weight="600" text-anchor="start"   font-family="ui-monospace,monospace">    if (goal[i]!='0' &amp;&amp; goal[i]!=str[i]) h++;</text>
<text x="666" y="728" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">  return h; }</text>
