<text x="1106" y="378" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   >结点1放士兵可看守</text>
<text x="1106" y="396" font-size="11" fill="#127a56" font-weight="700" text-anchor="start"   >0-1、1-2、1-3 三条边</text>
<rect x="810" y="500" width="526" height="116" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
