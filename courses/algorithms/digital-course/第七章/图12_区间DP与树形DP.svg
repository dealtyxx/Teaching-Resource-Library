<text x="80" y="744" font-size="13.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">最少数乘 dp[1][6] = 15125</text>
<text x="80" y="768" font-size="12.5" fill="#52514e" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">最优加括号：((A1(A2A3))((A4A5)A6))    时间 O(n³)</text>
<rect x="786" y="128" width="574" height="680" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="812" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >树形 DP · 最少士兵数</text>
<text x="1110" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >放士兵看守所有边</text>
<rect x="810" y="186" width="526" height="66" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="826" y="211" font-size="11.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >dp[i][1]：结点 i 上放士兵时子树最少士兵数</text>
<text x="826" y="233" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   >dp[i][0]：结点 i 上不放士兵时子树最少士兵数</text>
