<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >进阶模型 · 区间 DP 与 树形 DP</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >矩阵连乘（7.13，区间）与 最少士兵数（7.12，树形）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第7章 动态规划</text>
<rect x="40" y="128" width="726" height="680" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >区间 DP · 矩阵连乘</text>
<text x="342" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >枚举分割点 m</text>
<rect x="64" y="186" width="678" height="48" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="206" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start"   >dp[i][j] = 计算连乘 A[i..j] 的最少数乘次数</text>
<text x="80" y="226" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">A[i..j] 是 p[i−1]×p[j] 的矩阵</text>
<text x="80" y="250" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >枚举分割点 m（i≤m&lt;j）：A[i..j] = (A[i..m]) × (A[m+1..j])</text>
<rect x="160" y="264" width="150" height="40" fill="#e9f7f1" stroke="#127a56" stroke-width="1.5" rx="8" opacity="1" />
<text x="235.0" y="289" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">A[i..m]</text>
<rect x="340" y="264" width="160" height="40" fill="#fdf1ec" stroke="#b0491d" stroke-width="1.5" rx="8" opacity="1" />
<text x="420.0" y="289" font-size="12.5" fill="#b0491d" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">A[m+1..j]</text>
<text x="325" y="289" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >×</text>
<text x="520" y="289" font-size="12" fill="#b3406e" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">→ p[i−1]·p[m]·p[j]</text>
<rect x="64" y="322" width="678" height="62" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="80" y="347" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >状态转移方程（区间长度 len 由小到大）</text>
<text x="80" y="372" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">dp[i][j]=minᵢ≤ₘ&lt;ⱼ{ dp[i][m]+dp[m+1][j]+p[i−1]·p[m]·p[j] }</text>
<text x="80" y="414" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="start"   >示例 p={30,35,15,5,10,20,25}（A1[30×35]…A6[20×25]）</text>
<text x="178.0" y="450" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">j=1</text>
<text x="262.0" y="450" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">j=2</text>
<text x="346.0" y="450" font-size="11" fill="#898781" font-weight="700" text-anchor="middle"   font-family="ui-monospace,monospace">j=3</text>
