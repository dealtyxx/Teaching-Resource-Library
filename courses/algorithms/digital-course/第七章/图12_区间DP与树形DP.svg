<text x="826" y="550" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">放士兵：dp[i][1] = 1 + Σ min(dp[c][1], dp[c][0])</text>
<text x="826" y="570" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="start"   >                （子结点可放可不放）</text>
<text x="826" y="592" font-size="11.5" fill="#b0491d" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">不放：  dp[i][0] = Σ dp[c][1]</text>
<text x="826" y="608" font-size="10.5" fill="#898781" font-weight="normal" text-anchor="start"   >                （子结点必须都放，守住 i-c 边）</text>
<rect x="810" y="630" width="526" height="82" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<text x="826" y="656" font-size="12.5" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">答案 = min(dp[root][0], dp[root][1])</text>
<text x="826" y="680" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">本例 min(dp[0][0]=1, dp[0][1]=2) = 1</text>
<text x="826" y="700" font-size="12" fill="#127a56" font-weight="700" text-anchor="start"   >→ 只需在结点 1 放 1 名士兵。</text>
<rect x="810" y="726" width="526" height="62" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="826" y="752" font-size="12.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >树形 DP 要点</text>
<text x="826" y="774" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start"   >自底向上（DFS）合并子树信息，每结点 O(度数)。</text>
