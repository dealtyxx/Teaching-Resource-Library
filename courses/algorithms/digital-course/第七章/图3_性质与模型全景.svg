</marker>
</defs>
<text x="700.0" y="60" font-size="36" fill="#0b0b0b" font-weight="700" text-anchor="middle"   >动态规划的性质 · 类型 · 模型全景</text>
<text x="700.0" y="94" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle"   >三大性质、三类问题，以及本章各问题的 DP 模型分类（7.1.3）</text>
<text x="1360" y="40" font-size="13" fill="#898781" font-weight="normal" text-anchor="end"   >算法设计与分析 · 第7章 动态规划</text>
<rect x="40" y="128" width="512" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="66" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >三大性质</text>
<rect x="64" y="190" width="464" height="122" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.3" rx="12" opacity="1" />
<rect x="64" y="190" width="8" height="122" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="92" cy="220" r="13" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"/>
<text x="92" y="225" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle"   >1</text>
<text x="116" y="226" font-size="16.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >最优子结构</text>
<text x="84" y="252" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >问题的最优解所包含的子问题的解</text>
<text x="84" y="272" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >也是最优的 → 可由子问题最优解拼出</text>
<text x="84" y="292" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >大问题最优解。常用反证法证明。</text>
<rect x="64" y="324" width="464" height="122" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.3" rx="12" opacity="1" />
<rect x="64" y="324" width="8" height="122" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="92" cy="354" r="13" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"/>
<text x="92" y="359" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle"   >2</text>
<text x="116" y="360" font-size="16.5" fill="#127a56" font-weight="700" text-anchor="start"   >无后效性</text>
<text x="84" y="386" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >某阶段状态一旦确定，此后过程的</text>
<text x="84" y="406" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >演变不再受此前各状态及决策的影响</text>
<text x="84" y="426" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >（k=2 阶段仅与 k=3 阶段相关）。</text>
<rect x="64" y="458" width="464" height="122" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.3" rx="12" opacity="1" />
<rect x="64" y="458" width="8" height="122" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<circle cx="92" cy="488" r="13" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"/>
<text x="92" y="493" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle"   >3</text>
<text x="116" y="494" font-size="16.5" fill="#b0491d" font-weight="700" text-anchor="start"   >重叠子问题</text>
<text x="84" y="520" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >分解出的子问题彼此不独立，一些</text>
<text x="84" y="540" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >子问题会在后续决策中被多次重复</text>
<text x="84" y="560" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >使用 → 记录其解并复用（DP 的关键）。</text>
<rect x="64" y="592" width="464" height="96" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.3" rx="12" opacity="1" />
<text x="84" y="622" font-size="14.5" fill="#0b0b0b" font-weight="700" text-anchor="start"   >动态规划求解的三类问题</text>
<rect x="84" y="638" width="150" height="36" fill="#fdeef4" stroke="none" stroke-width="1" rx="8" opacity="1" />
<text x="96" y="654" font-size="13.5" fill="#b3406e" font-weight="700" text-anchor="start"   >求最值</text>
<text x="96" y="670" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >目标函数的最大 / 最小值</text>
<rect x="240" y="638" width="150" height="36" fill="#eceaf7" stroke="none" stroke-width="1" rx="8" opacity="1" />
<text x="252" y="654" font-size="13.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >判可行</text>
<text x="252" y="670" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >判断某个条件是否可行</text>
<rect x="396" y="638" width="150" height="36" fill="#e9f7f1" stroke="none" stroke-width="1" rx="8" opacity="1" />
<text x="408" y="654" font-size="13.5" fill="#127a56" font-weight="700" text-anchor="start"   >计方案</text>
<text x="408" y="670" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start"   >统计满足条件的方案数</text>
<rect x="572" y="128" width="788" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="598" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >本章 DP 模型全景</text>
<text x="830" y="167" font-size="14" fill="#898781" font-weight="normal" text-anchor="start"   >dp 状态维度 → 问题分类</text>
<rect x="596" y="188" width="740" height="76" fill="#eef4fc" stroke="#b7d3f6" stroke-width="1.2" rx="11" opacity="1" />
<rect x="596" y="188" width="8" height="76" fill="#2a78d6" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="618" y="218" font-size="15.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >线性 / 序列 DP</text>
<text x="618" y="243" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">dp[i]：以第 i 个元素结尾的最优值</text>
<rect x="1210" y="211.0" width="110" height="30" fill="#ffffff" stroke="#b7d3f6" stroke-width="1.1" rx="8" opacity="1" />
<text x="1265.0" y="231.0" font-size="12" fill="#1c5cab" font-weight="600" text-anchor="middle"   >最长递增子序列 7.3</text>
<rect x="1084" y="211.0" width="118" height="30" fill="#ffffff" stroke="#b7d3f6" stroke-width="1.1" rx="8" opacity="1" />
<text x="1143.0" y="231.0" font-size="12" fill="#1c5cab" font-weight="600" text-anchor="middle"   >最大连续子序列和 7.2</text>
<rect x="596" y="268.5" width="740" height="76" fill="#e9f7f1" stroke="#a9e0cb" stroke-width="1.2" rx="11" opacity="1" />
<rect x="596" y="268.5" width="8" height="76" fill="#1baf7a" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="618" y="298.5" font-size="15.5" fill="#127a56" font-weight="700" text-anchor="start"   >坐标 / 网格 DP</text>
<text x="618" y="323.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">dp[i][j]：到达格子 (i,j) 的最优值</text>
<rect x="1226" y="291.5" width="94" height="30" fill="#ffffff" stroke="#a9e0cb" stroke-width="1.1" rx="8" opacity="1" />
<text x="1273.0" y="311.5" font-size="12" fill="#127a56" font-weight="600" text-anchor="middle"   >扔鸡蛋问题 7.9</text>
<rect x="1108" y="291.5" width="110" height="30" fill="#ffffff" stroke="#a9e0cb" stroke-width="1.1" rx="8" opacity="1" />
<text x="1163.0" y="311.5" font-size="12" fill="#127a56" font-weight="600" text-anchor="middle"   >三角形最小路径 7.4</text>
<rect x="596" y="349.0" width="740" height="76" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="11" opacity="1" />
<rect x="596" y="349.0" width="8" height="76" fill="#4a3aa7" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="618" y="379.0" font-size="15.5" fill="#4a3aa7" font-weight="700" text-anchor="start"   >双序列 DP</text>
<text x="618" y="404.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">dp[i][j]：a 前 i 个与 b 前 j 个的最优值</text>
<rect x="1234" y="372.0" width="86" height="30" fill="#ffffff" stroke="#cbc4ee" stroke-width="1.1" rx="8" opacity="1" />
<text x="1277.0" y="392.0" font-size="12" fill="#4a3aa7" font-weight="600" text-anchor="middle"   >编辑距离 7.6</text>
<rect x="1116" y="372.0" width="110" height="30" fill="#ffffff" stroke="#cbc4ee" stroke-width="1.1" rx="8" opacity="1" />
<text x="1171.0" y="392.0" font-size="12" fill="#4a3aa7" font-weight="600" text-anchor="middle"   >最长公共子序列 7.5</text>
<rect x="596" y="429.5" width="740" height="76" fill="#fdf1ec" stroke="#f3c1ac" stroke-width="1.2" rx="11" opacity="1" />
<rect x="596" y="429.5" width="8" height="76" fill="#eb6834" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="618" y="459.5" font-size="15.5" fill="#b0491d" font-weight="700" text-anchor="start"   >背包 DP</text>
<text x="618" y="484.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">dp[i][r]：前 i 个物品、容量 r 的最优值</text>
<rect x="1226" y="452.5" width="94" height="30" fill="#ffffff" stroke="#f3c1ac" stroke-width="1.1" rx="8" opacity="1" />
<text x="1273.0" y="472.5" font-size="12" fill="#b0491d" font-weight="600" text-anchor="middle"   >资源分配 7.10</text>
<rect x="1108" y="452.5" width="110" height="30" fill="#ffffff" stroke="#f3c1ac" stroke-width="1.1" rx="8" opacity="1" />
<text x="1163.0" y="472.5" font-size="12" fill="#b0491d" font-weight="600" text-anchor="middle"   >完全/多重背包 7.8</text>
<rect x="998" y="452.5" width="102" height="30" fill="#ffffff" stroke="#f3c1ac" stroke-width="1.1" rx="8" opacity="1" />
<text x="1049.0" y="472.5" font-size="12" fill="#b0491d" font-weight="600" text-anchor="middle"   >0/1 背包 7.7</text>
<rect x="596" y="510.0" width="740" height="76" fill="#fdeef4" stroke="#f3c1d3" stroke-width="1.2" rx="11" opacity="1" />
<rect x="596" y="510.0" width="8" height="76" fill="#e87ba4" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="618" y="540.0" font-size="15.5" fill="#b3406e" font-weight="700" text-anchor="start"   >区间 DP</text>
<text x="618" y="565.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">dp[i][j]：区间 [i,j] 的最优值，枚举分割点</text>
<rect x="1226" y="533.0" width="94" height="30" fill="#ffffff" stroke="#f3c1d3" stroke-width="1.1" rx="8" opacity="1" />
<text x="1273.0" y="553.0" font-size="12" fill="#b3406e" font-weight="600" text-anchor="middle"   >矩阵连乘 7.13</text>
<rect x="596" y="590.5" width="740" height="76" fill="#e6f4e6" stroke="#a9d8a9" stroke-width="1.2" rx="11" opacity="1" />
<rect x="596" y="590.5" width="8" height="76" fill="#008300" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="618" y="620.5" font-size="15.5" fill="#0a6b0a" font-weight="700" text-anchor="start"   >树形 DP</text>
<text x="618" y="645.5" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">dp[i][0/1]：以 i 为根子树的最优值（DFS）</text>
<rect x="1218" y="613.5" width="102" height="30" fill="#ffffff" stroke="#a9d8a9" stroke-width="1.1" rx="8" opacity="1" />
<text x="1269.0" y="633.5" font-size="12" fill="#0a6b0a" font-weight="600" text-anchor="middle"   >最少士兵数 7.12</text>
<rect x="596" y="671.0" width="740" height="76" fill="#fdeceb" stroke="#f3b7b6" stroke-width="1.2" rx="11" opacity="1" />
<rect x="596" y="671.0" width="8" height="76" fill="#e34948" stroke="none" stroke-width="1" rx="0" opacity="1" />
<text x="618" y="701.0" font-size="15.5" fill="#b3201f" font-weight="700" text-anchor="start"   >状态压缩 DP</text>
<text x="618" y="726.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">dp[V][i]：用位掩码 V 表示已访问集合</text>
<rect x="1218" y="694.0" width="102" height="30" fill="#ffffff" stroke="#f3b7b6" stroke-width="1.1" rx="8" opacity="1" />
<text x="1269.0" y="714.0" font-size="12" fill="#b3201f" font-weight="600" text-anchor="middle"   >旅行商问题 7.11</text>
</svg>
