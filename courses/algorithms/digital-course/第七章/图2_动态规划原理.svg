<text x="172" y="710" font-size="15" fill="#127a56" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">A → B3 → C2 → D2 → E</text>
<text x="84" y="731" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >阶段 k（k=1~5），状态变量 xₖ∈Sₖ；某段状态一旦确定，其后演变与此前决策无关（无后效性）。</text>
<rect x="832" y="128" width="528" height="636" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5" rx="16" opacity="1" />
<text x="858" y="168" font-size="22" fill="#0b0b0b" font-weight="700" text-anchor="start"   >逆序 与 顺序 解法</text>
<rect x="856" y="188" width="480" height="66" fill="#fff7f2" stroke="#f3c1ac" stroke-width="1.2" rx="12" opacity="1" />
<text x="872" y="214" font-size="14" fill="#b0491d" font-weight="700" text-anchor="start"   >① 逆序解法（从 E 反推到 A）</text>
<text x="872" y="240" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(E)=0;  f(s)=min{ c(s,s')+f(s') }</text>
<rect x="856" y="268" width="480" height="168" fill="#fbfbfa" stroke="#e1e0d9" stroke-width="1.2" rx="12" opacity="1" />
<text x="872" y="298" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >第5阶段</text>
<text x="948" y="298" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">f(E)=0</text>
<text x="872" y="328" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >第4阶段</text>
<text x="948" y="328" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">f(D1)=3   f(D2)=4</text>
<text x="1320" y="328" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="end"   >next→E</text>
<text x="872" y="358" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >第3阶段</text>
<text x="948" y="358" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">f(C1)=7   f(C2)=7</text>
<text x="1320" y="358" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="end"   >→D1 / →D2</text>
<text x="872" y="388" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >第2阶段</text>
<text x="948" y="388" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">f(B1)=11  f(B2)=10  f(B3)=9</text>
<text x="1320" y="388" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="end"   >B3→C2</text>
<text x="872" y="418" font-size="12.5" fill="#1c5cab" font-weight="700" text-anchor="start"   >第1阶段</text>
<text x="948" y="418" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   font-family="ui-monospace,monospace">f(A)=12</text>
<text x="1320" y="418" font-size="11.5" fill="#127a56" font-weight="700" text-anchor="end"   >A→B3</text>
<text x="948" y="446" font-size="11" fill="#898781" font-weight="normal" text-anchor="start"   >f(s) = 状态 s 到终点 E 的最短路径长度</text>
<rect x="856" y="458" width="480" height="84" fill="#f4f7fb" stroke="#b7d3f6" stroke-width="1.2" rx="12" opacity="1" />
<text x="872" y="484" font-size="14" fill="#1c5cab" font-weight="700" text-anchor="start"   >② 顺序解法（从 A 正推到 E）</text>
<text x="872" y="510" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start"   font-family="ui-monospace,monospace">f(A)=0;  f(t)=min{ f(t')+c(t',t) }</text>
<text x="872" y="532" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start"   >f(t)=初始状态 A 到状态 t 的最短路径长度，与逆序对称</text>
<rect x="856" y="552" width="480" height="186" fill="#eceaf7" stroke="#cbc4ee" stroke-width="1.2" rx="12" opacity="1" />
<text x="872" y="580" font-size="14.5" fill="#3a2e86" font-weight="700" text-anchor="start"   >动态规划求解 5 步骤</text>
<text x="872" y="606" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >① 确定状态：各阶段的情况用不同状态表示</text>
<text x="872" y="632" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >② 确定状态转移方程：阶段间状态与指标的关系</text>
<text x="872" y="658" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >③ 确定初始条件与边界情况：递推的起点/特殊情形</text>
<text x="872" y="684" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >④ 确定计算顺序：顺序求解还是逆序求解</text>
<text x="872" y="710" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start"   >⑤ 消除冗余：如用滚动数组提升时空性能</text>
