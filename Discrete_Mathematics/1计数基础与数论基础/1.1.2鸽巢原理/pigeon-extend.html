    <script>
        var $ = function (id) { return document.getElementById(id); };
        function renderHash() {
            var k = +$('kSlider').value, m = +$('mSlider').value;
            $('kVal').textContent = k; $('mVal').textContent = m;
            var buckets = []; for (var i = 0; i < m; i++) buckets.push([]);
            for (var key = 1; key <= k; key++) { var h = (key * 13 + 5) % m; buckets[h].push(key); }
            var collisions = 0, html = '';
            buckets.forEach(function (arr, i) {
                if (arr.length >= 2) collisions += arr.length - 1;
                var chips = arr.map(function (x) { return '<span class="key-chip">k' + x + '</span>'; }).join('');
                html += '<div class="bucket' + (arr.length >= 2 ? ' hit' : '') + '"><div class="bk-lbl">桶' + i + '</div>' + chips + '</div>';
            });
            $('buckets').innerHTML = html;
            var v = $('hashVerdict');
            if (k > m) { v.className = 'verdict must'; v.innerHTML = '✅ <b>k=' + k + ' &gt; m=' + m + '</b>：鸽巢原理保证<b>必然冲突</b>（本次有 ' + collisions + ' 次冲突）。再怎么换哈希函数都躲不掉。'; }
            else { v.className = 'verdict maybe'; v.innerHTML = '🟡 <b>k=' + k + ' ≤ m=' + m + '</b>：理论上可能无冲突，但好的哈希也未必做到（本次 ' + collisions + ' 次冲突）。把 k 调到比 m 大试试。'; }
        }
        function renderBirthday() {
            var p = +$('pSlider').value; $('pVal').textContent = p;
            var prob = 1; for (var i = 0; i < p; i++) prob *= (365 - i) / 365;
            var col = (1 - prob) * 100;
            $('bdProb').textContent = col.toFixed(1) + '%';
            $('bdFill').style.width = Math.min(100, col) + '%';
            var note = p >= 366 ? '（≥366 人时，鸽巢原理保证 100% 必有同生日）' : '';
            $('bdText').innerHTML = p + ' 人中至少两人同一天生日的概率 ≈ <b>' + col.toFixed(1) + '%</b>。仅 23 人就超过 50%！——远比直觉小，因为「配对」的组合数随人数迅速增长。' + note;
        }
        $('kSlider').oninput = renderHash; $('mSlider').oninput = renderHash;
        $('pSlider').oninput = renderBirthday;
        renderHash(); renderBirthday();
    </script>
