                    <div class="info-panel">
                        <h3>简单鸽巢原理</h3>
                        <p>把 m 个鸽子放进 n 个巢，只要 <b>m &gt; n</b>，无论怎么放，<b>必有一个巢里 ≥ 2 只</b>。</p>
                        <p class="political-text">不靠枚举、靠推理就断定「必然」——透过现象看本质。</p>
                    </div>

    <script>
        var $ = function (id) { return document.getElementById(id); };
        function render() {
            var n = +$('nSlider').value, m = +$('mSlider').value;
            $('nVal').textContent = n; $('mVal').textContent = m;
            // 最均匀分配：round-robin
            var holes = []; for (var i = 0; i < n; i++) holes.push(0);
            for (var p = 0; p < m; p++) holes[p % n]++;
            var maxc = Math.max.apply(null, holes);
            var minGuaranteed = Math.ceil(m / n);
            var html = '';
            holes.forEach(function (c, i) {
                var collide = c >= 2 && c === maxc;
                var pgs = ''; for (var j = 0; j < c; j++) pgs += '<div class="pg">🕊️</div>';
                html += '<div class="hole' + (collide ? ' collide' : '') + '"><div class="lbl">巢 ' + (i + 1) + '</div><div class="pgs">' + pgs + '</div><div class="cnt">' + c + ' 只</div></div>';
            });
            $('holesRow').innerHTML = html;
            $('formulaLine').innerHTML = 'm=' + m + ', n=' + n + ' → ' + (m > n ? 'm &gt; n ✓' : 'm ≤ n') + ' ｜ ⌈m/n⌉ = ' + minGuaranteed;
            var v = $('verdict');
            if (m > n) {
                v.className = 'verdict must';
                v.innerHTML = '✅ 因为 <b>' + m + ' &gt; ' + n + '</b>，无论怎么放，<b>必有一个巢 ≥ 2 只</b>（本例最大巢有 ' + maxc + ' 只）。这就是鸽巢原理——只断言「必然存在」，不指定是哪个巢。';
            } else {
                v.className = 'verdict maybe';
                v.innerHTML = '🟢 当前 <b>' + m + ' ≤ ' + n + '</b>，可以做到每巢至多 1 只、互不重复。把 m 调到比 n 大，看看会发生什么？';
            }
        }
        $('nSlider').oninput = render; $('mSlider').oninput = render;
        $('placeBtn').onclick = render;
        render();
    </script>
