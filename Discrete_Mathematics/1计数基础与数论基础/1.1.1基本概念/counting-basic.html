    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">

                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>

                <p class="subtitle">●○○ 加法法则 · 乘法法则 · 建立直觉</p>
            </div>

            <div class="controls-wrapper">

                <div class="control-group">
                    <label>选择法则</label>
                    <div class="principle-buttons">
                        <button class="principle-btn active" id="btnAdd" aria-label="加法法则">
                            <span class="icon">+</span><span class="text">加法法则</span>
                        </button>
                        <button class="principle-btn" id="btnMul" aria-label="乘法法则">
                            <span class="icon">×</span><span class="text">乘法法则</span>
                        </button>
                    </div>
                </div>

                <div class="control-group" id="addCtl">
                    <label>分类相加（每类方法数）</label>
                    <div class="param-item">
                        <div class="param-label">类别数 k<span class="value" id="kVal">3</span></div>
                        <input type="range" id="kRange" min="2" max="5" value="3">
                    </div>
                    <div id="addPer"></div>
                </div>

                <div class="control-group" id="mulCtl" style="display:none">
                    <label>分步相乘（每步选项数）</label>
                    <div class="param-item">
                        <div class="param-label">步骤数<span class="value" id="sVal">3</span></div>
                        <input type="range" id="sRange" min="2" max="4" value="3">
                    </div>
                    <div id="mulPer"></div>
                </div>

                <div class="control-group">
                    <label>原理说明</label>
                    <div class="info-panel">
                        <h3 id="pName">加法法则</h3>
                        <p id="pDesc">分类相加：完成一件事有 k 类互斥方法，方法数相加。各类之间「选其一即可」。</p>
                        <p class="political-text">象征多元化发展路径的选择与包容。</p>
                    </div>
                </div>

                <div class="control-group">
                    <label>计算结果</label>
                    <div class="result-panel">
                        <div class="formula-display"><span id="formula">n₁ + n₂ + n₃</span></div>
                        <div class="result-display">
                            <span class="result-label">总方案数</span>
                            <span class="result-value" id="num">0</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="actions-footer">
                <button id="resetBtn" class="apple-btn secondary-btn" aria-label="重置">↺ 重置</button>

    <script>
        var mode = 'add';
        var addCounts = [2, 3, 4, 2, 3];
        var mulCounts = [2, 3, 2, 3];
        var $ = function (id) { return document.getElementById(id); };

        function buildPer(listId, k, arr, label) {
            var box = $(listId); box.innerHTML = '';
            for (var i = 0; i < k; i++) (function (i) {
                var row = document.createElement('div'); row.className = 'per-item';
                row.innerHTML = '<span class="nm">' + label + (i + 1) + '</span>';
                var r = document.createElement('input'); r.type = 'range'; r.min = 1; r.max = 6; r.value = arr[i];
                var v = document.createElement('span'); v.className = 'v'; v.textContent = arr[i];
                r.oninput = function () { arr[i] = +r.value; v.textContent = r.value; render(); };
                row.appendChild(r); row.appendChild(v); box.appendChild(row);
            })(i);
        }

        function render() {
            if (mode === 'add') {
                var k = +$('kRange').value, vals = addCounts.slice(0, k);
                var sum = vals.reduce(function (a, b) { return a + b; }, 0);
                $('pName').textContent = '加法法则';
                $('pDesc').textContent = '分类相加：完成一件事有 k 类互斥方法，方法数相加。各类之间「选其一即可」。';
                $('formula').textContent = vals.join(' + ') + ' = ' + sum;
                $('num').textContent = sum;
                var html = '<div class="category-title">加法法则：分类相加</div><div class="add-stage">';
                vals.forEach(function (n, i) {
                    if (i) html += '<div class="operation-symbol">+</div>';
                    var boxes = ''; for (var j = 0; j < n; j++) boxes += '<div class="mini-box" style="animation-delay:' + (j * .04) + 's"></div>';
                    html += '<div class="cat-bin"><div class="category-title" style="font-size:.95rem">第' + (i + 1) + '类</div><div class="mini-row">' + boxes + '</div><div class="cnt">' + n + ' 种</div></div>';
                });
                html += '</div>';
                $('vizArea').innerHTML = html;
                $('legendContent').innerHTML = '<div class="legend-item">每个小方块是一种方法</div><div class="legend-item">' + k + ' 类互斥，任选其一</div><div class="legend-item">总数 = 各类相加 = <b>' + sum + '</b></div>';
            } else {
                var s = +$('sRange').value, vals = mulCounts.slice(0, s);
                var prod = vals.reduce(function (a, b) { return a * b; }, 1);
                $('pName').textContent = '乘法法则';
                $('pDesc').textContent = '分步相乘：完成一件事需依次完成 k 个步骤，每步各有若干选项，方法数相乘。步步「都要做」。';
                $('formula').textContent = vals.join(' × ') + ' = ' + prod;
                $('num').textContent = prod;
                $('vizArea').innerHTML = '<div class="category-title">乘法法则：分步相乘</div>' + buildTree(vals);
                $('legendContent').innerHTML = '<div class="legend-item">从根到叶每条路径 = 一种方案</div><div class="legend-item">' + s + ' 步，分支 ' + vals.join('×') + '</div><div class="legend-item">叶子总数 = 各步相乘 = <b>' + prod + '</b></div>';
            }
        }

        function buildTree(vals) {
            var prod = vals.reduce(function (a, b) { return a * b; }, 1);
            if (prod > 24) {
                return '<div class="tree-container"><div class="tree-node highlighted" style="font-size:1.4rem;padding:18px 28px">' + vals.join(' × ') + ' = ' + prod + ' 种</div><p style="color:var(--text-secondary);text-align:center;max-width:420px">方案数较大（>24），以数值呈现。<br>每减少一步或一个选项，总数都会成倍变化——这正是「相乘」的威力。</p></div>';
            }
            var html = '<div class="tree-container">';
            html += '<div class="tree-level"><div class="tree-node highlighted">开始</div></div>';
            var count = 1;
            for (var lv = 0; lv < vals.length; lv++) {
                count *= vals[lv];
                html += '<div class="tree-level">';
                for (var n = 0; n < count; n++) {
                    var isLeaf = lv === vals.length - 1;
                    html += '<div class="tree-node' + (isLeaf ? ' highlighted' : '') + '">' + (isLeaf ? '✓' : ('第' + (lv + 1) + '步')) + '</div>';
                }
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        function setMode(m) {
            mode = m;
            $('btnAdd').classList.toggle('active', m === 'add');
            $('btnMul').classList.toggle('active', m === 'mul');
            $('addCtl').style.display = m === 'add' ? '' : 'none';
            $('mulCtl').style.display = m === 'mul' ? '' : 'none';
            render();
        }
        $('btnAdd').onclick = function () { setMode('add'); };
        $('btnMul').onclick = function () { setMode('mul'); };
        $('kRange').oninput = function () { $('kVal').textContent = this.value; buildPer('addPer', +this.value, addCounts, '第'); render(); };
        $('sRange').oninput = function () { $('sVal').textContent = this.value; buildPer('mulPer', +this.value, mulCounts, '步'); render(); };

        $('resetBtn').onclick = function () {
            addCounts.splice(0, 5, 2, 3, 4, 2, 3); mulCounts.splice(0, 4, 2, 3, 2, 3);
            $('kRange').value = 3; $('kVal').textContent = 3; $('sRange').value = 3; $('sVal').textContent = 3;
            buildPer('addPer', 3, addCounts, '第'); buildPer('mulPer', 3, mulCounts, '步'); setMode('add');
        };
        buildPer('addPer', 3, addCounts, '第');
        buildPer('mulPer', 3, mulCounts, '步');
        render();
    </script>
