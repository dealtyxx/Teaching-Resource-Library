    <a class="home-link" href="../../index.html#chapter1">← 返回课程主页</a>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="window-controls">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <h1>红色数理 <span class="highlight">随机抽样</span></h1>
                <p class="subtitle">Grassroots Investigation & Coverage</p>
            </div>

            <div class="controls-wrapper">
                <div class="control-group">
                    <label>LCG 参数（站点编号 0 ~ m−1）</label>

                    <div class="param-item">
                        <label class="sub-label">模数 m（站点总数）</label>
                        <input type="range" id="modInput" min="4" max="24" value="16">
                        <div class="slider-label">m = <span id="modValue">16</span></div>
                    </div>

                    <div class="param-item">
                        <label class="sub-label">乘数 a</label>
                        <input type="range" id="mulInput" min="1" max="20" value="5">
                        <div class="slider-label">a = <span id="mulValue">5</span></div>
                    </div>

                    <div class="param-item">
                        <label class="sub-label">增量 c</label>
                        <input type="range" id="incInput" min="0" max="20" value="3">
                        <div class="slider-label">c = <span id="incValue">3</span></div>
                    </div>

                    <div class="param-item">
                        <label class="sub-label">种子 X₀（起始站点）</label>
                        <input type="range" id="seedInput" min="0" max="15" value="0">
                        <div class="slider-label">X₀ = <span id="seedValue">0</span></div>
                    </div>
                </div>

                <div class="control-group">
                    <label>价值解读</label>
                    <div class="info-panel">
                        <h3 id="szTitle">全面覆盖</h3>
                        <p id="szDesc">满周期意味着每个站点都会被访问到：调研要遍布每一个基层站点，做到情况明、底数清、不留死角。</p>
                    </div>
                </div>
            </div>

            <div class="actions-footer">
                <button id="startBtn" class="apple-btn action-btn" aria-label="开始演示">▶ 开始演示</button>
                <button id="resetBtn" class="apple-btn danger-btn" aria-label="重置">↺ 重置</button>
            </div>
        </aside>

        <main class="visualizer-stage">
            <div class="glass-pane">
                <div class="stage-header">
                    <h2>线性同余生成器 (LCG)</h2>
                    <p>X<sub>n+1</sub> = (a · X<sub>n</sub> + c) mod m</p>
                </div>

                <div class="viz-content">
                    <div id="graphContainer" class="graph-container">
                        <!-- Nodes and paths will be generated here -->
                    </div>

                    <div id="lcgInfo" class="lcg-info"></div>
                    <div class="stats-panel">
                        <div class="stat-item">
                            <span class="stat-label">覆盖率</span>
                            <div class="progress-bar-bg">
                                <div id="coverageBar" class="progress-bar-fill" style="width: 0%"></div>
                            </div>
                            <span id="coverageText" class="stat-value">0%</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">当前状态</span>
                            <span id="statusBadge" class="status-badge pending">准备就绪</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
