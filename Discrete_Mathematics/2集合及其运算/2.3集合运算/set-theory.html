        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="window-controls">

                <p class="subtitle">对称差 ⊕ / 差的方向性 / 补依赖全集</p>
            </div>
            <div class="controls-wrapper">
                <p class="task-line">🎯 计算嵌套复合运算并辨析易错点。</p>
                <div class="control-group">
                    <label for="themeSelect">全集 U（主题词）</label>
                    <select id="themeSelect" class="apple-select">
                        <option value="revolutionary">革命精神</option>
                        <option value="development">发展理念</option>
                        <option value="culture">文化传承</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>基本运算</label>
                    <div class="operation-buttons">
                        <button type="button" class="operation-btn active" data-operation="union">A ∪ B</button>
                        <button type="button" class="operation-btn" data-operation="intersection">A ∩ B</button>
                        <button type="button" class="operation-btn" data-operation="diffAB">A − B</button>
                        <button type="button" class="operation-btn" data-operation="diffBA">B − A</button>
                        <button type="button" class="operation-btn" data-operation="symmetric">A ⊕ B</button>
                        <button type="button" class="operation-btn" data-operation="compA">~A</button>
                    </div>
                </div>
                <div class="control-group">
                    <label for="exprSelect">复合表达式（分步求值）</label>
                    <select id="exprSelect" class="apple-select">
                        <option value="">（不使用，只看基本运算）</option>
                        <option value="sym1">(A − B) ∪ (B − A)</option>
                        <option value="sym2">(A ∪ B) − (A ∩ B)</option>
                        <option value="dm">~(A ∪ B) 与 ~A ∩ ~B</option>
                        <option value="absorb">A − (A ∩ B) 与 A − B</option>
                    </select>
                    <div class="player-row">
                        <button type="button" class="apple-btn secondary-btn" id="prevBtn">上一步</button>
                        <button type="button" class="apple-btn action-btn" id="nextBtn">下一步</button>
                        <button type="button" class="apple-btn secondary-btn" id="playBtn">自动播放</button>
                    </div>
                    <div class="slider-container">
                        <span class="slider-label">播放速度：<span id="speedVal">2</span> 档</span>
                        <input type="range" id="speedSlider" min="1" max="4" value="2">
                    </div>
                </div>
                <div class="control-group">
                    <label>集合规模</label>
                    <div class="slider-container">
                        <span class="slider-label">|A| = <span id="setACount">5</span></span>
                        <input type="range" id="setASlider" min="3" max="7" value="5">
                    </div>
                    <div class="slider-container">
                        <span class="slider-label">|B| = <span id="setBCount">5</span></span>
                        <input type="range" id="setBSlider" min="3" max="7" value="5">

                <div class="control-group">
                    <label>结果统计</label>
                    <div class="stats-panel">

                        <div class="stat-item"><span class="stat-label">|B|</span><span class="stat-value" id="statB">5</span></div>
                        <div class="stat-item highlight-stat"><span class="stat-label">结果</span><span class="stat-value" id="statResult">8</span></div>
                    </div>
                </div>
            </div>
            <div class="actions-footer">

                <button type="button" id="resetBtn" class="apple-btn secondary-btn">重置</button>

        <main class="visualizer-stage">
            <div class="glass-pane">
                <div class="stage-top">
                    <h2 id="stageTitle">A ∪ B</h2>
                    <p id="stageFormula">A ∪ B = {x | x ∈ A ∨ x ∈ B}</p>
                </div>
                <svg id="mainSvg" viewBox="0 0 760 440" role="img" aria-label="全集 U 与集合 A、B 的文氏图">
                    <defs>
                        <clipPath id="stClipA"><circle cx="290" cy="230" r="160"/></clipPath>
                        <mask id="stMaskAonly"><rect width="760" height="440" fill="white"/><circle cx="470" cy="230" r="160" fill="black"/></mask>
                        <mask id="stMaskBonly"><rect width="760" height="440" fill="white"/><circle cx="290" cy="230" r="160" fill="black"/></mask>
                        <mask id="stMaskOut"><rect width="760" height="440" fill="white"/><circle cx="290" cy="230" r="160" fill="black"/><circle cx="470" cy="230" r="160" fill="black"/></mask>

                    <rect class="u-rect" x="16" y="16" width="728" height="408" rx="22"/>
                    <rect id="hlOut" class="hl" x="16" y="16" width="728" height="408" rx="22" mask="url(#stMaskOut)"/>
                    <circle class="set-fill-a" cx="290" cy="230" r="160"/>
                    <circle class="set-fill-b" cx="470" cy="230" r="160"/>
                    <circle id="hlA" class="hl" cx="290" cy="230" r="160" mask="url(#stMaskAonly)"/>
                    <circle id="hlB" class="hl" cx="470" cy="230" r="160" mask="url(#stMaskBonly)"/>

                    <circle class="set-stroke-a" cx="290" cy="230" r="160"/>
                    <circle class="set-stroke-b" cx="470" cy="230" r="160"/>
                    <text class="set-label" x="34" y="44">U</text>
                    <text class="set-label set-label-a" x="200" y="100">A</text>
                    <text class="set-label set-label-b" x="548" y="100">B</text>
                    <g id="elementsGroup"></g>
                </svg>
                <div class="legend">
                    <div class="legend-item"><div class="legend-color set-a-color"></div><span>集合 A</span></div>
                    <div class="legend-item"><div class="legend-color set-b-color"></div><span>集合 B</span></div>
                    <div class="legend-item"><div class="legend-color result-color"></div><span>当前结果区域 / 元素</span></div>
                </div>
                <div class="expr-panel" id="exprPanel"></div>
