    <script>
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        var O = RelOps, n = 4, names = ['1', '2', '3', '4'];
        var SAMPLE_R = [[0, 1], [1, 2], [2, 2], [3, 0]], SAMPLE_S = [[0, 1], [1, 0], [2, 3], [3, 0]];
        var R = O.fromPairs(SAMPLE_R), S = O.fromPairs(SAMPLE_S), op = 'union';
        var INFO = {
            union: { sign: '∪', title: 'M<sub>R∪S</sub>', text: '<b>R ∪ S</b> = {(x,y) | (x,y)∈R 或 (x,y)∈S}。矩阵上逐格取「或」：M<sub>R∪S</sub> = M<sub>R</sub> ∨ M<sub>S</sub>。' },
            inter: { sign: '∩', title: 'M<sub>R∩S</sub>', text: '<b>R ∩ S</b> = {(x,y) | (x,y)∈R 且 (x,y)∈S}。矩阵上逐格取「与」：M<sub>R∩S</sub> = M<sub>R</sub> ∧ M<sub>S</sub>。' },
            diff: { sign: '−', title: 'M<sub>R−S</sub>', text: '<b>R − S</b> = {(x,y) | (x,y)∈R 且 (x,y)∉S}。一般 R − S ≠ S − R。' },
            comp: { sign: '', title: 'M<sub>∼R</sub>', text: '<b>∼R</b> = A×A − R（相对于全域关系 E<sub>A</sub> 的补）。矩阵上 0、1 互换。' },
            inv: { sign: '', title: 'M<sub>R⁻¹</sub> = M<sub>R</sub><sup>T</sup>', text: '<b>R⁻¹</b> = {(y,x) | (x,y)∈R}：每个有序对反向，关系图中每条边掉头，矩阵<b>转置</b>。金色边框标出由 M<sub>R</sub> 第 j 行第 i 列「翻」过来的格子。' },
            invU: { sign: '∪', title: '(R∪S)⁻¹', text: '先求并再求逆，与先分别求逆再求并结果相同：<b>(R ∪ S)⁻¹ = R⁻¹ ∪ S⁻¹</b>。同理 (R ∩ S)⁻¹ = R⁻¹ ∩ S⁻¹、(R⁻¹)⁻¹ = R。' }
        };
        function result() {
            if (op === 'union') return O.union(R, S);
            if (op === 'inter') return O.inter(R, S);
            if (op === 'diff') return O.diff(R, S);
            if (op === 'comp') return O.complement(R, n);
            if (op === 'inv') return O.inverse(R);
            return O.inverse(O.union(R, S));
        }
        function badge(ok, text) { return '<span class="badge ' + (ok ? 'yes' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + text + '</span>'; }
        function render() {
            var unary = op === 'comp' || op === 'inv';
            var T = result(), info = INFO[op];
            $('sign1').textContent = info.sign;
            $('sign1').style.display = unary ? 'none' : '';
            $('cardS').style.display = unary ? 'none' : '';
            $('resTitle').innerHTML = info.title;
            $('opInfo').innerHTML = info.text;
            O.renderMatrix($('mR'), { n: n, names: names, R: R, editable: true, corner: 'R', onToggle: function (i, j) { toggle(R, i, j); },
                cellClass: function (i, j) { return op === 'inv' && R.has(O.key(i, j)) ? 'hi' : ''; } });
            O.renderMatrix($('mS'), { n: n, names: names, R: S, editable: true, corner: 'S', hdrClass: 'alt', onToggle: function (i, j) { toggle(S, i, j); } });
            O.renderMatrix($('mRes'), { n: n, names: names, R: T, corner: '',
                cellClass: function (i, j, on) {
                    if (!on) return '';
                    if (op === 'inv') return 'gold hi';
                    if (op === 'union' && S.has(O.key(i, j)) && !R.has(O.key(i, j))) return 'gold';
                    return '';
                } });
            O.renderGraph($('gIn'), { n: n, names: names, width: 250, height: 230, layers: unary
                ? [{ R: R, color: '#d63b1d' }]
                : [{ R: R, color: '#d63b1d' }, { R: S, color: '#c58a1f', dash: '5 4' }] });
            O.renderGraph($('gRes'), { n: n, names: names, width: 250, height: 230, layers: [{ R: T, color: op === 'inv' ? '#c58a1f' : '#b8321a', width: 2.4 }],
                nodeFill: function () { return '#b8321a'; } });
            var checks = '';
            if (op === 'inv') checks = badge(O.equal(O.inverse(T), R), '(R⁻¹)⁻¹ = R') + badge(O.equal(R, T), 'R = R⁻¹（R 对称）');
            else if (op === 'invU') checks = badge(O.equal(T, O.union(O.inverse(R), O.inverse(S))), '(R∪S)⁻¹ = R⁻¹∪S⁻¹');
            else if (op === 'diff') checks = badge(O.equal(T, O.diff(S, R)), 'R − S = S − R');
            else if (op === 'comp') checks = badge(O.equal(O.complement(T, n), R), '∼(∼R) = R');
            else checks = '<span class="badge info">|R| = ' + R.size + '，|S| = ' + S.size + '，|结果| = ' + T.size + '</span>';
            $('checkBox').innerHTML = checks;
            var resName = { union: 'R∪S', inter: 'R∩S', diff: 'R−S', comp: '∼R', inv: 'R⁻¹', invU: '(R∪S)⁻¹' }[op];
            $('gResTitle').textContent = resName + ' 的关系图';
            $('setLine').innerHTML = '<b>R</b> = ' + O.setText(R, names) + (unary ? '' : '　　<b>S</b> = ' + O.setText(S, names))
                + '<br><b>' + resName + '</b> = ' + O.setText(T, names);
            $('domBox').innerHTML = '<dt>dom R</dt><dd>' + O.listText(O.domain(R), names) + '</dd>'
                + '<dt>ran R</dt><dd>' + O.listText(O.range(R), names) + '</dd>'
                + '<dt>fld R</dt><dd>' + O.listText(O.domain(R).concat(O.range(R)).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort(), names) + '</dd>'
                + '<dt>dom ' + resName + '</dt><dd>' + O.listText(O.domain(T), names) + '</dd>'
                + '<dt>ran ' + resName + '</dt><dd>' + O.listText(O.range(T), names) + '</dd>'
                + (op === 'inv' ? '<dt style="grid-column:1/-1;color:#6b4a38;font-weight:400">观察：dom R⁻¹ = ran R，ran R⁻¹ = dom R。</dt>' : '');
        }
        function toggle(X, i, j) { var k = O.key(i, j); if (X.has(k)) X.delete(k); else X.add(k); render(); }
        Array.prototype.forEach.call($('opSeg').querySelectorAll('button'), function (b) {
            b.addEventListener('click', function () {
                op = b.dataset.op;
                Array.prototype.forEach.call($('opSeg').querySelectorAll('button'), function (x) { x.classList.toggle('active', x === b); });
                render();
            });
        });
        $('sampleBtn').addEventListener('click', function () { R = O.fromPairs(SAMPLE_R); S = O.fromPairs(SAMPLE_S); render(); });
        $('clearBtn').addEventListener('click', function () { R = new Set(); S = new Set(); render(); });
        render();
    })();
    </script>
