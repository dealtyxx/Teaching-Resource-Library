    <script>
        var $ = function (id) { return document.getElementById(id); };
        var n = 5, R = {};
        function key(i, j) { return i + '_' + j; }
        function has(i, j) { return !!R[key(i, j)]; }
        function props() {
            var refl = true, sym = true, anti = true, trans = true;
            for (var i = 1; i <= n; i++) if (!has(i, i)) refl = false;
            for (var a = 1; a <= n; a++) for (var b = 1; b <= n; b++) {
                if (has(a, b) && !has(b, a)) sym = false;
                if (has(a, b) && has(b, a) && a !== b) anti = false;
                if (has(a, b)) for (var c = 1; c <= n; c++) if (has(b, c) && !has(a, c)) trans = false;
            }
            return { 自反: refl, 对称: sym, 反对称: anti, 传递: trans };
        }
        function classes() { // 等价类（按 R 的连通分量，前提是等价关系）
            var par = {}; for (var i = 1; i <= n; i++) par[i] = i;
            function find(x) { return par[x] === x ? x : (par[x] = find(par[x])); }
            for (var a = 1; a <= n; a++) for (var b = 1; b <= n; b++) if (has(a, b)) par[find(a)] = find(b);
            var groups = {}; for (var k = 1; k <= n; k++) { var r = find(k); (groups[r] = groups[r] || []).push(k); }
            return Object.keys(groups).map(function (g) { return groups[g]; });
        }
        function lt(v) { return '<span class="lt ' + (v ? 'y' : 'n') + '">' + (v ? '✓' : '✗') + '</span>'; }
        function render() {
            n = +$('nRange').value; $('nVal').textContent = n;
            Object.keys(R).forEach(function (k) { var p = k.split('_'); if (+p[0] > n || +p[1] > n) delete R[k]; });
            var g = $('mtx'); g.style.gridTemplateColumns = 'repeat(' + (n + 1) + ', auto)';
            var html = '<div class="mcell corner"></div>';
            for (var j = 1; j <= n; j++) html += '<div class="mcell hdr">' + j + '</div>';
            for (var i = 1; i <= n; i++) { html += '<div class="mcell hdr">' + i + '</div>'; for (var j2 = 1; j2 <= n; j2++) { var on = has(i, j2); html += '<div class="mcell ' + (on ? 'b1' : 'b0') + '" data-i="' + i + '" data-j="' + j2 + '">' + (on ? 1 : 0) + '</div>'; } }
            g.innerHTML = html;
            [].forEach.call(g.querySelectorAll('.mcell[data-i]'), function (c) { c.onclick = function () { var k = key(+c.dataset.i, +c.dataset.j); if (R[k]) delete R[k]; else R[k] = 1; render(); }; });
            var p = props(), ph = '';
            for (var key2 in p) ph += '<div class="prop">' + lt(p[key2]) + ' ' + key2 + '</div>';
            $('props').innerHTML = ph;
            var isEq = p.自反 && p.对称 && p.传递, isPo = p.自反 && p.反对称 && p.传递;
            var v = $('verdict'), cl = $('classes'), note = $('note'); cl.innerHTML = ''; note.innerHTML = '';
            if (isEq) {
                v.innerHTML = '<span class="badge eq">✅ 等价关系</span>';
                var cs = classes();
                cl.innerHTML = cs.map(function (c) { return '<span class="cls">{ ' + c.join(', ') + ' }</span>'; }).join('');
                note.innerHTML = '它把集合划分成 <b>' + cs.length + ' 个等价类</b>（互不相交、并为全集）——这正是商集 A/R。';
            } else if (isPo) {
                v.innerHTML = '<span class="badge po">✅ 偏序关系</span>';
                note.innerHTML = '自反+反对称+传递 → 可画成<b>哈斯图</b>的层级结构（有的可比、有的不可比）。整除关系 a|b 就是典型偏序。';
            } else {
                v.innerHTML = '<span class="badge no">— 既非等价也非偏序</span>';
                note.innerHTML = '等价缺：' + (!p.自反 ? '自反 ' : '') + (!p.对称 ? '对称 ' : '') + (!p.传递 ? '传递' : (p.自反 && p.对称 && p.传递 ? '' : '')) + '；偏序缺：' + (!p.自反 ? '自反 ' : '') + (!p.反对称 ? '反对称 ' : '') + (!p.传递 ? '传递' : '') + '。补齐相应性质试试。';
            }
        }
        function loadEq() { R = {}; var blocks = n >= 5 ? [[1, 2], [3, 4], [5]] : [[1, 2], [3]]; if (n === 6) blocks = [[1, 2, 3], [4, 5], [6]]; blocks.forEach(function (bk) { bk.forEach(function (x) { bk.forEach(function (y) { R[key(x, y)] = 1; }); }); }); render(); }
        function loadPo() { R = {}; for (var a = 1; a <= n; a++) for (var b = 1; b <= n; b++) if (b % a === 0) R[key(a, b)] = 1; render(); } // 整除偏序
        $('nRange').oninput = render;
        $('eqBtn').onclick = loadEq; $('poBtn').onclick = loadPo; $('clearBtn').onclick = function () { R = {}; render(); };
        loadEq();
    </script>
