                                <span>全域关系 · 天下一家</span>
                                <span class="btn-sub">E<sub>A</sub> = A × A</span>
                            </div>
                        </button>
                        <button class="apple-btn relation-btn" data-type="identity" aria-label="恒等关系">
                            <span class="btn-icon">🪞</span>
                            <div class="btn-text">
                                <span>恒等关系 · 不忘初心</span>
                                <span class="btn-sub">I<sub>A</sub> = {(x,x) | x∈A}</span>
                            </div>
                        </button>
                        <button class="apple-btn relation-btn" data-type="leq" aria-label="小于等于关系">
                            <span class="btn-icon">📈</span>
                            <div class="btn-text">
                                <span>小于等于关系 · 循序渐进</span>
                                <span class="btn-sub">L<sub>A</sub> = {(x,y) | x ≤ y}</span>
                            </div>
                        </button>
                        <button class="apple-btn relation-btn" data-type="divides" aria-label="整除关系">
                            <span class="btn-icon">🌳</span>
                            <div class="btn-text">
                                <span>整除关系 · 薪火相传</span>
                                <span class="btn-sub">D<sub>A</sub> = {(x,y) | x 整除 y}</span>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="control-group">
                    <label>定义与解读</label>
                    <div class="insight-card">
