    <script>
        var $ = function (id) { return document.getElementById(id); };
        var n = 4, R = {};
        function key(i, j) { return i + '_' + j; }
        function has(rel, i, j) { return !!rel[key(i, j)]; }
        function checkProps(rel) {
            var refl = true, irr = true, sym = true, anti = true, trans = true;
            for (var i = 1; i <= n; i++) { if (!has(rel, i, i)) refl = false; if (has(rel, i, i)) irr = false; }
            for (var a = 1; a <= n; a++) for (var b = 1; b <= n; b++) {
                if (has(rel, a, b) && !has(rel, b, a)) sym = false;
                if (has(rel, a, b) && has(rel, b, a) && a !== b) anti = false;
                if (has(rel, a, b)) for (var c = 1; c <= n; c++) if (has(rel, b, c) && !has(rel, a, c)) trans = false;
            }
            return { 自反: refl, 反自反: irr, 对称: sym, 反对称: anti, 传递: trans };
        }
        function lt(v) { return '<span class="lt ' + (v ? 'y' : 'n') + '">' + (v ? '✓' : '✗') + '</span>'; }
        function renderMtx() {
            var g = $('mtx'); g.style.gridTemplateColumns = 'repeat(' + (n + 1) + ', auto)';
            var html = '<div class="mcell corner"></div>';
            for (var j = 1; j <= n; j++) html += '<div class="mcell hdr">' + j + '</div>';
            for (var i = 1; i <= n; i++) { html += '<div class="mcell hdr">' + i + '</div>'; for (var j2 = 1; j2 <= n; j2++) { var on = has(R, i, j2); html += '<div class="mcell ' + (on ? 'b1' : 'b0') + '" data-i="' + i + '" data-j="' + j2 + '">' + (on ? 1 : 0) + '</div>'; } }
            g.innerHTML = html;
            [].forEach.call(g.querySelectorAll('.mcell[data-i]'), function (c) { c.onclick = function () { var k = key(+c.dataset.i, +c.dataset.j); if (R[k]) delete R[k]; else R[k] = 1; renderMtx(); renderProps(); renderTests(); }; });
        }
        function renderProps() {
            var p = checkProps(R), html = '';
            for (var k in p) html += '<div class="prop">' + lt(p[k]) + ' ' + k + '</div>';
            $('props').innerHTML = html;
        }
        function buildRel(kind) { var r = {}; for (var i = 1; i <= n; i++) for (var j = 1; j <= n; j++) { if (kind === 'full') r[key(i, j)] = 1; else if (kind === 'id' && i === j) r[key(i, j)] = 1; } return r; }
        function renderCmp() {
            var names = [['∅ 空关系', {}], ['E<sub>A</sub> 全域', buildRel('full')], ['I<sub>A</sub> 恒等', buildRel('id')]];
            var cols = ['自反', '反自反', '对称', '反对称', '传递'];
            var html = '<tr><th>关系</th>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
            names.forEach(function (nm) { var p = checkProps(nm[1]); html += '<tr><td class="name">' + nm[0] + '</td>' + cols.map(function (c) { return '<td class="' + (p[c] ? 'y' : 'n') + '">' + (p[c] ? '✓' : '✗') + '</td>'; }).join('') + '</tr>'; });
            $('cmp').innerHTML = html;
        }
        // 用矩阵布尔运算实现关系运算，再用特殊关系做特例校验
        function compose(r, s) { var t = {}; for (var i = 1; i <= n; i++) for (var k = 1; k <= n; k++) if (has(r, i, k)) for (var j = 1; j <= n; j++) if (has(s, k, j)) t[key(i, j)] = 1; return t; }
        function inv(r) { var t = {}; for (var k in r) { var p = k.split('_'); t[key(+p[1], +p[0])] = 1; } return t; }
        function uni(r, s) { var t = {}; for (var k in r) t[k] = 1; for (var k2 in s) t[k2] = 1; return t; }
        function inter(r, s) { var t = {}; for (var k in r) if (s[k]) t[k] = 1; return t; }
        function eq(r, s) { var a = Object.keys(r).sort().join(','), b = Object.keys(s).sort().join(','); return a === b; }
        function renderTests() {
            var I = buildRel('id'), E = buildRel('full'), Z = {};
            var cases = [
                ['R∘I<sub>A</sub> = R', eq(compose(R, I), R)],
                ['I<sub>A</sub>∘R = R', eq(compose(I, R), R)],
                ['R∘∅ = ∅', eq(compose(R, Z), Z)],
                ['R ∪ ∅ = R', eq(uni(R, Z), R)],
                ['R ∩ E<sub>A</sub> = R', eq(inter(R, E), R)],
                ['R ∪ E<sub>A</sub> = E<sub>A</sub>', eq(uni(R, E), E)],
                ['(R<sup>−1</sup>)<sup>−1</sup> = R', eq(inv(inv(R)), R)],
                ['I<sub>A</sub><sup>−1</sup> = I<sub>A</sub>', eq(inv(I), I)]
            ];
            var pass = cases.filter(function (c) { return c[1]; }).length;
            $('tests').innerHTML = cases.map(function (c) { return '<div class="prop">' + lt(c[1]) + ' ' + c[0] + '</div>'; }).join('')
                + '<div class="tests-sum">通过 ' + pass + ' / ' + cases.length + ' 项（|R| = ' + Object.keys(R).length + '）</div>';
        }
        function renderAll() { n = +$('nRange').value; $('nVal').textContent = n; Object.keys(R).forEach(function (k) { var p = k.split('_'); if (+p[0] > n || +p[1] > n) delete R[k]; }); renderMtx(); renderProps(); renderCmp(); renderTests(); }
        $('nRange').oninput = renderAll;
        $('idBtn').onclick = function () { R = buildRel('id'); renderMtx(); renderProps(); renderTests(); };
        $('clearBtn').onclick = function () { R = {}; renderMtx(); renderProps(); renderTests(); };
        $('sampleBtn').onclick = function () { R = {}; ['1_2', '2_3', '1_3', '3_3', '4_1'].forEach(function (k) { var p = k.split('_'); if (+p[0] <= n && +p[1] <= n) R[k] = 1; }); renderMtx(); renderProps(); renderTests(); };
        R = buildRel('id'); renderAll();
    </script>
