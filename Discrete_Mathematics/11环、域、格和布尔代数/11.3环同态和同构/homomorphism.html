                        </select>
                    </div>
                    <div class="control-group">
                        <label for="multK">系数 k</label>

                    </div>
                </div>

                    <label>性质检验器（对所有元素对穷举）</label>
                    <div class="property-checker">
                        <div class="check-item" id="checkAdd"><span class="check-icon">?</span><span class="check-label">φ(a+b) = φ(a)+φ(b)</span></div>
                        <div class="check-item" id="checkMul"><span class="check-icon">?</span><span class="check-label">φ(a·b) = φ(a)·φ(b)</span></div>
                        <div class="check-item" id="checkOne"><span class="check-icon">?</span><span class="check-label">φ(1) = 1（含幺同态，可选）</span></div>
                        <div class="check-item" id="checkBijective"><span class="check-icon">?</span><span class="check-label">双射（单射 + 满射）</span></div>
